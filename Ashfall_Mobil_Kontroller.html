  FX.dustRing(b.x, b.y, 12, 120);
}

function bossUpdate(dt) {
  const b = BOSS;
  if (!b.active) return;
  b.st += dt; b.at += dt;
  if (b.flashT > 0) b.flashT -= dt;
  b.hpShown += (b.hp - b.hpShown) * mn(1, dt * 3.4);

  if (b.dead) {
    b.deadT += dt;
    b.frame = animFrame(BA.die, b.deadT);
    b.vx *= Math.pow(0.05, dt);
    b.x += b.vx * dt;
    /* dust and debris as the body settles */
    if (b.deadT < 2.0 && Math.random() < 0.28) FX.dust(b.x + rnd(-22, 22), b.y, 1, 14, 10, P.stnLt);
    if ((b.deadT > 0.6 && b.deadT - dt <= 0.6) || (b.deadT > 1.5 && b.deadT - dt <= 1.5)) {
      CAM.kick(2.2, 6); FX.stoneBurst(b.x + rnd(-16, 16), b.y, 5, 90, 6); AUD.land(0.9);
    }
    return;
  }

  const dx = PL.x - b.x, adx = ab(dx);
  if (b.cd > 0) b.cd -= dt;

  /* How long the knight has been standing in the king's own footprint. It is
     deliberately frozen while Grullk is staggered: that window is the whole
     reward for filling the stagger bar, and a stomp that fired in the middle
     of it would be taking back the prize with the other hand. */
  const stompTimerState = b.state === 'idle' || b.state === 'walk' || b.state === 'smash' ||
    b.state === 'sweep' || b.state === 'diag';
  if (PL.dead || !stompTimerState) {
    b.insideT = 0;
  } else if (adx < BOSS_INSIDE_X) b.insideT += dt;
  else b.insideT = mx(0, b.insideT - dt * 2);

  switch (b.state) {
    case 'intro': {
      b.introT += dt;
      b.frame = animFrame(BA.roar, b.introT);
      if (b.introT > 0.15 && b.introT - dt <= 0.15) { AUD.bossRoar(); CAM.kick(3.6, 4); }
      if (b.introT > 0.3 && Math.random() < 0.3) FX.dust(b.x + rnd(-30, 30), b.y, 1, 24, 18, P.stnLt);
      if (b.introT >= BA.roar.dur) { bSet('idle', 'idle'); b.cd = 0.5; }
      break;
    }
    case 'roar': {
      /* both of these are planted animations, so the drive left over from an
         interrupted swing has to be bled off or he slides through them */
      b.vx *= Math.pow(0.01, dt);
      b.frame = animFrame(BA.roar, b.st);
      if (b.st >= BA.roar.dur) { bSet('idle', 'idle'); b.cd = 0.35; }
      break;
    }
    case 'stun': {
      b.stunT -= dt;
      if (Math.random() < 0.10) FX.dust(b.x + rnd(-18, 18), b.y, 1, 8, 6, P.stnLt);
      if (b.stunT <= 0) {
        /* the phase change he was owed while he was down */
        if (b.phase2Roar) { b.phase2Roar = false; bSet('roar', 'roar'); AUD.bossRoar(); CAM.kick(3.6, 4); }
        else { bSet('idle', 'idle'); b.cd = 0.35; }
      }
      break;
    }
    case 'hurt': {
      b.vx *= Math.pow(0.05, dt);
      if (b.st >= BA.hurt.dur) { bSet('idle', 'idle'); b.cd = mx(b.cd, 0.25); }
      break;
    }
    case 'idle': case 'walk': {
      /* re-setting the anim every frame pins b.at at zero and the idle never
         breathes — the same trap the walk pick below is written to dodge */
      if (PL.dead) { bSet('idle', b.anim === 'idle' ? undefined : 'idle'); break; }
      b.face = dx > 0 ? 1 : -1;
      /* every road back to neutral runs through here, so this is the one
         place a punish swing's compressed clock has to be put back */
      if (b.punishing) { b.punishing = false; b.atkRate = 1; }
      if (b.insideT >= BOSS_INSIDE_T) { bossStomp(); break; }
      if (b.cd <= 0) {
        let pick;
        if (adx < 50) pick = Math.random() < 0.55 ? 'sweep' : 'smash';
        else if (adx < 96) pick = Math.random() < 0.45 ? 'smash' : (Math.random() < 0.6 ? 'diag' : 'sweep');
        else if (adx < 190) pick = Math.random() < 0.62 ? 'diag' : 'walk';
        else pick = 'walk';
        /* re-picking `walk` every 0.28 s must not restart the cycle, or the
           stride never gets past its first frame and Grullk slides along on
           a frozen leg */
        if (pick === 'walk') { bSet('walk', b.anim === 'walk' ? undefined : 'walk'); b.cd = 0.28; }
        else { bSet(pick, pick); b.hitDone = false; }
      } else {
        if (adx > 62) bSet('walk', b.anim === 'walk' ? undefined : 'walk');
        else if (b.anim !== 'idle') bSet('idle', 'idle');
      }
      if (b.state === 'walk') {
        const spd = b.phase === 2 ? 46 : 34;
        b.vx += b.face * 340 * dt;
        b.vx = clamp(b.vx, -spd, spd);
        if (adx < 56) b.vx *= 0.6;
      } else b.vx *= Math.pow(0.004, dt);
      break;
    }
    case 'smash': case 'sweep': case 'diag': case 'stomp': {
      /* The camp timer runs during the three ordinary attacks too, so a swing
         that is already playing can be cut short by it. */
      if (b.state !== 'stomp' && b.insideT >= BOSS_INSIDE_T) { bossStomp(); break; }
      const kind = b.state;
      const A = BA[kind], K = BATK[kind];
      /* a punish swing runs the same keys on a compressed clock — every read
         of the duration in here, and in drawBossTell, goes through this */
      const dur = A.dur / b.atkRate;
      const t = b.st / dur;
      const fi = mn(A.n - 1, fl(t * A.n));
      b.frame = fi;
      /* Forward drive during the committed part of the swing, scaled with the
         clock: the same push per second over less than half the time would
         cover less than half the ground, and a punish that fell short of the
         man it was aimed at would be no punish at all. */
      const drv = b.atkRate;
      if (kind === 'diag' && fi >= 3 && fi <= 5) b.vx += b.face * 420 * drv * dt;
      else if (kind === 'sweep' && fi >= 4 && fi <= 5) b.vx += b.face * 200 * drv * dt;
      else if (kind === 'smash' && fi === 5) b.vx += b.face * 120 * drv * dt;
      else b.vx *= Math.pow(0.01, dt);
      b.vx = clamp(b.vx, -150 * drv, 150 * drv);
      /* impact frame */
      if (fi !== b.lastFrame) {
        b.lastFrame = fi;
        if (fi === K.frames[0]) bossImpact(kind);
        if (kind === 'smash' && fi === 3) { AUD.tn(70, 46, 0.4, 0.10, 'sine'); }
        /* the knee at the top of its lift, held for one frame before it drops */
        if (kind === 'stomp' && fi === 2) { AUD.tn(58, 44, 0.30, 0.09, 'sine'); }
      }
      /* hit test on the active frames */
      if (K.frames.indexOf(fi) >= 0 && !b.hitDone && !PL.dead) {
        const fb = faceBox(b.x, b.face, K.box[0], K.box[2]);
        const bx0 = fb.x0, bx1 = fb.x1, by0 = b.y + K.box[1], by1 = b.y + K.box[3];
        const hb = PL.hurtBox();
        if (boxHit(hb, bx0, by0, bx1, by1)) {
          b.hitDone = true;
          const tell = BTELL[b.state];
          const res = damagePlayer(K.dmg, b.x, 'boss', clamp(PL.y - 22, by0, by1), tell ? tell.act : null);
          if (res === 'parry') { bossStun(); }
          else if (res === 'hit') {
            if (kind === 'stomp' && !PL.dead) {
              /* thrown clear along the way he is facing. The blow itself is
                 only the fare — it is the landing that puts the knight down,
                 which plUpdate picks up off this flag. */
              PL.vx = b.face * 300; PL.vy = -330; PL.stompFly = true;
            } else { PL.vx = (PL.x - b.x > 0 ? 1 : -1) * K.kb; PL.vy = -110; }
          }
        }
      }
      if (b.st >= dur) {
        /* A swing beaten by walking round the outside of it — not by
           answering it, by not being there — earns a repeat. `hitDone` is the
           honest test: it is set the moment the box overlaps the man whatever
           he then does about it, so a clean roll-through or a parry counts as
           reaching him and is left alone. `!b.punishing` keeps one whiff to
           one answer, so the fight still breathes. */
        const whiffedBehind = !b.hitDone && !b.punishing && kind !== 'stomp' &&
          !PL.dead && (PL.x - b.x) * b.face < 0 && adx < 170;
        b.hitDone = false;
        if (whiffedBehind) {
          b.face = dx > 0 ? 1 : -1;
          bSet(kind, kind); b.chain = 0;
          b.punishing = true; b.atkRate = BOSS_PUNISH_RATE;
          AUD.bossSnarl();
          FX.dustRing(b.x, b.y, 8, 80);
        } else if (b.punishing || kind === 'stomp') {
          b.punishing = false; b.atkRate = 1; b.chain = 0;
          bSet('idle', 'idle');
          /* he watches the knight get up: the stun is 2s and this cooldown is
             what stops the very next swing landing on a man still on his knees */
          b.cd = kind === 'stomp' ? rnd(1.9, 2.5) : (b.phase === 2 ? rnd(0.6, 1.1) : rnd(0.9, 1.45));
        } else if (b.phase === 2 && b.chain < 1 && Math.random() < 0.34 && adx < 120) {
          b.chain++; const nk = Math.random() < 0.5 ? 'smash' : 'sweep';
          bSet(nk, nk);
        } else {
          b.chain = 0;
          bSet('idle', 'idle');
          b.cd = b.phase === 2 ? rnd(0.42, 0.9) : rnd(0.8, 1.35);
        }
      }
      break;
    }
  }

  /* physics */
  b.vy = mn(460, b.vy + PLC.gravity * dt);
  const prevY = b.y;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.x = clamp(b.x, LV.arenaX0 + 26, LV.arenaX1 - 26);
  b.onGround = false;
  landOn(b, prevY, 16);
  /* animation clock for the looping states */
  if (b.state === 'sleep' || b.state === 'idle' || b.state === 'walk' || b.state === 'stun') {
    b.frame = animFrame(BA[b.anim], b.at);
    /* heavy footfalls */
    if (b.state === 'walk' && b.onGround && (b.frame === 0 || b.frame === 5) && b.stepPhase !== b.frame) {
      b.stepPhase = b.frame;
      FX.dust(b.x - b.face * 6, b.y, 4, 24, 14, P.stnLt);
      FX.stoneBurst(b.x - b.face * 4, b.y, 2, 40, 4);
      AUD.bossStep();
      CAM.kick(0.9, 12);
    }
  } else if (b.state === 'hurt') {
    b.frame = animFrame(BA.hurt, b.st);
  }
}

function bossImpact(kind) {
  const b = BOSS;
  const fx = b.x + b.face * 40;
  if (kind === 'smash') {
    AUD.hitHeavy(); AUD.bossStep();
    CAM.kick(5.2, 6);
    GAME.hitstop = mx(GAME.hitstop, 0.06);
    FX.stoneBurst(fx, b.y, 12, 190, 8);
    FX.dustColumn(fx, b.y, 110);
    FX.dustRing(fx, b.y, 10, 150);
    /* a couple of chips thrown toward the camera plane */
    for (let i = 0; i < 3; i++) PS.spawn({
      x: fx + rnd(-6, 6), y: b.y - 2, vx: rnd(-40, 40), vy: -rnd(60, 130),
      life: rnd(0.5, 0.9), size: 3, endSize: 2, col: P.stnHi, col2: P.stnD,
      grav: 380, shape: 3, spin: rnd(-8, 8), layer: L_COMBAT, ground: b.y + 4
    });
    shakeDebrisFromWalls(6);
  } else if (kind === 'sweep') {
    AUD.swingHeavy(); AUD.hitHeavy();
    CAM.kick(3.0, 7);
    for (let i = 0; i < 12; i++) PS.spawn({
      x: b.x + b.face * (10 + i * 4), y: b.y - rnd(0, 5), vx: b.face * rnd(40, 130), vy: rnd(-22, -4),
      life: rnd(0.3, 0.7), size: rint(2, 3), endSize: 5, col: P.stnLt, col2: P.stnD,
      alpha: rnd(0.22, 0.42), grav: 30, drag: 0.05, shape: 5, layer: L_WORLD
    });
    FX.stoneBurst(b.x + b.face * 34, b.y, 4, 70, 10);
  } else if (kind === 'stomp') {
    /* the only impact in the fight that throws its debris both ways, because
       it is the only one with no front */
    AUD.hitHeavy(); AUD.bossStep(); AUD.land(1);
    CAM.kick(6.4, 5);
    GAME.hitstop = mx(GAME.hitstop, 0.08);
    for (const sgn of [-1, 1]) {
      FX.stoneBurst(b.x + sgn * 26, b.y, 7, 150, 7);
      FX.dustRing(b.x + sgn * 20, b.y, 8, 140);
      for (let i = 0; i < 9; i++) PS.spawn({
        x: b.x + sgn * (8 + i * 6), y: b.y - rnd(0, 4), vx: sgn * rnd(60, 170), vy: rnd(-30, -6),
        life: rnd(0.35, 0.75), size: rint(2, 3), endSize: 6, col: P.stnLt, col2: P.stnD,
        alpha: rnd(0.26, 0.46), grav: 34, drag: 0.05, shape: 5, layer: L_WORLD
      });
    }
    FX.dustColumn(b.x, b.y, 120);
    shakeDebrisFromWalls(8);
  } else {
    AUD.hitHeavy();
    CAM.kick(4.0, 6.5);
    const a = b.face > 0 ? -0.7 : PI + 0.7;
    for (let i = 0; i < 10; i++) PS.spawn({
      x: fx + rnd(-6, 6), y: b.y - rnd(0, 20), vx: cos(a) * rnd(60, 170) * -1, vy: -sin(a) * rnd(60, 150) * -1,
      life: rnd(0.3, 0.7), size: rint(1, 2), col: i % 3 === 0 ? P.stlHi : P.stn, col2: P.stnS,
      grav: 320, shape: i % 3 === 0 ? 2 : 3, len: 5, layer: L_COMBAT, ground: b.y
    });
    FX.stoneBurst(fx, b.y, 6, 120, 6);
    FX.dustRing(fx, b.y, 6, 90);
    shakeDebrisFromWalls(3);
  }
}
/* rare debris dislodged from the arena walls by nearby heavy impacts */
function shakeDebrisFromWalls(n) {
  for (let i = 0; i < n; i++) {
    const x = LV.arenaX0 + 40 + Math.random() * (LV.arenaX1 - LV.arenaX0 - 80);
    PS.spawn({
      x: x, y: GY - 120 - Math.random() * 50, vx: rnd(-6, 6), vy: rnd(10, 30),
      life: rnd(0.9, 1.6), size: 1, col: P.stnM, col2: P.stnS,
      grav: 260, shape: 3, layer: L_WORLD, ground: GY
    });
  }
}

/* ===== 19.  THE GATE =========================================== */
/* The portcullis has two jobs. It bars the road to the arena until the last
   goblin is down, then hauls itself up; and once the knight is through, it
   drops behind him and there is no way back out.
     shut -> raising -> open -> falling -> closed                          */
const GATE = {
  y: GY - 92, shutY: GY - 92, upY: -120,
  state: 'shut', t: 0
};
const GATE_H = 92;
function hostStanding() {
  let n = 0;
  for (const e of EN) if (!e.dead) n++;
  return n;
}
/* solid while it hangs low enough for the knight to walk into */
function gateBarred() {
  if (GATE.state === 'shut') return true;
  if (GATE.state === 'raising') return GATE.y + GATE_H > GY - PLC.h + 6;
  return false;
}
function startBossFight() {
  if (GAME.arenaLocked) return;
  GAME.arenaLocked = true;
  CAM.lock = 1; CAM.lockX0 = LV.arenaX0 - 66; CAM.lockX1 = LV.arenaX1;
  GATE.state = 'falling'; GATE.t = 0; GATE.y = GATE.upY;
  BOSS.active = true; bSet('intro', 'roar'); BOSS.introT = 0;
  AUD.startMusic('boss');
  GAME.bossNameT = 3.2;
}
function gateUpdate(dt) {
  const G = GATE;
  if (G.state === 'shut') {
    /* the road opens the moment the field is clear */
    if (EN.length && hostStanding() === 0) {
      G.state = 'raising'; G.t = 0;
      AUD.gate(); AUD.uiBig();
      CAM.kick(2.8, 7);
      GAME.gateOpenT = 2.8;
      FX.dust(LV.gateX + 8, GY, 6, 30, 16, P.stnLt);
      FX.dust(LV.gateX + 48, GY, 6, 30, 16, P.stnLt);
    }
    return;
  }
  if (G.state === 'raising') {
    G.t += dt;
    const t = mn(1, G.t / 1.15);
    G.y = G.shutY + (G.upY - G.shutY) * eOut(t);
    /* grit shaken loose from the housing as the chains take the weight */
    if (Math.random() < 0.4) PS.spawn({
      x: LV.gateX + rnd(0, 56), y: GY - rnd(96, 118), vx: rnd(-8, 8), vy: rnd(20, 50),
      life: rnd(0.5, 1.0), size: 1, col: P.stnM, col2: P.stnS,
      grav: 240, shape: 3, layer: L_WORLD, ground: GY
    });
    if (t >= 1) G.state = 'open';
    return;
  }
  if (G.state === 'falling') {
    G.t += dt;
    const t = mn(1, G.t / 0.42);
    G.y = G.upY + (G.shutY - G.upY) * eIn(t);
    if (t >= 1) { G.state = 'closed'; gateSlam(); }
  }
}
/* iron meeting stone: the whole field feels it */
function gateSlam() {
  AUD.gate(); AUD.land(1);
  CAM.kick(8.5, 3.6);
  GAME.hitstop = mx(GAME.hitstop, 0.06);
  FX.dust(LV.gateX + 6, GY, 12, 52, 26, P.stnLt);
  FX.dust(LV.gateX + 50, GY, 12, 52, 26, P.stnLt);
  FX.dustColumn(LV.gateX + 28, GY, 120);
  FX.dustRing(LV.gateX + 28, GY, 14, 150);
  FX.stoneBurst(LV.gateX + 8, GY, 6, 130, 5);
  FX.stoneBurst(LV.gateX + 48, GY, 6, 130, 5);
  for (let i = 0; i < 10; i++) PS.spawn({
    x: LV.gateX + rnd(0, 56), y: GY - rnd(0, 6), vx: rnd(-120, 120), vy: rnd(-110, -25),
    life: rnd(0.15, 0.32), size: 1, col: P.stlHi, alpha: 0.9, grav: 240, shape: 2, len: 5,
    layer: L_COMBAT, add: true
  });
  for (let i = 0; i < 16; i++) PS.spawn({
    x: LV.gateX + rnd(-4, 60), y: GY - rnd(0, 90), vx: rnd(-50, 50), vy: rnd(-40, 50),
    life: rnd(0.5, 1.2), size: rint(1, 2), col: P.stn, col2: P.stnS,
    grav: 300, shape: 3, layer: L_WORLD, ground: GY
  });
  /* the arena walls shed what the impact knocks loose */
  shakeDebrisFromWalls(12);
  for (let i = 0; i < 6; i++) spawnFogWisp(LV.gateX + rnd(-20, 80), GY - rnd(2, 10), true);
}

  '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8], '8': [14, 17, 17, 14, 17, 17, 14],
  '9': [14, 17, 17, 15, 1, 2, 28],
  '.': [0, 0, 0, 0, 0, 12, 12], ',': [0, 0, 0, 0, 12, 12, 8], ':': [0, 12, 12, 0, 12, 12, 0],
  '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4], '-': [0, 0, 0, 31, 0, 0, 0],

};
function textW(s, sc, sp) { sc = sc || 1; sp = sp === undefined ? 1 : sp; return s.length * (5 * sc + sp * sc) - sp * sc; }
function text(g, s, x, y, col, sc, sp) {
  sc = sc || 1; sp = sp === undefined ? 1 : sp;
  s = String(s).toUpperCase();
  let cx = fl(x);
  g.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const gl = FONT[s[i]] || FONT['?'];
    for (let r2 = 0; r2 < 7; r2++) {
      const bits = gl[r2];
      if (!bits) continue;
      for (let c = 0; c < 5; c++) if (bits & (1 << (4 - c))) g.fillRect(cx + c * sc, fl(y) + r2 * sc, sc, sc);
    }
    cx += (5 + sp) * sc;
  }
}
function textSh(g, s, x, y, col, sc, sp, shCol) {
  text(g, s, x + sc, y + sc, shCol || '#05070a', sc, sp);
  text(g, s, x, y, col, sc, sp);
}
function textC(g, s, cx, y, col, sc, sp, sh) {
  const w = textW(s, sc, sp);
  if (sh) textSh(g, s, cx - w / 2, y, col, sc, sp, sh === true ? undefined : sh);
  else text(g, s, cx - w / 2, y, col, sc, sp);
}

/* ===== 21.  GAME STATE =========================================
   Owns: GAME (mode machine + run-scoped counters), the sprite warm queue,
         and resetRun() — the one door back to a clean run.
   Modes: boot -> title -> play <-> paused, play -> defeat -> play,
          play -> cutscene -> (closed). `victory` is deliberately unreachable
          and deliberately kept; see updatePlay().
   ===== */
/* Everything GAME carries that belongs to ONE run, so resetRun() has a list
   to work from instead of an ad-hoc pile of assignments. */
const GAME_RUN = {
  t: 0, hitstop: 0, damageFlash: 0, parryFlash: 0, hpGhost: PLC.maxHp,
  arenaLocked: false, kills: 0, reflectKills: 0,
  deathT: 0, winT: 0, bossNameT: 0, phaseText: 0, gateOpenT: 0,
  cine: false               /* the closing cutscene is running the screen */
};
/* and the fields that deliberately outlive a run: the mode machine, the warm
   queue, and the two gates that are about the device rather than the fight */
const GAME = Object.assign({
  mode: 'boot', starFx: [],
  warm: [], warmI: 0, ready: false,
  blocked: false,           /* handheld held upright — the world is frozen */
  closed: false             /* TEMPORARY — set by cutSceneEnd() */
}, GAME_RUN);

function buildWarmQueue() {
  const q = [];
  for (const k in KA) { const A = KA[k]; for (let i = 0; i < (A.n || 6); i++) q.push(['k', k, i]); }
  /* the two poses the knight wears after the king takes his shield. They
     bake to their own cache keys, so they have to be warmed separately or
     the cutscene would stutter on the frame the shield breaks. */
  for (const k of ['hurt', 'death']) for (let i = 0; i < KA[k].n; i++) q.push(['k', k, i, 1]);
  for (const t in GTYPE) for (const s in GA) { for (let i = 0; i < GA[s].n; i++) q.push(['g', t, s, i]); }
  for (const s in BA) for (let i = 0; i < BA[s].n; i++) q.push(['b', s, i]);
  for (let i = 0; i < CAPE_N; i++) q.push(['c', i]);
  for (let i = 0; i < 8; i++) q.push(['d', i]);
  GAME.warm = q; GAME.warmI = 0;
}
function warmTick(budget) {
  const q = GAME.warm;
  for (let n = 0; n < budget && GAME.warmI < q.length; n++, GAME.warmI++) {
    const it = q[GAME.warmI];
    if (it[0] === 'k') knightFrame(it[1], it[2], it[3]);
    else if (it[0] === 'g') gobFrame(it[1], it[2], it[3]);
    else if (it[0] === 'b') bossFrame(it[1], it[2]);
    else if (it[0] === 'c') capeSprite(it[1]);
    else daggerSprite(it[1]);
  }
  return GAME.warmI >= q.length;
}

function resetRun() {
  /* The press that starts or retries a run is still in the buffer when the
     first gameplay frame arrives, and it used to be spent as a player action:
     Enter is harmless, but the left mouse button opened the run mid-swing and
     a touch tap did the same. This is the one place covering both entries. */
  releaseAllInput();
  PL.reset(); BOSS.reset();
  EN.length = 0; DAG.length = 0;
  PS.clearCombat();
  Object.assign(GAME, GAME_RUN);
  Object.assign(CUT, CUT_INIT);
  GAME.starFx.length = 0;             /* emptied, not replaced — FX.parryBurst holds it */
  GATE.y = GATE.shutY; GATE.state = 'shut'; GATE.t = 0;
  CAM.lock = 0; CAM.x = 0; CAM.tx = 0; CAM.shake = 0;
  for (const s of LV.spawns) spawnEnemy(s.t, s.x, s.y);
  CAM.follow(PL.x, PL.y, 1, 0);
  AUD.startMusic('field');
}

/* ===== 22.  ENTITY RENDERING =================================== */
function drawPlayer() {
  const p = PL, cx = CAM.cx, cy = CAM.cy;
  const x = fl(p.x - cx), y = fl(p.y - cy);
  const flash = p.flashT > 0.18;
  /* contact shadow */
  const gY = groundAt(p.x, p.y);
  if (gY !== null && !p.dead) {
    const h = clamp(1 - (gY - p.y) / 90, 0.25, 1);
    ctx.globalAlpha = 0.42 * h;
    ell(ctx, x, fl(gY - cy), fl(9 * h), 2, '#04060a');
    ctx.globalAlpha = 1;
  }
  const fr = knightFrame(p.anim, p.frame, p.shieldGone);
  /* cape behind the body */
  if (p.anim !== 'roll' && !fr.prone) {
    const ci = clamp(fl((p.capeK + 1) * 0.5 * (CAPE_N - 1) + 0.5), 0, CAPE_N - 1);
    const ce2 = capeSprite(ci);
    blit(ce2, x + p.face * (fr.ax || 0), y + (fr.ay || -33), p.face, COX, COY);
  }
  blit(fr, x, y, p.face, KOX, KOY, 1, flash);
  /* Half a second of the most consequential state in the game, and it had no
     mark: held guard and just-pressed guard look identical, so whether a
     parry was even possible could only be learned from the outcome. A gold
     edge that burns down as the window closes says "this one is live"
     without adding anything to the silhouette. */
  if (!p.dead && p.parryT > 0 && (p.state === 'block' || p.state === 'parry') && !p.shieldGone) {
    const k = clamp(p.parryT / PLC.parryWindow, 0, 1);
    const ex = x + p.face * 12, ey = y - 34;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30 + 0.55 * k;
    r(ctx, ex, ey, 1, fl(4 + 12 * k), P.gldHi);
    ctx.globalAlpha = 0.18 + 0.30 * k;
    r(ctx, ex + p.face, ey + 1, 1, fl(3 + 9 * k), P.gld);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  /* low-health cracks and embers of pain */
  if (!p.dead && p.hp < PLC.maxHp * 0.3 && Math.random() < 0.12) {
    PS.spawn({
      x: p.x + rnd(-5, 5), y: p.y - rnd(18, 32), vx: rnd(-6, 6), vy: rnd(6, 20),
      life: rnd(0.25, 0.5), size: 1, col: P.bldD, alpha: 0.7, grav: 120, shape: 4, layer: L_COMBAT
    });
  }
  if (p.iTime > 0 && p.state === 'roll' && Math.random() < 0.4) {
    PS.spawn({
      x: p.x - p.face * rnd(2, 8), y: p.y - rnd(6, 16), vx: 0, vy: 0, life: 0.12,
      size: rint(2, 4), col: '#68809c', alpha: 0.3, shape: 7, layer: L_WORLD
    });
  }
}

/* ===== attack telegraph — it names the answer to the swing that is coming =
   smash : a vertical slam with a wide ground splash  -> roll through it
   sweep : a low horizontal swing at ankle height     -> jump over it
   diag  : a committed diagonal chop                  -> parry it
   stomp : no front at all, and no answer in the guard -> get out from under
   ===== */
const BTELL = {
  smash: { act: 'ROLL', col: '#8fb9dc', dim: '#3a5d78' },
  sweep: { act: 'JUMP', col: '#8fc47f', dim: '#3d6435' },
  diag: { act: 'PARRY', col: '#dcb85f', dim: '#6e5520' },
  /* BACK is not in damagePlayer's vocabulary, and that is the point: it is
     not ROLL, so the roll's i-frames are refused; it is not PARRY, so the
     window does not catch it; and being an answer at all, it skips the guard
     branch outright. The word names footwork because footwork is the only
     thing that beats it — there is 0.43s and no side of him to stand on. */
  stomp: { act: 'BACK', col: '#c98a5f', dim: '#6b4527' }
};
function drawBossTell() {
  const b = BOSS;
  if (!b.active) return;
  const sx = fl(b.x - CAM.cx), sy = fl(b.y - CAM.cy);
  if (b.dead || PL.dead || !GAME.arenaLocked) return;
  /* The stomp answers a clock the player cannot see, and its own tell fires
     only 0.43s before the blow — which narrates the loss rather than teaching
     the player to move. This bar fills under the king's feet from a bit over
     halfway, in the stomp's colour, so leaving is a decision made before the
     swing instead of a reaction to it. */
  if (b.insideT > BOSS_INSIDE_T * 0.55 && b.state !== 'stomp') {
    const k = clamp((b.insideT - BOSS_INSIDE_T * 0.55) / (BOSS_INSIDE_T * 0.45), 0, 1);
    const bw = 30, bx = sx - bw / 2, by = sy + 3;
    ctx.globalAlpha = 0.34 + 0.30 * k;
    r(ctx, bx, by, bw, 1, '#3a2418');
    r(ctx, bx, by, fl(bw * k), 1, BTELL.stomp.col);
    if (k > 0.75 && (sin(WT * 26) > 0)) { ctx.globalAlpha = 0.85; r(ctx, bx, by - 2, bw, 1, BTELL.stomp.col); }
    ctx.globalAlpha = 1;
  }
  const T = BTELL[b.state]; if (!T) return;
  const A = BA[b.state], K = BATK[b.state];
  /* the same compressed duration bossUpdate is running the swing on, or the
     bar would fill at half speed while the mace came down at full */
  const dur = A.dur / (b.atkRate || 1);
  const impact = K.frames[0] / A.n * dur;        /* the frame the blow lands on */
  const t = b.st, endT = impact + 0.16;
  if (t > endT) return;
  const a = clamp(t / 0.07, 0, 1) * clamp((endT - t) / 0.18, 0, 1);
  if (a <= 0.01) return;

  const w = textW(T.act, 1, 2), pw = w + 11, ph = 15;
  const cx2 = clamp(fl(sx), fl(pw / 2) + 3, VW - fl(pw / 2) - 3);
  const py = clamp(fl(sy) - 108, 6, VH - 46);
  /* blink hard over the last third of the wind-up */
  const near = t > impact - 0.30;
  const blink = near ? (0.62 + 0.38 * (sin(t * 34) > 0 ? 1 : 0)) : 1;

  /* a repeat swing keeps its word — the answer has not changed — but wears a
     blood-coloured frame, so the rule being taught is legible the first time
     it costs the player something */
  const dimC = b.punishing ? '#8c2f26' : T.dim;
  ctx.globalAlpha = a * 0.78;
  r(ctx, cx2 - pw / 2, py, pw, ph, '#05070a');
  ctx.globalAlpha = a * (b.punishing ? 0.85 : 0.5);
  r(ctx, cx2 - pw / 2, py, pw, 1, dimC);
  r(ctx, cx2 - pw / 2, py + ph - 1, pw, 1, dimC);
  if (b.punishing) { r(ctx, cx2 - pw / 2, py, 1, ph, dimC); r(ctx, cx2 + fl(pw / 2) - 1, py, 1, ph, dimC); }
  ctx.globalAlpha = a * blink;
  textC(ctx, T.act, cx2, py + 3, T.col, 1, 2, true);
  /* timing bar: fills as the mace comes down */
  const bw = pw - 6, fwd = fl(bw * clamp(t / impact, 0, 1));
  ctx.globalAlpha = a * 0.55;
  r(ctx, cx2 - bw / 2, py + ph + 1, bw, 1, '#0a0d12');
  if (fwd > 0) { ctx.globalAlpha = a * blink; r(ctx, cx2 - bw / 2, py + ph + 1, fwd, 1, T.col); }
  /* little arrow pointing down at the head */
  ctx.globalAlpha = a * 0.7;
  r(ctx, cx2 - 1, py + ph + 4, 3, 1, dimC);
  r(ctx, cx2, py + ph + 5, 1, 1, dimC);
  ctx.globalAlpha = 1;
}
function drawDaggers() {
  const cx = CAM.cx, cy = CAM.cy;
  for (const d of DAG) {

/* ===== 23.  HUD — hammered iron plate and tarnished gold ======= */
function panel(x, y, w, h, dark) {

function rivet(x, y) { r(ctx, x, y, 2, 2, P.gldD); px(ctx, x, y, P.gld); }

/* ===== 25b. THE KING GETS UP — the closing cutscene ============

   The fight is won and it does not matter. Grullk hauls himself off the
   stone, walks the knight down, takes the shield off him with one blow and
   the knight with the next; then something that was watching says its piece
   and the screen goes white.
   Driven off one flat phase table, NOT the entity updates: plUpdate and
   bossUpdate never run in this mode, so nothing here fights a state machine
   for a limb. Poses go straight onto PL.anim / BOSS.anim with the frame read
   off the phase clock — which is why every animation used below is one that
   is already baked and warmed.
   ===== */
/* One sentence per box. They arrive in order, each one clearing before the
   next types in — except the last, which is left standing on the screen. */
const CUT_LINES = [
  'Hmm...',
  'Interesting turn of events.',
  "But it's too early...",
  'Not yet.'
];
/* name, duration. A duration of 0 means the phase ends on its own condition. */
const CUT_PH = [
  ['still', 0.9],     /* the body lies there and the field is silent          */
  ['rise', 1.5],      /* the death animation runs backwards — he stands up    */
  ['walk', 0],        /* closes the distance, however far he fell             */
  ['tense', 1.1],     /* the roar: he gathers himself                         */
  ['swing1', 1.15],   /* the shield goes                                      */
  ['stagger', 1.5],   /* the knight has nothing left to raise                 */
  ['swing2', 1.05],   /* and the knight goes                                  */
  ['fall', 1.9],      /* the body settles                                     */
  ['fade', 1.4],      /* down to black                                        */
  ['black', 5.0],     /* five seconds of nothing                              */
  ['boxin', 0.6],     /* the frame fades up                                   */
  ['type', 0],        /* one letter at a time                                 */
  ['hold', 5.0],      /* five seconds to read it                              */
  ['bright', 2.4],    /* and up into white                                    */
  ['end', 0]
];
const CUT_INIT = {
  on: false, i: 0, t: 0, hit: false, walkT: 0, stepF: -1, fly: false,
  si: 0, sHold: 0, gap: 0,          /* which sentence, its dwell, the blank beat */
  lines: null, flat: '', shown: 0, acc: 0,
  fade: 0, bright: 0, boxA: 0, closed: false
};
const CUT = Object.assign({}, CUT_INIT);
function cutName() { return CUT_PH[CUT.i][0]; }
function cutBegin() {
  if (CUT.on) return;
  Object.assign(CUT, CUT_INIT);
  CUT.on = true;
  GAME.cine = true; GAME.mode = 'cutscene';
  /* drop anything the player was still holding — nothing here takes input */
  IN.held = {}; IN.buf = {};
  DAG.length = 0;
  AUD.stopMusic();
}
function cutAdvance() { CUT.i = mn(CUT_PH.length - 1, CUT.i + 1); CUT.t = 0; CUT.hit = false; }
/* The two ways a pose is set in here. Nothing in this scene runs through a
   state machine, so a phase either lets an animation play on its own clock
   (`pose`) or scrubs it directly off the phase's progress (`poseAt`). */
function pose(e, tbl, name, dt) { e.anim = name; e.at += dt; e.frame = animFrame(tbl[name], e.at); }
function poseAt(e, tbl, name, u) { e.anim = name; e.frame = mn(tbl[name].n - 1, fl(u * tbl[name].n)); }

/* word wrap against the pixel font, which is fixed pitch, so the width of a
   run is only ever a function of its length */
function wrapText(str, maxW, sc, sp) {
  const words = String(str).split(' '), out = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && textW(t, sc, sp) > maxW) { out.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}
/* A caption plate, not a page: wide, shallow, low on the screen where a
   subtitle belongs. The square it replaced filled half the frame for four
   short lines and read as a menu. Width tracks VW so it stays a caption on a
   wide handset. */
const CUT_BOX_H = 40, CUT_PAD = 12, CUT_LH = 12;
function cutBoxW() { return mn(VW - 72, 392); }
function cutBuildText() {
  if (CUT.lines) return;
  const i = mn(CUT.si, CUT_LINES.length - 1);
  CUT.lines = wrapText(CUT_LINES[i], cutBoxW() - CUT_PAD * 2 - 4, 1, 2);
  CUT.flat = CUT.lines.join('');
}

/* He walks twice in this scene — once to close the distance and once more after
   the first blow throws the knight further than the mace can reach. Same stride,
   same footfall, so it lives in one place. */
function cutBossStride(dt) {
  const b = BOSS;
  b.x += b.face * 46 * dt;
  b.anim = 'walk'; CUT.walkT += dt;
  b.frame = animFrame(BA.walk, CUT.walkT);
  if ((b.frame === 0 || b.frame === 5) && CUT.stepF !== b.frame) {
    CUT.stepF = b.frame;
    FX.dust(b.x - b.face * 6, b.y, 4, 24, 14, P.stnLt);
    AUD.bossStep(); CAM.kick(0.9, 12);
  }
}

function cutUpdate(dt) {
  const b = BOSS, p = PL;
  CUT.t += dt;
  const ph = cutName(), dur = CUT_PH[CUT.i][1];
  const u = dur > 0 ? clamp(CUT.t / dur, 0, 1) : 0;
  const dx = p.x - b.x;

  /* both of them look at each other for the whole thing */
  if (ph !== 'fall' && ph !== 'fade') { b.face = dx > 0 ? 1 : -1; p.face = -b.face; }

  switch (ph) {
    case 'still': {
      b.anim = 'die'; b.frame = BA.die.n - 1;
      pose(p, KA, p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle', dt);
      break;
    }
    case 'rise': {
      /* the death keys played back to front. Nothing new had to be posed for
         this: a fall run in reverse already reads as a thing standing up. */
      if (CUT.t - dt <= 0) { AUD.bossSnarl(); CAM.kick(2.2, 6); }
      b.anim = 'die';
      b.frame = clamp(BA.die.n - 1 - fl(u * BA.die.n), 0, BA.die.n - 1);
      if ((CUT.t % 0.16) < dt) FX.dust(b.x + rnd(-22, 22), b.y, 2, 18, 14, P.stnLt);
      if (u >= 1 && !CUT.hit) {
        CUT.hit = true; AUD.bossStep(); CAM.kick(3.4, 5);
        FX.dustRing(b.x, b.y, 10, 110); FX.stoneBurst(b.x, b.y, 5, 90, 8);
      }
      pose(p, KA, p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle', dt);
      break;
    }
    case 'walk': {
      /* however far the killing blow threw him, he closes it on foot */
      const adx = ab(dx);
      if (adx <= 56 || CUT.t > 3.4) { cutAdvance(); break; }
      cutBossStride(dt);
      pose(p, KA, 'idle', dt);
      break;
    }
    case 'tense': {
      if (CUT.t - dt <= 0) { AUD.bossRoar(); CAM.kick(4.2, 4); }
      poseAt(b, BA, 'roar', u);
      if (Math.random() < 0.30) FX.dust(b.x + rnd(-30, 30), b.y, 1, 26, 18, P.stnLt);
      /* the knight puts the shield up. It is the right answer and it will not
         matter, which is the only thing this whole sequence is for. */
      pose(p, KA, 'block', dt);
      break;
    }
    case 'swing1': {
      poseAt(b, BA, 'smash', u);
      if (b.frame >= 5 && !CUT.hit) {
        CUT.hit = true;
        /* ---- the shield goes ---- */
        p.shieldGone = true; p.hp = mn(p.hp, 14); p.flashT = 0.32;
        p.anim = 'hurt'; p.at = 0; p.frame = 0;
        p.vx = b.face * 210; p.vy = -120;
        CUT.fly = true;
        FX.shieldShatter(p.x + p.face * 10, p.y - 28, b.face);
        FX.blood(p.x, p.y - 26, b.face, 7, P.bld);
        AUD.shieldBreak(); AUD.hurt();
        GAME.hitstop = mx(GAME.hitstop, 0.18);
        GAME.damageFlash = 0.32;
        CAM.kick(6.0, 5);
      }
      if (!CUT.hit) pose(p, KA, 'block', dt);
      break;
    }
    case 'stagger': {
      /* The first blow throws the knight some forty pixels clear, which is
         further than the mace can reach — so the king walks it back in. Skip
         this and the killing blow visibly lands on empty stone. */
      if (ab(dx) > 54) {
        cutBossStride(dt);
      } else pose(b, BA, 'idle', dt);
      /* held on the last recoil frame, the same trick a parried goblin gets */
      p.anim = 'hurt'; p.frame = KA.hurt.n - 1;
      if ((CUT.t % 0.22) < dt) FX.blood(p.x + rnd(-4, 4), p.y - rnd(16, 30), -p.face, 1, P.bldD);
      break;
    }
    case 'swing2': {
      poseAt(b, BA, 'diag', u);
      if (b.frame >= 5 && !CUT.hit) {
        CUT.hit = true;
        p.hp = 0; p.dead = true; p.deadT = 0; p.state = 'death';
        p.anim = 'death'; p.at = 0; p.frame = 0;
        p.vx = b.face * 150; p.vy = -150; CUT.fly = true;
        FX.blood(p.x, p.y - 26, b.face, 16, P.bld);
        AUD.hitHeavy(); AUD.die();
        GAME.hitstop = mx(GAME.hitstop, 0.26);
        GAME.damageFlash = 0.40;
        CAM.kick(7.0, 4.5);
      }
      if (!CUT.hit) { p.anim = 'hurt'; p.frame = KA.hurt.n - 1; }
      break;
    }
    case 'fall': {
      pose(b, BA, 'idle', dt);
      pose(p, KA, 'death', dt);
      break;
    }
    case 'fade': {
      CUT.fade = u;
      pose(b, BA, 'idle', dt);
      p.anim = 'death'; p.frame = KA.death.n - 1;
      break;
    }
    case 'black': CUT.fade = 1; break;
    case 'boxin': cutBuildText(); CUT.boxA = u; break;
    case 'type': {
      CUT.boxA = 1; cutBuildText();
      /* the blank beat between two sentences — the plate stays, the words go */
      if (CUT.gap > 0) {
        CUT.gap -= dt;
        if (CUT.gap <= 0) { CUT.si++; CUT.lines = null; CUT.shown = 0; CUT.acc = 0; cutBuildText(); }
        break;
      }
      if (CUT.shown < CUT.flat.length) {
        CUT.acc += dt;
        /* a full stop buys a beat. Without it "Hmm..." arrives at the same
           even clip as everything else and the pause in the writing is lost. */
        while (CUT.shown < CUT.flat.length) {
          const c = CUT.flat[CUT.shown];
          const cost = c === '.' ? 0.155 : (c === ',' ? 0.10 : 0.045);
          if (CUT.acc < cost) break;
          CUT.acc -= cost; CUT.shown++;
          if (c !== ' ') AUD.type();
        }
        if (CUT.shown >= CUT.flat.length) CUT.sHold = 1.5;
        break;
      }
      /* fully typed. The last sentence is not cleared — it is what the five
         seconds of 'hold' are for, and what the screen brightens over. */
      if (CUT.si >= CUT_LINES.length - 1) { cutAdvance(); break; }
      CUT.sHold -= dt;
      if (CUT.sHold <= 0) CUT.gap = 0.30;
      break;
    }
    case 'hold': CUT.boxA = 1; break;
    case 'bright': CUT.boxA = 1; CUT.bright = u; break;
    case 'end': {
      CUT.boxA = 1; CUT.bright = 1;
      cutSceneEnd();                    /* TEMPORARY — see the block below */
      break;
    }
  }

  /* the only physics in the whole sequence: a body that was just thrown */
  if (CUT.fly) {
    p.vy = mn(PLC.maxFall, p.vy + PLC.gravity * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.30, dt);
    const g0 = groundAt(p.x, p.y);
    if (g0 !== null && p.y >= g0) {
      p.y = g0; p.vy = 0; p.vx *= 0.2;
      if (ab(p.vx) < 6) CUT.fly = false;
    }
  }
  if (dur > 0 && CUT.t >= dur) cutAdvance();
  CAM.follow((PL.x + BOSS.x) * 0.5, PL.y - 26, dt, 0);
}

function cutRender() {
  const sceneOver = CUT.fade >= 1;
  if (!sceneOver) {
    renderPlay();                        /* drawHUD bails on GAME.cine */
    if (CUT.fade > 0) ra(ctx, 0, 0, VW, VH, '#05070a', CUT.fade);
  } else {
    r(ctx, 0, 0, VW, VH, '#05070a');
  }
  if (CUT.boxA > 0 && CUT.lines) cutDrawBox();
  if (CUT.bright > 0) {
    /* the ramp is eased in so the last half second is the bright half — a
       linear fill to white reads as a wash rather than as something arriving */
    ra(ctx, 0, 0, VW, VH, '#ffffff', clamp(eIn(CUT.bright), 0, 1));
  }
}
function cutDrawBox() {
  const W = cutBoxW(), H = CUT_BOX_H;
  const x0 = fl(VW / 2 - W / 2), y0 = VH - H - 18;
  const a = clamp(CUT.boxA, 0, 1);
  ctx.globalAlpha = a;
  /* a plain white frame, and nothing else on the screen with it */
  r(ctx, x0, y0, W, H, '#ffffff');
  r(ctx, x0 + 2, y0 + 2, W - 4, H - 4, '#05070a');
  ctx.globalAlpha = a * 0.30;
  r(ctx, x0 + 3, y0 + 3, W - 6, 1, '#ffffff');
  ctx.globalAlpha = a;
  const n = CUT.lines.length;
  const ty = y0 + fl((H - n * CUT_LH) / 2) + 2;
  let rem = CUT.shown, lastX = x0 + CUT_PAD, lastY = ty;
  for (let i = 0; i < n; i++) {
    const L = CUT.lines[i];
    if (rem <= 0) break;
    const k = mn(rem, L.length);
    text(ctx, L.slice(0, k), x0 + CUT_PAD, ty + i * CUT_LH, '#e8ecf2', 1, 2);
    lastX = x0 + CUT_PAD + textW(L.slice(0, k), 1, 2) + 2; lastY = ty + i * CUT_LH;
    rem -= L.length;
  }
  /* the caret, so a line that has stopped arriving still looks alive */
  if (cutName() === 'type' || cutName() === 'hold') {
    if ((WT % 0.9) < 0.5) r(ctx, lastX, lastY, 4, 7, '#e8ecf2');
  }
  ctx.globalAlpha = 1;
}

/* ===================================================================
   TEMPORARY — THE GAME SHUTS ITSELF DOWN HERE
   Everything between this marker and the matching one below exists only
   until there is something on the other side of the white. Deleting the
   two functions and the single `cutSceneEnd()` call in cutUpdate's 'end'
   case, plus the one guard line at the top of frame(), takes the whole
   thing out and leaves the cutscene ending on a white screen.
   =================================================================== */
function cutSceneEnd() {
  if (CUT.closed) return;
  CUT.closed = true;
  AUD.stopMusic();
  /* window.close() is only obeyed for a window script opened, so in a normal
     tab this does nothing at all and the fallback below is what actually
     runs. Either way the next launch boots a fresh run — there is no save. */
  try { window.close(); } catch (_) { }
  setTimeout(function () {
    GAME.closed = true;                 /* frame() stops asking for frames */
    try {
      document.documentElement.style.background = '#ffffff';
      document.body.style.background = '#ffffff';
      document.body.innerHTML = '';
    } catch (_) { }
  }, 420);
}

/* ===== 26.  MAIN LOOP ========================================== */
let ashTimer = 0, moteTimer = 0, wispTimer = 0;

function ambientTick(dt) {
  WT += dt;
  /* falling ash — three depth groups, screen space, always moving */
  ashTimer -= dt;
  if (PS.nAmb < 84 && ashTimer <= 0) { spawnAsh(false); ashTimer = 0.05 + Math.random() * 0.05; }
  /* dust motes near enclosed stone and fire */
  moteTimer -= dt;
  if (moteTimer <= 0) {
    moteTimer = 0.18;
    const cx = CAM.cx;
    for (const b of LV.braziers) {
      if (ab(b.x - cx - VW / 2) < VW * 0.6 && Math.random() < 0.3) spawnMote(b.x + rnd(-26, 26), b.y - rnd(14, 50));
    }
    if (GAME.arenaLocked && Math.random() < 0.6) spawnMote(cx + rnd(0, VW), GY - rnd(20, 110));
    for (const bg of LV.bg) if (bg.k === 'arch' && ab(bg.x - cx - VW / 2) < VW * 0.7 && Math.random() < 0.25)
      spawnMote(bg.x + rnd(0, 90), bg.y + rnd(20, 60));
  }
  /* low fog wisps hugging the ground */
  wispTimer -= dt;
  if (wispTimer <= 0) {
    wispTimer = 0.42;
    const cx = CAM.cx;
    const dense = GAME.arenaLocked;
    if (Math.random() < (dense ? 0.9 : 0.6)) {
      const x = cx + rnd(-30, VW + 30);
      const gy2 = groundAt(x, 0);
      if (gy2 !== null) spawnFogWisp(x, gy2 - rnd(1, 9), dense);
    }
  }
}

/* the callouts and flashes that do nothing but count down to zero */
const GAME_TIMERS = ['damageFlash', 'parryFlash', 'bossNameT', 'phaseText', 'gateOpenT'];
function updatePlay(dt) {
  GAME.t += dt;
  for (const k of GAME_TIMERS) if (GAME[k] > 0) GAME[k] -= dt;
  for (let i = GAME.starFx.length - 1; i >= 0; i--) { GAME.starFx[i].t -= dt; if (GAME.starFx[i].t <= 0) GAME.starFx.splice(i, 1); }
  GAME.hpGhost += (PL.hp - GAME.hpGhost) * mn(1, dt * 2.2);

  let sdt = dt;
  if (GAME.hitstop > 0) { GAME.hitstop -= dt; sdt = 0; }

  if (sdt > 0) {
    plUpdate(sdt);
    for (const e of EN) enemyUpdate(e, sdt);
    bossUpdate(sdt);
    daggerUpdate(sdt);
    gateUpdate(sdt);
    if (!GAME.arenaLocked && PL.x > LV.arenaX0 + 44 && !PL.dead) startBossFight();
  }
  CAM.follow(PL.x, PL.y - 18, dt, PL.vx);

  /* deathT does double duty — the 2.4s the body gets before the plate, then
     the plate's own fade and 1.6s input lock — so it must be zeroed at the
     handover, or the plate snaps in fully lit and takes input immediately. */
  if (PL.dead) { GAME.deathT += dt; if (GAME.deathT > 2.4) { GAME.mode = 'defeat'; GAME.deathT = 0; } }
  /* The body gets 2.9s to settle, then the cutscene takes over. The
     `victory` mode and drawEndScreen(true) are DELIBERATELY left intact and
     unreachable below, so pulling the cutscene out restores the old ending
     by changing this one line. Do not tidy them away. */
  if (BOSS.dead) { GAME.winT += dt; if (GAME.winT > 2.9) cutBegin(); }
}

/* Everything under the entities, and everything over them. The title screen
   draws the same two sandwiches with nothing in between, so keeping the order
   written down once is what stops the two views drifting apart.
   ORDER IS THE CONTRACT HERE — the arena's rear wall has to land after the sky
   and before the platforms, or the hall paints over the floor of it. */
function drawWorldBack(arena) {
  drawBackground();
  if (arena && arenaCv) {
    /* the hall's floor IS the arena floor, so like every other planted layer
       it must not drift vertically — see drawBackground's mid-ground loop */
    const ax = fl(2782 - CAM.cx), ay = fl(GY - 196 - CAM.cy);
    if (ax < VW && ax + arenaCv.width > 0) {
      ctx.drawImage(arenaCv, ax, ay);
      /* the throne, waiting behind the king */
      ctx.drawImage(PROPS.throne, fl(LV.arenaX1 - 104 - CAM.cx), fl(GY - 58 - CAM.cy));
    }
  }
  PS.draw(L_BGATM, CAM.cx, CAM.cy);
  drawPits();
  drawPlatforms();
  drawDecor(false);
}
function drawWorldFront() {
  drawForeground();
  PS.draw(L_FGATM, CAM.cx, CAM.cy);
}
function renderPlay() {
  drawWorldBack(true);
  drawDecor(true);
  drawBraziers();
  PS.draw(L_WORLD, CAM.cx, CAM.cy);
  drawEnemies();
  drawBoss();
  drawDaggers();
  drawPlayer();
  PS.draw(L_COMBAT, CAM.cx, CAM.cy);
  drawGate();
  drawFogBand(fogs[2], CAM.cx);
  drawWorldFront();
  drawScreenFx();

}

let lastT = performance.now();
function frame(now) {
  if (GAME.closed) return;              /* TEMPORARY — see cutSceneEnd() */
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt <= 0) dt = 1 / 60;
  FRAME_DT = dt;

  /* portrait on a handheld: the field is behind the rotate prompt, so nothing
     ticks. lastT is already advanced, so turning back does not hand the world
     a stored-up frame. */
  if (GAME.blocked) { IN.clearEdges(); return; }

  IN.tick(dt);
  ambientTick(dt);

  if (GAME.mode === 'title') {
    if (!GAME.ready) {
      if (warmTick(7)) { GAME.ready = true; const b = document.getElementById('boot'); if (b) b.style.display = 'none'; }
    }
    CAM.x = 190; CAM.tx = 190; CAM.y = 0;
    PS.update(dt);
    drawTitle();
    if (GAME.ready && (IN.press('start') || IN.press('light') || IN.press('jump'))) {
      AUD.unlock(); AUD.uiBig();
      GAME.mode = 'play'; GAME.t = 0;
      resetRun();
    }
  } else if (GAME.mode === 'play') {
    if (IN.press('pause')) { GAME.mode = 'paused'; AUD.ui(); }
    else {
      updatePlay(dt);
      PS.update(dt);
      renderPlay();
    }
  } else if (GAME.mode === 'paused') {
    FRAME_DT = dt * 0.3;            /* the field idles behind the plate too */
    PS.update(dt * 0.3);
    renderPlay();
    drawPause();
    if (IN.press('pause')) { GAME.mode = 'play'; AUD.ui(); }
    if (IN.press('restart')) { GAME.mode = 'title'; AUD.stopMusic(); AUD.startMusic('field'); }
  } else if (GAME.mode === 'cutscene') {
    if (GAME.hitstop > 0) { GAME.hitstop -= dt; }
    else cutUpdate(dt);
    if (GAME.damageFlash > 0) GAME.damageFlash -= dt;
    PS.update(dt);
    cutRender();
  } else if (GAME.mode === 'victory' || GAME.mode === 'defeat') {
    const win = GAME.mode === 'victory';
    if (win) GAME.winT += dt; else GAME.deathT += dt;
    if (GAME.hitstop > 0) GAME.hitstop -= dt;
    if (win) { bossUpdate(dt); for (const e of EN) enemyUpdate(e, dt); }
    else plUpdate(dt);
    CAM.follow(win ? BOSS.x : PL.x, (win ? BOSS.y : PL.y) - 18, dt, 0);
    PS.update(dt);
    renderPlay();
    drawEndScreen(win);
    const tt = win ? GAME.winT : GAME.deathT;
    if (tt > 1.6 && (IN.press('start') || IN.press('restart'))) {
      AUD.uiBig();
      if (win) { GAME.mode = 'title'; AUD.stopMusic(); }
      else { GAME.mode = 'play'; GAME.t = 0; resetRun(); }
    }
  }
  if (IN.press('mute')) { AUD.toggle(); tcMuteLabel(); }
  tcSyncQuit();
  tcSyncCine();
  IN.clearEdges();
}

/* ===== 26b. DEVICE PROFILE + ON-SCREEN CONTROLS ================
        The pads are mapped onto the same action names the keyboard uses,
        so the game logic is untouched.
   ===== */
const TOUCH = (function () {
  if (location.hash === '#touch') return true;
  if (location.hash === '#notouch') return false;
  try {
    /* a phone or tablet: the pointer you actually play with is a finger */
    if (matchMedia('(pointer:coarse)').matches) return true;
    /* a touch panel with no mouse anywhere — but a touchscreen laptop keeps
       its keyboard and mouse, and must not be handed a thumb pad */
    if (!matchMedia('(any-pointer:fine)').matches &&
      (('ontouchstart' in window) || navigator.maxTouchPoints > 0)) return true;
    return false;
  } catch (_) {
    return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  }
})();

/* The visual viewport is the honest one on a handheld: it shrinks and grows
   as the browser chrome slides in and out, while innerHeight keeps reporting
   the space the address bar is still sitting on. */
function viewW() { const v = window.visualViewport; return (v && v.width) ? v.width : innerWidth; }
function viewH() { const v = window.visualViewport; return (v && v.height) ? v.height : innerHeight; }

/* What we are running on, refreshed on every resize. */
const DEV = {
  touch: TOUCH, kind: 'desktop', portrait: false,
  dpr: 1, vw: 0, vh: 0, scale: 1, unit: 62, integer: false
};
function profileDevice() {
  const w = viewW(), h = viewH();
  DEV.vw = w; DEV.vh = h;
  DEV.dpr = window.devicePixelRatio || 1;
  DEV.portrait = h > w;
  /* the short edge is orientation-independent, so a phone stays a phone when
     it is turned: ~480 CSS px splits every current handset from every tablet */
  DEV.kind = !TOUCH ? 'desktop' : (mn(w, h) >= 480 ? 'tablet' : 'phone');
  return DEV;
}
const TCPAD = document.getElementById('tc');
const TC_PTR = {};        /* pointerId -> {act, el} */
const TC_CNT = {};        /* act -> how many fingers hold it */
function tcDown(act, el, id) {
  if (TC_PTR[id]) return;
  TC_PTR[id] = { act: act, el: el };
  TC_CNT[act] = (TC_CNT[act] || 0) + 1;
  if (TC_CNT[act] === 1) IN.down(act);
  el.classList.add('on');
}
function tcUp(id) {
  const rec = TC_PTR[id]; if (!rec) return;
  delete TC_PTR[id];
  TC_CNT[rec.act] = mx(0, (TC_CNT[rec.act] || 1) - 1);
  if (TC_CNT[rec.act] === 0) IN.up(rec.act);
  rec.el.classList.remove('on');
}
function tcMuteLabel() {
  const m = document.getElementById('tb-mute');
  if (!m) return;
  m.classList.toggle('muted', !!AUD.muted);
  if (ICON.sound) m.style.backgroundImage = 'url(' + (AUD.muted ? ICON.muted : ICON.sound) + ')';
}
/* QUIT only exists while the run is paused — the same reach the keyboard has,
   where `restart` is read on the pause and defeat plates and nowhere during
   play. A pad that could throw away a boss fight on a stray thumb has no
   business sitting over the field. */
let tcQuitOn = false;
function tcSyncQuit() {
  const want = TOUCH && GAME.mode === 'paused';
  if (want === tcQuitOn) return;
  tcQuitOn = want;
  const q = document.getElementById('tb-quit');
  if (q) q.hidden = !want;
}
/* The pads stand down for a cutscene: nothing in one takes input, and on a
   handheld they sit exactly where the caption plate does. Held fingers are
   released on the way in, or a thumb that was down when the scene began
   would be reported as held for the whole of it. */
let tcCineOn = false;
function tcSyncCine() {
  const want = TOUCH && !!GAME.cine;
  if (want === tcCineOn) return;
  tcCineOn = want;
  if (want) releaseAllInput();
  if (TCPAD) TCPAD.hidden = want || GAME.blocked || !TOUCH;
}

/* ===== 27.  BOOT — presentation sizing and the orientation gate = */

/* How much of the fitted area an integer scale must still cover before a
   handheld accepts the letterboxing it costs. Giving up more than a seventh
   of a phone screen hurts worse than slightly uneven pixel columns do; a
   desktop has the room to spare and always takes the crisp step. On a dense
   panel the bar is higher still (INT_SCALE_FILL_HIDPI): VW is already cut to
   the screen's aspect, so there is no letterbox for the crisp step to hide
   inside and taking it puts bars on all four sides — while at dpr 2+ the
   uneven columns it buys are a fraction of a physical pixel. */
const INT_SCALE_FILL = 0.86, INT_SCALE_FILL_HIDPI = 0.995;

function resize() {
  const D = profileDevice();
  /* the keyboard hint line only exists off touch, so only desktop pays for it */
  const pad = TOUCH ? 0 : 26;
  const availW = D.vw, availH = mx(80, D.vh - pad);

  /* Snap in DEVICE pixels, not CSS pixels. One game pixel has to cover a whole
     number of physical pixels or the upscale shows uneven columns that crawl
     as the camera moves — the one artefact this art style cannot hide. */
  const fit = mn(availW / VW, availH / VH);
  let s = fit;
  D.integer = false;
  const devScale = fit * D.dpr;
  if (devScale >= 2) {
    const cand = fl(devScale) / D.dpr;
    const need = !TOUCH ? 0 : (D.dpr >= 2 ? INT_SCALE_FILL_HIDPI : INT_SCALE_FILL);
    if (cand / fit >= need) { s = cand; D.integer = true; }
  }
  s = mx(0.2, s);
  D.scale = s;

  cvs.style.width = (VW * s) + 'px';
  cvs.style.height = (VH * s) + 'px';
  /* centre against the visual viewport so the canvas never sits behind the
     browser chrome when it slides back into view */
  document.body.style.height = D.vh + 'px';

  sizeTouchPads();
  updateOrientationGate();
}

/* Pads are sized off the short screen edge: a fixed 62px button is a
   thumb-swallowing slab on a small phone and a postage stamp on a tablet. */
function sizeTouchPads() {
  if (!TOUCH || !TCPAD) return;
  const u = clamp(Math.round(mn(DEV.vw, DEV.vh) * 0.17), 42, 84);
  TCPAD.style.setProperty('--u', u + 'px');
  TCPAD.style.setProperty('--gap', clamp(Math.round(u * 0.18), 6, 16) + 'px');
  /* the glyph fills about half the pad, rounded to a whole multiple of its
     16px source — a pixel icon at 1.7x has fatter columns than thin ones */
  TCPAD.style.setProperty('--icon', ICON_SRC * clamp(Math.round(u * 0.52 / ICON_SRC), 1, 4) + 'px');
  DEV.unit = u;
}

/* A handheld held upright gets the rotate prompt rather than a sliver of a
   level that was composed to be played the other way round. */
const ROTEL = document.getElementById('rot');
function updateOrientationGate() {
  const block = TOUCH && DEV.portrait;
  if (block === GAME.blocked) return;
  GAME.blocked = block;
  if (ROTEL) ROTEL.classList.toggle('show', block);
  /* a resize mid-cutscene must not hand the pads back — see tcSyncCine() */
  if (TCPAD) TCPAD.hidden = block || !TOUCH || !!GAME.cine;
  if (block) {
    /* drop every held finger and pause a run in progress — the knight must not
       take hits behind an overlay nobody can see past */
    releaseAllInput();
    if (GAME.mode === 'play') GAME.mode = 'paused';
  }
}

addEventListener('resize', resize);
addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) {
  visualViewport.addEventListener('resize', resize);
  visualViewport.addEventListener('scroll', resize);
}
try { matchMedia('(orientation:portrait)').addEventListener('change', resize); } catch (_) { }
resize();

buildProps();
buildArena();
bakePits();
buildWarmQueue();
seedAmbient();
GAME.mode = 'title';
CAM.x = 190;
requestAnimationFrame(frame);
</script>
</body>
</html>
