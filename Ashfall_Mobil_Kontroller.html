    const rr = 6 + grow * (CHARGE_WAVE_ECHO_R - 6) - rest;
    ctx.globalAlpha = Math.pow(1 - v, 1.14) * 0.48;
    impactWave(ctx, waveX, y, rr, rr * 0.56, P.clFxEcho, true, fl(v * 9), 0, 2, 2);
  }
  const mr = 4 + waveE * (CHARGE_WAVE_R - 4) - settle;
  /* A source-over under-rail gives the red body a silhouette over green enemies
     and bright steel; luminous rails stay one pixel wide instead of blooming. */
  ctx.globalCompositeOperation = 'source-over';
  const ripPhase = fl(waveU * 5);
  ctx.globalAlpha = Math.pow(1 - waveU, 0.80) * 0.82;
  impactWave(ctx, waveX, y, mr + 1, mr * 0.66 + 1, P.clFxD, false, ripPhase, 0, 2, 2);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.pow(1 - waveU, 0.56) * 1.00;
  impactWave(ctx, waveX, y, mr, mr * 0.66, P.clFx, false, ripPhase, 0, 2, 2);
  ctx.globalAlpha = Math.pow(1 - waveU, 0.72) * 0.94;
  impactWave(ctx, waveX, y, mr - 1, mr * 0.66 - 1, P.clFxHi, false, ripPhase + 2, s.dir, 2, 3);
  if (waveU < 0.46) {
    const v = waveU / 0.46, rr = 2 + eOut(v) * (CHARGE_WAVE_CORE_R - 2);
    ctx.globalAlpha = Math.pow(1 - v, 0.72) * 0.98;
    impactWave(ctx, x, y, rr, rr * 0.72, P.clFxCore, false, fl(v * 3), 0, 1, 2);
  }

  /* The cut is shorter than the wave. It opens the impact, then leaves the
     expanding contours to carry the remaining silhouette. */
  const cutAge = clamp(ageS / CHARGE_CUT_T, 0, 1), cutQ = 1 - cutAge;
  if (cutQ <= 0) {
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    return;
  }
  const reach = fl(12 + eOut(cutAge) * 14);
  const x0 = x - s.dir * reach * 0.45, y0 = y - reach * 0.55;
  const x1 = x + s.dir * reach * 0.65, y1 = y + reach * 0.42;
  /* Dark parallel rails preserve the diagonal at actual 1x pixel scale; the
     hot centre stays one pixel, so this reads as a cut rather than a beam. */
  ctx.globalAlpha = cutQ * 0.38;
  impactLine(ctx, x0, y0 - 1, x1, y1 - 1, P.cl);
  impactLine(ctx, x0, y0 + 1, x1, y1 + 1, P.clD);
  ctx.globalAlpha = cutQ * 0.84;
  impactLine(ctx, x0, y0, x1, y1, P.clHi);
  ctx.globalAlpha = cutQ * 0.46;
  impactLine(ctx, x - s.dir * 5, y + 6, x + s.dir * 9, y - 8, P.cl);
  impactLine(ctx, x - s.dir * 3, y - 1, x - s.dir * (6 + reach * 0.35), y + 4, P.clD);
  if (cutAge < 0.38) {
    ctx.globalAlpha = (1 - cutAge / 0.38) * 0.88;
    r(ctx, x - 3, y, 7, 1, P.clFxWhite); r(ctx, x, y - 3, 1, 7, P.clHi);
    r(ctx, x - 1, y - 1, 3, 3, P.clHi);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ===== 25b. THE KING GETS UP — the closing cutscene ============

   The first fight is won and it does not matter. Grullk hauls himself off the
   stone, walks the knight down, takes the shield off him with one blow and
   the knight with the next; then something that was watching says its piece
   and the screen goes white. A later wrong kill reuses that retaliation with
   one short reminder, while a rematch death enters after the retaliation and
   hears only "Not yet." All three routes return through the same white wake.
   Driven off one flat phase table, NOT the entity updates: plUpdate and
   bossUpdate never run in this mode, so nothing here fights a state machine
   for a limb. Poses go straight onto PL.anim / BOSS.anim with the frame read

/* The two ways a pose is set in here. Nothing in this scene runs through a
   state machine, so a phase either lets an animation play on its own clock
   (`pose`) or scrubs it directly off the phase's progress (`poseAt`). */
function pose(e, tbl, name, dt) { e.anim = name; e.at += dt; e.frame = animFrame(tbl[name], e.at); }

/* word wrap against the pixel font, which is fixed pitch, so the width of a
   run is only ever a function of its length */
function wrapText(str, maxW, sc, sp) {
  const words = String(str).split(' '), out = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && textW(t, sc, sp) > maxW) { out.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}
/* A caption plate, not a page: wide and shallow. The square it replaced
   filled half the frame for four short lines and read as a menu. Width tracks
   VW so it stays a caption on a wide handset. Placement is supplied by the
   caller: the closing boss scene uses the upper safe edge, while opening and
   gameplay captions retain their lower subtitle position. */
const CUT_BOX_H = 40, CUT_PAD = 12, CUT_LH = 12;
function cutBoxW() { return mn(VW - 72, 392); }

/* ---- the caption track ----
   One plate and one typewriter for everything in the game that says words:
   the closing scene, the opening one, and a single line of the knight's own
   voice mid-fight. Anything carrying these six fields can be fed to them.
   The rates are the closing scene's, unchanged — a full stop buys a beat,
   because without one "Hmm..." arrives at the same even clip as everything
   else and the pause in the writing is lost. */
const CAP_CH = 0.045, CAP_DOT = 0.155, CAP_COMMA = 0.10, CAP_HOLD = 1.5, CAP_GAP = 0.30;
function capBuild(c, arr) {
  if (c.lines) return;
  const i = mn(c.si, arr.length - 1);
  c.lines = wrapText(arr[i], cutBoxW() - CUT_PAD * 2 - 4, 1, 2);
  /* Keep the separator that wrapText removed at the line boundary. Without it
     a long sentence such as the unknown voice's question would render
     `firstslot` as one word while the typewriter advances across the wrap. */
  c.flat = c.lines.join(' ');
}
/* Returns true the moment the LAST sentence has finished arriving. Everything
   before that — the blank beat between two sentences, the dwell on a finished
   one — is this function's business and nobody else's. */
function capTick(c, arr, dt) {
  capBuild(c, arr);
  /* the blank beat between two sentences — the plate stays, the words go */
  if (c.gap > 0) {
    c.gap -= dt;
    if (c.gap <= 0) { c.si++; c.lines = null; c.shown = 0; c.acc = 0; capBuild(c, arr); }
    return false;
  }
  if (c.shown < c.flat.length) {
    c.acc += dt;
    while (c.shown < c.flat.length) {
      const ch = c.flat[c.shown];
      const cost = ch === '.' ? CAP_DOT : (ch === ',' ? CAP_COMMA : CAP_CH);
      if (c.acc < cost) break;
      c.acc -= cost; c.shown++;
      if (ch !== ' ') AUD.type();
    }
    if (c.shown >= c.flat.length) c.sHold = CAP_HOLD;
    return false;
  }
  /* fully typed. The last sentence is never cleared — what happens to it is
     the caller's decision, not the typewriter's. */
  if (c.si >= arr.length - 1) return true;
  c.sHold -= dt;
  if (c.sHold <= 0) c.gap = CAP_GAP;
  return false;

/* The second scene uses the same typewriter, but keeps its own caption track
   so the original Grullk lines remain frozen above the first white-out. The
   anchor is semantic: `bottom` is the knight, `top` is the voice. */
const CUT_POST_LINES = Object.freeze({
  knightWake: 'What... happened?',
  voice: 'Did you ever try using the item in your first slot at the right moment while fighting Grullk, then hitting Grullk with your strongest attack?',
  knightWho: 'Who are you- wait, what?',
  knightMad: "Great. Now I'm starting to lose my mind."
});
function cutTalkReset() { Object.assign(CUT_TALK, CUT_TALK_INIT); }
function cutTalkStart(text, anchor) {
  cutTalkReset();

}
function cutTalkTick(dt) {

}
function cutTalkPhase(text, anchor, dt) {
  if (!CUT_TALK.active) cutTalkStart(text, anchor);

     caption must remain readable before the authored timeline advances. The
     shared capTick deliberately leaves the final sentence's dwell decision to
     its caller. This track owns that dwell, then RETURNS completion so the
     timeline that called it advances its own phase counter. */
  if (CUT_TALK.sHold > 0) {
    CUT_TALK.sHold = mx(0, CUT_TALK.sHold - dt);

function cutTalkDraw() {
  if (!CUT_TALK.active || !CUT_TALK.lines) return;
  drawCaption(CUT_TALK, CUT_TALK.sHold > 0, CUT_TALK.out, CUT_TALK.anchor);
}

/* ---- one line, said out loud, over the top of play ----
   The same plate and the same rate as a cutscene, because the game has
   exactly one way of putting words on a screen and this is it. Types, holds
   long enough to be read, and fades. */
const SAY_INIT = {
  on: false, out: 1, hold: 0, fade: 0, arr: null,
  si: 0, sHold: 0, gap: 0, lines: null, flat: '', shown: 0, acc: 0
};
const SAY = Object.assign({}, SAY_INIT);
const SAY_HOLD = 1.9, SAY_FADE = 0.5;
function sayLines(arr) {
  Object.assign(SAY, SAY_INIT);
  SAY.on = true; SAY.arr = arr.slice();
  capBuild(SAY, SAY.arr);
}
function sayLine(str) { sayLines([str]); }
function sayUpdate(dt) {
  if (!SAY.on) return;
  if (SAY.hold > 0) {
    SAY.hold = mx(0, SAY.hold - dt);
    if (SAY.hold <= 0) SAY.fade = SAY_FADE;
    return;
  }
  if (SAY.fade > 0) {
    SAY.fade = mx(0, SAY.fade - dt);
    SAY.out = SAY.fade / SAY_FADE;
    if (SAY.fade <= 0) SAY.on = false;
    return;
  }
  if (capTick(SAY, SAY.arr, dt)) SAY.hold = SAY_HOLD;
}
function sayDraw() {
  /* he has stopped talking. Without this the plate freezes under the death
     screen, half readable through it, for as long as the body lies there. */
  if (!SAY.on || !SAY.lines || PL.dead) return;
  drawCaption(SAY, SAY.hold > 0, SAY.out);
}

/* He walks twice in this scene — once to close the distance and once more after
   the first blow throws the knight further than the mace can reach. Same stride,
   same footfall, so it lives in one place. */
function cutBossStride(dt) {
  const b = BOSS;
  b.x += b.face * 46 * dt;
  b.anim = 'walk'; CUT.walkT += dt;
  b.frame = animFrame(BA.walk, CUT.walkT);
  if ((b.frame === 0 || b.frame === 5) && CUT.stepF !== b.frame) {
    CUT.stepF = b.frame;
    FX.dust(b.x - b.face * 6, b.y, 4, 24, 14, P.stnLt);
    AUD.bossStep(); CAM.kick(0.9, 12);
  }
}

/* The white reveals the threshold of the next attempt: the host and Grullk
   stay absent while the knight wakes, and the portcullis remains raised.
   Retaliation routes put both pieces of kit on solid ground at the entrance;
   an ordinary rematch death keeps them equipped. Grullk returns only after the
   player walks right into the arena trigger. */
function cutPostPrepare() {
  if (CUT.postReady) return;
  const p = PL;
  const lostKit = CUT.kind !== 'death';
  CUT.postReady = true; CUT.fade = 0; CUT.bright = 1; CUT.boxA = 0;
  EN.length = 0; DAG.length = 0; GAME.damageNums.length = 0;
  PS.clearCombat();
  BOSS.active = false; BOSS.dead = true; BOSS.deadT = 999; BOSS.hp = 0; BOSS.hpShown = 0;
  GAME.arenaLocked = true;
  GAME.bossWake = false;
  CAM.lock = 0;
  GATE.state = 'open'; GATE.y = GATE.upY; GATE.t = 0;
  p.x = clamp(bossWakeStageX(), 6, LV.w - 8); p.y = GY;
  p.vx = 0; p.vy = 0; p.onGround = true; p.dead = false; p.deadT = 0;
  p.hp = PLC.maxHp; p.stam = PLC.maxStam; p.flasks = PLC.flasks;
  p.armed = !lostKit; p.shieldGone = false; p.cutKitStrip = lostKit ? 3 : -1;
  p.state = 'idle'; p.st = 0; p.anim = 'kneel'; p.at = 0; p.frame = 0;
  p.lastGroundX = p.x; p.lastGroundY = p.y; p.face = 1;
  CUT.itemSwordX = p.x + 20; CUT.itemShieldX = p.x + 2;
  CUT.swordTaken = !lostKit; CUT.shieldTaken = !lostKit;
  cutTalkReset();
  CAM.follow(p.x, p.y - 18, 1, 0);
}
function drawCutGroundItem(prop, x) {
  const cv = PROPS[prop];
  if (!cv) return;
  const sx = fl(x - CAM.cx - cv.width / 2), sy = fl(GY - CAM.cy - cv.height + 1);
  if (sx > VW + 24 || sx + cv.width < -24) return;
  ctx.drawImage(cv, sx, sy);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.08 + 0.08 * (0.5 + 0.5 * sin(WT * 2.4 + x));
  ctx.drawImage(cv, sx, sy - 1);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawCutGroundKit() {
  if (!CUT.postReady) return;
  if (!CUT.swordTaken) drawCutGroundItem('itemSword', CUT.itemSwordX);
  if (!CUT.shieldTaken) drawCutGroundItem('itemShield', CUT.itemShieldX);
}

function cutUpdate(dt) {
  const b = BOSS, p = PL;
  CUT.t += dt;
  const ph = cutName(), dur = cutPhaseTable()[CUT.i][1];
  const u = dur > 0 ? clamp(CUT.t / dur, 0, 1) : 0;
  const dx = p.x - b.x;

  /* both of them look at each other for the whole thing */
  if (ph !== 'fall' && ph !== 'fade') { b.face = dx > 0 ? 1 : -1; p.face = -b.face; }

  switch (ph) {
    case 'still': {
      b.anim = 'die'; b.frame = BA.die.n - 1;
      pose(p, KA, p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle', dt);
      break;
    }
    case 'rise': {
      /* the death keys played back to front. Nothing new had to be posed for
         this: a fall run in reverse already reads as a thing standing up. */
      if (CUT.t - dt <= 0) { AUD.bossSnarl(); CAM.kick(2.2, 6); }
      b.anim = 'die';
      b.frame = clamp(BA.die.n - 1 - fl(u * BA.die.n), 0, BA.die.n - 1);
      if ((CUT.t % 0.16) < dt) FX.dust(b.x + rnd(-22, 22), b.y, 2, 18, 14, P.stnLt);
      if (u >= 1 && !CUT.hit) {
        CUT.hit = true; AUD.bossStep(); CAM.kick(3.4, 5);
        FX.dustRing(b.x, b.y, 10, 110); FX.stoneBurst(b.x, b.y, 5, 90, 8);
      }
      pose(p, KA, p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle', dt);
      break;
    }
    case 'walk': {
      /* however far the killing blow threw him, he closes it on foot */
      const adx = ab(dx);
      if (adx <= 56 || CUT.t > 3.4) { cutAdvance(); break; }
      cutBossStride(dt);
      pose(p, KA, 'idle', dt);
      break;
    }
    case 'tense': {
      if (CUT.t - dt <= 0) { AUD.bossRoar(); CAM.kick(4.2, 4); }
      poseAt(b, BA, 'roar', u);
      if (Math.random() < 0.30) FX.dust(b.x + rnd(-30, 30), b.y, 1, 26, 18, P.stnLt);
      /* the knight puts the shield up. It is the right answer and it will not
         matter, which is the only thing this whole sequence is for. */
      pose(p, KA, 'block', dt);
      break;
    }
    case 'swing1': {
      poseAt(b, BA, 'smash', u);
      if (b.frame >= 5 && !CUT.hit) {
        CUT.hit = true;
        /* ---- the shield goes ---- */
        p.shieldGone = true; p.hp = mn(p.hp, 14); p.flashT = 0.32;
        p.anim = 'hurt'; p.at = 0; p.frame = 0;
        p.vx = b.face * 210; p.vy = -120;
        CUT.fly = true;
        FX.shieldShatter(p.x + p.face * 10, p.y - 28, b.face);
        FX.blood(p.x, p.y - 26, b.face, 7, P.bld);
        AUD.shieldBreak(); AUD.hurt();
        GAME.hitstop = mx(GAME.hitstop, 0.18);
        GAME.damageFlash = 0.32;
        CAM.kick(6.0, 5);
      }
      if (!CUT.hit) pose(p, KA, 'block', dt);
      break;
    }
    case 'stagger': {
      /* The first blow throws the knight some forty pixels clear, which is
         further than the mace can reach — so the king walks it back in. Skip
         this and the killing blow visibly lands on empty stone. */
      if (ab(dx) > 54) {
        cutBossStride(dt);
      } else pose(b, BA, 'idle', dt);
      /* held on the last recoil frame, the same trick a parried goblin gets */
      p.anim = 'hurt'; p.frame = KA.hurt.n - 1;
      if ((CUT.t % 0.22) < dt) FX.blood(p.x + rnd(-4, 4), p.y - rnd(16, 30), -p.face, 1, P.bldD);
      break;
    }
    case 'swing2': {
      poseAt(b, BA, 'diag', u);
      if (b.frame >= 5 && !CUT.hit) {
        CUT.hit = true;
        p.hp = 0; p.dead = true; p.deadT = 0; p.state = 'death';
        p.anim = 'death'; p.at = 0; p.frame = 0;
        p.vx = b.face * 150; p.vy = -150; CUT.fly = true;
        FX.blood(p.x, p.y - 26, b.face, 16, P.bld);
        AUD.hitHeavy(); AUD.die();
        GAME.hitstop = mx(GAME.hitstop, 0.26);
        GAME.damageFlash = 0.40;
        CAM.kick(7.0, 4.5);
      }
      if (!CUT.hit) { p.anim = 'hurt'; p.frame = KA.hurt.n - 1; }
      break;
    }
    case 'fall': {
      pose(b, BA, 'idle', dt);
      pose(p, KA, 'death', dt);
      break;
    }
    case 'fade': {
      CUT.fade = u;
      pose(b, BA, 'idle', dt);
      p.anim = 'death'; p.frame = KA.death.n - 1;
      break;
    }
    case 'black': CUT.fade = 1; break;
    case 'boxin': capBuild(CUT, CUT.linesForRun); CUT.boxA = u; break;
    case 'type': {
      /* the last sentence is left standing: it is what the five seconds of
         'hold' are for, and what the screen brightens over */
      CUT.boxA = 1;
      if (capTick(CUT, CUT.linesForRun, dt)) cutAdvance();
      break;
    }
    case 'hold': CUT.boxA = 1; break;
    case 'bright': CUT.boxA = 1; CUT.bright = u; break;
    case 'brightHold': CUT.boxA = 0; CUT.bright = 1; break;
    case 'return': {
      cutPostPrepare();
      CUT.bright = 1 - eOut(u);
      poseAt(p, KA, 'kneel', 0);
      break;
    }
    case 'postKneel': {
      pose(p, KA, 'kneel', dt);
      break;
    }
    case 'postStand': {
      poseAt(p, KA, 'kneelStand', u);
      break;
    }
    case 'postSword': {
      poseAt(p, KA, 'pickup', u);
      if (p.frame >= PICK_FRAME && !CUT.hit) {
        CUT.hit = true; CUT.swordTaken = true; p.cutKitStrip = 1;
        AUD.uiBig(); FX.dust(CUT.itemSwordX, GY, 4, 18, 12, P.stnLt);
      }
      break;
    }
    case 'postShield': {
      poseAt(p, KA, 'pickup', u);
      if (p.frame >= PICK_FRAME && !CUT.hit) {
        CUT.hit = true; CUT.shieldTaken = true; p.cutKitStrip = 0;
        AUD.uiBig(); FX.dust(CUT.itemShieldX, GY, 4, 18, 12, P.stnLt);
      }
      if (CUT.t >= dur) { p.armed = true; p.shieldGone = false; plSet('idle', 'idle'); }
      break;
    }
    case 'postKnight1':
      if (cutTalkPhase(CUT_POST_LINES.knightWake, 'bottom', dt)) cutAdvance(); break;
    case 'postGap': break;
    case 'postVoice':
      if (cutTalkPhase(CUT_POST_LINES.voice, 'top', dt)) cutAdvance(); break;
    case 'postKnight2':
      if (cutTalkPhase(CUT_POST_LINES.knightWho, 'bottom', dt)) cutAdvance(); break;
    case 'postSilence': break;
    case 'postKnight3':
      if (cutTalkPhase(CUT_POST_LINES.knightMad, 'bottom', dt)) cutAdvance(); break;
    case 'end': {
      cutSceneEnd();
      break;
    }
  }

  /* the only physics in the whole sequence: a body that was just thrown */
  if (CUT.fly) {
    const prevY = p.y;
    p.vy = mn(PLC.maxFall, p.vy + PLC.gravity * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.30, dt);
    /* This scene starts inside the live boss arena. Its authored knockback is
       allowed to move the body, not to pass through the wall or portcullis. */
    if (LV.arenaX0 !== undefined) {
      const x0 = LV.arenaX0 + 34, x1 = LV.arenaX1 - 10;
      if (p.x < x0) { p.x = x0; if (p.vx < 0) p.vx = 0; }
      else if (p.x > x1) { p.x = x1; if (p.vx > 0) p.vx = 0; }
    }
    p.onGround = false;
    /* Sweep from the previous feet position. A point query at the new y can
       miss the whole floor on the engine's legal 60ms hitch frame. */
    if (landOn(p, prevY, PLC.footW)) {
      p.vx *= 0.2;
      if (ab(p.vx) < 6) CUT.fly = false;
    }
  }
  if (dur > 0 && CUT.t >= dur) cutAdvance();
  CAM.follow(CUT.postReady ? PL.x : (PL.x + BOSS.x) * 0.5, PL.y - (CUT.postReady ? 18 : 26), dt, 0);
}

function cutRender() {
  const sceneOver = CUT.fade >= 1;
  if (!sceneOver) {
    renderPlay();                        /* drawHUD bails on GAME.cine */
    if (CUT.fade > 0) ra(ctx, 0, 0, VW, VH, '#05070a', CUT.fade);
  } else {
    r(ctx, 0, 0, VW, VH, '#05070a');
  }
  if (CUT.boxA > 0 && CUT.lines) cutDrawBox();
  cutTalkDraw();
  if (CUT.bright > 0) {
    /* the ramp is eased in so the last half second is the bright half — a
       linear fill to white reads as a wash rather than as something arriving */
    ra(ctx, 0, 0, VW, VH, '#ffffff', clamp(eIn(CUT.bright), 0, 1));
  }
}
/* The boss's closing words live above the action. Other caption tracks pass
   the default lower anchor so their established placement is unchanged. */
function cutDrawBox() { drawCaption(CUT, cutName() === 'type' || cutName() === 'hold', CUT.boxA, 'top'); }
/* The plate itself. `c` is any caption track (see capTick). `anchor` keeps
   placement an explicit render concern instead of duplicating the plate. */
function drawCaption(c, caret, alpha, anchor) {
  const W = cutBoxW(), H = CUT_BOX_H;
  const x0 = fl(VW / 2 - W / 2), y0 = anchor === 'top' ? 18 : VH - H - 18;
  const a = clamp(alpha, 0, 1);
  if (a <= 0.01) return;
  ctx.globalAlpha = a;
  /* a plain white frame, and nothing else on the screen with it */
  r(ctx, x0, y0, W, H, '#ffffff');
  r(ctx, x0 + 2, y0 + 2, W - 4, H - 4, '#05070a');
  ctx.globalAlpha = a * 0.30;
  r(ctx, x0 + 3, y0 + 3, W - 6, 1, '#ffffff');
  ctx.globalAlpha = a;
  const n = c.lines.length;
  const ty = y0 + fl((H - n * CUT_LH) / 2) + 2;
  const shown = c.shown;
  let start = 0, lastX = x0 + CUT_PAD, lastY = ty;
  for (let i = 0; i < n; i++) {
    const L = c.lines[i];
    const k = mn(mx(shown - start, 0), L.length);
    if (k <= 0) break;
    text(ctx, L.slice(0, k), x0 + CUT_PAD, ty + i * CUT_LH, '#e8ecf2', 1, 2);
    lastX = x0 + CUT_PAD + textW(L.slice(0, k), 1, 2) + 2; lastY = ty + i * CUT_LH;
    start += L.length + 1;
  }
  /* the caret, so a line that has stopped arriving still looks alive */
  if (caret && (WT % 0.9) < 0.5) r(ctx, lastX, lastY, 4, 7, '#e8ecf2');
  ctx.globalAlpha = 1;
}

/* ===================================================================
   CUTSCENE HANDOFF — stage the next arena attempt after the white
   The scene owns the revival and clean transition. It does not call resetRun(),
   because that would respawn the field host. Instead it rebuilds only Grullk
   through restartBossFight() → stageBossWake(), preserving inventory and passage
   upgrades until the player enters the next arena attempt.
   =================================================================== */
function cutSceneEnd() {
  if (CUT.closed) return;
  CUT.closed = true;
  CUT.on = false; CUT.boxA = 0; CUT.bright = 0; CUT.fade = 0;
  CUT_TALK.active = false;
  EN.length = 0; DAG.length = 0; GAME.damageNums.length = 0;
  GAME.cine = false; GAME.mode = 'play';
  GAME.t = 0; GAME.winT = 0; GAME.deathT = 0;
  CAM.lock = 0;
  GATE.state = 'open'; GATE.y = GATE.upY; GATE.t = 0;
  const p = PL;
  p.dead = false; p.deadT = 0; p.hp = PLC.maxHp; p.stam = PLC.maxStam; p.flasks = PLC.flasks;
  p.armed = true; p.shieldGone = false; p.cutKitStrip = -1;
  p.vx = 0; p.vy = 0; p.onGround = true; p.face = 1;
  plSet('idle', 'idle');
  releaseAllInput();
  /* Only the complete first story scene unlocks the item. Wrong kills and
     deaths enter with this already true and can never roll it backwards. */
  if (CUT.kind === 'first') GAME.bossRematch = true;
  /* Stage the reborn attempt at the entrance. The player must walk right into
     the arena before the ordinary encounter entrance drops the gate and
     activates the full-health phase-one king. */
  if (!restartBossFight()) AUD.startMusic(LV.music || 'field');
  CAM.follow(p.x, p.y - 18, 1, 0);
}

/* ===== 25bb. THE FINISHER AFTERMATH ============================
   A charged red strike is a different story beat from the ordinary boss
   defeat. It deliberately owns its own timeline: the first closing scene
   remains replayable for a normal kill, while this branch can end in a real
   black-screen handoff without leaking the old scene's revival state. */
const FIN_LINES = Object.freeze({
  helm: 'Okay, I need to take this helmet off now!',
  shock: 'WHAT THE HECK?!',
  refused: "I said don't even try."
});
const FIN_PH = [
  ['headache', 1.9],
  ['dropSword', 0.72],
  ['dropShield', 0.72],
  ['line1', 0],
  ['struggle', 2.35],
  ['line2', 0],
  ['faint', 3.8],
  ['black', 10.0],
  ['close', 0]
];
/* A helmet refusal is paid off only after the same first-slot finisher has
   completed its authored black hold. Keep this as a second authored timeline
   rather than inserting a conditional phase during the scene: the ordinary
   finisher remains exactly nine phases, while the marked run gets one top
   caption and a readable pause before the terminal close. */
const FIN_REFUSED_PH = [
  ['headache', 1.9],
  ['dropSword', 0.72],
  ['dropShield', 0.72],
  ['line1', 0],
  ['struggle', 2.35],
  ['line2', 0],
  ['faint', 3.8],
  ['black', 10.0],
  ['refusedLine', 0],
  ['refusedHold', 2.8],
  ['close', 0]
];
const FIN_INIT = {
  on: false, i: 0, t: 0, fade: 0, swordX: 0, shieldX: 0,
  swordDropped: false, shieldDropped: false, closed: false,
  helmetRefused: false
};
const FIN_CUT = Object.assign({}, FIN_INIT);
function finPhaseTable() { return FIN_CUT.helmetRefused ? FIN_REFUSED_PH : FIN_PH; }
function finName() { return finPhaseTable()[FIN_CUT.i][0]; }
function finCutBegin() {
  if (FIN_CUT.on || FIN_CUT.closed) return;
  Object.assign(FIN_CUT, FIN_INIT);
  FIN_CUT.helmetRefused = PROG.helmetRefused;
  FIN_CUT.on = true;
  plPrepareCinematic(PL.x);
  GAME.cine = true; GAME.mode = 'finale'; GAME.winT = 0;
  EN.length = 0; DAG.length = 0; GAME.damageNums.length = 0;
  BOSS.active = false; BOSS.dead = true; BOSS.deadT = 999;
  GATE.state = 'open'; GATE.y = GATE.upY; GATE.t = 0;
  FIN_CUT.swordX = PL.x + 18; FIN_CUT.shieldX = PL.x - 3;
  releaseAllInput(); AUD.stopMusic();
  cutTalkReset();
}
function finAdvance(keepTalk) {
  FIN_CUT.i = mn(finPhaseTable().length - 1, FIN_CUT.i + 1);
  FIN_CUT.t = 0;
  if (!keepTalk) Object.assign(CUT_TALK, CUT_TALK_INIT);
}
function drawFinGroundKit() {
  if (!FIN_CUT.on) return;
  if (FIN_CUT.swordDropped) drawCutGroundItem('itemSword', FIN_CUT.swordX);
  if (FIN_CUT.shieldDropped) drawCutGroundItem('itemShield', FIN_CUT.shieldX);
}
function finCutUpdate(dt) {
  const p = PL;
  FIN_CUT.t += dt;
  const ph = finName(), dur = finPhaseTable()[FIN_CUT.i][1];
  const u = dur > 0 ? clamp(FIN_CUT.t / dur, 0, 1) : 0;
  p.face = 1;
  switch (ph) {
    case 'headache':
      poseAt(p, KA, 'finClutch', u);
      p.armed = true; p.cutKitStrip = 0;
      if ((FIN_CUT.t % 0.34) < dt) {
        GAME.damageFlash = mx(GAME.damageFlash, 0.24);
        CAM.kick(1.3, 7); FX.unknown(p.x + rnd(-3, 3), p.y - 38, rint(1, 2));
      }
      break;
    case 'dropSword':
      poseAt(p, KA, 'pickup', u);
      p.armed = true; p.cutKitStrip = FIN_CUT.swordDropped ? 2 : 0;
      if (u >= 0.55 && !FIN_CUT.swordDropped) {
        FIN_CUT.swordDropped = true; p.cutKitStrip = 2;
        AUD.uiBig(); FX.dust(FIN_CUT.swordX, GY, 4, 18, 12, P.stnLt);
      }
      break;
    case 'dropShield':
      poseAt(p, KA, 'pickup', u);
      p.armed = true; p.cutKitStrip = 2;
      if (u >= 0.55 && !FIN_CUT.shieldDropped) {
        FIN_CUT.shieldDropped = true; p.armed = false; p.cutKitStrip = 3;
        AUD.uiBig(); FX.dust(FIN_CUT.shieldX, GY, 4, 18, 12, P.stnLt);
      }
      break;
    case 'line1':
      p.armed = false; p.cutKitStrip = 3; p.anim = 'idle'; p.frame = 0;
      if (cutTalkPhase(FIN_LINES.helm, 'bottom', dt)) finAdvance(); break;
    case 'struggle':
      p.armed = false; p.cutKitStrip = 3;
      pose(p, KA, 'helmetStruggle', dt);
      if ((FIN_CUT.t % 0.42) < dt) { AUD.hurt(); CAM.kick(0.8, 9); }
      break;
    case 'line2':
      p.armed = false; p.cutKitStrip = 3; p.anim = 'helmetStruggle'; p.frame = KA.helmetStruggle.n - 1;
      if (cutTalkPhase(FIN_LINES.shock, 'bottom', dt)) finAdvance(); break;
    case 'refusedLine':
      p.armed = false; p.cutKitStrip = 3; p.anim = 'helmetStruggle'; p.frame = KA.helmetStruggle.n - 1;
      if (cutTalkPhase(FIN_LINES.refused, 'top', dt)) finAdvance(true); break;
    case 'refusedHold':
      p.armed = false; p.cutKitStrip = 3; p.anim = 'helmetStruggle'; p.frame = KA.helmetStruggle.n - 1;
      break;
    case 'faint':
      p.armed = false; p.cutKitStrip = 3;
      poseAt(p, KA, 'death', u); FIN_CUT.fade = eOut(u);
      break;
    case 'black':
      FIN_CUT.fade = 1; break;
    case 'close':
      finCutEnd(); return;
  }
  if (dur > 0 && FIN_CUT.t >= dur) finAdvance();
  CAM.follow(p.x, p.y - 18, dt, 0);
}
function finCutRender() {
  renderPlay();
  if (FIN_CUT.fade > 0) ra(ctx, 0, 0, VW, VH, '#05070a', clamp(FIN_CUT.fade, 0, 1));
  cutTalkDraw();
}
function finCutEnd() {
  if (FIN_CUT.closed) return;
  FIN_CUT.closed = true; FIN_CUT.on = false;
  CUT_TALK.active = false;
  EN.length = 0; DAG.length = 0; GAME.damageNums.length = 0;
  BOSS.active = false; BOSS.dead = true; BOSS.deadT = 999; BOSS.hp = 0; BOSS.hpShown = 0;
  /* Keep the cinematic lock asserted in the black fallback too, so a touch
     device cannot reveal controls over the terminal screen while the browser
     decides whether `window.close()` is allowed. */
  GAME.cine = true; GAME.mode = 'closed'; GAME.arenaLocked = true;
  releaseAllInput(); AUD.stopMusic();
  /* Closing a file opened directly is browser-policy dependent. The explicit
     attempt satisfies that path; the `closed` mode is the deterministic black
     fallback when a browser refuses script-initiated tab closure. */
  try { window.close(); } catch (_) { /* browser refused — remain black */ }
}

/* ===== 25c. THE FIRE — the opening cutscene ====================

   Before any of it. The knight is sitting at a campfire with his helm on the
   stone beside him and nothing over his head — and what is under there has no
   shape, which is the only thing this scene is about. He gets up, puts the
   helm on, something is wrong with it, he says so, and the road starts.
   Same architecture as the closing scene and for the same reason: plUpdate
   never runs, poses are written straight onto PL.anim with the frame read off
   the phase clock, and every animation used is one buildWarmQueue has already
   baked. Nothing in here touches plCanAct, damagePlayer or the guard.
   It plays ONCE per playthrough (PROG.introSeen). Dying in the prologue puts
   you back on the road, not back at the fire — a scene that has to be sat
   through again is a punishment, and this one is not that.
   ===== */
const INTRO_LINES = [
  'What is this feeling?',
  'My head hurts so badly...',
  'But I have to keep going.'
];
const INTRO_PH = [
  ['dark', 1.4],      /* the drone, and nothing to look at yet            */
  ['dawn', 3.4],      /* the field comes up out of the black              */
  ['sit', 3.2],       /* he sits, and the unknowing lifts off him         */
  ['stand', 1.15],    /* he gets up                                       */
  ['helm', 1.55],     /* takes the helm off the stone and puts it on      */
  ['settle', 1.0],    /* one second in which nothing at all is wrong      */
  ['clutch', 1.7],    /* and then his hand goes to it                     */
  ['boxin', 0.5],
  ['type', 0],
  ['hold', 1.6],
  ['boxout', 0.6],
  ['end', 0]
];
const INTRO_INIT = {
  on: false, i: 0, t: 0, fade: 1, boxA: 0, helm: true, worn: false, arr: null,
  si: 0, sHold: 0, gap: 0, lines: null, flat: '', shown: 0, acc: 0
};
const INTRO = Object.assign({}, INTRO_INIT);
/* How far over his feet his head is, per pose. Only the black coming off him
   reads these, but they live beside the animations they measure. */
const INTRO_HEAD_SIT = 27, INTRO_HEAD_UP = 40;
const INTRO_HEAD_HELM = [39, 25, 21, 24, 33, 39, 0, 0];
function introName() { return INTRO_PH[INTRO.i][0]; }
function introBegin() {
  Object.assign(INTRO, INTRO_INIT);
  INTRO.on = true; INTRO.arr = INTRO_LINES;
  plPrepareCinematic();
  GAME.cine = true; GAME.mode = 'intro';
  PL.face = -1;                       /* he is looking into the fire */
  PL.state = 'idle'; PL.anim = 'sit'; PL.at = 0; PL.frame = 0;
  CAM.follow(PL.x, PL.y - 20, 1, 0);
}
function introAdvance() { INTRO.i = mn(INTRO_PH.length - 1, INTRO.i + 1); INTRO.t = 0; }
function introEnd() {
  INTRO.on = false;
  PROG.introSeen = true;
  GAME.cine = false;
  GAME.mode = 'play';
  GAME.t = 0;
  PL.face = 1;                        /* the road is the other way */
  plSet('idle', 'idle');
  releaseAllInput();
}
/* Where the helm is lying. Derived from the one number the scene actually
   places — his own position — and from the same reach the animation was
   authored against, so the thing on the stone and the hand that closes on it
   are at the same place by construction. */
function introHelmX() { return PL.x + PL.face * 16; }
function introUpdate(dt) {
  const p = PL;
  INTRO.t += dt;
  const ph = introName(), dur = INTRO_PH[INTRO.i][1];
  const u = dur > 0 ? clamp(INTRO.t / dur, 0, 1) : 0;
  let headH = 0;                      /* 0 = there is steel over it */
  switch (ph) {
    case 'dark':
      INTRO.fade = 1; poseAt(p, KA, 'sit', 0); headH = INTRO_HEAD_SIT; break;
    case 'dawn':
      INTRO.fade = 1 - eOut(u); pose(p, KA, 'sit', dt); headH = INTRO_HEAD_SIT; break;
    case 'sit':
      INTRO.fade = 0; pose(p, KA, 'sit', dt); headH = INTRO_HEAD_SIT; break;
    case 'stand':
      poseAt(p, KA, 'standup', u);
      headH = INTRO_HEAD_SIT + (INTRO_HEAD_UP - INTRO_HEAD_SIT) * u; break;
    case 'helm': {
      poseAt(p, KA, 'wearhelm', u);
      /* the helm leaves the stone on the frame his hand closes on it */
      if (p.frame >= 2 && INTRO.helm) {
        INTRO.helm = false;
        AUD.step();
        FX.dust(introHelmX(), p.y, 3, 12, 9, P.stnLt);
      }
      /* and it is on his head one frame after it is over it */
      if (p.frame >= 6 && !INTRO.worn) { INTRO.worn = true; AUD.block(); }
      headH = INTRO_HEAD_HELM[p.frame] || 0;
      break;
    }
    case 'settle': pose(p, KA, 'idle', dt); break;
    case 'clutch':
      if (INTRO.t - dt <= 0) {
        AUD.hurt(); CAM.kick(1.6, 7);
        GAME.damageFlash = mx(GAME.damageFlash, 0.20);
      }
      poseAt(p, KA, 'clutch', u);
      break;
    /* he stays exactly as he is for the whole of the writing */
    case 'boxin': p.anim = 'clutch'; p.frame = KA.clutch.n - 1; INTRO.boxA = u; capBuild(INTRO, INTRO.arr); break;
    case 'type':
      p.anim = 'clutch'; p.frame = KA.clutch.n - 1; INTRO.boxA = 1;
      if (capTick(INTRO, INTRO.arr, dt)) introAdvance();
      break;
    case 'hold': p.anim = 'clutch'; p.frame = KA.clutch.n - 1; INTRO.boxA = 1; break;
    case 'boxout': p.anim = 'clutch'; p.frame = KA.clutch.n - 1; INTRO.boxA = 1 - u; break;
    case 'end': introEnd(); return;
  }
  /* The black coming off him — the only thing in this scene that is not a
     pose, because it is the only thing that is not part of him. Held back
     until the screen is up far enough to see it against the fire. */
  if (headH > 0 && INTRO.fade < 0.9 && (INTRO.t % 0.13) < dt) FX.unknown(p.x, p.y - headH, rint(1, 2));
  CAM.follow(p.x - p.face * 8, p.y - 20, dt, 0);
  if (dur > 0 && INTRO.t >= dur) introAdvance();
}
function introRender() {
  renderPlay();                        /* drawHUD bails on GAME.cine */
  if (INTRO.fade > 0) ra(ctx, 0, 0, VW, VH, '#05070a', clamp(INTRO.fade, 0, 1));
  if (INTRO.boxA > 0 && INTRO.lines) {
    drawCaption(INTRO, introName() === 'type' || introName() === 'hold', INTRO.boxA);
  }
}
/* the helm on the stone, behind him, because that is where it is */
function drawRestingHelm() {
  const cv = PROPS.helmRest;
  if (!cv) return;
  ctx.drawImage(cv, fl(introHelmX() - CAM.cx - cv.width / 2), fl(PL.y - CAM.cy - cv.height + 2));
}

/* ---- the ore reminder ---------------------------------------------
   A tiny authored cutscene, not AI movement: simulation stands still while
   the same knight animation table supplies the walk and bend. */
function midOreIndex() {
  if (!LV.pickups) return -1;
  for (let i = 0; i < LV.pickups.length; i++) if (LV.pickups[i].k === 'redOre' && pickupAvailable(LV.pickups[i])) return i;
  return -1;
}
function midAutoBegin() {
  if (GAME.mode !== 'play' || GAME.cine || PROG.gemTaken) return;
  const i = midOreIndex();
  if (i < 0) return;
  Object.assign(MIDSCENE, MIDSCENE_INIT);
  MIDSCENE.on = true; MIDSCENE.phase = 'say'; MIDSCENE.takeI = i;
  plPrepareCinematic(LV.mid.gemGate);
  GAME.mode = 'midscene'; GAME.cine = true;
  PL.face = -1;
  sayLine('I think I should take this gem.');
}
function midAutoEnd() {
  MIDSCENE.on = false;
  GAME.cine = false; GAME.mode = 'play';
  PL.vx = 0; plSet('idle', 'idle');
  releaseAllInput();
}
function midAutoUpdate(dt) {
  const p = PL, it = LV.pickups && LV.pickups[MIDSCENE.takeI];
  if (!it) { midAutoEnd(); return; }
  MIDSCENE.t += dt;
  if (MIDSCENE.phase === 'say') {
    sayUpdate(dt);
    if (!SAY.on) { MIDSCENE.phase = 'walk'; MIDSCENE.t = 0; p.anim = 'run'; p.at = 0; p.frame = 0; }
  } else if (MIDSCENE.phase === 'walk') {
    const target = it.x + 13;
    p.face = -1; p.x = mx(target, p.x - 72 * dt);
    p.at += dt; p.anim = 'run'; p.frame = animFrame(KA.run, p.at);
    if ((p.frame === 0 || p.frame === 5) && MIDSCENE.stepF !== p.frame) {
      MIDSCENE.stepF = p.frame; AUD.step(); FX.footDust(p.x + 3, p.y, -1, 72);
    }
    if (p.x <= target + 0.01) {
      MIDSCENE.phase = 'pickup'; MIDSCENE.t = 0;
      plSet('pickup', 'pickup'); p.takeI = MIDSCENE.takeI;
    }
  } else if (MIDSCENE.phase === 'pickup') {
    p.st = MIDSCENE.t; p.at = MIDSCENE.t; p.anim = 'pickup';
    p.frame = animFrame(KA.pickup, p.at);
    if (p.takeI >= 0 && p.st >= KA.pickup.dur * (PICK_FRAME / KA.pickup.n)) {
      const i = p.takeI; p.takeI = -1; pickupTake(i);
    }
    if (p.st >= KA.pickup.dur) midAutoEnd();
  }
  CAM.follow(p.x, p.y - 18, dt, 0);
}
function midAutoRender() {
  renderPlay();
  if (SAY.on) sayDraw();
}

/* ===== 26.  MAIN LOOP ========================================== */
let ashTimer = 0, moteTimer = 0, wispTimer = 0;

function ambientTick(dt) {
  WT += dt;
  /* falling ash — three depth groups, screen space, always moving */
  ashTimer -= dt;
  if (PS.nAmb < 84 && ashTimer <= 0) { spawnAsh(false); ashTimer = 0.05 + Math.random() * 0.05; }
  /* dust motes near enclosed stone and fire */
  moteTimer -= dt;
  if (moteTimer <= 0) {
    moteTimer = 0.18;
    const cx = CAM.cx;
    for (const b of LV.braziers) {
      if (!fireVisible(b)) continue;
      if (ab(b.x - cx - VW / 2) < VW * 0.6 && Math.random() < 0.3) spawnMote(b.x + rnd(-26, 26), b.y - rnd(14, 50));
    }
    if (GAME.arenaLocked && Math.random() < 0.6) spawnMote(cx + rnd(0, VW), GY - rnd(20, 110));
    for (const bg of LV.bg) if (bg.k === 'arch' && ab(bg.x - cx - VW / 2) < VW * 0.7 && Math.random() < 0.25)
      spawnMote(bg.x + rnd(0, 90), bg.y + rnd(20, 60));
  }
  /* low fog wisps hugging the ground */
  wispTimer -= dt;
  if (wispTimer <= 0) {
    wispTimer = 0.42;
    const cx = CAM.cx;
    const dense = GAME.arenaLocked;
    if (Math.random() < (dense ? 0.9 : 0.6)) {
      const x = cx + rnd(-30, VW + 30);
      const gy2 = groundAt(x, 0);
      if (gy2 !== null) spawnFogWisp(x, gy2 - rnd(1, 9), dense);
    }
  }
}

/* the callouts and flashes that do nothing but count down to zero */
const GAME_TIMERS = ['damageFlash', 'parryFlash', 'chargeRecoilT', 'bossNameT', 'phaseText', 'gateOpenT', 'invFlash', 'wallRejectT', 'midRevealT', 'finisherFlash'];
function updatePlay(dt) {
  /* The doorway at the end of a map. While the screen is going down nothing
     ticks, and on the frame the swap lands GAME has just been rebuilt — so
     this frame is over either way and the new map starts on the next one. */
  if (WARP.t > 0) { warpTick(dt); return; }
  GAME.t += dt;
  for (const k of GAME_TIMERS) if (GAME[k] > 0) GAME[k] -= dt;
  for (let i = GAME.starFx.length - 1; i >= 0; i--) { GAME.starFx[i].t -= dt; if (GAME.starFx[i].t <= 0) GAME.starFx.splice(i, 1); }
  for (let i = GAME.chargeFx.length - 1; i >= 0; i--) { GAME.chargeFx[i].t -= dt; if (GAME.chargeFx[i].t <= 0) GAME.chargeFx.splice(i, 1); }
  /* UI feedback uses real frame time, so hit-stop does not silently extend a
     promised 0.55-second label. Pause/modal modes still freeze it naturally. */
  updateDamageNumbers(dt);
  GAME.hpGhost += (PL.hp - GAME.hpGhost) * mn(1, dt * 2.2);
  sayUpdate(dt);
  /* Exit warnings use the normal SAY caption, but are still gameplay: no
     cutscene mode, no alternate pose clock. Only the player/world update is
     paused until the line has finished displaying. */
  if (GAME.exitNotice) {
    if (!SAY.on) GAME.exitNotice = '';
    else { CAM.follow(PL.x, PL.y - 18, dt, PL.vx); return; }
  }
  /* Spending a slot is a UI act, not a move: it is read outside the hit-stop
     gate and outside plCanAct, because what it does is put words on a screen.
     `consume` after the guard, like every other press in the game. */
  if (!PL.dead) for (let i = 0; i < PROG.inv.length; i++) {
    if (IN.consume('slot' + (i + 1))) { invUse(i); break; }
  }

  let sdt = dt;
  if (GAME.hitstop > 0) { GAME.hitstop -= dt; sdt = 0; }

  if (sdt > 0) {
    plUpdate(sdt);
    if (GAME.mode !== 'play') { CAM.follow(PL.x, PL.y - 18, dt, PL.vx); return; }
    if (GAME.exitNotice) {
      CAM.follow(PL.x, PL.y - 18, dt, PL.vx);
      return;
    }
    for (const e of EN) enemyUpdate(e, sdt);
    bossUpdate(sdt);
    daggerUpdate(sdt);
    gateUpdate(sdt);
    if (LV.arenaX0 !== undefined && !GAME.arenaLocked && PL.x > LV.arenaX0 + 44 && !PL.dead) startBossFight();
    if (LV.exitX !== undefined && !PL.dead && PL.x > LV.exitX) warpBegin(LV.next);
  }
  CAM.follow(PL.x, PL.y - 18, dt, PL.vx);

  /* deathT does double duty — the 2.4s the body gets before the plate, then
     the plate's own fade and 1.6s input lock — so it must be zeroed at the
     handover, or the plate snaps in fully lit and takes input immediately. */
  if (PL.dead) {
    GAME.deathT += dt;
    if (GAME.deathT > 2.4) {
      /* The old defeat plate still owns every ordinary death, including a
         loss in the mandatory first Grullk encounter. Once the story has
         opened the rematch, however, death is an arena-local resurrection:
         no beginLevel(), no field-host respawn, no lost encounter state. */
      if (GAME.bossRematch && GAME.arenaLocked && BOSS.active && !BOSS.dead) cutBegin('death');
      else { GAME.mode = 'defeat'; GAME.deathT = 0; }
    }
  }
  /* The body gets 2.9s to settle, then the cutscene takes over. The
     `victory` mode and drawEndScreen(true) are DELIBERATELY left intact and
     unreachable below, so pulling the cutscene out restores the old ending
     by changing this one line. Do not tidy them away. */
  if (BOSS.dead && BOSS.active) {
    GAME.winT += dt;
    if (GAME.winT > 2.9) (BOSS.finisherDeath ? finCutBegin() : cutBegin());
  }
}

/* Everything under the entities, and everything over them. The title screen
   draws the same two sandwiches with nothing in between, so keeping the order
   written down once is what stops the two views drifting apart.
   ORDER IS THE CONTRACT HERE — the arena's rear wall has to land after the sky
   and before the platforms, or the hall paints over the floor of it. */
function drawWorldBack(arena) {
  drawBackground();
  drawMidArchitectureBack();
  const H = LV.hall;
  if (arena && H && LV.hallCv) {
    /* the hall's floor IS the arena floor, so like every other planted layer
       it must not drift vertically — see drawBackground's mid-ground loop */
    const ax = fl(H.x - CAM.cx), ay = fl(H.y - CAM.cy);
    if (ax < VW && ax + LV.hallCv.width > 0) {
      ctx.drawImage(LV.hallCv, ax, ay);
      /* the throne, waiting behind the king */
      ctx.drawImage(PROPS.throne, fl(LV.arenaX1 + H.throneDx - CAM.cx), fl(H.throneY - CAM.cy));
    }
  }
  PS.draw(L_BGATM, CAM.cx, CAM.cy);
  drawPits();
  drawPlatforms();
  drawDecor(false);
}
function drawWorldFront() {
  drawForeground();
  PS.draw(L_FGATM, CAM.cx, CAM.cy);
}
function renderPlay() {
  drawWorldBack(true);
  drawDecor(true);
  drawMidArchitecture();
  drawBraziers();
  PS.draw(L_WORLD, CAM.cx, CAM.cy);
  /* on the stone, under everything that is standing on it */
  drawPickups();
  if (GAME.mode === 'cutscene') drawCutGroundKit();
  if (GAME.mode === 'finale') drawFinGroundKit();
  if (INTRO.on && INTRO.helm) drawRestingHelm();
  drawEnemies();
  drawBoss();
  drawDaggers();
  drawPlayer();
  PS.draw(L_COMBAT, CAM.cx, CAM.cy);
  drawGate();
  drawFogBand(fogs[2], CAM.cx);
  drawWorldFront();
  drawEnemyFeedback();
  drawScreenFx();
  drawHUD();
  /* the doorway between maps covers everything, HUD included */
  if (WARP.t > 0) ra(ctx, 0, 0, VW, VH, '#05070a', warpAlpha());
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt <= 0) dt = 1 / 60;
  FRAME_DT = dt;

  /* portrait on a handheld: the field is behind the rotate prompt, so nothing
     ticks. lastT is already advanced, so turning back does not hand the world
     a stored-up frame. */
  if (GAME.blocked) { IN.clearEdges(); return; }

  IN.tick(dt);
  ambientTick(dt);

  if (GAME.mode === 'title') {
    if (!GAME.ready) {
      if (warmTick(7)) { GAME.ready = true; const b = document.getElementById('boot'); if (b) b.style.display = 'none'; }
    }
    CAM.x = 190; CAM.tx = 190; CAM.y = 0;
    PS.update(dt);
    drawTitle();
    if (GAME.ready && (IN.press('start') || IN.press('light') || IN.press('jump'))) {
      AUD.unlock(); AUD.uiBig();
      newGame();
    }
  } else if (GAME.mode === 'play') {
    if (IN.press('pause')) { GAME.mode = 'paused'; AUD.ui(); }
    else {
      updatePlay(dt);
      PS.update(dt);
      renderPlay();
    }
  } else if (GAME.mode === 'paused') {
    FRAME_DT = dt * 0.3;            /* the field idles behind the plate too */
    PS.update(dt * 0.3);
    renderPlay();
    drawPause();
    if (IN.press('pause')) { GAME.mode = 'play'; AUD.ui(); }
    if (IN.press('restart')) { GAME.mode = 'title'; AUD.stopMusic(); AUD.startMusic('field'); }
  } else if (GAME.mode === 'forge') {
    forgeUpdate(dt);
    PS.update(dt * 0.25);
    renderPlay();
    if (GAME.mode === 'forge') drawForge();
  } else if (GAME.mode === 'midscene') {
    if (GAME.hitstop > 0) GAME.hitstop -= dt;
    else midAutoUpdate(dt);
    PS.update(dt);
    midAutoRender();
  } else if (GAME.mode === 'intro') {
    /* the same shape as the closing scene's branch: one updater, one
       renderer, and the flash timers ticked by hand because updatePlay —
       which owns GAME_TIMERS — is not running */
    if (GAME.hitstop > 0) { GAME.hitstop -= dt; }
    else introUpdate(dt);
    if (GAME.damageFlash > 0) GAME.damageFlash -= dt;
    PS.update(dt);
    introRender();
  } else if (GAME.mode === 'cutscene') {
    if (GAME.hitstop > 0) { GAME.hitstop -= dt; }
    else cutUpdate(dt);
    if (GAME.damageFlash > 0) GAME.damageFlash -= dt;
    PS.update(dt);
    cutRender();
  } else if (GAME.mode === 'finale') {
    if (GAME.hitstop > 0) { GAME.hitstop -= dt; }
    else finCutUpdate(dt);
    if (GAME.damageFlash > 0) GAME.damageFlash -= dt;
    PS.update(dt);
    finCutRender();
  } else if (GAME.mode === 'closed') {
    /* Deterministic fallback for browsers that refuse window.close(). */
    r(ctx, 0, 0, VW, VH, '#05070a');
  } else if (GAME.mode === 'victory' || GAME.mode === 'defeat') {
    const win = GAME.mode === 'victory';
    if (win) GAME.winT += dt; else GAME.deathT += dt;
    if (GAME.hitstop > 0) GAME.hitstop -= dt;
    if (win) { bossUpdate(dt); for (const e of EN) enemyUpdate(e, dt); }
    else plUpdate(dt);
    CAM.follow(win ? BOSS.x : PL.x, (win ? BOSS.y : PL.y) - 18, dt, 0);
    PS.update(dt);
    renderPlay();
    drawEndScreen(win);
    const tt = win ? GAME.winT : GAME.deathT;
    if (tt > 1.6 && (IN.press('start') || IN.press('restart'))) {
      AUD.uiBig();
      if (win) { GAME.mode = 'title'; AUD.stopMusic(); }
      else beginLevel();               /* the same map, not the first one */
    }
  }
  if (IN.press('mute')) { AUD.toggle(); tcMuteLabel(); }
  tcSyncQuit();
  tcSyncTake();
  tcSyncCine();
  tcSyncForge();
  IN.clearEdges();
}

/* ===== 26b. DEVICE PROFILE + ON-SCREEN CONTROLS ================
        The pads are mapped onto the same action names the keyboard uses,
        so the game logic is untouched.
   ===== */
const TOUCH = (function () {
  if (location.hash === '#touch') return true;
  if (location.hash === '#notouch') return false;
  try {
    /* a phone or tablet: the pointer you actually play with is a finger */
    if (matchMedia('(pointer:coarse)').matches) return true;
    /* a touch panel with no mouse anywhere — but a touchscreen laptop keeps
       its keyboard and mouse, and must not be handed a thumb pad */
    if (!matchMedia('(any-pointer:fine)').matches &&
      (('ontouchstart' in window) || navigator.maxTouchPoints > 0)) return true;
    return false;
  } catch (_) {
    return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  }
})();

/* The visual viewport is the honest one on a handheld: it shrinks and grows
   as the browser chrome slides in and out, while innerHeight keeps reporting
   the space the address bar is still sitting on. */
function viewW() { const v = window.visualViewport; return (v && v.width) ? v.width : innerWidth; }
function viewH() { const v = window.visualViewport; return (v && v.height) ? v.height : innerHeight; }

/* What we are running on, refreshed on every resize. */
const DEV = {
  touch: TOUCH, kind: 'desktop', portrait: false,
  dpr: 1, vw: 0, vh: 0, scale: 1, unit: 62, integer: false
};
function profileDevice() {
  const w = viewW(), h = viewH();
  DEV.vw = w; DEV.vh = h;
  DEV.dpr = window.devicePixelRatio || 1;
  DEV.portrait = h > w;
  /* the short edge is orientation-independent, so a phone stays a phone when
     it is turned: ~480 CSS px splits every current handset from every tablet */
  DEV.kind = !TOUCH ? 'desktop' : (mn(w, h) >= 480 ? 'tablet' : 'phone');
  return DEV;
}
const TCPAD = document.getElementById('tc');
const TC_PTR = {};        /* pointerId -> {act, el} */
const TC_CNT = {};        /* act -> how many fingers hold it */
function tcDown(act, el, id) {
  if (TC_PTR[id]) return;
  TC_PTR[id] = { act: act, el: el };
  TC_CNT[act] = (TC_CNT[act] || 0) + 1;
  if (TC_CNT[act] === 1) IN.down(act);
  el.classList.add('on');
}
function tcUp(id) {
  const rec = TC_PTR[id]; if (!rec) return;
  delete TC_PTR[id];
  TC_CNT[rec.act] = mx(0, (TC_CNT[rec.act] || 1) - 1);
  if (TC_CNT[rec.act] === 0) IN.up(rec.act);
  /* Two fingers can physically share one pad. Releasing either one must not
     extinguish the pressed visual while the other pointer still owns that
     same element; action counts alone would be too broad if a future layout
     exposes the same action through two different elements. */
  let elHeld = false;
  for (const k in TC_PTR) if (TC_PTR[k].el === rec.el) { elHeld = true; break; }
  if (!elHeld) rec.el.classList.remove('on');
}
function tcMuteLabel() {
  const m = document.getElementById('tb-mute');
  if (!m) return;
  m.classList.toggle('muted', !!AUD.muted);
  if (ICON.sound) m.style.backgroundImage = 'url(' + (AUD.muted ? ICON.muted : ICON.sound) + ')';
}
/* QUIT only exists while the run is paused — the same reach the keyboard has,
   where `restart` is read on the pause and defeat plates and nowhere during
   play. A pad that could throw away a boss fight on a stray thumb has no
   business sitting over the field. */
let tcQuitOn = false;
function tcSyncQuit() {
  const want = TOUCH && GAME.mode === 'paused';
  if (want === tcQuitOn) return;
  tcQuitOn = want;
  const q = document.getElementById('tb-quit');
  if (q) q.hidden = !want;
}
/* The take pad exists only while something is actually in reach, and it asks
   takeTarget() — the same function the prompt and the press go through — so
   the pad, the word on screen and what F would do are one answer. A pad that
   can do nothing has no business under a thumb. Hiding it mid-press is safe:
   the window-level pointerup and pointercancel handlers release every held
   pad wherever the finger comes up. */
let tcTakeOn = false, tcTakeKind = '';
function tcSyncTake() {
  let kind = '';
  if (GAME.mode === 'forge') kind = 'EXIT';
  else if (GAME.mode === 'play' && !GAME.cine && midAnvilReachable()) kind = 'INTERACT';
  else if (GAME.mode === 'play' && !GAME.cine && takeTarget() >= 0) kind = 'TAKE';
  const want = TOUCH && !!kind;
  if (want === tcTakeOn && kind === tcTakeKind) return;
  tcTakeOn = want;
  tcTakeKind = kind;
  const row = document.getElementById('tc-take-row');
  if (row) row.hidden = !want;
  const b = document.getElementById('tb-take');
  if (b) { b.textContent = kind || 'TAKE'; b.setAttribute('aria-label', (kind || 'take').toLowerCase()); }
}
/* Gameplay pads stand down for a cutscene because they sit where the caption
   plate does; only the device-level mute pad returns in the reserved margin.
   Held fingers are released on the way in, or a thumb that was down when the
   scene began would be reported as held for the whole of it. */
let tcCineOn = false, tcCineClosed = false;
function tcSyncCine() {
  const want = TOUCH && !!GAME.cine;
  const closed = want && GAME.mode === 'closed';
  if (want === tcCineOn && closed === tcCineClosed) return;
  const entering = want && !tcCineOn;
  tcCineOn = want;
  tcCineClosed = closed;
  if (entering) releaseAllInput();
  if (TCPAD) {
    TCPAD.classList.toggle('cine-modal', want && !closed);
    TCPAD.hidden = closed || GAME.blocked || !TOUCH;
  }
}
let tcForgeOn = false;
function tcSyncForge() {
  const want = TOUCH && GAME.mode === 'forge';
  if (want === tcForgeOn) return;
  tcForgeOn = want;
  if (TCPAD) {
    TCPAD.classList.toggle('forge-modal', want);
    if (want) TCPAD.hidden = false;
  }
}
/* ---- pad icons ---
   Same primitives and palette as the sprites, so the controls speak the
   game's language rather than a UI font's. 16x16 sources, baked once at boot
   into data URIs and shown at an integer multiple of 16 so they never land
   between pixels. Each glyph carries the colour of the thing it does. */
const ICON_SRC = 16;
const ICON = {};
function icon(key, fn) {
  const cv = mkcv(ICON_SRC, ICON_SRC);
  fn(gc(cv));
  finish(cv, { rim: 1.10, rimAdd: 4, bot: 0.78 });   /* the sprites' moon, turned down for a glyph */
  ICON[key] = cv.toDataURL();
}
function buildPadIcons() {
  /* the health flask — crimson draught under a gold cap */
  icon('flask', function (g) {
    ell(g, 8, 10.4, 5.4, 4.6, '#2a1418');            /* glass */
    ell(g, 8, 10.8, 4.4, 4.0, P.cl);                 /* the draught */
    r(g, 4, 12, 9, 3, P.clS);
    ell(g, 7, 10.2, 2.4, 1.9, P.clHi);
    r(g, 6, 3, 4, 4, '#33202a');                     /* neck */
    r(g, 6, 3, 1, 4, '#4a2f38');
    r(g, 5, 0, 6, 3, P.gld);                         /* cap */
    r(g, 5, 0, 6, 1, P.gldHi);
    r(g, 5, 2, 6, 1, P.gldD);
    px(g, 5, 9, '#e8a09a'); px(g, 5, 10, '#c9807c'); /* glint */
  });
  /* the heater shield */
  icon('guard', function (g) {
    for (let y = 0; y < 15; y++) {
      const t = y / 14;
      const hw = t < 0.42 ? 6.2 : 6.2 * (1 - Math.pow((t - 0.42) / 0.58, 1.6));
      if (hw < 0.5) continue;
      for (let x = -7; x <= 7; x++) {
        if (ab(x) > hw) continue;
        /* rounded across, not split down the middle */
        let col = P.stl;
        if (x < -hw * 0.62) col = P.stlHi;
        else if (x > hw * 0.68) col = P.stlD;
        else if (x < -hw * 0.15) col = P.stlLt;
        if (y === 0) col = P.stlHi;
        if (y > 11) col = mixc(col, P.stlS, 0.45);      /* the point falls into shadow */
        px(g, 8 + x, y, col);
      }
    }
    /* the boss, a centred gold diamond */
    px(g, 8, 4, P.gldHi);
    r(g, 7, 5, 3, 1, P.gld); px(g, 7, 5, P.gldHi);
    r(g, 6, 6, 5, 1, P.gld); px(g, 6, 6, P.gldHi);
    r(g, 7, 7, 3, 1, P.gldD);
    px(g, 8, 8, P.gldS);
    px(g, 3, 2, P.gldD); px(g, 13, 2, P.gldD);          /* rivets */
  });
  /* light attack — the arming sword alone */
  icon('light', function (g) {
    seg(g, 4.5, 11.5, 13, 3, 2.6, { hi: P.stlHi, base: P.stlLt, sh: P.stlM, taper: 0.4 });
    seg(g, 2.5, 9.5, 6.5, 13.5, 2, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
    seg(g, 4, 12.5, 1.5, 15, 2.2, M_LEA);
    px(g, 13, 3, P.stlHi);
  });
  /* heavy attack — a broader blade, and the blow already landing */
  icon('heavy', function (g) {
    seg(g, 4.5, 11.5, 12.5, 3.5, 4.2, { hi: P.stlHi, base: P.stl, sh: P.stlD, taper: 0.26 });
    seg(g, 2, 9.5, 7, 14, 2.8, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
    seg(g, 4, 12.5, 1, 15.5, 2.6, M_LEA);
    px(g, 14, 1, P.gldHi); px(g, 12, 0, P.gld);
    px(g, 15, 3, P.gld); px(g, 15, 0, P.gldHi);
  });
  /* roll — a turn, with the arrow chasing it round */
  icon('roll', function (g) {
    /* the turn, opened at the top right so the arrow has somewhere to go */
    for (let a = 0; a < TAU; a += 0.035) {
      const d = a * 180 / PI;
      if (d > 262 && d < 332) continue;
      px(g, 8 + cos(a) * 5.2, 8 + sin(a) * 5.2, '#b4cfe2');
      px(g, 8 + cos(a) * 4.0, 8 + sin(a) * 4.0, '#7d9db8');
    }
    /* arrowhead carrying on clockwise */
    r(g, 9, 0, 1, 7, '#cfe4f2');
    r(g, 10, 1, 1, 5, '#b4cfe2');
    r(g, 11, 2, 1, 3, '#b4cfe2');
    px(g, 12, 3, '#8fb0c8');
  });
  /* jump — up, off the stone */
  icon('jump', function (g) {
    for (let i = 0; i < 5; i++) r(g, 7 - i, 2 + i, 2 + i * 2, 1, i < 2 ? '#c8e8ba' : '#a8d49c');
    r(g, 7, 7, 2, 5, '#a8d49c');
    r(g, 7, 7, 1, 5, '#c8e8ba');
    r(g, 3, 13, 10, 2, '#4a6b46');
    r(g, 3, 13, 10, 1, '#6d9463');
  });
  /* the two directions */
  icon('right', function (g) {
    for (let x = 0; x < 8; x++) { const h = 7 - x; r(g, 5 + x, 8 - h, 1, h * 2 + 1, '#9aa5b3'); }
    for (let x = 0; x < 7; x++) px(g, 5 + x, 8 - (7 - x), '#c2cdd9');
  });
  icon('left', function (g) {
    for (let x = 0; x < 8; x++) { const h = 7 - x; r(g, 10 - x, 8 - h, 1, h * 2 + 1, '#9aa5b3'); }
    for (let x = 0; x < 7; x++) px(g, 10 - x, 8 - (7 - x), '#c2cdd9');
  });
  /* system row */
  icon('pause', function (g) {
    r(g, 4, 3, 3, 10, '#9aa5b3'); r(g, 4, 3, 3, 1, '#c2cdd9');
    r(g, 9, 3, 3, 10, '#9aa5b3'); r(g, 9, 3, 3, 1, '#c2cdd9');
  });
  const speaker = function (g) {
    r(g, 2, 6, 3, 4, '#9aa5b3');
    for (let i = 0; i < 4; i++) { const h = 4 + i * 2; r(g, 5 + i, 8 - h / 2, 1, h, i < 2 ? '#aab5c3' : '#9aa5b3'); }
    r(g, 2, 6, 3, 1, '#c2cdd9');
  };
  icon('sound', function (g) {
    speaker(g);
    r(g, 10, 6, 1, 4, '#8fb0c8'); r(g, 12, 4, 1, 8, '#6f90ab'); r(g, 14, 2, 1, 12, '#54748c');
  });
  icon('muted', function (g) {
    speaker(g);
    for (let i = 0; i < 6; i++) { px(g, 10 + i, 4 + i, '#c07b76'); px(g, 10 + i, 5 + i, '#8e5a56'); }
  });
}
buildPadIcons();
const ICON_FOR = {
  left: 'left', right: 'right', jump: 'jump', roll: 'roll', light: 'light',
  heavy: 'heavy', guard: 'guard', flask: 'flask', pause: 'pause', mute: 'sound'
};

if (TOUCH && TCPAD) {
  TCPAD.hidden = false;
  const pads = TCPAD.querySelectorAll('.tb');
  for (let i = 0; i < pads.length; i++) {
    const el = pads[i], act = el.getAttribute('data-act');
    const ic = ICON_FOR[act];
    if (ic) el.style.backgroundImage = 'url(' + ICON[ic] + ')';
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault(); e.stopPropagation();
      AUD.unlock();
      tcDown(act, el, e.pointerId);
      try { el.setPointerCapture(e.pointerId); } catch (_) { }
    }, { passive: false });
    el.addEventListener('pointerup', function (e) { e.preventDefault(); tcUp(e.pointerId); }, { passive: false });
    el.addEventListener('pointercancel', function (e) { tcUp(e.pointerId); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('dragstart', function (e) { e.preventDefault(); });
  }
  addEventListener('pointerup', function (e) {
    tcUp(e.pointerId);
    /* System pads share this window-level release listener. Only the canvas
       pointer that owns Forge may move/drop the active item or result hold. */
    if (GAME.mode === 'forge' && FORGE.pointer === e.pointerId && forgeMovePoint(e))
      forgePointerUpAt(FORGE.px, FORGE.py, e.pointerId);
  });
  addEventListener('pointercancel', function (e) { tcUp(e.pointerId); forgePointerCancel(e.pointerId); });
  /* a tap on the play area is START / RETRY on the title and end screens,
     and a tap on a slot is that slot — the inventory is drawn on the canvas,
     so the canvas is the only surface it can be pressed through. It raises
     the same action names the number keys do, so nothing downstream knows
     the difference. */
  cvs.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    AUD.unlock();
    if (GAME.mode === 'title' || GAME.mode === 'victory' || GAME.mode === 'defeat') {
      IN.down('start'); IN.up('start');
      return;
    }
    if (GAME.mode === 'forge') {
      /* The modal has one pointer owner. Reject another finger before it can
         write FORGE.px/py or toggle Armor underneath the active gesture. */
      if (FORGE.pointer !== null) return;
      /* A finger has no secondary button. The armor slot and its +/- tabs
         route to the same catalogue toggle as desktop RMB; every other point
         continues through the shared drag/hold pointer door. */
      if (forgeMovePoint(e)) {
        if (forgeToggleArmorAt(FORGE.px, FORGE.py)) {
          FORGE.pointer = e.pointerId; FORGE.pointerKind = 'armor';
        }
        else forgePointerDownAt(FORGE.px, FORGE.py, e.pointerId);
      }
      if (FORGE.pointer === e.pointerId) try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
      return;
    }
    if (GAME.mode !== 'play' || GAME.cine) return;
    const rect = cvs.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const i = invSlotAt((e.clientX - rect.left) / rect.width * VW,
      (e.clientY - rect.top) / rect.height * VH);
    if (i >= 0) { const a = 'slot' + (i + 1); IN.down(a); IN.up(a); }
  }, { passive: false });
  cvs.addEventListener('pointermove', function (e) {
    if (GAME.mode === 'forge' && e.pointerType !== 'mouse' && FORGE.pointer === e.pointerId) {
      e.preventDefault(); forgeMovePoint(e);
    }
  }, { passive: false });
}

/* ===== 27.  BOOT — presentation sizing and the orientation gate = */

/* How much of the fitted area an integer scale must still cover before a
   handheld accepts the letterboxing it costs. Giving up more than a seventh
   of a phone screen hurts worse than slightly uneven pixel columns do; a
   desktop has the room to spare and always takes the crisp step. On a dense
   panel the bar is higher still (INT_SCALE_FILL_HIDPI): VW is already cut to
   the screen's aspect, so there is no letterbox for the crisp step to hide
   inside and taking it puts bars on all four sides — while at dpr 2+ the
   uneven columns it buys are a fraction of a physical pixel. */
const INT_SCALE_FILL = 0.86, INT_SCALE_FILL_HIDPI = 0.995;

function resize() {
  const D = profileDevice();
  /* The canvas owns the whole fitted area; the old desktop-only keyboard line
     outside the game has been removed. */
  const pad = 0;
  const availW = D.vw, availH = mx(80, D.vh - pad);

  /* Snap in DEVICE pixels, not CSS pixels. One game pixel has to cover a whole
     number of physical pixels or the upscale shows uneven columns that crawl
     as the camera moves — the one artefact this art style cannot hide. */
  const fit = mn(availW / VW, availH / VH);
  let s = fit;
  D.integer = false;
  const devScale = fit * D.dpr;
  if (devScale >= 2) {
    const cand = fl(devScale) / D.dpr;
    const need = !TOUCH ? 0 : (D.dpr >= 2 ? INT_SCALE_FILL_HIDPI : INT_SCALE_FILL);
    if (cand / fit >= need) { s = cand; D.integer = true; }
  }
  s = mx(0.2, s);
  D.scale = s;

  cvs.style.width = (VW * s) + 'px';
  cvs.style.height = (VH * s) + 'px';
  /* centre against the visual viewport so the canvas never sits behind the
     browser chrome when it slides back into view */
  document.body.style.height = D.vh + 'px';

  sizeTouchPads();
  updateOrientationGate();
}

/* Pads are sized off the short screen edge: a fixed 62px button is a
   thumb-swallowing slab on a small phone and a postage stamp on a tablet. */
function sizeTouchPads() {
  if (!TOUCH || !TCPAD) return;
  const u = clamp(Math.round(mn(DEV.vw, DEV.vh) * 0.17), 42, 84);
  TCPAD.style.setProperty('--u', u + 'px');
  TCPAD.style.setProperty('--gap', clamp(Math.round(u * 0.18), 6, 16) + 'px');
  /* the glyph fills about half the pad, rounded to a whole multiple of its
     16px source — a pixel icon at 1.7x has fatter columns than thin ones */
  TCPAD.style.setProperty('--icon', ICON_SRC * clamp(Math.round(u * 0.52 / ICON_SRC), 1, 4) + 'px');
  DEV.unit = u;
}

/* A handheld held upright gets the rotate prompt rather than a sliver of a
   level that was composed to be played the other way round. */
const ROTEL = document.getElementById('rot');
function updateOrientationGate() {
  const block = TOUCH && DEV.portrait;
  if (block === GAME.blocked) return;
  GAME.blocked = block;
  if (ROTEL) ROTEL.classList.toggle('show', block);
  /* a resize mid-cutscene must not hand the pads back — see tcSyncCine() */
  /* Cinematics keep one mute-only system pad; the terminal closed mode is
     hidden by tcSyncCine and remains deliberately interaction-free. */
  if (TCPAD) TCPAD.hidden = block || !TOUCH || (GAME.mode === 'closed');
  if (block) {
    /* drop every held finger and pause a run in progress — the knight must not
       take hits behind an overlay nobody can see past */
    releaseAllInput();
    if (GAME.mode === 'play') GAME.mode = 'paused';
  }
}

addEventListener('resize', resize);
addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) {
  visualViewport.addEventListener('resize', resize);
  visualViewport.addEventListener('scroll', resize);
}
try { matchMedia('(orientation:portrait)').addEventListener('change', resize); } catch (_) { }
resize();

buildProps();
/* the map bakes its own stone, pits and hall — see loadLevel */
loadLevel(PROG.level);
buildWarmQueue();
seedAmbient();
GAME.mode = 'title';
CAM.x = 190;
requestAnimationFrame(frame);
</script>
