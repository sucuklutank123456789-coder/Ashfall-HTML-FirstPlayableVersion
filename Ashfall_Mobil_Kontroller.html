<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes the env(safe-area-inset-*) rules below real
     on notched handsets; without it they all resolve to zero -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ASHFALL — The Last Warlord</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#050507;overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
    color:#8a95a3;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #wrap{position:relative;line-height:0;filter:saturate(0.96) contrast(1.03);}
  canvas#c{
    display:block;
    image-rendering:optimizeSpeed;
    image-rendering:-moz-crisp-edges;
    image-rendering:-webkit-optimize-contrast;
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    background:#05060a;
    box-shadow:0 0 0 1px #14161a, 0 0 24px 6px rgba(0,0,0,0.9), 0 0 90px 30px rgba(0,0,0,0.65);
  }
  #boot{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05060a;color:#646e7d;font-size:13px;letter-spacing:3px;line-height:1.6;
    text-align:center;z-index:5;
  }
  #boot b{color:#b8963f;font-weight:400;}
  #hint{
    position:fixed;bottom:6px;left:0;right:0;text-align:center;
    font-size:10px;letter-spacing:2px;color:#2e3238;pointer-events:none;
  }

  /* ---------------- on-screen (touch) controls ---------------- */
  #tc{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    --u:62px;--gap:11px;
    font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  }
  #tc[hidden]{display:none;}
  /* --u / --gap are driven from JS (sizeTouchPads) off the short screen edge;
     the values above are only the fallback until the first resize lands. */

  .tb{
    pointer-events:auto;-webkit-tap-highlight-color:transparent;
    -webkit-appearance:none;appearance:none;
    width:var(--u);height:var(--u);border-radius:50%;
    border:1px solid #3a3f49;background:rgba(9,11,16,0.55);
    color:#8f9aa8;font-family:inherit;font-size:10px;letter-spacing:1px;
    line-height:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.55), 0 3px 12px rgba(0,0,0,0.6);
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:transform .05s linear, background .05s linear, color .05s linear;
    backdrop-filter:blur(1px);
  }
  .tb b{font-weight:400;font-size:10px;}
  .tb i{font-style:normal;font-size:7px;letter-spacing:1px;color:#5b6470;}
  .tb.on{background:rgba(70,57,26,0.88);color:#e9d49c;border-color:#b8963f;transform:scale(0.93);}
  .tb.on i{color:#b8963f;}

  .tb.move{font-size:22px;color:#9aa5b3;}
  .tb.roll{border-color:#40566b;color:#8fb0c8;}
  .tb.jump{border-color:#3f5a44;color:#8dbb84;}
  .tb.guard{border-color:#40566b;color:#8fb0c8;}
  .tb.light{width:calc(var(--u)*1.05);height:calc(var(--u)*1.05);border-color:#5a4c36;color:#c3ab80;}
  .tb.heavy{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-color:#6b4a30;color:#cfa06e;}
  .tb.flask{width:calc(var(--u)*0.88);height:calc(var(--u)*0.88);border-color:#5c3a3a;color:#c79a9a;}
  .tb.sys{width:36px;height:30px;border-radius:7px;font-size:10px;color:#79828f;}
  .tb.sys.muted{color:#7a5652;border-color:#6b4844;text-decoration:line-through;}

  .tc-row{display:flex;gap:var(--gap);align-items:flex-end;}
  .tc-left{
    position:absolute;display:flex;flex-direction:column;gap:var(--gap);align-items:flex-start;
    left:calc(12px + env(safe-area-inset-left,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
  }
  .tc-left .tc-row:first-child{padding-left:calc(var(--u)*0.30);}
  .tc-right{
    position:absolute;display:flex;flex-direction:column;gap:var(--gap);align-items:flex-end;
    right:calc(12px + env(safe-area-inset-right,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
  }
  .tc-right .tc-row:first-child{padding-right:calc(var(--u)*0.36);}
  .tc-right .tc-row:last-child{padding-right:calc(var(--u)*0.10);}
  .tc-sys{
    position:absolute;display:flex;gap:8px;
    right:calc(10px + env(safe-area-inset-right,0px));
    top:calc(10px + env(safe-area-inset-top,0px));
  }

  /* ---------------- portrait gate (handhelds only) ---------------- */
  #rot{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;
    padding:24px;background:#05060a;
    font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;
  }
  #rot.show{display:flex;}
  /* the same scanline the game wears, so the prompt belongs to it */
  #rot::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0.17) 0 1px,transparent 1px 2px);
  }
  .rot-in{position:relative;z-index:1;max-width:430px;text-align:center;}
  .rot-ico{width:min(38vw,140px);height:min(38vw,140px);margin:0 auto 26px;}
  .rot-ico svg{display:block;width:100%;height:100%;overflow:visible;}
  .rot-dev{transform-origin:60px 62px;animation:rotdev 3.1s ease-in-out infinite;}
  .rot-arc{animation:rotarc 3.1s ease-in-out infinite;}
  @keyframes rotdev{
    0%,15%{transform:rotate(0deg);}
    45%,76%{transform:rotate(90deg);}
    97%,100%{transform:rotate(0deg);}
  }
  @keyframes rotarc{0%,12%{opacity:.30;}28%{opacity:1;}58%,100%{opacity:.30;}}
  @media (prefers-reduced-motion:reduce){
    .rot-dev{animation:none;transform:rotate(90deg);}
    .rot-arc{animation:none;opacity:.85;}
  }
  .rot-t{font-size:15px;letter-spacing:4px;color:#e6cd8b;line-height:1.7;}
  .rot-s{font-size:10px;letter-spacing:3px;color:#5c6674;line-height:1.9;margin-top:14px;}
  .rot-r{
    width:150px;height:1px;margin:20px auto 0;background:#3a3420;position:relative;
  }
  .rot-r::before{
    content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;
    margin-left:-2px;background:#b8963f;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="boot">FORGING THE RUINS<br><b>. . .</b></div>
</div>
<div id="hint">A/D MOVE &nbsp;·&nbsp; W JUMP &nbsp;·&nbsp; S ROLL &nbsp;·&nbsp; LEFT CLICK LIGHT &nbsp;·&nbsp; RIGHT CLICK HEAVY &nbsp;·&nbsp; Q GUARD/PARRY &nbsp;·&nbsp; E FLASK</div>
<div id="tc" hidden>
  <div class="tc-sys">
    <button class="tb sys" data-act="pause" aria-label="pause">II</button>
    <button class="tb sys" id="tb-mute" data-act="mute" aria-label="mute">MUTE</button>
  </div>
  <div class="tc-left">
    <div class="tc-row">
      <button class="tb flask" data-act="flask"><b>FLASK</b></button>
    </div>
    <div class="tc-row">
      <button class="tb move" data-act="left" aria-label="left">&#9664;</button>
      <button class="tb move" data-act="right" aria-label="right">&#9654;</button>
    </div>
  </div>
  <div class="tc-right">
    <div class="tc-row">
      <button class="tb guard" data-act="guard"><b>GUARD</b><i>PARRY</i></button>
    </div>
    <div class="tc-row">
      <button class="tb light" data-act="light"><b>LIGHT</b></button>
      <button class="tb heavy" data-act="heavy"><b>HEAVY</b></button>
    </div>
    <div class="tc-row">
      <button class="tb roll" data-act="roll"><b>ROLL</b></button>
      <button class="tb jump" data-act="jump"><b>JUMP</b></button>
    </div>
  </div>
</div>
<div id="rot">
  <div class="rot-in">
    <div class="rot-ico">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g class="rot-arc" fill="none" stroke="#b8963f" stroke-width="3" stroke-linecap="round">
          <path d="M18 42 A 46 46 0 0 1 102 42"/>
        </g>
        <path class="rot-arc" fill="#b8963f" d="M102 57 L93 39 L111 39 Z"/>
        <g class="rot-dev">
          <rect x="44" y="36" width="32" height="52" rx="5" fill="#14171d" stroke="#4a5360" stroke-width="2"/>
          <rect x="48" y="43" width="24" height="36" fill="#0a0c11" stroke="#2b323d" stroke-width="1"/>
          <rect x="55" y="38.5" width="10" height="2" rx="1" fill="#39424f"/>
          <circle cx="60" cy="83" r="2.4" fill="#39424f"/>
        </g>
      </svg>
    </div>
    <div class="rot-t">PLEASE ROTATE YOUR DEVICE</div>
    <div class="rot-r"></div>
    <div class="rot-s">ASHFALL IS PLAYED IN LANDSCAPE</div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   ASHFALL — THE LAST WARLORD
   A hand-crafted 32-bit dark-fantasy action game.
   Everything (sprites, terrain, sky, sound) is generated procedurally.
   ===================================================================== */

/* ---------------------------------------------------------------------
   0.  CANVAS + LOW LEVEL PIXEL PLUMBING
   --------------------------------------------------------------------- */
const VW = 480, VH = 270;                 // internal pixel resolution
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const fl = Math.floor, ce = Math.ceil, ab = Math.abs, mn = Math.min, mx = Math.max;
const PI = Math.PI, TAU = PI * 2;
const sin = Math.sin, cos = Math.cos, hyp = Math.hypot, atan2 = Math.atan2;

function mkcv(w, h) {
  const c = document.createElement('canvas');
  c.width = mx(1, w | 0); c.height = mx(1, h | 0);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}
function gc(c) { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return g; }

/* pixel primitives — every coordinate is snapped to the internal grid */
function r(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(fl(x), fl(y), fl(w), fl(h)); }
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(fl(x), fl(y), 1, 1); }
function ra(g, x, y, w, h, c, a) { g.globalAlpha = a; g.fillStyle = c; g.fillRect(fl(x), fl(y), fl(w), fl(h)); g.globalAlpha = 1; }

/* hard-edged pixel ellipse (scanline filled, no anti-aliasing) */
function ell(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t <= 0) continue;
    const w = Math.sqrt(t) * rx;
    g.fillRect(fl(cx - w), fl(cy + y), mx(1, fl(w * 2)), 1);
  }
}
/* hollow pixel ring */
function ring(g, cx, cy, rad, c, thick) {
  g.fillStyle = c; thick = thick || 1;
  const st = 1 / mx(8, rad * 6);
  for (let a = 0; a < TAU; a += st) {
    g.fillRect(fl(cx + cos(a) * rad), fl(cy + sin(a) * rad), thick, thick);
  }
}
/* oriented plate — the workhorse for armour, limbs, weapons.
   Rasterised per-pixel so edges stay hard at any angle. Used only while
   baking sprites into the cache, never in the per-frame path.          */
function plate(g, cx, cy, len, wid, ang, c) {
  const ca = cos(ang), sa = sin(ang);
  const hl = len * 0.5, hw = wid * 0.5;
  const rad = ce(hyp(hl, hw)) + 1;
  const x0 = fl(cx - rad), x1 = ce(cx + rad), y0 = fl(cy - rad), y1 = ce(cy + rad);
  const taper = c.taper || 0, round = c.round || 0;
  const cHi = c.hi || c.base, cSh = c.sh || c.base;
  /* horizontal runs of one colour are emitted as a single fillRect —
     setting fillStyle per pixel is what makes procedural baking slow */
  for (let y = y0; y <= y1; y++) {
    let runCol = null, runX = 0, runN = 0;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
      const un = u / hl;
      const halfW = hw * (1 - taper * (un * 0.5 + 0.5));
      let col = null;
      if (!(ab(u) > hl || ab(v) > halfW)) {
        const vn = v / halfW;
        if (!(round && un * un + vn * vn > 1)) {
          col = c.base;
          if (vn < -0.42) col = cHi;
          else if (vn > 0.46) col = cSh;
          if (c.edge && ab(un) > 0.84) col = c.edge;
          if (c.spec && vn > -0.42 && vn < -0.05 && un > -0.5 && un < 0.25) col = c.spec;
        }
      }
      if (col === runCol) { runN++; continue; }
      if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, y, runN, 1); }
      runCol = col; runX = x; runN = col === null ? 0 : 1;
    }
    if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, y, runN, 1); }
  }
}
/* dome / ellipse with directional shading (helmet skulls, pommels, shield bosses) */
function dome(g, cx, cy, rx, ry, c, lightX, lightY) {
  lightX = lightX === undefined ? -0.5 : lightX; lightY = lightY === undefined ? -0.75 : lightY;
  const cHi = c.hi || c.base, cSh = c.sh || c.base;
  for (let y = -ry; y <= ry; y++) {
    let runCol = null, runX = 0, runN = 0;
    const yy = fl(cy + y);
    for (let x = -rx; x <= rx; x++) {
      const q = (x / rx) * (x / rx) + (y / ry) * (y / ry);
      let col = null;
      if (q <= 1) {
        const d = (x / rx) * lightX + (y / ry) * lightY;
        col = c.base;
        if (d > 0.55) col = cHi;
        else if (d < -0.35) col = cSh;
        if (q > 0.82 && d < 0) col = cSh;
      }
      if (col === runCol) { runN++; continue; }
      if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, yy, runN, 1); }
      runCol = col; runX = fl(cx + x); runN = col === null ? 0 : 1;
    }
    if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, yy, runN, 1); }
  }
}
/* deterministic checker dither between two colours */
function dith(g, x, y, w, h, ca, cb, density) {
  density = density === undefined ? 2 : density;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const on = ((i + j * (density === 2 ? 1 : 2)) % (density + 1)) === 0;
    g.fillStyle = on ? cb : ca; g.fillRect(fl(x + i), fl(y + j), 1, 1);
  }
}

/* --- colour utils ------------------------------------------------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(a) { return '#' + ((1 << 24) + (a[0] << 16) + (a[1] << 8) + a[2]).toString(16).slice(1); }
function shade(h, f) { const c = hex2rgb(h); return rgb2hex([mn(255, mx(0, c[0] * f | 0)), mn(255, mx(0, c[1] * f | 0)), mn(255, mx(0, c[2] * f | 0))]); }
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex([A[0] + (B[0] - A[0]) * t | 0, A[1] + (B[1] - A[1]) * t | 0, A[2] + (B[2] - A[2]) * t | 0]);
}

/* --- deterministic randomness -------------------------------------- */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* stable hash noise for environment detail — same result every frame */
function hn(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => fl(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const eOut = t => 1 - (1 - t) * (1 - t);
const eIn = t => t * t;
const eOut3 = t => 1 - Math.pow(1 - t, 3);
const eIn3 = t => t * t * t;

/* ---------------------------------------------------------------------
   1.  PALETTE — a tight, cohesive, grim set
   --------------------------------------------------------------------- */
const P = {
  /* worn steel */
  stlHi: '#c2cad4', stlLt: '#94a0ad', stl: '#6d7784', stlM: '#59626f', stlD: '#3f4854',
  stlS: '#2a313c', stlX: '#1a1f27',
  rust: '#6d4a30', rust2: '#4c3220', rust3: '#33220f',
  /* leather */
  leaHi: '#8a6440', lea: '#5f4429', leaD: '#3d2b1a', leaS: '#261a10',
  /* cloth / crimson */
  clHi: '#96322f', cl: '#6f2224', clD: '#4b1519', clS: '#2c0d10',
  /* stone masonry */
  stnHi: '#666c75', stnLt: '#4d535c', stn: '#3a4048', stnM: '#2e333a',
  stnD: '#22262c', stnS: '#171a1f', stnX: '#0e1014',
  moss: '#35422a', mossD: '#25301c', mossHi: '#455636',
  /* goblin */
  gobHi: '#93a355', gob: '#6e8039', gobM: '#5a6a2e', gobD: '#414d22', gobS: '#2b3416',
  gobBl: '#42591f', gobBlD: '#2c3c14',
  /* gold / bronze */
  gldHi: '#e6cd8b', gld: '#b8963f', gldD: '#7d6127', gldS: '#4a3916',
  bronze: '#8a6a3a', bronzeD: '#5c4423',
  /* fire */
  fireHi: '#ffd39a', fire: '#e07f2c', fireM: '#b85618', fireD: '#7d3410',
  ember: '#c96a20',
  /* sky & atmosphere */
  sky0: '#05060a', sky1: '#0a0c13', sky2: '#11141e', sky3: '#1a1e2b',
  sky4: '#242a3a', sky5: '#2f3648', horiz: '#3b4356',
  moonHi: '#b9bfca', moon: '#9aa1ad', moonD: '#787f8c', moonS: '#5c6270',
  fogA: '#2d3546', fogB: '#3a4457', fogC: '#4a5568',
  /* blood */
  bld: '#7d1520', bldD: '#4f0c14', bldS: '#310810',
  /* ui */
  ink: '#07080b', ink2: '#0d0f14',
  bone: '#c9c2ad', boneD: '#8d8878'
};

/* ---------------------------------------------------------------------
   2.  INPUT
   --------------------------------------------------------------------- */
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyW: 'jump', ArrowUp: 'jump', Space: 'jump',
  KeyS: 'roll', ArrowDown: 'roll',
  KeyQ: 'guard',
  KeyE: 'flask',
  Enter: 'start', Escape: 'pause', KeyP: 'pause',
  KeyM: 'mute', KeyR: 'restart'
};
const IN = {
  held: {}, hit: {}, rel: {}, anyKey: false,
  buf: {},                       // input buffers (seconds remaining)
  down(a) { if (!this.held[a]) { this.hit[a] = true; this.buf[a] = 0.13; } this.held[a] = true; this.anyKey = true; },
  up(a) { this.held[a] = false; this.rel[a] = true; },
  press(a) { return !!this.hit[a]; },
  consume(a) { if (this.buf[a] > 0) { this.buf[a] = 0; return true; } return false; },
  tick(dt) { for (const k in this.buf) if (this.buf[k] > 0) this.buf[k] = mx(0, this.buf[k] - dt); },
  clearEdges() { this.hit = {}; this.rel = {}; this.anyKey = false; }
};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (a) { e.preventDefault(); IN.down(a); }
  else IN.anyKey = true;
  AUD.unlock();
}, { passive: false });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); IN.up(a); } }, { passive: false });
addEventListener('blur', () => { IN.held = {}; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousedown', e => {
  e.preventDefault(); AUD.unlock();
  if (e.button === 0) IN.down('light'); else if (e.button === 2) IN.down('heavy');
});
addEventListener('mouseup', e => { if (e.button === 0) IN.up('light'); else if (e.button === 2) IN.up('heavy'); });

/* ---------------------------------------------------------------------
   3.  AUDIO — pure Web Audio synthesis
   --------------------------------------------------------------------- */
const AUD = {
  ac: null, master: null, musicGain: null, sfxGain: null, muted: false, ready: false,
  noiseBuf: null, drone: null, curTrack: '',
  unlock() {
    if (this.ready) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.85; this.master.connect(this.ac.destination);
      this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.9; this.sfxGain.connect(this.master);
      this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.0; this.musicGain.connect(this.master);
      const len = this.ac.sampleRate * 2;
      const b = this.ac.createBuffer(1, len, this.ac.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
      this.ready = true;

/* ---------------------------------------------------------------------
   4.  SPRITE FINISHING PASS
   Every baked sprite receives the same treatment so all characters share

   --------------------------------------------------------------------- */

  opt = opt || {};

        const up = A(x, y - 1) < 8, dn = A(x, y + 1) < 8, lf = A(x - 1, y) < 8;
        if (dn && !up) {

        } else if (up) {

/* ---------------------------------------------------------------------

          ring(ctx, x, y, mx(1, p.size), col, 1);
          break;
        }
      }
    }
    if (addOn) ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
};

/* ---------------------------------------------------------------------
   6.  THE KNIGHT — layered plate armour, heater shield, arming sword
   Built from oriented pixel plates driven by a small skeleton with
   two-bone IK, then baked into the sprite cache.
   --------------------------------------------------------------------- */
const KW = 88, KH = 80, KOX = 44, KOY = 66;    /* sprite canvas + feet origin */

function ik(ax, ay, bx, by, l1, l2, bend) {
  let dx = bx - ax, dy = by - ay;
  let d = hyp(dx, dy) || 0.001;
  const nx = dx / d, ny = dy / d;
  d = mn(d, l1 + l2 - 0.02);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(mx(0, l1 * l1 - a * a));
  return {
    ex: ax + nx * a + (-ny) * h * bend, ey: ay + ny * a + (nx) * h * bend,
    hx: ax + nx * d, hy: ay + ny * d
  };
}
function seg(g, x0, y0, x1, y1, w, c) {
  const ang = atan2(y1 - y0, x1 - x0), len = hyp(x1 - x0, y1 - y0);
  plate(g, (x0 + x1) * 0.5, (y0 + y1) * 0.5, len + w * 0.45, w, ang, c);
}

/* material sets */
const M_NEAR = { hi: P.stlHi, base: P.stl, sh: P.stlD, edge: P.stlS };
const M_FAR = { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX };
const M_DARK = { hi: P.stlM, base: P.stlD, sh: P.stlX, edge: P.stlX };
const M_LEA = { hi: P.leaHi, base: P.lea, sh: P.leaD, edge: P.leaS };
const M_CLOTH = { hi: P.clHi, base: P.cl, sh: P.clD, edge: P.clS };
const M_GOLD = { hi: P.gldHi, base: P.gld, sh: P.gldD, edge: P.gldS };

function KPOSE() {
  return {
    hipX: 0, hipY: -20, lean: 0.07, headX: 1, headY: 0, headA: 0,
    swX: 7, swY: -26, swA: 0.75,
    shX: -3, shY: -28, shA: -0.25,
    fFx: 5, fFy: 0, fBx: -5, fBy: 0,
    capeK: -0.05, swordFront: true, shieldFront: true, wounded: false,
    scale: 1, hideSword: false, kneel: 0
  };
}

/* --- the sword ----------------------------------------------------- */
function drawSword(g, hx, hy, ang, bright) {
  const ca = cos(ang), sa = sin(ang);
  const at = (d, o) => [hx + ca * d - sa * o, hy + sa * d + ca * o];
  const bladeM = bright
    ? { hi: '#e6ecf4', base: P.stlHi, sh: P.stlLt, edge: P.stlHi }
    : { hi: P.stlHi, base: P.stlLt, sh: P.stlM, edge: P.stlLt };
  /* pommel */
  let p = at(-4, 0); dome(g, p[0], p[1], 2, 2, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.7);
  /* grip (wrapped leather) */
  let a = at(-3.5, 0), b = at(2.5, 0);
  seg(g, a[0], a[1], b[0], b[1], 3, { hi: P.leaHi, base: P.leaD, sh: P.leaS, edge: P.leaS });
  for (let i = -2; i <= 2; i += 2) { const q = at(i, 0); px(g, q[0], q[1], P.leaS); }
  /* crossguard */
  let c0 = at(3, -5.5), c1 = at(3, 5.5);
  seg(g, c0[0], c0[1], c1[0], c1[1], 2, { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlD });
  let cg = at(3, 0); px(g, cg[0], cg[1], P.gldD);
  /* blade */
  let b0 = at(4.5, 0), b1 = at(26, 0);
  seg(g, b0[0], b0[1], b1[0], b1[1], 4, { hi: bladeM.hi, base: bladeM.base, sh: bladeM.sh, taper: 0.42 });
  /* fuller — one darker pixel line down the centre */
  for (let d = 7; d < 22; d += 1) { const q = at(d, 0); px(g, q[0], q[1], bright ? P.stlLt : P.stlM); }
  /* tip */
  let t0 = at(25, 0); px(g, t0[0], t0[1], bladeM.hi);
  /* battle nicks */
  let n1 = at(13, -1.6); px(g, n1[0], n1[1], P.stlS);
  let n2 = at(19, 1.6); px(g, n2[0], n2[1], P.stlS);
}

/* --- the heater shield --------------------------------------------- */
function drawShield(g, cx, cy, ang, back) {
  const ca = cos(ang), sa = sin(ang);
  const W = 11, H = 17;
  const rimC = back ? P.stlX : P.stlS, faceC = back ? P.stlD : P.stlM;
  for (let y = -2; y < H - 2; y++) {
    const t = (y + 2) / H;
    /* heater profile: straight sides, pointed lower half */
    let hw = W * 0.5;
    if (t > 0.42) hw = W * 0.5 * (1 - Math.pow((t - 0.42) / 0.58, 1.75));
    hw = mx(0.6, hw);
    for (let x = -ce(hw); x <= ce(hw); x++) {
      if (ab(x) > hw) continue;
      const px2 = cx + x * ca - y * sa, py2 = cy + x * sa + y * ca;
      const edge = (ab(x) > hw - 1.35) || t < 0.055 || (hw < 1.6);
      let col;
      if (edge) col = rimC;
      else {
        col = faceC;
        if (x < -hw * 0.35) col = back ? P.stlM : P.stl;          /* lit side */
        if (x > hw * 0.45) col = back ? P.stlX : P.stlS;          /* shaded side */
        /* faded heraldic chevron — tarnished almost to nothing */
        const cheq = ab(x) * 0.9 + (y - 1) * 0.8;
        if (!back && y > 0 && y < 11 && ab(cheq - 4.2) < 1.1) col = (x < 0 ? P.gldD : P.gldS);
        if (!back && y > 3 && y < 13 && ab(cheq - 8.4) < 1.0) col = mixc(P.gldS, col, 0.35);
      }
      px(g, px2, py2, col);
    }
  }
  if (!back) {
    /* rivets around the rim */
    const rv = [[-4, -1], [4, -1], [-4, 6], [4, 6], [0, 13]];
    for (const v of rv) px(g, cx + v[0] * ca - v[1] * sa, cy + v[0] * sa + v[1] * ca, P.stlLt);
    /* central boss */
    const bx = cx + 0 * ca - 3 * sa, by = cy + 0 * sa + 3 * ca;
    dome(g, bx, by, 2, 2, { hi: P.stlHi, base: P.stl, sh: P.stlS }, -0.6, -0.8);
    /* dents and a chipped edge */
    px(g, cx - 3 * ca - 8 * sa, cy - 3 * sa + 8 * ca, P.stlS);
    px(g, cx + 2 * ca - 0 * sa, cy + 2 * sa + 0 * ca, P.stlS);
    px(g, cx + 3 * ca + 5 * sa, cy + 3 * sa - 5 * ca, P.rust);
  }
}

/* --- helm ---------------------------------------------------------- */
function drawHelm(g, cx, cy, ang, wounded) {
  const ca = cos(ang), sa = sin(ang);
  const at = (x, y) => [cx + x * ca - y * sa, cy + x * sa + y * ca];
  /* neck guard sweeping back */
  let a = at(-4, 2), b = at(-7, 5);
  seg(g, a[0], a[1], b[0], b[1], 6, M_DARK);
  /* skull */
  dome(g, cx, cy - 1, 6, 6, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.55, -0.8);
  /* raised comb along the crown */
  let c0 = at(-4, -5), c1 = at(3, -6);
  seg(g, c0[0], c0[1], c1[0], c1[1], 2, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
  /* face plate / visor */
  let v0 = at(1, -2), v1 = at(4, 3);
  seg(g, v0[0], v0[1], v1[0], v1[1], 8, { hi: P.stlLt, base: P.stlM, sh: P.stlD, taper: 0.3 });
  /* brow ridge */
  let br0 = at(-2, -2), br1 = at(5, -1);
  seg(g, br0[0], br0[1], br1[0], br1[1], 2, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
  /* eye slit — deep shadow with two cold glints */
  for (let i = -2; i <= 4; i++) { const q = at(i, 1); px(g, q[0], q[1], P.stlX); }
  for (let i = -2; i <= 4; i++) { const q = at(i, 2); px(g, q[0], q[1], '#0a0c10'); }
  let e1 = at(3, 1), e2 = at(1, 1);
  px(g, e1[0], e1[1], wounded ? '#9d5a52' : '#7d8898');
  px(g, e2[0], e2[1], wounded ? '#6d3c38' : '#5c6674');
  /* breath holes */
  let h1 = at(3, 4), h2 = at(1, 5);
  px(g, h1[0], h1[1], P.stlX); px(g, h2[0], h2[1], P.stlX);
  /* cheek plate */
  let k0 = at(-2, 3), k1 = at(1, 6);
  seg(g, k0[0], k0[1], k1[0], k1[1], 4, { hi: P.stlM, base: P.stlD, sh: P.stlS });
  /* tattered crimson crest */
  const crest = [[-2, -7], [-5, -8], [-8, -6], [-10, -3]];
  for (let i = 0; i < crest.length - 1; i++) {
    const s0 = at(crest[i][0], crest[i][1]), s1 = at(crest[i + 1][0], crest[i + 1][1]);
    seg(g, s0[0], s0[1], s1[0], s1[1], 3.4 - i * 0.7, i === 0 ? M_CLOTH : { hi: P.cl, base: P.clD, sh: P.clS });
  }
  let cb = at(-1, -6); dome(g, cb[0], cb[1], 2, 2, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  /* scratches */
  let s = at(-3, -3); px(g, s[0], s[1], P.stlS);
  let s2 = at(2, -4); px(g, s2[0], s2[1], P.stlD);
  if (wounded) { let w = at(0, -3); px(g, w[0], w[1], P.rust2); }
}

/* --- torso, arms and legs ------------------------------------------ */
function drawKnightBody(g, ps) {
  const OX = KOX, OY = KOY;
  const hx = OX + ps.hipX, hy = OY + ps.hipY;
  /* once the body is down the cape stops hanging and pools on the stone */
  if (ps.prone) {
    for (let i = 0; i < 30; i++) {
      const t = i / 29;
      const len = 8 + t * 6 - Math.pow(t, 3) * 3;
      const yy = OY - 1 - fl(t * 5);
      for (let d = 0; d < len; d++) {
        const xx = hx - 6 - d - fl(t * 3);
        if (hn(d * 3, i, 61) > 0.90) continue;
        const fold = sin(d * 0.7 + i * 0.4);
        px(g, xx, yy, d > len - 3 ? P.clS : (fold > 0.4 ? P.cl : (fold < -0.3 ? P.clS : P.clD)));
      }
    }
  }
  const spine = 13;
  const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
  const hdx = sx + sin(ps.lean) * 7 + ps.headX, hdy = sy - cos(ps.lean) * 7 + ps.headY;

  const swx = OX + ps.swX, swy = OY + ps.swY;
  const shx = OX + ps.shX, shy = OY + ps.shY;
  const ffx = OX + ps.fFx, ffy = OY + ps.fFy;
  const fbx = OX + ps.fBx, fby = OY + ps.fBy;

  /* ---- far leg ---- */
  const legB = ik(hx - 2, hy, fbx, fby, 10, 10, 1);
  seg(g, hx - 2, hy, legB.ex, legB.ey, 7, M_FAR);                       /* cuisse */
  seg(g, legB.ex, legB.ey, legB.hx, legB.hy, 5.4, M_FAR);               /* greave */
  dome(g, legB.ex, legB.ey, 3, 3, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.6, -0.7);  /* poleyn */
  seg(g, legB.hx - 1, legB.hy - 1, legB.hx + 3, legB.hy - 1, 4, { hi: P.stlM, base: P.stlD, sh: P.stlX });  /* sabaton */

  /* ---- far arm (shield arm when the shield is behind) ---- */
  const armB = ik(sx - 1, sy + 2, shx, shy, 8, 8, ps.shieldFront ? 1 : 1);
  if (!ps.shieldFront) drawShield(g, shx + 1, shy + 2, ps.shA, true);
  seg(g, sx - 1, sy + 2, armB.ex, armB.ey, 6, M_FAR);
  dome(g, armB.ex, armB.ey, 2.6, 2.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.6, -0.7);
  seg(g, armB.ex, armB.ey, armB.hx, armB.hy, 5, M_FAR);
  dome(g, armB.hx, armB.hy, 2.4, 2.4, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.5, -0.7);

  /* ---- sword behind the body ---- */
  if (!ps.swordFront && !ps.hideSword) {
    const armS0 = ik(sx + 1, sy + 2, swx, swy, 8, 8, -1);
    seg(g, sx + 1, sy + 2, armS0.ex, armS0.ey, 6, M_FAR);
    seg(g, armS0.ex, armS0.ey, armS0.hx, armS0.hy, 5, M_FAR);
    drawSword(g, swx, swy, ps.swA, false);
  }

  /* ---- torso ---- */
  const lean = ps.lean;
  /* fauld (skirt of lames over the hips) */
  for (let i = 0; i < 3; i++) {
    const t = i / 2, yy = hy + 1 - i * 2.4 + 1;
    const xx = hx + sin(lean) * (i * 1.2);
    seg(g, xx - 6 + i * 0.4, yy, xx + 6.5 - i * 0.4, yy, 3, i % 2 ? M_FAR : { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  }
  /* mail beneath the fauld */
  dith(g, hx - 5, hy + 2, 11, 3, P.stlS, P.stlD, 1);
  /* cuirass */
  const cA = lean - PI / 2;
  plate(g, (hx + sx) / 2 + sin(lean) * 1.0, (hy + sy) / 2, 15, 13.5, cA + PI / 2,
    { hi: P.stlLt, base: P.stl, sh: P.stlD, taper: 0.26 });
  /* breastplate highlight ridge */
  const rd0x = sx + sin(lean) * 0 + 1, rd0y = sy + 2, rd1x = hx + 2, rd1y = hy - 1;
  seg(g, rd0x, rd0y, rd1x, rd1y, 2, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
  /* chest flare / lower edge */
  seg(g, hx - 6, hy - 2, hx + 7, hy - 2.6, 2.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  /* belt */
  seg(g, hx - 6, hy - 0.5, hx + 6.5, hy - 1, 2.4, M_LEA);
  dome(g, hx + 3, hy - 1, 2, 1.6, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  /* gorget */
  seg(g, sx - 4, sy - 1, sx + 4, sy - 1.6, 3.4, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  /* rivets, scratches, corrosion — deterministic so they never crawl */
  px(g, sx - 3, sy + 3, P.stlHi); px(g, sx + 4, sy + 3, P.stlHi);
  px(g, hx - 4, hy - 6, P.stlS); px(g, hx - 3, hy - 5, P.stlS);
  px(g, hx + 5, hy - 8, P.rust); px(g, hx + 4, hy - 9, P.rust2);
  px(g, sx + 2, sy + 6, P.stlD);
  if (ps.wounded) {
    px(g, hx + 1, hy - 7, P.bldD); px(g, hx + 2, hy - 6, P.bldD); px(g, hx + 1, hy - 5, P.bld);
    px(g, hx - 2, hy - 9, P.bldD);
  }
  /* pauldrons — layered lames, far one first */
  const pbx = sx - 4.5 + sin(lean) * 1, pby = sy - 0.5;
  for (let i = 0; i < 2; i++) plate(g, pbx - i * 0.8, pby + i * 2.2, 8 - i * 1.4, 4.2 - i * 0.5, -0.28, { hi: P.stlLt, base: P.stlM, sh: P.stlS, round: 1 });
  const pfx = sx + 4.5 + sin(lean) * 1, pfy = sy - 0.6;
  for (let i = 0; i < 3; i++) plate(g, pfx + i * 0.6, pfy + i * 2.1, 9 - i * 1.5, 4.4 - i * 0.6, 0.22, { hi: P.stlHi, base: P.stl, sh: P.stlD, round: 1 });
  px(g, pfx + 1, pfy - 1, P.stlHi);

  /* ---- head ---- */
  drawHelm(g, hdx, hdy, ps.headA + lean * 0.4, ps.wounded);

  /* ---- near leg ---- */
  const legF = ik(hx + 2, hy, ffx, ffy, 10, 10, 1);
  seg(g, hx + 2, hy, legF.ex, legF.ey, 7.4, M_NEAR);
  dome(g, legF.ex, legF.ey, 3.2, 3.2, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);
  seg(g, legF.ex, legF.ey, legF.hx, legF.hy, 5.8, M_NEAR);
  px(g, legF.ex, legF.ey - 2, P.stlHi);
  seg(g, legF.hx - 1.5, legF.hy - 1, legF.hx + 3.5, legF.hy - 1, 4.2, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  px(g, legF.hx + 4, legF.hy - 1, P.stlD);

  /* ---- near arm + shield ---- */
  if (ps.shieldFront) {
    const armF = ik(sx - 0.5, sy + 2.5, shx, shy, 8, 8, 1);
    seg(g, sx - 0.5, sy + 2.5, armF.ex, armF.ey, 6.4, M_NEAR);
    dome(g, armF.ex, armF.ey, 2.8, 2.8, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);
    seg(g, armF.ex, armF.ey, armF.hx, armF.hy, 5.4, M_NEAR);
    dome(g, armF.hx, armF.hy, 2.6, 2.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.5, -0.7);
    drawShield(g, shx, shy, ps.shA, false);
  }
  /* ---- sword arm in front ---- */
  if (ps.swordFront && !ps.hideSword) {
    const armS = ik(sx + 1.5, sy + 2.5, swx, swy, 8, 8, -1);
    seg(g, sx + 1.5, sy + 2.5, armS.ex, armS.ey, 6.4, M_NEAR);
    dome(g, armS.ex, armS.ey, 2.8, 2.8, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);
    seg(g, armS.ex, armS.ey, armS.hx, armS.hy, 5.4, M_NEAR);
    /* gauntlet */
    dome(g, armS.hx, armS.hy, 2.8, 2.8, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.5, -0.7);
    px(g, armS.hx, armS.hy - 2, P.stlHi);
    drawSword(g, swx, swy, ps.swA, ps.bright);
  }
  return { ax: sx - OX, ay: sy - OY };
}

/* --- rolled-up ball ------------------------------------------------ */
function drawKnightRoll(g, t) {
  const cx = KOX, cy = KOY - 11, a = t * TAU * 1.15 - 0.5;
  const at = (x, y) => [cx + x * cos(a) - y * sin(a), cy + x * sin(a) + y * cos(a)];
  /* back plates */
  let b0 = at(-7, 2), b1 = at(3, 7);
  seg(g, b0[0], b0[1], b1[0], b1[1], 8, M_FAR);
  /* tucked legs */
  let l0 = at(-2, 6), l1 = at(6, 3);
  seg(g, l0[0], l0[1], l1[0], l1[1], 6.5, M_FAR);
  let l2 = at(6, 3), l3 = at(8, -3);
  seg(g, l2[0], l2[1], l3[0], l3[1], 5.5, M_NEAR);
  /* curled torso */
  let t0 = at(-5, -1), t1 = at(4, -3);
  seg(g, t0[0], t0[1], t1[0], t1[1], 11, { hi: P.stlLt, base: P.stl, sh: P.stlD, round: 1 });
  /* cape wrapped round the ball */
  let c0 = at(-8, -2), c1 = at(-4, 6);
  seg(g, c0[0], c0[1], c1[0], c1[1], 6, M_CLOTH);
  /* helm */
  let h = at(6, -5);
  drawHelm(g, h[0], h[1], a + 0.5, false);
  /* shield on the outside of the curl */
  let s = at(-3, -7);
  drawShield(g, s[0], s[1], a + 1.2, false);
  /* sword tucked in */
  let sw = at(2, 6);
  drawSword(g, sw[0], sw[1], a - 0.8, false);
  return { ax: -6, ay: -18 };
}

/* --- the cape (separate sprite so it can lag behind the body) ------- */
const CAPE_N = 9, CW = 44, CH = 52, COX = 22, COY = 7;
function buildCape(g, k) {
  const H = 30;
  for (let s = 0; s <= 46; s++) {
    const u = s / 46 * 2 - 1;
    const jag = fl(hn(s * 7, 3, 91) * 8);
    const L = H + 5 - jag - (ab(u) > 0.75 ? 4 : 0);
    for (let i = 0; i < L; i++) {
      const t = i / (H - 1);
      const off = -k * Math.pow(t, 1.5) * 15 - Math.pow(t, 2.2) * 2;
      const hw = 5.2 + t * 6.2 - Math.pow(t, 3) * 2.4;
      const x = COX + off + u * hw, y = COY + i;
      let col = P.cl;
      const fold = sin(u * 7.5 + k * 1.5) ;
      if (fold > 0.45) col = P.clHi;
      else if (fold < -0.35) col = P.clD;
      if (u > 0.62) col = P.clS;
      if (u < -0.72) col = mixc(P.clHi, P.cl, 0.35);
      if (i > L - 3) col = P.clS;
      if (t > 0.72 && hn(s * 3, i, 17) > 0.86) col = P.clS;
      px(g, x, y, col);
      if (ab(u) < 0.06 && i % 5 === 2) px(g, x, y, P.clD);
    }
  }
  /* shoulder clasp band */
  for (let x = -7; x <= 7; x++) {
    const yy = COY - 1 + (ab(x) > 5 ? 1 : 0);
    px(g, COX + x, yy, ab(x) < 2 ? P.gldD : P.leaD);
    px(g, COX + x, yy - 1, ab(x) < 2 ? P.gld : P.lea);
  }
}
function capeSprite(i) {
  return SPR.get('cape' + i, CW, CH, (g) => buildCape(g, -1 + i * (2 / (CAPE_N - 1))), { rim: 1.16, rimAdd: 8, bot: 0.72 });
}

/* ---------------------------------------------------------------------
   7.  KNIGHT ANIMATION TABLE
   --------------------------------------------------------------------- */
const gait = (ph) => ({ x: 8.5 * sin(ph), y: cos(ph) > 0 ? -9 * cos(ph) * cos(ph) : 0 });

const KA = {
  idle: {
    n: 6, dur: 2.0, loop: 1, cape: -0.05, f(t, p) {
      const s = sin(t * TAU);
      p.hipY = -20 + s * 0.5; p.lean = 0.07 + s * 0.02;
      p.swY = -26 + s * 0.6; p.swA = 0.78 + s * 0.05;
      p.shX = -6; p.shY = -25 + s * 0.5; p.shA = -0.22;
      p.fFx = 5; p.fBx = -5.5; p.headY = s * 0.4;
    }
  },
  idleW: {
    n: 6, dur: 2.4, loop: 1, cape: -0.02, f(t, p) {
      const s = sin(t * TAU);
      p.wounded = true;
      p.hipY = -18.5 + s * 0.7; p.lean = 0.22 + s * 0.03; p.headY = 1 + s * 0.5; p.headA = 0.16;
      p.swY = -23 + s * 0.7; p.swA = 1.15; p.swX = 6;
      p.shX = -4; p.shY = -25 + s * 0.6; p.shA = 0.1;

    }

  run: {
    n: 8, dur: 0.60, loop: 1, cape: 0.55, f(t, p) {
      const ph = t * TAU;
      const F = gait(ph), B = gait(ph + PI);
      p.fFx = F.x; p.fFy = F.y; p.fBx = B.x; p.fBy = B.y;
      p.hipY = -20 + 1.3 * ab(sin(ph)) - 0.6;
      p.lean = 0.20 + 0.03 * sin(ph * 2);
      p.headX = 1.4; p.headY = -0.4 + 0.4 * ab(cos(ph));
      p.swX = 6 - 4.2 * sin(ph); p.swY = -25.5 + 1.6 * ab(cos(ph)); p.swA = 0.95 - 0.2 * sin(ph);
      p.shX = -6 + 4.4 * sin(ph); p.shY = -26.5 - 1.2 * sin(ph); p.shA = -0.30 + 0.12 * sin(ph);
    }
  },
  jump: {
    n: 3, dur: 0.30, cape: 0.85, f(t, p) {

      else if (k === 1) { p.hipY = -22; p.fFx = 3; p.fFy = -1; p.fBx = -4; p.fBy = -2; p.lean = 0.10; p.swY = -27; p.swA = 1.1; p.shY = -30; p.shA = -0.5; }
      else { p.hipY = -21; p.fFx = 6; p.fFy = -6; p.fBx = -3; p.fBy = -2; p.lean = 0.18; p.swY = -26; p.swA = 1.2; p.shX = -1; p.shY = -30; p.shA = -0.6; }
    }
  },
  fall: {
    n: 2, dur: 0.34, loop: 1, cape: 0.95, f(t, p) {

      p.hipY = -20; p.lean = 0.14 + s * 0.03;
      p.fFx = 7; p.fFy = -3 - s; p.fBx = -6; p.fBy = -1;

      p.swX = -7; p.swY = -22; p.swA = 1.85; p.swordFront = false;
    }
  },
  parry: {
    n: 3, dur: 0.26, cape: 0.3, f(t, p) {
      const k = mn(2, fl(t * 3));
      p.lean = k === 0 ? -0.16 : (k === 1 ? 0.16 : 0.02);
      p.hipY = -19.5; p.fFx = k === 1 ? 8.5 : 7; p.fBx = -7.5;
      p.shX = k === 0 ? 5 : (k === 1 ? 12 : 9); p.shY = -30; p.shA = k === 1 ? 0.12 : -0.1;
      p.swX = -7; p.swY = -22; p.swA = 1.9; p.swordFront = false;
      p.headX = k === 1 ? 2 : 0.5;
    }
  },
  hurt: {
    n: 2, dur: 0.30, cape: -0.6, f(t, p) {
      const s = t < 0.5 ? 1 : 0.6;
      p.lean = -0.24 * s; p.hipY = -19 - s * 0.5; p.headX = -1.6 * s; p.headA = -0.24 * s;
      p.fFx = 3 + s; p.fBx = -8 - s; p.fFy = 0; p.fBy = 0;
      p.swX = 6 + s * 2; p.swY = -22; p.swA = 1.5;
      p.shX = -5 - s; p.shY = -26; p.shA = -0.7;
    }
  },
  death: {
    n: 7, dur: 1.5, cape: -0.4, f(t, p) {
      const k = mn(6, fl(t * 7));
      const key = [
        { hip: -19, lean: -0.3, hd: -2, ff: 3, fb: -8, sw: [7, -22, 1.5], sh: [-6, -26, -0.6] },
        { hip: -17, lean: -0.15, hd: -1, ff: 2, fb: -9, sw: [9, -18, 2.1], sh: [-7, -22, -0.2] },
        { hip: -13, lean: 0.25, hd: 1, ff: 0, fb: -8, sw: [11, -12, 2.6], sh: [-6, -16, 0.5] },
        { hip: -10, lean: 0.5, hd: 2, ff: -1, fb: -7, sw: [12, -7, 2.9], sh: [-4, -11, 1.0] },
        { hip: -7, lean: 0.85, hd: 3, ff: -2, fb: -6, sw: [13, -4, 3.05], sh: [-2, -7, 1.4] },
        { hip: -5, lean: 1.15, hd: 3, ff: -3, fb: -6, sw: [13, -2, 3.1], sh: [0, -4, 1.6] },
        { hip: -4, lean: 1.32, hd: 3, ff: -4, fb: -6, sw: [13, -1, 3.14], sh: [1, -3, 1.7] }
      ];
      const q = key[k];
      p.wounded = true;
      p.hipY = q.hip; p.lean = q.lean; p.headX = q.hd; p.headA = q.lean * 0.5;
      p.fFx = q.ff; p.fBx = q.fb; p.fFy = 0; p.fBy = 0;
      p.swX = q.sw[0]; p.swY = q.sw[1]; p.swA = q.sw[2];
      p.shX = q.sh[0]; p.shY = q.sh[1]; p.shA = q.sh[2];
      p.swordFront = k > 2; p.capeK = -0.6 + k * 0.1; p.prone = k >= 2;
    }
  }
};

function knightFrame(state, i) {
  const key = 'k_' + state + '_' + i;
  const c = SPR.cache[key];
  if (c) return c;
  const A = KA[state];
  let meta;
  const cv = bakeInto(KW, KH, function (g) {
    if (state === 'roll') meta = drawKnightRoll(g, i / 6);
    else {
      const p = KPOSE();
      p.capeK = A.cape === undefined ? 0 : A.cape;
      A.f((i + 0.5) / A.n, p);
      meta = drawKnightBody(g, p);
      meta.capeK = p.capeK; meta.prone = p.prone;
    }
  }, { rim: 1.23, rimAdd: 12, bot: 0.58 });
  const e = { n: cv, f: flipOf(cv), fl: null, w: KW, h: KH, ax: meta.ax, ay: meta.ay, prone: !!meta.prone, capeK: meta.capeK === undefined ? 0 : meta.capeK };
  SPR.cache[key] = e;
  return e;
}
KA.roll = { n: 6, dur: 0.46, cape: 0 };

/* ---------------------------------------------------------------------
   8.  GOBLINS — three readable variants sharing one skeleton
       grunt   : hooded scavenger with a rusted cleaver
       thrower : wiry, bandolier of daggers, keeps its distance
       brute   : horned iron helm, heavy axe, scraps of looted plate
   --------------------------------------------------------------------- */
const GW = 62, GH = 58, GOX = 31, GOY = 48;

const M_SKIN = { hi: P.gobHi, base: P.gob, sh: P.gobD, edge: P.gobS };
const M_SKIN_D = { hi: P.gob, base: P.gobM, sh: P.gobS, edge: P.gobS };
const M_IRON = { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX };
const M_RUST = { hi: P.rust, base: P.rust2, sh: P.rust3, edge: P.rust3 };

const GTYPE = {
  grunt: { s: 1.00, helm: 'hood', weap: 'cleaver', cloth: P.leaD, cloth2: P.leaS, hp: 42 },
  thrower: { s: 0.92, helm: 'bare', weap: 'dagger', cloth: '#4a3a2a', cloth2: '#2c231a', hp: 30 },
  brute: { s: 1.30, helm: 'iron', weap: 'axe', cloth: P.stlS, cloth2: P.stlX, hp: 86 }
};

function GPOSE() {
  return {
    hipX: 0, hipY: -13, lean: 0.22, headX: 1.5, headY: 0, headA: 0.1,
    wX: 8, wY: -17, wA: 0.6, oX: -5, oY: -17, oA: 0.2,
    fFx: 4, fFy: 0, fBx: -4, fBy: 0, weapFront: true, dead: 0, hideW: false
  };
}

function drawGobWeapon(g, kind, hx, hy, ang) {
  const ca = cos(ang), sa = sin(ang);
  const at = (d, o) => [hx + ca * d - sa * o, hy + sa * d + ca * o];
  if (kind === 'cleaver') {
    let a = at(-3, 0), b = at(3, 0);
    seg(g, a[0], a[1], b[0], b[1], 2.6, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
    let c = at(4, 0), d = at(15, -1);
    seg(g, c[0], c[1], d[0], d[1], 5.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: -0.35 });
    /* rust and a chipped edge */
    let e = at(9, -2); px(g, e[0], e[1], P.rust);
    let e2 = at(12, 1); px(g, e2[0], e2[1], P.rust2);
    let e3 = at(15, -3); px(g, e3[0], e3[1], P.stlHi);
    let e4 = at(11, -3.4); px(g, e4[0], e4[1], P.stlHi);
  } else if (kind === 'dagger') {
    let a = at(-2, 0), b = at(2, 0);
    seg(g, a[0], a[1], b[0], b[1], 2.2, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
    let c = at(2.5, -2.5), d = at(2.5, 2.5);
    seg(g, c[0], c[1], d[0], d[1], 1.6, M_IRON);
    let e = at(3, 0), f = at(11, 0);
    seg(g, e[0], e[1], f[0], f[1], 2.6, { hi: P.stlHi, base: P.stlLt, sh: P.stlM, taper: 0.7 });
  } else if (kind === 'axe') {
    let a = at(-6, 0), b = at(9, 0);
    seg(g, a[0], a[1], b[0], b[1], 3.0, { hi: P.leaHi, base: P.lea, sh: P.leaD });
    for (let i = -4; i <= 6; i += 3) { const q = at(i, 0); px(g, q[0], q[1], P.leaS); }
    /* head of the axe: a broad crescent */
    let h0 = at(11, -6), h1 = at(11, 6);
    seg(g, h0[0], h0[1], h1[0], h1[1], 3.4, M_IRON);
    let h2 = at(15, -5), h3 = at(15, 5);
    seg(g, h2[0], h2[1], h3[0], h3[1], 3.0, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
    let h4 = at(9, -4), h5 = at(9, 4);
    seg(g, h4[0], h4[1], h5[0], h5[1], 3.0, { hi: P.stlM, base: P.stlD, sh: P.stlX });
    let r1 = at(12, 2); px(g, r1[0], r1[1], P.rust);
    let r2 = at(13, -3); px(g, r2[0], r2[1], P.rust2);
    let bl = at(14, 4); px(g, bl[0], bl[1], P.bldS);
    /* butt spike */
    let s0 = at(-6, 0), s1 = at(-9, 0);
    seg(g, s0[0], s0[1], s1[0], s1[1], 2, { hi: P.stlM, base: P.stlD, sh: P.stlX, taper: 0.8 });
  }
}

function drawGobHead(g, cx, cy, ang, cfg) {
  const ca = cos(ang), sa = sin(ang);
  const at = (x, y) => [cx + x * ca - y * sa, cy + x * sa + y * ca];
  const s = cfg.s;
  /* ears — long, pointed, one notched */
  let e0 = at(-2, -1), e1 = at(-9, -6);
  seg(g, e0[0], e0[1], e1[0], e1[1], 3.4 * s, { hi: P.gobHi, base: P.gobM, sh: P.gobS, taper: 0.85 });
  let e2 = at(-1, 0), e3 = at(-6, 4);
  seg(g, e2[0], e2[1], e3[0], e3[1], 3.0 * s, { hi: P.gob, base: P.gobD, sh: P.gobS, taper: 0.85 });
  /* skull */
  dome(g, cx, cy, 5 * s, 4.6 * s, { hi: P.gobHi, base: P.gob, sh: P.gobD }, -0.5, -0.8);
  /* brow */
  let b0 = at(-1, -2), b1 = at(4, -1.5);
  seg(g, b0[0], b0[1], b1[0], b1[1], 2.2 * s, { hi: P.gobHi, base: P.gobM, sh: P.gobD });
  /* long hooked nose */
  let n0 = at(3, 0.5), n1 = at(7.5, 2);
  seg(g, n0[0], n0[1], n1[0], n1[1], 3 * s, { hi: P.gobHi, base: P.gob, sh: P.gobD, taper: 0.6 });
  /* eyes — sunken sockets with sickly yellow points */
  let s0 = at(2.5, -0.2), s1 = at(0.2, -0.2);
  px(g, s0[0], s0[1], P.gobS); px(g, s1[0], s1[1], P.gobS);
  let y0 = at(2.6, -0.4); px(g, y0[0], y0[1], '#c9b24a');
  let y1 = at(0.4, -0.4); px(g, y1[0], y1[1], '#9a8636');
  /* jaw + teeth */
  let j0 = at(0, 3), j1 = at(4.5, 3.2);
  seg(g, j0[0], j0[1], j1[0], j1[1], 3 * s, { hi: P.gob, base: P.gobD, sh: P.gobS });
  let t0 = at(3.6, 2.2); px(g, t0[0], t0[1], P.bone);
  let t1 = at(1.6, 2.6); px(g, t1[0], t1[1], P.boneD);
  /* headgear */
  if (cfg.helm === 'hood') {
    for (let i = 0; i < 3; i++) {
      const h0 = at(-1 + i * 0.4, -5 - i * 0.2), h1 = at(-7 - i, -3 + i * 2.2);
      seg(g, h0[0], h0[1], h1[0], h1[1], (5 - i) * s, i ? { hi: cfg.cloth, base: cfg.cloth2, sh: P.ink2 } : { hi: P.leaHi, base: cfg.cloth, sh: cfg.cloth2 });
    }
    let c0 = at(-1, -5), c1 = at(4, -3.5);
    seg(g, c0[0], c0[1], c1[0], c1[1], 3.2 * s, { hi: P.leaHi, base: cfg.cloth, sh: cfg.cloth2 });
    let tp = at(-9, 4); px(g, tp[0], tp[1], cfg.cloth2);
  } else if (cfg.helm === 'iron') {
    /* horned iron skullcap */
    dome(g, cx + ca * 0.5, cy - 4.2 * s, 5.4 * s, 3.2 * s, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.5, -0.9);
    let r0 = at(-5, -4), r1 = at(5, -5);
    seg(g, r0[0], r0[1], r1[0], r1[1], 2 * s, { hi: P.stlLt, base: P.stlD, sh: P.stlX });
    let hn0 = at(-2, -6), hn1 = at(-7, -12);
    seg(g, hn0[0], hn0[1], hn1[0], hn1[1], 3.2 * s, { hi: P.boneD, base: '#6b6555', sh: '#3f3b31', taper: 0.85 });
    let hn2 = at(3, -6.5), hn3 = at(7, -11);
    seg(g, hn2[0], hn2[1], hn3[0], hn3[1], 2.8 * s, { hi: P.bone, base: P.boneD, sh: '#4a463a', taper: 0.85 });
    let rv = at(3, -4); px(g, rv[0], rv[1], P.stlHi);
    let rs = at(-3, -3); px(g, rs[0], rs[1], P.rust);
  } else {
    /* bare skull with lank hair and a bone piercing */
    for (let i = 0; i < 4; i++) {
      const a0 = at(-1 - i, -4.5 + i * 0.3), a1 = at(-5 - i * 1.4, -1 + i * 1.6);
      seg(g, a0[0], a0[1], a1[0], a1[1], 1.6, { hi: '#4a4436', base: '#332f26', sh: '#211e18' });
    }
    let p0 = at(6, 2.6); px(g, p0[0], p0[1], P.bone);
    let sc = at(1, -3); px(g, sc[0], sc[1], P.gobS);
  }
}

function drawGoblin(g, cfg) {
  return function (ps) {
    const s = cfg.s;
    const hx = GOX + ps.hipX * s, hy = GOY + ps.hipY * s;
    const spine = 9 * s;
    const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
    const hdx = sx + sin(ps.lean) * 5 * s + ps.headX * s, hdy = sy - cos(ps.lean) * 5 * s + ps.headY * s;
    const wx = GOX + ps.wX * s, wy = GOY + ps.wY * s;
    const ox = GOX + ps.oX * s, oy = GOY + ps.oY * s;
    const ffx = GOX + ps.fFx * s, ffy = GOY + ps.fFy * s;
    const fbx = GOX + ps.fBx * s, fby = GOY + ps.fBy * s;
    const L1 = 6.5 * s, L2 = 6.5 * s, A1 = 6 * s, A2 = 6 * s;

    /* far leg */
    const lb = ik(hx - 1.5 * s, hy, fbx, fby, L1, L2, 1);
    seg(g, hx - 1.5 * s, hy, lb.ex, lb.ey, 4.6 * s, M_SKIN_D);
    seg(g, lb.ex, lb.ey, lb.hx, lb.hy, 3.6 * s, M_SKIN_D);
    seg(g, lb.hx - 1, lb.hy - 0.8, lb.hx + 2.6 * s, lb.hy - 0.8, 2.6 * s, { hi: P.gobM, base: P.gobD, sh: P.gobS });
    /* far arm */
    const ab2 = ik(sx - 1 * s, sy + 1.5 * s, ox, oy, A1, A2, 1);
    seg(g, sx - 1 * s, sy + 1.5 * s, ab2.ex, ab2.ey, 3.8 * s, M_SKIN_D);
    seg(g, ab2.ex, ab2.ey, ab2.hx, ab2.hy, 3.2 * s, M_SKIN_D);
    if (cfg.helm === 'iron') { /* the brute wraps its off hand in chain */
      dith(g, ab2.hx - 2, ab2.hy - 2, 4, 4, P.stlD, P.stlS, 1);
    }
    if (!ps.weapFront && !ps.hideW) {
      drawGobWeapon(g, cfg.weap, wx, wy, ps.wA);
      const aw0 = ik(sx + s, sy + 1.5 * s, wx, wy, A1, A2, -1);
      seg(g, sx + s, sy + 1.5 * s, aw0.ex, aw0.ey, 3.8 * s, M_SKIN_D);
      seg(g, aw0.ex, aw0.ey, aw0.hx, aw0.hy, 3.2 * s, M_SKIN_D);
    }
    /* torso — hunched, ribbed */
    plate(g, (hx + sx) / 2, (hy + sy) / 2, 11 * s, 9.4 * s, ps.lean + PI / 2, { hi: P.gobHi, base: P.gob, sh: P.gobD, taper: 0.2 });
    /* ribs / collarbone hints */
    px(g, sx - 2 * s, sy + 3 * s, P.gobD); px(g, sx + 2 * s, sy + 3.4 * s, P.gobD);
    px(g, sx - 1, sy + 5 * s, P.gobD);
    /* looted armour scraps */
    if (cfg.helm === 'iron') {
      for (let i = 0; i < 3; i++) plate(g, sx + 3.4 * s + i * 0.5, sy + 0.4 * s + i * 2 * s, (8 - i * 1.4) * s, 3.6 * s, 0.25, { hi: P.stlLt, base: P.stlM, sh: P.stlS, round: 1 });
      dith(g, hx - 4 * s, hy - 5 * s, 8 * s, 5 * s, P.stlS, P.stlD, 1);
      seg(g, hx - 5 * s, hy - 1, hx + 5 * s, hy - 1, 2.6 * s, { hi: P.stlM, base: P.stlD, sh: P.stlX });
    } else {
      /* leather harness crossing the chest */
      seg(g, sx - 4 * s, sy + 6 * s, sx + 4.5 * s, sy + 1 * s, 2.4 * s, { hi: P.leaHi, base: P.lea, sh: P.leaD });
      seg(g, hx - 4.5 * s, hy - 1, hx + 4.5 * s, hy - 1.4, 2.4 * s, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
      px(g, hx + 1.5 * s, hy - 1, P.bronze);
      if (cfg.weap === 'dagger') {
        /* bandolier of throwing knives */
        for (let i = 0; i < 3; i++) {
          const bx = sx - 2 * s + i * 2.2 * s, by = sy + 5 * s - i * 1.6 * s;
          seg(g, bx, by, bx + 0.5, by - 3.4 * s, 1.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.5 });
        }
      }
      /* loin cloth */
      for (let i = 0; i < 2; i++) seg(g, hx - 3 * s + i * 3 * s, hy + 1, hx - 3.4 * s + i * 3 * s, hy + 5 * s, 3 * s, { hi: cfg.cloth, base: cfg.cloth2, sh: P.ink2 });
    }
    /* head */
    drawGobHead(g, hdx, hdy, ps.headA + ps.lean * 0.35, cfg);
    /* near leg */
    const lf = ik(hx + 1.5 * s, hy, ffx, ffy, L1, L2, 1);
    seg(g, hx + 1.5 * s, hy, lf.ex, lf.ey, 5 * s, M_SKIN);
    seg(g, lf.ex, lf.ey, lf.hx, lf.hy, 3.8 * s, M_SKIN);
    if (cfg.helm === 'iron') { /* iron greave on the leading shin */
      seg(g, lf.ex, lf.ey, lf.hx, lf.hy, 3.0 * s, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
    } else { /* rag wrappings */
      dith(g, lf.ex - 2, lf.ey + 1, 4, 3, cfg.cloth, cfg.cloth2, 1);
    }
    seg(g, lf.hx - 1.2, lf.hy - 0.8, lf.hx + 3 * s, lf.hy - 0.8, 3 * s, { hi: P.gobHi, base: P.gob, sh: P.gobD });
    px(g, lf.hx + 3 * s, lf.hy - 1.6, P.boneD);   /* claw */
    /* near arm + weapon */
    if (ps.weapFront) {
      const aw = ik(sx + s, sy + 1.5 * s, wx, wy, A1, A2, -1);
      seg(g, sx + s, sy + 1.5 * s, aw.ex, aw.ey, 4.2 * s, M_SKIN);
      seg(g, aw.ex, aw.ey, aw.hx, aw.hy, 3.4 * s, M_SKIN);
      px(g, aw.ex, aw.ey - 2, P.gobHi);
      if (!ps.hideW) drawGobWeapon(g, cfg.weap, wx, wy, ps.wA);
    }
  };
}

/* --- goblin animation table ---------------------------------------- */
const GA = {

    n: 4, dur: 1.6, loop: 1, f(t, p) {
      const s = sin(t * TAU);
      p.hipY = -13 + s * 0.5; p.lean = 0.24 + s * 0.03;
      p.wY = -16 + s * 0.6; p.wA = 0.7; p.oY = -16 + s * 0.4;

      p.fFx = 4; p.fBx = -4.5;
    }
  },
  walk: {
    n: 6, dur: 0.66, loop: 1, f(t, p) {
      const ph = t * TAU;
      const F = { x: 5.5 * sin(ph), y: cos(ph) > 0 ? -5 * cos(ph) * cos(ph) : 0 };
      const B = { x: 5.5 * sin(ph + PI), y: cos(ph + PI) > 0 ? -5 * cos(ph + PI) * cos(ph + PI) : 0 };
      p.fFx = F.x; p.fFy = F.y; p.fBx = B.x; p.fBy = B.y;
      p.hipY = -13 + 1.1 * ab(sin(ph)); p.lean = 0.30;
      p.headX = 2; p.headY = 0.3 * cos(ph);
      p.wX = 7 - 2.6 * sin(ph); p.wY = -16; p.wA = 0.8 - 0.2 * sin(ph);
      p.oX = -5 + 2.6 * sin(ph); p.oY = -16;
    }
  },
  run: {
    n: 6, dur: 0.42, loop: 1, f(t, p) {

      const F = { x: 7 * sin(ph), y: cos(ph) > 0 ? -7 * cos(ph) * cos(ph) : 0 };
      const B = { x: 7 * sin(ph + PI), y: cos(ph + PI) > 0 ? -7 * cos(ph + PI) * cos(ph + PI) : 0 };
      p.fFx = F.x; p.fFy = F.y; p.fBx = B.x; p.fBy = B.y;
      p.hipY = -13.5 + 1.4 * ab(sin(ph)); p.lean = 0.44;
      p.headX = 2.6; p.headY = 0.4 * cos(ph); p.headA = -0.1;
      p.wX = 8 - 3.6 * sin(ph); p.wY = -15.5; p.wA = 0.5 - 0.3 * sin(ph);
      p.oX = -6 + 3.6 * sin(ph); p.oY = -16.5;

  },
  wind: {
    n: 3, dur: 0.42, f(t, p) {
      const k = mn(2, fl(t * 3));
      p.lean = -0.10 - k * 0.06; p.hipY = -12.5;
      p.fFx = 3.5; p.fBx = -6 - k * 0.5;
      p.wX = -1 - k * 2.5; p.wY = -22 - k * 2; p.wA = -1.9 - k * 0.35; p.weapFront = false;
      p.oX = -5; p.oY = -15; p.headX = 1 - k * 0.3; p.headA = -0.16;
    }
  },
  atk: {
    n: 4, dur: 0.34, f(t, p) {
      const k = mn(3, fl(t * 4));
      const key = [
        { w: [4, -24, -1.2], lean: 0.15, ff: 5, fb: -5, front: 1 },
        { w: [11, -17, -0.15], lean: 0.48, ff: 7.5, fb: -4.5, front: 1 },
        { w: [12, -12, 0.55], lean: 0.55, ff: 7.5, fb: -4.5, front: 1 },
        { w: [9, -14, 0.7], lean: 0.34, ff: 6, fb: -4.5, front: 1 }
      ][k];
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.lean = key.lean; p.fFx = key.ff; p.fBx = key.fb; p.hipY = -13;
      p.headX = 2.4; p.headA = 0.2; p.oX = -5.5; p.oY = -17;
    }
  },
  throw: {
    n: 4, dur: 0.46, f(t, p) {
      const k = mn(3, fl(t * 4));
      const key = [
        { w: [-2, -22, -2.3], lean: -0.14, front: 0, ff: 4, hd: 1 },
        { w: [-4, -24, -2.6], lean: -0.22, front: 0, ff: 4, hd: 0.6 },
        { w: [8, -21, -0.5], lean: 0.30, front: 1, ff: 6, hd: 2.4 },
        { w: [11, -19, 0.1], lean: 0.36, front: 1, ff: 6.5, hd: 2.6 }
      ][k];
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.lean = key.lean; p.weapFront = !!key.front; p.fFx = key.ff; p.fBx = -5;
      p.headX = key.hd; p.hipY = -13; p.hideW = k >= 3;
      p.oX = -4; p.oY = -18;
    }
  },
  guard: {
    n: 2, dur: 0.5, loop: 1, f(t, p) {
      const s = t < 0.5 ? 0 : 1;
      p.lean = -0.08; p.hipY = -12.5 + s * 0.3; p.fFx = 5; p.fBx = -6;
      p.wX = -4; p.wY = -14; p.wA = 1.6; p.weapFront = false;
      p.oX = 6; p.oY = -19; p.headX = 0.8;
    }
  },
  hurt: {
    n: 2, dur: 0.26, f(t, p) {
      const s = t < 0.5 ? 1 : 0.55;
      p.lean = -0.30 * s; p.hipY = -12.4; p.headX = -1.4 * s; p.headA = -0.4 * s;
      p.fFx = 2.5; p.fBx = -6.5;
      p.wX = 7 + s * 2; p.wY = -13; p.wA = 1.5; p.oX = -6 - s; p.oY = -14;
    }
  },
  die: {
    n: 5, dur: 0.62, f(t, p) {
      const k = mn(4, fl(t * 5));
      const key = [
        { hip: -12, lean: -0.4, hd: -2, w: [8, -12, 2.0], o: [-6, -12, 0], ff: 2, fb: -7 },
        { hip: -9, lean: -0.7, hd: -3, w: [10, -8, 2.6], o: [-7, -9, 0], ff: 0, fb: -8 },
        { hip: -6, lean: -1.0, hd: -4, w: [11, -4, 2.9], o: [-8, -5, 0], ff: -2, fb: -8 },
        { hip: -3.5, lean: -1.3, hd: -5, w: [11, -2, 3.1], o: [-9, -2, 0], ff: -4, fb: -7 },
        { hip: -2.5, lean: -1.45, hd: -5.5, w: [11, -1, 3.14], o: [-9, -1, 0], ff: -5, fb: -6 }
      ][k];
      p.hipY = key.hip; p.lean = key.lean; p.headX = key.hd; p.headA = key.lean * 0.6;
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.oX = key.o[0]; p.oY = key.o[1];
      p.fFx = key.ff; p.fBx = key.fb; p.fFy = 0; p.fBy = 0; p.weapFront = true;
    }
  }
};

function gobFrame(type, state, i) {
  const key = 'g_' + type + '_' + state + '_' + i;
  const c = SPR.cache[key]; if (c) return c;
  const cfg = GTYPE[type], A = GA[state];
  const cv = bakeInto(GW, GH, function (g) {
    const p = GPOSE();
    A.f((i + 0.5) / A.n, p);
    drawGoblin(g, cfg)(p);
  }, { rim: 1.22, rimAdd: 11, bot: 0.58 });
  const e = { n: cv, f: flipOf(cv), fl: null, w: GW, h: GH };
  SPR.cache[key] = e;
  return e;
}

/* --- thrown dagger ------------------------------------------------- */
function daggerSprite(i) {
  return SPR.get('dag' + i, 20, 20, (g) => {
    const a = i / 8 * TAU;
    drawGobWeapon(g, 'dagger', 10 - cos(a) * 3, 10 - sin(a) * 3, a);
  }, { rim: 1.2, bot: 0.7 });
}

/* ---------------------------------------------------------------------
   9.  GRULLK, THE GOBLIN KING
   Twice the height of his kin, wrapped in looted plate, a bent crown of
   tarnished gold, and a mace that drags his whole body behind it.
   --------------------------------------------------------------------- */
const BW = 176, BH = 168, BOX = 84, BOY = 138;

const M_KSKIN = { hi: '#5f6d38', base: '#47542a', sh: '#2d3719', edge: '#1c2410' };
const M_KSKIN_D = { hi: '#3f4a24', base: '#303a1b', sh: '#1e2611', edge: '#141a0b' };
const M_KIRON = { hi: P.stlLt, base: P.stlD, sh: P.stlX, edge: P.stlX };
const M_KIRON2 = { hi: P.stlHi, base: P.stlM, sh: P.stlS, edge: P.stlX };
const M_FUR = { hi: '#4a4034', base: '#332c23', sh: '#211c16', edge: '#161310' };

function BPOSE() {
  return {
    hipX: 0, hipY: -40, lean: 0.16, headX: 3, headY: 0, headA: 0.08,
    mX: 22, mY: -52, mA: 0.9, oX: -16, oY: -50, oA: 0,
    fFx: 9, fFy: 0, fBx: -10, fBy: 0, maceFront: true, capeK: 0, jaw: 0, crownTilt: 0
  };
}

function drawMace(g, hx, hy, ang) {
  const ca = cos(ang), sa = sin(ang);
  const at = (d, o) => [hx + ca * d - sa * o, hy + sa * d + ca * o];
  /* haft — dark timber bound with iron */
  let a = at(-10, 0), b = at(30, 0);
  seg(g, a[0], a[1], b[0], b[1], 6, { hi: '#5a4a35', base: '#3a2f22', sh: '#241d15', edge: '#1a140f' });
  for (let d = -6; d <= 24; d += 8) {
    const p0 = at(d, -3.4), p1 = at(d, 3.4);
    seg(g, p0[0], p0[1], p1[0], p1[1], 2.4, M_KIRON2);
  }
  /* butt cap + hanging chain */
  let bc = at(-11, 0); dome(g, bc[0], bc[1], 3.4, 3.4, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.5, -0.8);
  for (let i = 0; i < 4; i++) { const q = at(-12 - i * 1.2, 3 + i * 2.6); px(g, q[0], q[1], i % 2 ? P.stlM : P.stlS); }
  /* head — a heavy iron block */
  let h0 = at(30, 0), h1 = at(44, 0);
  seg(g, h0[0], h0[1], h1[0], h1[1], 17, { hi: P.stlLt, base: P.stlD, sh: P.stlX });
  let f0 = at(32, 0), f1 = at(42, 0);
  seg(g, f0[0], f0[1], f1[0], f1[1], 13, { hi: P.stlM, base: P.stlS, sh: P.stlX });
  /* royal band of tarnished gold */
  let g0 = at(36, -8.5), g1 = at(36, 8.5);
  seg(g, g0[0], g0[1], g1[0], g1[1], 3, { hi: P.gldHi, base: P.gld, sh: P.gldS });
  /* spikes */
  const sp = [[46, 0, 0], [42, -10, -0.9], [42, 10, 0.9], [33, -11, -2.2], [33, 11, 2.2]];
  for (const s of sp) {
    const s0 = at(s[0], s[1]);
    const s1 = at(s[0] + cos(s[2]) * 8, s[1] + sin(s[2]) * 8);
    seg(g, s0[0], s0[1], s1[0], s1[1], 5.4, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.88 });
  }
  /* rust, gore and battle wear */
  let r0 = at(35, 4); px(g, r0[0], r0[1], P.rust);
  let r1 = at(39, -5); px(g, r1[0], r1[1], P.rust2);
  let r2 = at(41, 6); px(g, r2[0], r2[1], P.bldS);
  let r3 = at(38, 2); px(g, r3[0], r3[1], P.stlHi);
}

function drawCrown(g, cx, cy, ang) {
  const ca = cos(ang), sa = sin(ang);
  const at = (x, y) => [cx + x * ca - y * sa, cy + x * sa + y * ca];
  /* band */
  let b0 = at(-9, 0), b1 = at(9, -1);
  seg(g, b0[0], b0[1], b1[0], b1[1], 5, { hi: P.gldHi, base: P.gld, sh: P.gldD });
  /* points — one snapped off, one bent */
  const pts = [[-8, -1, -6, -9], [-4, -2, -3.5, -11], [0, -2, 0, -13], [4, -2, 5.5, -10], [8, -1, 10, -5]];
  for (let i = 0; i < pts.length; i++) {
    const q = pts[i];
    const s0 = at(q[0], q[1]), s1 = at(q[2], q[3]);
    seg(g, s0[0], s0[1], s1[0], s1[1], i === 2 ? 4.4 : 3.6, i === 4
      ? { hi: P.gldD, base: P.gldS, sh: P.gldS, taper: 0.7 }
      : { hi: P.gldHi, base: P.gld, sh: P.gldD, taper: 0.55 });
    if (i !== 4) { const t = at(q[2], q[3] - 1); px(g, t[0], t[1], P.gldHi); }
  }
  /* set stones: one blood-red, one missing */
  let j0 = at(0, -1); px(g, j0[0], j0[1], P.bld);
  let j1 = at(-4, -1); px(g, j1[0], j1[1], P.gldS);
  let j2 = at(4, -1); px(g, j2[0], j2[1], P.clD);
  /* tarnish */
  let t0 = at(-7, 1); px(g, t0[0], t0[1], P.gldS);
  let t1 = at(6, 0); px(g, t1[0], t1[1], P.bronzeD);
}

function drawKingHead(g, cx, cy, ang, jaw, crownTilt) {
  const ca = cos(ang), sa = sin(ang);
  const at = (x, y) => [cx + x * ca - y * sa, cy + x * sa + y * ca];
  /* ears, torn and pierced */
  let e0 = at(-4, -2), e1 = at(-16, -10);
  seg(g, e0[0], e0[1], e1[0], e1[1], 6.4, { hi: '#5f6d38', base: '#3a4520', sh: '#1e2611', taper: 0.8 });
  let e2 = at(-3, 1), e3 = at(-13, 7);
  seg(g, e2[0], e2[1], e3[0], e3[1], 5.6, { hi: '#47542a', base: '#2a3318', sh: '#19200e', taper: 0.8 });
  let pr = at(-11, -7); px(g, pr[0], pr[1], P.gld);
  let pr2 = at(-9, 4); px(g, pr2[0], pr2[1], P.bronze);
  /* skull */
  dome(g, cx, cy, 10, 9, { hi: '#5f6d38', base: '#47542a', sh: '#2a3318' }, -0.5, -0.8);
  /* heavy brow */
  let b0 = at(-3, -4), b1 = at(8, -3);
  seg(g, b0[0], b0[1], b1[0], b1[1], 5, { hi: '#6b7a3e', base: '#47542a', sh: '#2a3318' });
  /* eyes — deep sockets, sickly amber */
  for (const ex of [[6, -0.5], [1.5, -0.6]]) {
    const s = at(ex[0], ex[1]);
    r(g, s[0] - 1, s[1] - 1, 3, 3, '#232a12');
  }
  let y0 = at(6, -1); px(g, y0[0], y0[1], '#e0c258'); px(g, y0[0] - 1, y0[1], '#a8902f');
  let y1 = at(1.5, -1); px(g, y1[0], y1[1], '#c9ab45');
  /* broad hooked nose */
  let n0 = at(5, 1), n1 = at(12, 3.5);
  seg(g, n0[0], n0[1], n1[0], n1[1], 5.4, { hi: '#5f6d38', base: '#414d22', sh: '#2a3318', taper: 0.5 });
  /* jaw, tusks */
  let j0 = at(-1, 6 + jaw), j1 = at(8, 6.5 + jaw);
  seg(g, j0[0], j0[1], j1[0], j1[1], 6.4, { hi: '#4f5c2c', base: '#333d1c', sh: '#1e2611' });
  const tk = [[7, 3.6 + jaw], [3, 4.2 + jaw], [5, 4 + jaw]];
  for (let i = 0; i < 3; i++) {
    const s0 = at(tk[i][0], tk[i][1]), s1 = at(tk[i][0] + 0.6, tk[i][1] - 4 - (i === 0 ? 2 : 0));
    seg(g, s0[0], s0[1], s1[0], s1[1], i === 0 ? 3.4 : 2.4, { hi: '#e2dcc4', base: P.bone, sh: P.boneD, taper: 0.7 });
  }
  if (jaw > 0.5) { let m = at(3, 7); r(g, m[0] - 3, m[1] - 1, 7, 3, '#1a1408'); }
  /* scars */
  let s0 = at(2, -5); px(g, s0[0], s0[1], '#8a5a4a'); let s1 = at(3, -4); px(g, s1[0], s1[1], '#8a5a4a');
  let s2 = at(4, -3); px(g, s2[0], s2[1], '#6d4436');
  /* warpaint smear */
  dith(g, cx - 4, cy - 2, 5, 2, '#2a3318', P.bldD, 1);
  /* crown */
  const cr = at(1, -10);
  drawCrown(g, cr[0], cr[1], ang + crownTilt);
}

function drawKing(g, ps) {
  const hx = BOX + ps.hipX, hy = BOY + ps.hipY;
  const spine = 26;
  const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
  const hdx = sx + sin(ps.lean) * 13 + ps.headX, hdy = sy - cos(ps.lean) * 13 + ps.headY;
  const mx2 = BOX + ps.mX, my2 = BOY + ps.mY;
  const ox = BOX + ps.oX, oy = BOY + ps.oY;
  const ffx = BOX + ps.fFx, ffy = BOY + ps.fFy;
  const fbx = BOX + ps.fBx, fby = BOY + ps.fBy;

  /* ---- ruined royal cape behind ---- */
  const k = ps.capeK;
  for (let s = 0; s <= 40; s++) {
    const u = s / 40 * 2 - 1;
    const jag = fl(hn(s * 5, 11, 47) * 12);
    const L = 58 - jag - (ab(u) > 0.8 ? 10 : 0);
    for (let i = 0; i < L; i++) {
      const t = i / 56;
      const off = -k * Math.pow(t, 1.5) * 24 - Math.pow(t, 2.2) * 5 - 17;
      const hw = 12 + t * 11 - Math.pow(t, 3) * 4;
      const fold = sin(u * 6 + k);
      let col = fold > 0.4 ? P.cl : (fold < -0.3 ? P.clS : P.clD);
      if (u > 0.6) col = P.clS;
      if (i > L - 4) col = P.clS;
      if (hn(s * 3, i, 23) > 0.9) col = P.clS;
      px(g, sx + off + u * hw, sy - 4 + i, col);
    }
  }
  /* ---- far leg ---- */
  const lb = ik(hx - 7, hy, fbx, fby, 20, 20, 1);
  seg(g, hx - 7, hy, lb.ex, lb.ey, 15, M_KSKIN_D);
  dome(g, lb.ex, lb.ey, 5.5, 5.5, { hi: '#3f4a24', base: '#2a3318', sh: '#19200e' }, -0.5, -0.7);
  seg(g, lb.ex, lb.ey, lb.hx, lb.hy, 11, M_KSKIN_D);
  /* strap wrappings on the far shin */
  for (let i = 0; i < 3; i++) {
    const t = 0.25 + i * 0.25;
    seg(g, lb.ex + (lb.hx - lb.ex) * t - 4, lb.ey + (lb.hy - lb.ey) * t,
      lb.ex + (lb.hx - lb.ex) * t + 5, lb.ey + (lb.hy - lb.ey) * t - 1, 2.4, { hi: P.leaD, base: P.leaS, sh: '#160f09' });
  }
  seg(g, lb.hx - 3, lb.hy - 2, lb.hx + 8, lb.hy - 2, 5, { hi: '#2a3318', base: '#1e2611', sh: '#12170a' });
  /* far arm */
  const ab2 = ik(sx - 6, sy + 4, ox, oy, 14, 13, 1);
  seg(g, sx - 6, sy + 4, ab2.ex, ab2.ey, 11, M_KSKIN_D);
  seg(g, ab2.ex, ab2.ey, ab2.hx, ab2.hy, 9, M_KSKIN_D);
  dome(g, ab2.hx, ab2.hy, 4, 4, { hi: '#47542a', base: '#333d1c', sh: '#1e2611' }, -0.5, -0.7);
  /* mace behind the body during the wind-up */
  if (!ps.maceFront) {
    drawMace(g, mx2, my2, ps.mA);
    const am0 = ik(sx + 6, sy + 4, mx2, my2, 14, 13, -1);
    seg(g, sx + 6, sy + 4, am0.ex, am0.ey, 11, M_KSKIN_D);
    seg(g, am0.ex, am0.ey, am0.hx, am0.hy, 9, M_KSKIN_D);
  }
  /* ---- torso: gut, belly plate, chain skirt ---- */
  plate(g, (hx + sx) / 2 + sin(ps.lean) * 2, (hy + sy) / 2 + 2, 30, 30, ps.lean + PI / 2, { hi: '#5f6d38', base: '#47542a', sh: '#2a3318', taper: -0.25, round: 0 });
  /* sagging gut */
  dome(g, hx + 6 + sin(ps.lean) * 3, hy - 8, 11, 10, { hi: '#5f6d38', base: '#47542a', sh: '#2a3318' }, -0.4, -0.6);
  /* belly plate — three riveted iron lames, dulled by campaign filth */
  for (let i = 0; i < 3; i++) {
    const yy = hy - 3 - i * 6;
    seg(g, hx - 9 + i, yy, hx + 12 - i * 0.5, yy - 1, 6.5,
      i % 2 ? { hi: P.stlM, base: P.stlS, sh: P.stlX } : { hi: P.stlLt, base: P.stlD, sh: P.stlX });
    px(g, hx - 6 + i, yy - 2, P.stlLt); px(g, hx + 8 - i, yy - 2, P.stlM);
    px(g, hx + 2 + i, yy, P.rust2);
  }
  /* chain skirt */
  dith(g, hx - 12, hy + 1, 24, 9, P.stlS, P.stlD, 1);
  for (let i = 0; i < 4; i++) r(g, hx - 11 + i * 6, hy + 9, 4, 3, i % 2 ? P.stlS : P.stlX);
  /* wide leather belt with a gold buckle */
  seg(g, hx - 13, hy - 1, hx + 13, hy - 2, 6, { hi: P.leaHi, base: P.lea, sh: P.leaS });
  dome(g, hx + 3, hy - 2, 4, 3, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  /* trophy: a knight's helm hanging from the belt */
  dome(g, hx - 11, hy + 3, 4, 4, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.5, -0.7);
  r(g, hx - 13, hy + 3, 5, 1, P.stlX);
  /* fur mantle over the shoulders */
  for (let i = 0; i < 9; i++) {
    const a = -0.5 + i * 0.32, rr = 15 + (i % 2) * 3;
    seg(g, sx - 2 + cos(a + PI) * 4, sy - 2, sx + cos(a + PI) * rr, sy - 2 + sin(a) * 8 + 4, 7, M_FUR);
  }
  plate(g, sx, sy - 2, 30, 12, ps.lean, M_FUR);
  /* bone necklace */
  for (let i = -3; i <= 3; i++) {
    const a = i * 0.34;
    px(g, sx + sin(a) * 10 + 1, sy + 6 + cos(a) * 3, P.boneD);
    if (i % 2 === 0) px(g, sx + sin(a) * 10 + 1, sy + 7 + cos(a) * 3, P.bone);
  }
  /* pauldrons — spiked, looted */
  for (let i = 0; i < 3; i++) plate(g, sx - 13 - i * 0.6, sy - 1 + i * 4, 19 - i * 3, 8 - i * 1.2, -0.25, { hi: P.stlM, base: P.stlD, sh: P.stlX, round: 1 });
  for (let i = 0; i < 3; i++) plate(g, sx + 14 + i * 0.8, sy - 1 + i * 4.2, 21 - i * 3, 9 - i * 1.2, 0.22, { hi: P.stlHi, base: P.stlM, sh: P.stlS, round: 1 });
  seg(g, sx + 14, sy - 5, sx + 20, sy - 12, 5, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.85 });
  seg(g, sx - 13, sy - 4, sx - 18, sy - 10, 4.4, { hi: P.stlM, base: P.stlD, sh: P.stlX, taper: 0.85 });
  px(g, sx + 13, sy + 1, P.rust); px(g, sx - 12, sy + 3, P.rust2);
  /* ---- head ---- */
  drawKingHead(g, hdx, hdy, ps.headA + ps.lean * 0.3, ps.jaw, ps.crownTilt);
  /* ---- near leg ---- */
  const lf = ik(hx + 7, hy, ffx, ffy, 20, 20, 1);
  seg(g, hx + 7, hy, lf.ex, lf.ey, 16, M_KSKIN);
  dome(g, lf.ex, lf.ey, 6, 6, { hi: '#5f6d38', base: '#414d22', sh: '#2a3318' }, -0.5, -0.7);
  seg(g, lf.ex, lf.ey, lf.hx, lf.hy, 12, M_KSKIN);
  /* strapped iron greave */

/* ====== LAYER 3: mountains — jagged asymmetric silhouettes ====== */
function mkMountains(w, h, seed, colTop, colBody, colShade, peaks, amp) {
  const cv = mkcv(w, h), g = gc(cv);
  const prof = new Float32Array(w);
  for (let x = 0; x < w; x++) prof[x] = h;
  /* stack asymmetric triangular peaks — the classic ridge silhouette */
  for (let i = 0; i < peaks; i++) {
    const px2 = hn(i, 1, seed) * (w + 200) - 100;
    const ph = h * (0.30 + hn(i, 2, seed) * amp);
    const lw = 26 + hn(i, 3, seed) * 90, rw = 26 + hn(i, 4, seed) * 110;
    const top = h - ph;
    for (let x = fl(px2 - lw); x < px2 + rw; x++) {
      if (x < 0 || x >= w) continue;
      const t = x < px2 ? (px2 - x) / lw : (x - px2) / rw;
      /* broken, notched flanks rather than clean slopes */
      const notch = hn(x >> 2, i, seed + 9) * 5 * t;
      const y = top + Math.pow(t, 0.82) * ph + notch;
      if (y < prof[x]) prof[x] = y;
    }
  }
  for (let x = 0; x < w; x++) {
    const top = mx(0, fl(prof[x]));
    for (let y = top; y < h; y++) {
      let col = colBody;
      if (y === top) col = colTop;                                  /* moonlit ridge */
      else if (y === top + 1 && hn(x, 0, seed + 1) > 0.4) col = colTop;
      else if (y < top + 4 && hn(x, y, seed + 2) > 0.72) col = colShade;
      else if (y > top + 6 && hn(x >> 2, y >> 2, seed + 3) > 0.94) col = colShade;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* ====== masonry helpers ====== */
function brickFace(g, x0, y0, w, h, seed, pal) {
  pal = pal || { hi: P.stnHi, lt: P.stnLt, base: P.stn, m: P.stnM, d: P.stnD, s: P.stnS, x: P.stnX };
  const rowH = 7;
  for (let ry = 0; ry * rowH < h; ry++) {
    const yy = y0 + ry * rowH;
    const rowOff = (ry % 2) * 9 + fl(hn(ry, seed, 3) * 5);
    let bx = -rowOff;
    while (bx < w) {
      const bw = 11 + fl(hn(bx, ry + seed, 7) * 9);
      const rr = hn(bx + 3, ry + seed, 11);
      let base = pal.base;
      if (rr > 0.86) base = pal.m; else if (rr < 0.14) base = pal.lt;
      const recessed = rr > 0.93;
      for (let j = 0; j < rowH && yy + j < y0 + h; j++) {
        for (let i = 0; i < bw && bx + i < w; i++) {
          if (bx + i < 0) continue;
          let col = base;
          if (j === 0) col = recessed ? pal.d : pal.lt;                       /* top light */
          else if (j === rowH - 1) col = pal.x;                               /* mortar shadow */
          else if (i === 0 || i === bw - 1) col = pal.d;                      /* vertical seam */
          else if (j === 1) col = recessed ? pal.m : mixc(base, pal.lt, 0.45);
          else if (j > rowH - 3) col = pal.s;
          if (recessed) col = mixc(col, pal.x, 0.5);

          if (n > 0.965) col = pal.hi; else if (n < 0.035) col = pal.x;
          g.fillStyle = col; g.fillRect(x0 + bx + i, yy + j, 1, 1);

}

        if (hn(x, y, 27) > 0.9) col = P.rust;
        px(g, 2 + x, 8 + y, col);

    }

    for (let i = 0; i < 9; i++) {
      const x = 4 + fl(hn(i, 1, 29) * 10), y = 8 + fl(hn(i, 2, 29) * 2);
      px(g, x, y, hn(i, 3, 29) > 0.5 ? P.fireD : P.fireM);

  });
  /* foreground silhouettes */
  prop('fgPost', 14, 46, (g) => {
    for (let y = 0; y < 46; y++) {

  prop('gate', 56, 92, (g) => {

/* ====== LAYER 6: battlefield fog strips ====== */
function mkFog(w, h, seed, col, alpha) {
  const cv = mkcv(w, h), g = gc(cv);
  for (let x = 0; x < w; x++) {
    let v = 0, amp = 1, f = 0.02;
    for (let o = 0; o < 3; o++) { v += (hn(fl(x * f), o, seed) - 0.5) * amp; amp *= 0.5; f *= 2.7; }
    const top = h * 0.5 - (0.35 + v) * h * 0.5;
    const bot = h * 0.5 + (0.35 - v * 0.6) * h * 0.5;
    for (let y = mx(0, fl(top)); y < mn(h, bot); y++) {
      const edge = (y < top + 3 ? (y - top) / 3 : 1) * (y > bot - 3 ? (bot - y) / 3 : 1);
      /* hard dithered edge instead of a soft blur */
      if (edge < 0.99 && hn(x, y, seed + 5) > edge) continue;
      ra(g, x, y, 1, 1, y < h * 0.45 ? mixc(col, '#5c6779', 0.3) : col, alpha);
    }
  }
  return cv;
}

const vigCv = (function () {
  const cv = mkcv(VW, VH), g = gc(cv);
  const cx = VW / 2, cy = VH / 2, mr = hyp(cx, cy);
  for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
    const d = hyp((x - cx) * 0.86, (y - cy)) / mr;
    let a = Math.pow(mx(0, d - 0.26) / 0.74, 1.7) * 0.88;
    if (a > 0.006) { g.fillStyle = 'rgba(3,4,7,' + a.toFixed(3) + ')'; g.fillRect(x, y, 1, 1); }
  }
  return cv;
})();

  const cv = mkcv(VW, VH), g = gc(cv);

})();

/* solid lookup */
function groundAt(x, yRef) {
  let best = 1e9, found = null;
  for (const p of LV.plats) {
    if (x < p.x || x > p.x + p.w) continue;
    if (p.y >= yRef - 2 && p.y < best) { best = p.y; found = p; }
  }
  return found ? found.y : null;
}
function isSolidAt(x, y) {
  for (const p of LV.plats) if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return p;

}

const CAM = {
  x: 0, y: 0, tx: 0, ty: 0, shake: 0, shakeD: 0, ox: 0, oy: 0, lock: 0, lockX0: 0, lockX1: 0,
  follow(px2, py2, face, dt, vx) {
    const look = clamp(vx * 0.16, -26, 26);
    this.tx = px2 - VW * 0.42 + look;
    const desiredY = py2 - VH * 0.66;
    this.ty += (desiredY - this.ty) * mn(1, dt * 3.2);
    let lo = 0, hi = LV.w - VW;
    if (this.lock) { lo = this.lockX0; hi = this.lockX1 - VW; }
    this.tx = clamp(this.tx, lo, hi);
    this.x += (this.tx - this.x) * mn(1, dt * 6.5);
    this.x = clamp(this.x, lo, hi);
    this.y = clamp(this.ty, -30, 26);
    if (this.shake > 0) {
      this.shake = mx(0, this.shake - dt * this.shakeD);
      const s = this.shake * this.shake;
      this.ox = (Math.random() * 2 - 1) * s; this.oy = (Math.random() * 2 - 1) * s * 0.7;
    } else { this.ox = 0; this.oy = 0; }
  },
  kick(amount, decay) { this.shake = mn(9, mx(this.shake, amount)); this.shakeD = decay || 5; },
  get cx() { return fl(this.x + this.ox); },
  get cy() { return fl(this.y + this.oy); }
};

  const mxp = fl(74 - cx * 0.022), myp = fl(20 - cy * 0.02);
  ctx.drawImage(moonCv, mxp, myp);

  for (let i = 3; i >= 1; i--) {

    ell(ctx, mxp + 26, myp + 26, 26 + i * 7, 26 + i * 7, '#7d8698');
  }
  ctx.globalAlpha = 1;
  /* clouds crossing the moon */
  for (const c of clouds) {
    let x = -((c.x + WT * c.sp + cx * c.plx) % (c.cv.width + VW));
    for (let k = 0; k < 3; k++) {

  const drawTiled = (cv, plx, y, alpha) => {
    const w = cv.width;

    if (alpha) ctx.globalAlpha = alpha;
    for (let x = off - w; x < VW + w; x += w) ctx.drawImage(cv, fl(x), fl(y - cy * plx * 0.5));
    ctx.globalAlpha = 1;
  };
  drawTiled(mtFar, 0.10, 66, 0.88);

    if (sx > VW + 20 || sx + cvp.width < -20) continue;
    ctx.globalAlpha = 0.78;

function drawPits() {

    const x0 = fl(p.x0 - cx), x1 = fl(p.x1 - cx);
    if (x1 < -8 || x0 > VW + 8) continue;
    const w = x1 - x0, ty = fl(top - cy);
    /* layered darkness receding into the depths */
    r(ctx, x0, ty, w, VH - ty, '#0a0c10');
    r(ctx, x0 + 2, ty + 4, w - 4, VH - ty, '#07080b');
    r(ctx, x0 + 5, ty + 12, w - 10, VH - ty, '#040507');
    /* vertical depth lines on the shaft walls */
    for (let i = 0; i < w; i += 5) {
      const d = 10 + fl(hn(p.x0 + i, 3, 77) * 26);
      ra(ctx, x0 + i, ty + 2, 1, d, '#151a22', 0.5);
    }
    /* wet ledges clinging to the walls */
    for (let i = 0; i < 4; i++) {
      const yy = ty + 8 + i * 13, ww = 3 + fl(hn(p.x0, i, 78) * 4);
      ra(ctx, x0 + 1, yy, ww, 2, '#1b2028', 0.7);
      ra(ctx, x1 - 1 - ww, yy + 5, ww, 2, '#161b23', 0.7);
    }
    /* iron spikes at the bottom of the shaft */
    const sy = fl(top - cy) + 54;
    if (sy < VH + 10) for (let i = 2; i < w - 2; i += 6) {
      const h = 8 + fl(hn(p.x0 + i, 5, 79) * 7);
      for (let j = 0; j < h; j++) {
        const ww2 = mx(1, fl((1 - j / h) * 3));
        ra(ctx, x0 + i - (ww2 >> 1) + 1, sy + h - j, ww2, 1, j > h * 0.7 ? '#2a3039' : '#1a1f26', 0.9);
      }
      ra(ctx, x0 + i, sy + 1, 1, 1, P.stnLt, 0.5);
    }
    /* the mouth of the pit catches a little moonlight */
    ra(ctx, x0, ty, w, 1, '#2e3540', 0.5);
    ra(ctx, x0, ty + 1, 2, 3, '#20262e', 0.6);
    ra(ctx, x1 - 2, ty + 1, 2, 3, '#20262e', 0.6);

    if (Math.random() < 0.06) PS.spawn({
      x: p.x0 + Math.random() * (p.x1 - p.x0), y: top + 6, vx: rnd(-3, 3), vy: rnd(5, 16),

    });
  }

/* ---- the arena: bigger blocks, iron, royal ruin ---- */
let arenaCv = null;
function buildArena() {
  const W = 880, H = 210, cv = mkcv(W, H), g = gc(cv);
  const pal = { hi: '#4b515b', lt: '#383e47', base: '#2a2f36', m: '#21262c', d: '#181c22', s: '#101318', x: '#090b0f' };
  /* rear wall of great blocks */
  for (let ry = 0; ry * 14 < H; ry++) {
    const yy = ry * 14, off = (ry % 2) * 17;
    let bx = -off;
    while (bx < W) {
      const bw = 26 + fl(hn(bx, ry, 91) * 14);
      const rr = hn(bx + 5, ry, 93);
      let base = rr > 0.85 ? pal.m : (rr < 0.15 ? pal.lt : pal.base);
      for (let j = 0; j < 14 && yy + j < H; j++) for (let i = 0; i < bw && bx + i < W; i++) {
        if (bx + i < 0) continue;
        let col = base;
        if (j === 0) col = pal.lt; else if (j === 13) col = pal.x;
        else if (i === 0 || i === bw - 1) col = pal.d;
        else if (j === 1) col = mixc(base, pal.hi, 0.3);
        else if (j > 11) col = pal.s;
        const n = hn(bx + i, yy + j, 95);
        if (n > 0.97) col = pal.hi; else if (n < 0.03) col = pal.x;
        g.fillStyle = col; g.fillRect(bx + i, yy + j, 1, 1);
      }
      bx += bw;
    }
  }
  /* iron reinforcement bands */
  for (const by of [46, 122]) {
    r(g, 0, by, W, 5, P.stlD); r(g, 0, by, W, 1, P.stlM); r(g, 0, by + 4, W, 1, P.stlX);
    for (let x = 8; x < W; x += 26) { px(g, x, by + 1, P.stlLt); px(g, x, by + 3, P.stlS); }
    for (let x = 20; x < W; x += 53) if (hn(x, by, 97) > 0.5) px(g, x, by + 2, P.rust);
  }
  /* damaged carvings — a frieze of crowned skulls */
  for (let i = 0; i < 9; i++) {
    const x = 40 + i * 84, y = 74;
    if (hn(i, 1, 99) > 0.75) continue;
    dome(g, x, y, 8, 8, { hi: pal.lt, base: pal.m, sh: pal.x }, -0.5, -0.8);
    r(g, x - 4, y - 1, 3, 3, pal.x); r(g, x + 2, y - 1, 3, 3, pal.x);
    r(g, x - 3, y + 4, 7, 2, pal.x);
    for (let k = -2; k <= 2; k++) r(g, x + k * 3, y - 10, 2, 4, hn(i, k, 101) > 0.3 ? P.gldS : pal.d);
    r(g, x - 8, y - 7, 17, 2, P.gldS);
    /* gouges hacked into the stone */
    if (hn(i, 2, 103) > 0.5) { for (let k = 0; k < 6; k++) px(g, x - 5 + k, y - 3 + k, pal.x); }
  }
  /* crimson drapes, torn */
  for (const dx of [110, 300, 470, 660, 806]) {
    for (let x = 0; x < 22; x++) {
      const L = 70 + fl(hn(dx + x, 3, 105) * 26) - (x > 16 ? 26 : 0);
      for (let y = 0; y < L; y++) {
        if (hn(dx + x, y, 107) > 0.95) continue;
        const f2 = sin(x * 0.8 + y * 0.03);
        let col = f2 > 0.5 ? P.clD : (f2 < -0.5 ? P.clS : mixc(P.clD, P.clS, 0.5));
        if (y > L - 4) col = P.clS;
        g.fillStyle = col; g.fillRect(dx + x, 12 + y, 1, 1);
      }
    }
    r(g, dx - 2, 8, 26, 4, P.stlD); r(g, dx - 2, 8, 26, 1, P.stlM);
    for (let x = 0; x < 22; x += 6) px(g, dx + x, 10, P.gldD);
  }
  /* scorch marks and old green stains near the floor */
  addStain(g, 0, H - 40, W, 34, 111, '#0a0c10');
  for (const sx of [200, 420, 600, 780]) addStain(g, sx, H - 26, 60, 22, 113, P.gobBlD);
  /* the hall swallows light towards the floor and the corners */
  for (let y = 0; y < H; y++) {
    const a = clamp((y - 90) / 120, 0, 1) * 0.55;
    if (a > 0.01) ra(g, 0, y, W, 1, '#04060a', a);
  }
  for (let x = 0; x < W; x++) {
    const e = mx(0, 1 - x / 90) + mx(0, 1 - (W - x) / 90);
    if (e > 0.02) ra(g, x, 0, 1, H, '#04060a', mn(0.6, e * 0.5));
  }
  arenaCv = cv;
}
