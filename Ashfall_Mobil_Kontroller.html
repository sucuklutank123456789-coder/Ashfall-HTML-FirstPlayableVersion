/* ---------------------------------------------------------------------
   15.  THE PLAYER
   --------------------------------------------------------------------- */
const PLC = {
  runSpeed: 136, accel: 940, friction: 1400, airAccel: 560,
  gravity: 980, jumpV: -348, maxFall: 460,
  w: 13, h: 44,
  maxHp: 120, maxStam: 100, stamRegen: 30, stamDelay: 0.42,
  rollSpeed: 210, rollIFrames: [0.06, 0.34], rollDur: 0.46, rollCost: 22,
  lightCost: 11, heavyCost: 25, blockCost: 13,
  parryWindow: 0.19, coyote: 0.10, buffer: 0.14,
  flasks: 4, flaskHeal: 45
};
const PL = {
  x: 60, y: GY, vx: 0, vy: 0, face: 1, onGround: true, coyote: 0,
  hp: PLC.maxHp, stam: PLC.maxStam, stamCd: 0, flasks: PLC.flasks,
  state: 'idle', st: 0, anim: 'idle', at: 0, frame: 0,
  iTime: 0, hurtT: 0, dead: false, deadT: 0, blockHold: false, parryT: 0,
  hitDone: false, combo: 0, comboT: 0, capeK: 0, capeV: 0, lastGround: 60,
  landForce: 0, flashT: 0, stepPhase: 0, hitCount: 0,
  attackDamageDealt: false, guardBreak: 0, healT: 0, respawnT: 0,
  reset() {
    this.x = 60; this.y = GY; this.vx = 0; this.vy = 0; this.face = 1; this.onGround = true;
    this.hp = PLC.maxHp; this.stam = PLC.maxStam; this.flasks = PLC.flasks;
    this.state = 'idle'; this.st = 0; this.anim = 'idle'; this.at = 0; this.frame = 0;
    this.iTime = 0; this.dead = false; this.deadT = 0; this.combo = 0; this.capeK = 0; this.capeV = 0;
    this.flashT = 0; this.guardBreak = 0; this.healT = 0; this.respawnT = 0; this.parryT = 0;
  },
  get cx() { return this.x; },
  get cy() { return this.y - PLC.h * 0.5; },
  hurtBox() { return { x0: this.x - 7, y0: this.y - 42, x1: this.x + 7, y1: this.y - 1 }; }
};

function plSet(state, anim) {
  PL.state = state; PL.st = 0;
  if (anim !== undefined) { PL.anim = anim; PL.at = 0; PL.frame = 0; }
}
function plCanAct() {
  return !PL.dead && PL.state !== 'roll' && PL.state !== 'atk1' && PL.state !== 'atk1b' &&
    PL.state !== 'atk2' && PL.state !== 'hurt' && PL.state !== 'parry' && PL.state !== 'drink' &&
    PL.state !== 'guardbreak';
}
function plSpend(n) { PL.stam = mx(0, PL.stam - n); PL.stamCd = PLC.stamDelay; }

function plUpdate(dt) {
  const p = PL;
  if (p.dead) {
    p.deadT += dt;
    p.at += dt;
    p.frame = mn(KA.death.n - 1, fl(p.at / KA.death.dur * KA.death.n));
    p.vx *= 0.86; p.x += p.vx * dt;
    p.vy = mn(PLC.maxFall, p.vy + PLC.gravity * dt); p.y += p.vy * dt;
    const g0 = groundAt(p.x, p.y);
    if (g0 !== null && p.y > g0) { p.y = g0; p.vy = 0; }
    return;
  }
  p.st += dt; p.at += dt;
  if (p.iTime > 0) p.iTime -= dt;
  if (p.flashT > 0) p.flashT -= dt;
  if (p.parryT > 0) p.parryT -= dt;
  if (p.comboT > 0) p.comboT -= dt; else p.combo = 0;
  if (p.stamCd > 0) p.stamCd -= dt;
  else p.stam = mn(PLC.maxStam, p.stam + PLC.stamRegen * (p.state === 'block' ? 0.35 : 1) * dt);

  const wantLeft = IN.held.left, wantRight = IN.held.right;
  let dir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);

  /* ---- action inputs ---- */
  if (plCanAct()) {
    if (IN.consume('roll') && p.stam >= PLC.rollCost && p.onGround) {
      plSet('roll', 'roll'); AUD.roll(); plSpend(PLC.rollCost);
      p.face = dir !== 0 ? dir : p.face;
      p.vx = p.face * PLC.rollSpeed;
      p.iTime = 0;
    } else if (IN.consume('flask') && p.flasks > 0 && p.onGround && p.hp < PLC.maxHp) {
      plSet('drink', 'drink'); p.flasks--; p.healT = 0; AUD.flask();
    } else if (IN.consume('heavy') && p.stam >= PLC.heavyCost) {
      plSet('atk2', 'atk2'); AUD.swingHeavy(); plSpend(PLC.heavyCost);
      p.hitDone = false; if (dir !== 0) p.face = dir;
      p.vx += p.face * 26;
    } else if (IN.consume('light') && p.stam >= PLC.lightCost) {
      const b = p.combo === 1;
      plSet(b ? 'atk1b' : 'atk1', b ? 'atk1b' : 'atk1');
      AUD.swing(); plSpend(PLC.lightCost);
      p.hitDone = false; p.combo = b ? 0 : 1; p.comboT = 0.55;
      if (dir !== 0) p.face = dir;
      p.vx += p.face * 34;
    } else if (IN.consume('jump') && (p.onGround || p.coyote > 0)) {
      p.vy = PLC.jumpV; p.onGround = false; p.coyote = 0;
      plSet('jump', 'jump'); AUD.jump();
      FX.jumpDust(p.x, p.y);
    }
  }
  /* guard is a hold; a fresh press opens the parry window */
  const guardWanted = IN.held.guard && p.onGround && plCanAct() && p.stam > 4;
  if (guardWanted && p.state !== 'block' && p.state !== 'parry') {
    plSet('block', 'block'); p.parryT = PLC.parryWindow;
  } else if (!guardWanted && (p.state === 'block')) {
    plSet('idle', 'idle');
  }

  /* ---- state behaviour ---- */
  const A = KA[p.anim];
  let allowMove = true, spd = PLC.runSpeed;
  switch (p.state) {
    case 'roll': {
      allowMove = false;
      const t = p.st / PLC.rollDur;
      p.iTime = (t > PLC.rollIFrames[0] / PLC.rollDur && t < PLC.rollIFrames[1] / PLC.rollDur) ? 0.02 : p.iTime;
      p.vx = p.face * PLC.rollSpeed * (1 - eIn(clamp(t, 0, 1)) * 0.55);
      if (p.onGround && (p.st % 0.07) < dt) FX.rollDust(p.x, p.y, p.face);
      if (p.st >= PLC.rollDur) { plSet(guardWanted ? 'block' : 'idle', guardWanted ? 'block' : 'idle'); }
      break;
    }
    case 'atk1': case 'atk1b': case 'atk2': {
      allowMove = false;
      const dur = A.dur;
      const t = p.st / dur;
      p.vx *= Math.pow(0.02, dt);
      /* the heavy swing drags the body forward through the impact */
      if (p.state === 'atk2' && t > 0.52 && t < 0.66 && p.onGround) p.vx += p.face * 300 * dt;
      const fi = fl(t * A.n);
      if (A.hit && A.hit.indexOf(fi) >= 0 && !p.hitDone) plStrike(p.state === 'atk2');
      if (fi === (A.hit ? A.hit[0] : 99) && p.st - dt < A.hit[0] / A.n * dur) {
        const ang = p.state === 'atk2' ? -0.5 : (p.state === 'atk1b' ? -1.1 : 0.2);
        if (p.state === 'atk2') FX.swingHeavy(p.x + p.face * 14, p.y - 28, p.face, ang);
        else FX.swingLight(p.x + p.face * 12, p.y - 26, p.face, ang);
      }
      if (p.st >= dur) plSet('idle', 'idle');
      break;
    }
    case 'block': {
      allowMove = true; spd = 42;
      break;
    }
    case 'parry': {
      allowMove = false; p.vx *= Math.pow(0.01, dt);
      if (p.st >= KA.parry.dur) plSet(IN.held.guard ? 'block' : 'idle', IN.held.guard ? 'block' : 'idle');
      break;
    }
    case 'hurt': {
      allowMove = false; p.vx *= Math.pow(0.06, dt);
      if (p.st >= KA.hurt.dur) plSet('idle', 'idle');
      break;
    }
    case 'guardbreak': {
      allowMove = false; p.vx *= Math.pow(0.05, dt);
      if (p.st >= 0.62) plSet('idle', 'idle');
      break;
    }
    case 'drink': {
      allowMove = false; p.vx *= Math.pow(0.02, dt);
      p.healT += dt;
      if (p.healT > 0.22 && p.healT - dt <= 0.22) {
        p.hp = mn(PLC.maxHp, p.hp + PLC.flaskHeal);
        for (let i = 0; i < 10; i++) PS.spawn({
          x: p.x + rnd(-6, 6), y: p.y - rnd(8, 34), vx: rnd(-12, 12), vy: rnd(-26, -6),
          life: rnd(0.4, 0.8), size: 1, col: i % 2 ? P.gldHi : P.gld, alpha: 0.7,
          drag: 0.05, shape: 0, layer: L_COMBAT, add: true
        });
      }
      if (p.st >= KA.drink.dur) plSet('idle', 'idle');
      break;
    }
  }

  /* ---- horizontal motion ---- */
  if (allowMove && dir !== 0) {
    if (p.state !== 'block') p.face = dir;
    const a = (p.onGround ? PLC.accel : PLC.airAccel) * dt;
    p.vx += dir * a;
    p.vx = clamp(p.vx, -spd, spd);
  } else if (allowMove) {
    const f = (p.onGround ? PLC.friction : 240) * dt;
    if (p.vx > 0) p.vx = mx(0, p.vx - f); else p.vx = mn(0, p.vx + f);
  }
  /* ---- gravity + integration ---- */
  p.vy = mn(PLC.maxFall, p.vy + PLC.gravity * dt);
  const prevY = p.y;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  /* arena confinement */
  if (GAME.arenaLocked) p.x = clamp(p.x, LV.arenaX0 + 34, LV.arenaX1 - 10);
  p.x = clamp(p.x, 6, LV.w - 8);

  /* ---- collisions ---- */
  let landed = false;
  p.onGround = false;
  for (const pl of LV.plats) {
    if (p.x + 6 < pl.x || p.x - 6 > pl.x + pl.w) continue;
    /* landing on top */
    if (p.vy >= 0 && prevY <= pl.y + 1 && p.y >= pl.y) {
      p.y = pl.y; p.vy = 0; p.onGround = true; landed = true; break;
    }
    /* standing inside (walked into a step) */
    if (p.y > pl.y && p.y - PLC.h < pl.y + pl.h && prevY > pl.y) {
      /* push out sideways from a wall */
      const cxp = p.x, left = pl.x, right = pl.x + pl.w;
      if (p.y - PLC.h * 0.4 > pl.y) {
        if (cxp < left + pl.w * 0.5) { p.x = mn(p.x, left - 7); } else { p.x = mx(p.x, right + 7); }
        p.vx = 0;
      }
    }
  }
  if (p.onGround) {
    p.coyote = PLC.coyote;
    p.lastGround = p.x;
    if (!landed) { }
  } else {
    p.coyote = mx(0, p.coyote - dt);
  }
  /* landing feedback */
  if (landed && (p.state === 'fall' || p.state === 'jump')) {
    const force = clamp(p.landForce / 420, 0, 1);
    FX.landDust(p.x, p.y, force);
    AUD.land(force);
    if (force > 0.55) CAM.kick(1.6 + force * 1.6, 8);
    plSet('land', 'land');
  }
  p.landForce = p.vy;
  /* airborne state */
  if (!p.onGround && (p.state === 'idle' || p.state === 'run' || p.state === 'land' || p.state === 'block')) {
    plSet('fall', 'fall');
  }
  if (p.state === 'jump' && p.vy > 20) plSet('fall', 'fall');
  if (p.state === 'land' && p.st >= KA.land.dur) plSet('idle', 'idle');
  /* ground locomotion state */
  if (p.onGround && (p.state === 'idle' || p.state === 'run')) {
    const moving = ab(p.vx) > 12 && dir !== 0;
    if (moving && p.state !== 'run') plSet('run', 'run');
    else if (!moving && p.state !== 'idle') plSet('idle', p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle');
    if (!moving && p.anim === 'idle' && p.hp < PLC.maxHp * 0.3) { p.anim = 'idleW'; }
    if (!moving && p.anim === 'idleW' && p.hp >= PLC.maxHp * 0.3) { p.anim = 'idle'; }
  }
  /* pit */
  if (p.y > VH + 90) {
    p.hp -= 34; p.flashT = 0.32; AUD.hurt(); CAM.kick(3, 6);
    if (p.hp <= 0) { plDie(); return; }
    const gx = p.lastGround;
    p.x = gx; p.y = (groundAt(gx, 0) || GY) - 2; p.vy = 0; p.vx = 0;
    p.iTime = 1.1; plSet('land', 'land');
  }

  /* ---- animation clock ---- */
  const AA = KA[p.anim];
  if (AA) {
    if (p.anim === 'run') p.at += ab(p.vx) / PLC.runSpeed * dt * 0.55;
    let tt = p.at / AA.dur;
    if (AA.loop) { tt = tt % 1; p.frame = fl(tt * AA.n) % AA.n; }
    else p.frame = mn(AA.n - 1, fl(clamp(tt, 0, 1) * AA.n));
    if (p.anim === 'roll') p.frame = mn(5, fl(p.st / PLC.rollDur * 6));
    /* footfall dust on the two contact frames */
    if (p.anim === 'run' && p.onGround) {
      const f2 = p.frame;
      if ((f2 === 2 || f2 === 6) && p.stepPhase !== f2) {
        FX.footDust(p.x - p.face * 3, p.y, p.face, ab(p.vx));
        AUD.step();
      }
      if (p.stepPhase !== f2) p.stepPhase = f2;
    }
  }
  /* ---- cape lag ---- */
  const targetK = (KA[p.anim] && KA[p.anim].cape !== undefined ? KA[p.anim].cape : 0)
    - clamp(p.vx * p.face / PLC.runSpeed, -1, 1) * 0.55
    + clamp(-p.vy / 300, -0.6, 0.9);
  p.capeV += (targetK - p.capeK) * 26 * dt;
  p.capeV *= Math.pow(0.0006, dt);
  p.capeK = clamp(p.capeK + p.capeV * dt, -1, 1);
}

function plDie() {
  if (PL.dead) return;
  PL.dead = true; PL.deadT = 0; PL.at = 0; PL.anim = 'death'; PL.state = 'death';
  PL.vx = -PL.face * 40; PL.vy = -80;
  AUD.die(); AUD.stopMusic();
  FX.blood(PL.x, PL.y - 26, -PL.face, 14, P.bld);
  CAM.kick(4, 4);
  GAME.deathT = 0;
}

/* the player's own strike */
function plStrike(heavy) {
  const p = PL;
  p.hitDone = true;
  const box = heavy
    ? { x0: 2, y0: -46, x1: 40, y1: -4 }
    : (p.state === 'atk1b' ? { x0: 2, y0: -42, x1: 32, y1: -8 } : { x0: 2, y0: -38, x1: 32, y1: -10 });
  const wx0 = p.face > 0 ? p.x + box.x0 : p.x - box.x1;
  const wx1 = p.face > 0 ? p.x + box.x1 : p.x - box.x0;
  const wy0 = p.y + box.y0, wy1 = p.y + box.y1;
  let hitAny = false;
  const dmg = heavy ? 30 : 13;
  for (const e of EN) {
    if (e.dead) continue;
    const hb = e.hurtBox();
    if (hb.x1 < wx0 || hb.x0 > wx1 || hb.y1 < wy0 || hb.y0 > wy1) continue;
    const hx = clamp((wx0 + wx1) * 0.5, hb.x0, hb.x1), hy = clamp((wy0 + wy1) * 0.5, hb.y0, hb.y1);
    enemyHurt(e, dmg, p.face, heavy, hx, hy);
    hitAny = true;
  }
  if (BOSS.active && !BOSS.dead) {
    const hb = bossHurtBox();
    if (!(hb.x1 < wx0 || hb.x0 > wx1 || hb.y1 < wy0 || hb.y0 > wy1)) {
      const hx = clamp((wx0 + wx1) * 0.5, hb.x0, hb.x1), hy = clamp((wy0 + wy1) * 0.5, hb.y0, hb.y1);
      bossHurt(dmg, p.face, heavy, hx, hy);
      hitAny = true;
    }
  }
  if (hitAny) {
    GAME.hitstop = mx(GAME.hitstop, heavy ? 0.11 : 0.055);
    CAM.kick(heavy ? 3.0 : 1.5, heavy ? 7 : 9);
    p.stam = mn(PLC.maxStam, p.stam + (heavy ? 6 : 3));
  } else {
    /* whiff — a few motes of disturbed dust only */
    if (heavy) FX.dust(p.x + p.face * 22, p.y - 30, 2, 8, 6, P.stnLt);
  }
}

/* damage taken by the player, routed through guard / parry / i-frames */
function damagePlayer(amount, srcX, kind, contactY) {
  const p = PL;
  if (p.dead || p.iTime > 0) {
    if (p.state === 'roll') FX.afterimage(p.x, p.y, p.face);
    return 'dodge';
  }
  const fromFront = (srcX - p.x) * p.face > -4;
  const cy2 = contactY === undefined ? p.y - 26 : contactY;
  const cxp = p.x + p.face * 11;
  if ((p.state === 'block' || p.state === 'parry') && fromFront) {
    if (p.parryT > 0) {
      /* ---- PARRY ---- */
      plSet('parry', 'parry');
      p.parryT = 0; p.iTime = 0.30;
      FX.parryBurst(cxp, cy2, p.face);
      AUD.parry();
      GAME.hitstop = mx(GAME.hitstop, 0.16);
      GAME.parryFlash = 0.24;
      CAM.kick(4.2, 7);
      p.stam = mn(PLC.maxStam, p.stam + 26);
      return 'parry';
    }
    /* ---- BLOCK ---- */
    const cost = PLC.blockCost + amount * 0.55;
    plSpend(cost);
    FX.blockSparks(cxp, cy2, p.face);
    AUD.block();
    CAM.kick(1.5, 9);
    GAME.hitstop = mx(GAME.hitstop, 0.045);
    p.vx += (p.x - srcX > 0 ? 1 : -1) * 46;
    if (p.stam <= 0) {
      plSet('guardbreak', 'hurt');
      p.hp -= amount * 0.30; p.flashT = 0.32; p.iTime = 0.2;
      AUD.hurt(); CAM.kick(3, 6);
      if (p.hp <= 0) plDie();
      return 'break';
    }
    p.hp -= amount * 0.12;
    if (p.hp <= 0) plDie();
    return 'block';
  }
  /* ---- clean hit ---- */
  p.hp -= amount;
  p.flashT = 0.32; p.iTime = 0.62;
  plSet('hurt', 'hurt');
  p.vx = (p.x - srcX > 0 ? 1 : -1) * 120;
  p.vy = mn(p.vy, -70);
  FX.blood(p.x, p.y - 26, p.x - srcX > 0 ? 1 : -1, 8, P.bld);
  AUD.hurt();
  CAM.kick(3.4, 6);
  GAME.hitstop = mx(GAME.hitstop, 0.07);
  GAME.damageFlash = 0.32;
  if (p.hp <= 0) plDie();
  return 'hit';
}

/* ---------------------------------------------------------------------
   16.  GOBLINS
   --------------------------------------------------------------------- */
const EN = [];
const ETUNE = {
  grunt: { hp: 42, spd: 58, chase: 200, atkRange: 27, wind: 0.42, dmg: 12, poise: 0, cd: [0.55, 1.1], w: 11, h: 30 },
  thrower: { hp: 30, spd: 48, chase: 300, atkRange: 150, wind: 0.30, dmg: 10, poise: 0, cd: [1.1, 1.8], w: 10, h: 28 },
  brute: { hp: 88, spd: 46, chase: 230, atkRange: 34, wind: 0.52, dmg: 20, poise: 1, cd: [0.9, 1.6], w: 15, h: 39 }
};
function spawnEnemy(t, x, y) {
  const T = ETUNE[t];
  const e = {
    t: t, x: x, y: y === undefined ? GY : y, vx: 0, vy: 0, face: -1,
    hp: T.hp, maxHp: T.hp, state: 'idle', st: 0, anim: 'idle', at: 0, frame: 0,
    dead: false, deadT: 0, alerted: false, cd: rnd(0.3, 1), hitDone: false,
    flashT: 0, onGround: true, home: x, patrolDir: -1, patrolT: rnd(0, 2),
    guardT: 0, stagger: 0, fade: 1,
    hurtBox() { return { x0: this.x - T.w * 0.5, y0: this.y - T.h, x1: this.x + T.w * 0.5, y1: this.y - 1 }; }
  };
  EN.push(e);
  return e;
}
function eSet(e, s, a) { e.state = s; e.st = 0; if (a !== undefined) { e.anim = a; e.at = 0; e.frame = 0; } }

function enemyUpdate(e, dt) {
  const T = ETUNE[e.t];
  e.st += dt; e.at += dt;
  if (e.flashT > 0) e.flashT -= dt;
  if (e.dead) {
    e.deadT += dt;
    e.frame = mn(GA.die.n - 1, fl(e.deadT / GA.die.dur * GA.die.n));
    e.vx *= Math.pow(0.02, dt);
    e.vy = mn(400, e.vy + PLC.gravity * dt);
    e.x += e.vx * dt; e.y += e.vy * dt;
    const g0 = groundAt(e.x, e.y); if (g0 !== null && e.y > g0) { e.y = g0; e.vy = 0; }
    if (e.deadT > 1.5) e.fade = mx(0, 1 - (e.deadT - 1.5) / 0.8);
    return;
  }
  const dx = PL.x - e.x, dy = PL.y - e.y, adx = ab(dx);
  const sameLevel = ab(dy) < 46;
  if (!e.alerted && adx < T.chase && sameLevel && !PL.dead) {
    e.alerted = true; AUD.gobAlert();
    eSet(e, 'idle', 'idle');
  }
  if (e.cd > 0) e.cd -= dt;

  let move = 0;
  switch (e.state) {
    case 'idle': {
      if (e.alerted && !PL.dead) {
        if (e.t === 'thrower') {
          if (adx < 82 && sameLevel) { move = -Math.sign(dx); e.face = Math.sign(dx) || e.face; }
          else if (adx > 175 || !sameLevel) { move = Math.sign(dx); e.face = move; }
          else { e.face = Math.sign(dx) || e.face; if (e.cd <= 0) { eSet(e, 'throwWind', 'throw'); } }
        } else {
          e.face = Math.sign(dx) || e.face;
          if (adx > T.atkRange) move = Math.sign(dx);
          else if (e.cd <= 0) {
            if (e.t === 'brute' && Math.random() < 0.24) { eSet(e, 'guard', 'guard'); e.guardT = rnd(0.5, 1.0); }
            else eSet(e, 'wind', 'wind');
          }
        }
      } else {
        /* idle patrol along the ledge */
        e.patrolT -= dt;
        if (e.patrolT <= 0) { e.patrolT = rnd(1.4, 3.2); e.patrolDir = Math.random() < 0.5 ? -1 : (Math.random() < 0.5 ? 0 : 1); }
        move = e.patrolDir * 0.42;
        if (move !== 0) e.face = Math.sign(move);
      }
      break;
    }
    case 'wind': {
      if (e.st >= GA.wind.dur) { eSet(e, 'atk', 'atk'); e.hitDone = false; }
      break;
    }
    case 'atk': {
      const fi = fl(e.st / GA.atk.dur * GA.atk.n);
      if ((fi === 1 || fi === 2) && !e.hitDone) {
        e.hitDone = true;
        const box = e.t === 'brute' ? [4, -34, 36, 2] : [4, -24, 28, -1];
        const wx0 = e.face > 0 ? e.x + box[0] : e.x - box[2];
        const wx1 = e.face > 0 ? e.x + box[2] : e.x - box[0];
        const hb = PL.hurtBox();
        if (!(hb.x1 < wx0 || hb.x0 > wx1 || hb.y1 < e.y + box[1] || hb.y0 > e.y + box[3])) {
          const res = damagePlayer(T.dmg, e.x, 'melee', e.y - 22);
          if (res === 'parry') { eSet(e, 'hurt', 'hurt'); e.stagger = 1.0; e.vx = -e.face * 100; enemyHurt(e, 6, PL.face, false, e.x, e.y - 16); }
        }
        AUD.swing();
        FX.dust(e.x + e.face * 18, e.y - 12, 2, 10, 8, P.stnLt);
      }
      if (e.st >= GA.atk.dur) { eSet(e, 'idle', 'idle'); e.cd = rnd(T.cd[0], T.cd[1]); }
      break;
    }
    case 'throwWind': {
      const fi = fl(e.st / GA.throw.dur * GA.throw.n);
      if (fi >= 3 && !e.hitDone) {
        e.hitDone = true;
        const tx = PL.x - e.x, ty = (PL.y - 24) - (e.y - 20);
        const d = mx(30, hyp(tx, ty));
        spawnDagger(e.x + e.face * 8, e.y - 20, (tx / d) * 190, (ty / d) * 190 - 22, e);
        AUD.dagger();
      }
      if (e.st >= GA.throw.dur) { eSet(e, 'idle', 'idle'); e.cd = rnd(T.cd[0], T.cd[1]); e.hitDone = false; }
      break;
    }
    case 'guard': {
      e.guardT -= dt;
      e.face = Math.sign(dx) || e.face;
      if (e.guardT <= 0) { eSet(e, 'idle', 'idle'); e.cd = 0.15; }
      break;
    }
    case 'hurt': {
      if (e.st >= GA.hurt.dur) { eSet(e, 'idle', 'idle'); e.cd = mx(e.cd, 0.24); }
      break;
    }
  }
  /* ---- motion ---- */
  const spd = T.spd * (e.state === 'idle' ? 1 : 0.2);
  if (move !== 0 && (e.state === 'idle')) {
    e.vx += move * 800 * dt;
    e.vx = clamp(e.vx, -spd, spd);
    /* do not walk off a ledge or into a pit */
    const ahead = e.x + Math.sign(move) * 12;
    const gA = groundAt(ahead, e.y - 4);
    if (gA === null || ab(gA - e.y) > 20) { e.vx = 0; if (!e.alerted) e.patrolDir *= -1; }
  } else {
    e.vx *= Math.pow(0.0008, dt);
  }
  e.vy = mn(460, e.vy + PLC.gravity * dt);
  const prevY = e.y;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.onGround = false;
  for (const pl of LV.plats) {
    if (e.x + 5 < pl.x || e.x - 5 > pl.x + pl.w) continue;
    if (e.vy >= 0 && prevY <= pl.y + 1 && e.y >= pl.y) { e.y = pl.y; e.vy = 0; e.onGround = true; break; }
  }
  if (e.y > VH + 140) { e.dead = true; e.deadT = 2.2; }
  /* ---- anim ---- */
  let want = e.anim;
  if (e.state === 'idle') want = ab(e.vx) > 12 ? (e.alerted ? 'run' : 'walk') : 'idle';
  else if (e.state === 'wind') want = 'wind';
  else if (e.state === 'atk') want = 'atk';
  else if (e.state === 'throwWind') want = 'throw';
  else if (e.state === 'guard') want = 'guard';
  else if (e.state === 'hurt') want = 'hurt';
  if (want !== e.anim) { e.anim = want; e.at = 0; }
  const A = GA[e.anim];
  let tt = (e.state === 'idle' ? e.at : e.st) / A.dur;
  if (A.loop) { tt = tt % 1; e.frame = fl(tt * A.n) % A.n; }
  else e.frame = mn(A.n - 1, fl(clamp(tt, 0, 1) * A.n));
  /* footfalls kick a little grit */
  if ((e.anim === 'run') && e.onGround && (e.frame === 1 || e.frame === 4)) {
    if (Math.random() < 0.35) FX.footDust(e.x, e.y, e.face, ab(e.vx) * 0.7);
  }
}

function enemyHurt(e, dmg, dir, heavy, hx, hy) {
  if (e.dead) return;
  /* the brute's guard turns aside light blows */
  if (e.state === 'guard' && (e.face * dir < 0) && !heavy) {
    FX.blockSparks(e.x + e.face * 10, e.y - 20, e.face);
    AUD.block(); e.vx = dir * 40;
    return;
  }
  e.hp -= dmg; e.flashT = 0.09;
  const T = ETUNE[e.t];
  if (heavy) FX.hitHeavy(hx, hy, dir, P.gobBl); else FX.hitLight(hx, hy, dir, P.gobBl);
  if (e.hp <= 0) {
    e.dead = true; e.deadT = 0; e.anim = 'die'; e.frame = 0;
    e.vx = dir * (heavy ? 150 : 80); e.vy = -110;
    FX.gobDeath(e.x, e.y - T.h * 0.5, dir);
    AUD.gobDie();
    GAME.kills++;
    return;
  }
  AUD.gobHurt();
  const flinch = heavy || T.poise === 0;
  if (flinch) {
    eSet(e, 'hurt', 'hurt');
    e.vx = dir * (heavy ? 130 : 70);
    if (heavy) e.vy = -60;
  } else {
    e.vx = dir * 30;
  }
  e.alerted = true;
}

/* ---------------------------------------------------------------------
   17.  THROWN DAGGERS (parry them back at their owner)
   --------------------------------------------------------------------- */
const DAG = [];
function spawnDagger(x, y, vx, vy, owner) {
  DAG.push({ x: x, y: y, vx: vx, vy: vy, rot: 0, life: 4, owner: owner, friendly: false, trailT: 0 });
}
function daggerUpdate(dt) {
  for (let i = DAG.length - 1; i >= 0; i--) {
    const d = DAG[i];
    d.life -= dt;
    d.vy += 190 * dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.rot += (d.vx > 0 ? 1 : -1) * dt * 16;
    let gone = d.life <= 0;
    /* stone */
    if (isSolidAt(d.x, d.y)) {
      gone = true;
      FX.stoneBurst(d.x, d.y, 3, 60, 2);
      AUD.daggerHit();
    }
    if (!gone && !d.friendly && !PL.dead) {
      const hb = PL.hurtBox();
      if (d.x > hb.x0 - 3 && d.x < hb.x1 + 3 && d.y > hb.y0 && d.y < hb.y1) {
        const res = damagePlayer(10, d.x, 'proj', d.y);
        if (res === 'parry') {
          d.friendly = true; d.vx = -d.vx * 1.5; d.vy = -ab(d.vy) * 0.3 - 20; d.life = 3;
        } else if (res === 'block') {
          gone = true;
        } else if (res === 'dodge') {
          /* passes through the roll */
        } else gone = true;
      }
    } else if (!gone && d.friendly) {
      for (const e of EN) {
        if (e.dead) continue;
        const hb = e.hurtBox();
        if (d.x > hb.x0 && d.x < hb.x1 && d.y > hb.y0 && d.y < hb.y1) {
          enemyHurt(e, 36, Math.sign(d.vx) || 1, true, d.x, d.y);
          gone = true; GAME.reflectKills++;
          break;
        }
      }
      if (!gone && BOSS.active && !BOSS.dead) {
        const hb = bossHurtBox();
        if (d.x > hb.x0 && d.x < hb.x1 && d.y > hb.y0 && d.y < hb.y1) { bossHurt(30, Math.sign(d.vx) || 1, true, d.x, d.y); gone = true; }
      }
    }
    if (gone) { DAG.splice(i, 1); continue; }
    /* faint trail */
    d.trailT -= dt;
    if (d.trailT <= 0) {
      d.trailT = 0.05;
      PS.spawn({
        x: d.x, y: d.y, vx: 0, vy: 0, life: 0.16, size: 1,
        col: d.friendly ? P.gldHi : '#5c6674', alpha: d.friendly ? 0.6 : 0.3,
        shape: 0, layer: L_COMBAT, add: d.friendly
      });
    }
  }
}

/* ---------------------------------------------------------------------
   18.  GRULLK — boss logic
   --------------------------------------------------------------------- */
const BATK = {
  smash: { frames: [5, 6], box: [12, -50, 52, 6], dmg: 30, kb: 190, dur: 1.55 },
  sweep: { frames: [4, 5, 6], box: [2, -28, 62, 6], dmg: 24, kb: 240, dur: 1.30 },
  diag: { frames: [5, 6], box: [8, -60, 54, 6], dmg: 26, kb: 210, dur: 1.25 }
};
const BOSS = {
  active: false, x: 3150, y: GY, vx: 0, vy: 0, face: -1,
  hp: 640, maxHp: 640, hpShown: 640,
  state: 'sleep', st: 0, anim: 'idle', at: 0, frame: 0,
  dead: false, deadT: 0, phase: 1, stagger: 0, staggerMax: 145,
  cd: 0.9, hitDone: false, flashT: 0, stunT: 0, atkKind: '', chain: 0,
  stepPhase: -1, introT: 0, onGround: true, lastFrame: -1,
  reset() {
    this.active = true; this.x = 3150; this.y = GY; this.vx = 0; this.vy = 0; this.face = -1;
    this.hp = this.maxHp; this.hpShown = this.maxHp; this.state = 'sleep'; this.st = 0;
    this.anim = 'idle'; this.at = 0; this.frame = 0; this.dead = false; this.deadT = 0;

};
function bossHurtBox() {

}
function bSet(s, a) { BOSS.state = s; BOSS.st = 0; if (a !== undefined) { BOSS.anim = a; BOSS.at = 0; BOSS.frame = 0; BOSS.lastFrame = -1; } }

function bossHurt(dmg, dir, heavy, hx, hy) {
  const b = BOSS;
  if (b.dead || !b.active) return;
  const mult = b.state === 'stun' ? 1.75 : 1;
  b.hp -= dmg * mult;
  b.flashT = 0.09;
  if (heavy) FX.hitHeavy(hx, hy, dir, P.gobBl); else FX.hitLight(hx, hy, dir, P.gobBl);
  for (let i = 0; i < (heavy ? 3 : 1); i++) PS.spawn({
    x: hx, y: hy, vx: dir * rnd(40, 110), vy: rnd(-70, -10), life: rnd(0.2, 0.4),
    size: 1, col: P.stlHi, alpha: 0.8, grav: 200, shape: 2, len: 4, layer: L_COMBAT, add: true
  });
  AUD.bossHurt();
  if (b.hp <= 0) { bossDie(dir); return; }
  if (b.state !== 'stun') {
    b.stagger += dmg * (heavy ? 1.5 : 1);
    if (b.stagger >= b.staggerMax) bossStun();
    else if (b.state === 'idle' || b.state === 'walk') {
      if (heavy && Math.random() < 0.4) bSet('hurt', 'hurt');
      b.vx = dir * 24;
    }
  }
  if (b.phase === 1 && b.hp <= b.maxHp * 0.5) {
    b.phase = 2; b.stagger = 0; b.staggerMax = 185;
    bSet('roar', 'roar'); AUD.bossRoar(); CAM.kick(4.5, 4);
    GAME.phaseText = 2.4;
    for (let i = 0; i < 16; i++) FX.dust(b.x + rnd(-24, 24), b.y, 1, 40, 30, P.stnLt);
    FX.dustRing(b.x, b.y, 12, 130);
  }
}
function bossStun() {
  const b = BOSS;
  bSet('stun', 'stun');
  b.stunT = 2.7; b.stagger = 0; b.vx = 0;
  AUD.bossHurt(); AUD.tn(90, 40, 0.5, 0.18, 'sine');
  CAM.kick(3, 6);
  FX.dustRing(b.x, b.y, 10, 90);
  for (let i = 0; i < 8; i++) PS.spawn({
    x: b.x + rnd(-14, 14), y: b.y - rnd(40, 80), vx: rnd(-30, 30), vy: rnd(-40, -10),
    life: rnd(0.4, 0.8), size: 1, col: P.gldHi, alpha: 0.7, grav: 90, shape: 0, layer: L_COMBAT, add: true
  });
}
function bossDie(dir) {
  const b = BOSS;
  b.dead = true; b.deadT = 0; bSet('die', 'die'); b.vx = dir * 30;
  AUD.bossDie(); AUD.stopMusic();
  CAM.kick(5, 3.5);
  GAME.hitstop = mx(GAME.hitstop, 0.35);
  /* 25-40 particles across several kinds, not one uniform puff */

function bossUpdate(dt) {
  const b = BOSS;
  if (!b.active) return;
  b.st += dt; b.at += dt;
  if (b.flashT > 0) b.flashT -= dt;
  b.hpShown += (b.hp - b.hpShown) * mn(1, dt * 3.4);

  if (b.dead) {
    b.deadT += dt;
    b.frame = mn(BA.die.n - 1, fl(b.deadT / BA.die.dur * BA.die.n));
    b.vx *= Math.pow(0.05, dt);
    b.x += b.vx * dt;
    /* dust and debris as the body settles */
    if (b.deadT < 2.0 && Math.random() < 0.28) FX.dust(b.x + rnd(-22, 22), b.y, 1, 14, 10, P.stnLt);
    if ((b.deadT > 0.6 && b.deadT - dt <= 0.6) || (b.deadT > 1.5 && b.deadT - dt <= 1.5)) {
      CAM.kick(2.2, 6); FX.stoneBurst(b.x + rnd(-16, 16), b.y, 5, 90, 6); AUD.land(0.9);
    }
    return;
  }

  const dx = PL.x - b.x, adx = ab(dx);
  if (b.cd > 0) b.cd -= dt;

  switch (b.state) {
    case 'intro': {
      b.introT += dt;
      b.frame = mn(BA.roar.n - 1, fl(b.introT / BA.roar.dur * BA.roar.n));
      if (b.introT > 0.15 && b.introT - dt <= 0.15) { AUD.bossRoar(); CAM.kick(3.6, 4); }
      if (b.introT > 0.3 && Math.random() < 0.3) FX.dust(b.x + rnd(-30, 30), b.y, 1, 24, 18, P.stnLt);
      if (b.introT >= BA.roar.dur) { bSet('idle', 'idle'); b.cd = 0.5; }
      break;
    }
    case 'roar': {
      b.frame = mn(BA.roar.n - 1, fl(b.st / BA.roar.dur * BA.roar.n));
      if (b.st >= BA.roar.dur) { bSet('idle', 'idle'); b.cd = 0.35; }
      break;
    }
    case 'stun': {
      b.stunT -= dt;
      if (Math.random() < 0.10) FX.dust(b.x + rnd(-18, 18), b.y, 1, 8, 6, P.stnLt);
      if (b.stunT <= 0) { bSet('idle', 'idle'); b.cd = 0.35; }
      break;
    }
    case 'hurt': {
      if (b.st >= BA.hurt.dur) { bSet('idle', 'idle'); b.cd = mx(b.cd, 0.25); }
      break;
    }
    case 'idle': case 'walk': {
      if (PL.dead) { bSet('idle', 'idle'); break; }
      b.face = dx > 0 ? 1 : -1;
      if (b.cd <= 0) {
        let pick;
        if (adx < 50) pick = Math.random() < 0.55 ? 'sweep' : 'smash';
        else if (adx < 96) pick = Math.random() < 0.45 ? 'smash' : (Math.random() < 0.6 ? 'diag' : 'sweep');
        else if (adx < 190) pick = Math.random() < 0.62 ? 'diag' : 'walk';
        else pick = 'walk';
        if (pick === 'walk') { bSet('walk', 'walk'); b.cd = 0.28; }
        else { bSet(pick, pick); b.atkKind = pick; b.hitDone = false; }
      } else {
        if (adx > 62) bSet(b.state === 'walk' ? 'walk' : 'walk', b.anim === 'walk' ? undefined : 'walk');
        else if (b.anim !== 'idle') bSet('idle', 'idle');
      }
      if (b.state === 'walk') {
        const spd = b.phase === 2 ? 46 : 34;
        b.vx += b.face * 340 * dt;
        b.vx = clamp(b.vx, -spd, spd);
        if (adx < 56) b.vx *= 0.6;
      } else b.vx *= Math.pow(0.004, dt);
      break;
    }
    case 'smash': case 'sweep': case 'diag': {
      const A = BA[b.state], K = BATK[b.state];
      const t = b.st / A.dur;
      const fi = mn(A.n - 1, fl(t * A.n));
      b.frame = fi;
      /* forward drive during the committed part of the swing */
      if (b.state === 'diag' && fi >= 3 && fi <= 5) b.vx += b.face * 420 * dt;
      else if (b.state === 'sweep' && fi >= 4 && fi <= 5) b.vx += b.face * 200 * dt;
      else if (b.state === 'smash' && fi === 5) b.vx += b.face * 120 * dt;
      else b.vx *= Math.pow(0.01, dt);
      b.vx = clamp(b.vx, -150, 150);
      /* impact frame */
      if (fi !== b.lastFrame) {
        b.lastFrame = fi;
        if (fi === K.frames[0]) bossImpact(b.state);
        if (b.state === 'smash' && fi === 3) { AUD.tn(70, 46, 0.4, 0.10, 'sine'); }
      }
      /* hit test on the active frames */
      if (K.frames.indexOf(fi) >= 0 && !b.hitDone && !PL.dead) {
        const bx0 = b.face > 0 ? b.x + K.box[0] : b.x - K.box[2];
        const bx1 = b.face > 0 ? b.x + K.box[2] : b.x - K.box[0];
        const by0 = b.y + K.box[1], by1 = b.y + K.box[3];
        const hb = PL.hurtBox();
        if (!(hb.x1 < bx0 || hb.x0 > bx1 || hb.y1 < by0 || hb.y0 > by1)) {
          b.hitDone = true;
          const res = damagePlayer(K.dmg, b.x, 'boss', clamp(PL.y - 22, by0, by1));
          if (res === 'parry') { bossStun(); }
          else if (res === 'hit') { PL.vx = (PL.x - b.x > 0 ? 1 : -1) * K.kb; PL.vy = -110; }
        }
      }
      if (b.st >= A.dur) {
        b.hitDone = false;
        if (b.phase === 2 && b.chain < 1 && Math.random() < 0.34 && adx < 120) {
          b.chain++; const nk = Math.random() < 0.5 ? 'smash' : 'sweep';
          bSet(nk, nk); b.atkKind = nk;
        } else {
          b.chain = 0;
          bSet('idle', 'idle');
          b.cd = b.phase === 2 ? rnd(0.42, 0.9) : rnd(0.8, 1.35);
        }
      }
      break;
    }
  }

  /* physics */
  b.vy = mn(460, b.vy + PLC.gravity * dt);
  const prevY = b.y;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.x = clamp(b.x, LV.arenaX0 + 26, LV.arenaX1 - 26);
  b.onGround = false;
  for (const pl of LV.plats) {
    if (b.x + 16 < pl.x || b.x - 16 > pl.x + pl.w) continue;
    if (b.vy >= 0 && prevY <= pl.y + 1 && b.y >= pl.y) { b.y = pl.y; b.vy = 0; b.onGround = true; break; }
  }
  /* animation clock for the looping states */
  const A2 = BA[b.anim];
  if (b.state === 'sleep' || b.state === 'idle' || b.state === 'walk' || b.state === 'stun') {
    let tt = (b.at / A2.dur) % 1;
    b.frame = fl(tt * A2.n) % A2.n;
    /* heavy footfalls */
    if (b.state === 'walk' && b.onGround && (b.frame === 1 || b.frame === 4) && b.stepPhase !== b.frame) {
      b.stepPhase = b.frame;
      FX.dust(b.x - b.face * 6, b.y, 4, 24, 14, P.stnLt);
      FX.stoneBurst(b.x - b.face * 4, b.y, 2, 40, 4);
      AUD.bossStep();
      CAM.kick(0.9, 12);
    }
  } else if (b.state === 'hurt') {
    b.frame = mn(BA.hurt.n - 1, fl(b.st / BA.hurt.dur * BA.hurt.n));
  }
}

function bossImpact(kind) {

}

function textW(s, sc, sp) { sc = sc || 1; sp = sp === undefined ? 1 : sp; return s.length * (5 * sc + sp * sc) - sp * sc; }
function text(g, s, x, y, col, sc, sp) {
  sc = sc || 1; sp = sp === undefined ? 1 : sp;
  s = String(s).toUpperCase();
  let cx = fl(x);
  g.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const gl = FONT[s[i]] || FONT['?'];
    for (let r2 = 0; r2 < 7; r2++) {
      const bits = gl[r2];
      if (!bits) continue;
      for (let c = 0; c < 5; c++) if (bits & (1 << (4 - c))) g.fillRect(cx + c * sc, fl(y) + r2 * sc, sc, sc);
    }
    cx += (5 + sp) * sc;
  }
}
function textSh(g, s, x, y, col, sc, sp, shCol) {
  text(g, s, x + sc, y + sc, shCol || '#05070a', sc, sp);
  text(g, s, x, y, col, sc, sp);
}
function textC(g, s, cx, y, col, sc, sp, sh) {
  const w = textW(s, sc, sp);
  if (sh) textSh(g, s, cx - w / 2, y, col, sc, sp, sh === true ? undefined : sh);
  else text(g, s, cx - w / 2, y, col, sc, sp);
}

function buildWarmQueue() {
  const q = [];
  for (const k in KA) { const A = KA[k]; for (let i = 0; i < (A.n || 6); i++) q.push(['k', k, i]); }
  for (const t in GTYPE) for (const s in GA) { for (let i = 0; i < GA[s].n; i++) q.push(['g', t, s, i]); }
  for (const s in BA) for (let i = 0; i < BA[s].n; i++) q.push(['b', s, i]);
  for (let i = 0; i < CAPE_N; i++) q.push(['c', i]);
  for (let i = 0; i < 8; i++) q.push(['d', i]);
  GAME.warm = q; GAME.warmI = 0;
}
function warmTick(budget) {
  const q = GAME.warm;
  for (let n = 0; n < budget && GAME.warmI < q.length; n++, GAME.warmI++) {
    const it = q[GAME.warmI];
    if (it[0] === 'k') knightFrame(it[1], it[2]);
    else if (it[0] === 'g') gobFrame(it[1], it[2], it[3]);
    else if (it[0] === 'b') bossFrame(it[1], it[2]);
    else if (it[0] === 'c') capeSprite(it[1]);
    else daggerSprite(it[1]);
  }
  return GAME.warmI >= q.length;
}

  PL.reset(); BOSS.reset();

  PS.clearCombat();
  GAME.arenaLocked = false; GAME.kills = 0; GAME.reflectKills = 0;

  GAME.deathT = 0; GAME.winT = 0; GAME.bossNameT = 0; GAME.phaseText = 0;
  GAME.starFx.length = 0; GAME.hpGhost = PLC.maxHp; GAME.t = 0;
  GATE.y = GATE.y0; GATE.closing = false; GATE.closed = false; GATE.t = 0;
  CAM.lock = 0; CAM.x = 0; CAM.tx = 0; CAM.shake = 0;

}

function drawPlayer() {
  const p = PL, cx = CAM.cx, cy = CAM.cy;
  const x = fl(p.x - cx), y = fl(p.y - cy);
  const flash = p.flashT > 0.18;
  /* contact shadow */
  const gY = groundAt(p.x, p.y);
  if (gY !== null && !p.dead) {
    const h = clamp(1 - (gY - p.y) / 90, 0.25, 1);
    ra(ctx, x - 8 * h, fl(gY - cy) - 1, fl(16 * h), 2, '#04050800', 0);
    ctx.globalAlpha = 0.42 * h;
    ell(ctx, x, fl(gY - cy), fl(9 * h), 2, '#04060a');
    ctx.globalAlpha = 1;
  }
  const fr = knightFrame(p.anim, p.frame);
  /* cape behind the body */
  if (p.anim !== 'roll' && !fr.prone) {
    const ci = clamp(fl((p.capeK + 1) * 0.5 * (CAPE_N - 1) + 0.5), 0, CAPE_N - 1);
    const ce2 = capeSprite(ci);
    blit(ce2, x + p.face * (fr.ax || 0), y + (fr.ay || -33), p.face, COX, COY, p.dead ? 1 : 1);
  }
  blit(fr, x, y, p.face, KOX, KOY, 1, flash);
  /* low-health cracks and embers of pain */
  if (!p.dead && p.hp < PLC.maxHp * 0.3 && Math.random() < 0.12) {
    PS.spawn({
      x: p.x + rnd(-5, 5), y: p.y - rnd(18, 32), vx: rnd(-6, 6), vy: rnd(6, 20),
      life: rnd(0.25, 0.5), size: 1, col: P.bldD, alpha: 0.7, grav: 120, shape: 4, layer: L_COMBAT
    });
  }
  if (p.iTime > 0 && p.state === 'roll' && Math.random() < 0.4) {
    PS.spawn({
      x: p.x - p.face * rnd(2, 8), y: p.y - rnd(6, 16), vx: 0, vy: 0, life: 0.12,
      size: rint(2, 4), col: '#68809c', alpha: 0.3, shape: 7, layer: L_WORLD
    });
  }
}
function drawEnemies() {
  const cx = CAM.cx, cy = CAM.cy;
  for (const e of EN) {
    const x = fl(e.x - cx), y = fl(e.y - cy);
    if (x < -50 || x > VW + 50) continue;
    const T = ETUNE[e.t];

/* --------------------------------------------------------------------
   Attack telegraph — names the answer to the swing that is coming.
   smash : a vertical slam with a wide ground splash  -> roll through it
   sweep : a low horizontal swing at ankle height     -> jump over it
   diag  : a committed diagonal chop                  -> parry it
   -------------------------------------------------------------------- */
const BTELL = {
  smash: { act: 'ROLL', col: '#8fb9dc', dim: '#3a5d78' },
  sweep: { act: 'JUMP', col: '#8fc47f', dim: '#3d6435' },
  diag: { act: 'PARRY', col: '#dcb85f', dim: '#6e5520' }
};
function drawBossTell() {
  const b = BOSS;
  if (!b.active) return;
  const sx = fl(b.x - CAM.cx), sy = fl(b.y - CAM.cy);
  if (b.dead || PL.dead || !GAME.arenaLocked) return;
  const T = BTELL[b.state]; if (!T) return;
  const A = BA[b.state], K = BATK[b.state];
  const impact = K.frames[0] / A.n * A.dur;      /* the frame the blow lands on */
  const t = b.st, endT = impact + 0.16;
  if (t > endT) return;
  const a = clamp(t / 0.07, 0, 1) * clamp((endT - t) / 0.18, 0, 1);
  if (a <= 0.01) return;

  const w = textW(T.act, 1, 2), pw = w + 11, ph = 15;
  const cx2 = clamp(fl(sx), fl(pw / 2) + 3, VW - fl(pw / 2) - 3);
  const py = clamp(fl(sy) - 108, 6, VH - 46);
  /* blink hard over the last third of the wind-up */
  const near = t > impact - 0.30;
  const blink = near ? (0.62 + 0.38 * (sin(t * 34) > 0 ? 1 : 0)) : 1;

  ctx.globalAlpha = a * 0.78;
  r(ctx, cx2 - pw / 2, py, pw, ph, '#05070a');
  ctx.globalAlpha = a * 0.5;
  r(ctx, cx2 - pw / 2, py, pw, 1, T.dim);
  r(ctx, cx2 - pw / 2, py + ph - 1, pw, 1, T.dim);
  ctx.globalAlpha = a * blink;
  textC(ctx, T.act, cx2, py + 3, T.col, 1, 2, true);
  /* timing bar: fills as the mace comes down */
  const bw = pw - 6, fwd = fl(bw * clamp(t / impact, 0, 1));
  ctx.globalAlpha = a * 0.55;
  r(ctx, cx2 - bw / 2, py + ph + 1, bw, 1, '#0a0d12');
  if (fwd > 0) { ctx.globalAlpha = a * blink; r(ctx, cx2 - bw / 2, py + ph + 1, fwd, 1, T.col); }
  /* little arrow pointing down at the head */
  ctx.globalAlpha = a * 0.7;
  r(ctx, cx2 - 1, py + ph + 4, 3, 1, T.dim);
  r(ctx, cx2, py + ph + 5, 1, 1, T.dim);
  ctx.globalAlpha = 1;
}
function drawDaggers() {
  const cx = CAM.cx, cy = CAM.cy;
  for (const d of DAG) {
    const i = ((fl(d.rot / TAU * 8) % 8) + 8) % 8;
    const sp = daggerSprite(i);
    const x = fl(d.x - cx), y = fl(d.y - cy);
    if (d.friendly) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.45;
      ctx.drawImage(sp.n, x - 10, y - 10);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(sp.n, x - 10, y - 10);
  }
}
function drawGate() {
  if (GATE.y < -110) return;
  const cx = CAM.cx, cy = CAM.cy;
  const x = fl(LV.gateX - cx), y = fl(GATE.y - cy);

  ctx.drawImage(PROPS.gate, x, y);

/* ---------------------------------------------------------------------
   26.  MAIN LOOP
   --------------------------------------------------------------------- */
GAME.hpGhost = PLC.maxHp;
let ashTimer = 0, moteTimer = 0, wispTimer = 0;

function ambientTick(dt) {
  WT += dt;
  /* falling ash — three depth groups, screen space, always moving */
  ashTimer -= dt;
  if (PS.nAmb < 84 && ashTimer <= 0) { spawnAsh(false); ashTimer = 0.05 + Math.random() * 0.05; }
  /* dust motes near enclosed stone and fire */
  moteTimer -= dt;
  if (moteTimer <= 0) {
    moteTimer = 0.18;
    const cx = CAM.cx;
    for (const b of LV.braziers) {
      if (ab(b.x - cx - VW / 2) < VW * 0.6 && Math.random() < 0.3) spawnMote(b.x + rnd(-26, 26), b.y - rnd(14, 50));
    }
    if (GAME.arenaLocked && Math.random() < 0.6) spawnMote(cx + rnd(0, VW), GY - rnd(20, 110));
    for (const bg of LV.bg) if (bg.k === 'arch' && ab(bg.x - cx - VW / 2) < VW * 0.7 && Math.random() < 0.25)
      spawnMote(bg.x + rnd(0, 90), bg.y + rnd(20, 60));
  }
  /* low fog wisps hugging the ground */
  wispTimer -= dt;
  if (wispTimer <= 0) {
    wispTimer = 0.42;
    const cx = CAM.cx;
    const dense = GAME.arenaLocked;
    if (Math.random() < (dense ? 0.9 : 0.6)) {
      const x = cx + rnd(-30, VW + 30);
      const gy2 = groundAt(x, 0);
      if (gy2 !== null) spawnFogWisp(x, gy2 - rnd(1, 9), dense);
    }
  }
}

function updatePlay(dt) {
  GAME.t += dt;
  if (GAME.damageFlash > 0) GAME.damageFlash -= dt;
  if (GAME.parryFlash > 0) GAME.parryFlash -= dt;
  if (GAME.bossNameT > 0) GAME.bossNameT -= dt;
  if (GAME.phaseText > 0) GAME.phaseText -= dt;
  for (let i = GAME.starFx.length - 1; i >= 0; i--) { GAME.starFx[i].t -= dt; if (GAME.starFx[i].t <= 0) GAME.starFx.splice(i, 1); }
  GAME.hpGhost += (PL.hp - GAME.hpGhost) * mn(1, dt * 2.2);

  let sdt = dt;
  if (GAME.hitstop > 0) { GAME.hitstop -= dt; sdt = 0; }

  if (sdt > 0) {
    plUpdate(sdt);
    for (const e of EN) enemyUpdate(e, sdt);
    bossUpdate(sdt);
    daggerUpdate(sdt);
    gateUpdate(sdt);
    if (!GAME.arenaLocked && PL.x > LV.arenaX0 + 44 && !PL.dead) startBossFight();
  }
  CAM.follow(PL.x, PL.y - 18, PL.face, dt, PL.vx);

  if (PL.dead) { GAME.deathT += dt; if (GAME.deathT > 2.4) GAME.mode = 'defeat'; }
  if (BOSS.dead) { GAME.winT += dt; if (GAME.winT > 2.9) { GAME.mode = 'victory'; } }
}

function renderPlay() {
  drawBackground();
  /* arena rear wall sits just behind the play field */
  if (arenaCv) {
    const ax = fl(2782 - CAM.cx), ay = fl(GY - 196 - CAM.cy * 0.8);
    if (ax < VW && ax + arenaCv.width > 0) {
      ctx.drawImage(arenaCv, ax, ay);
      /* the throne, waiting behind the king */
      ctx.drawImage(PROPS.throne, fl(LV.arenaX1 - 104 - CAM.cx), fl(GY - 58 - CAM.cy * 0.94));
    }
  }
  PS.draw(L_BGATM, CAM.cx, CAM.cy);
  drawPits();
  drawPlatforms();
  drawDecor(false);
  drawDecor(true);
  drawBraziers(0);
  PS.draw(L_WORLD, CAM.cx, CAM.cy);
  drawEnemies();
  drawBoss();
  drawDaggers();
  drawPlayer();
  PS.draw(L_COMBAT, CAM.cx, CAM.cy);
  drawGate();
  drawFogBand(fogs[2], CAM.cx);
  drawForeground();
  PS.draw(L_FGATM, CAM.cx, CAM.cy);
  drawScreenFx();
  drawHUD();
}

let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.06) dt = 0.06;
  if (dt <= 0) dt = 1 / 60;

  /* portrait on a handheld: the field is behind the rotate prompt, so nothing
     ticks. lastT is already advanced, so turning back does not hand the world
     a stored-up frame. */
  if (GAME.blocked) { IN.clearEdges(); return; }

  IN.tick(dt);
  ambientTick(dt);

  if (GAME.mode === 'title') {
    if (!GAME.ready) {
      if (warmTick(7)) { GAME.ready = true; const b = document.getElementById('boot'); if (b) b.style.display = 'none'; }
    }
    CAM.x = 190; CAM.tx = 190; CAM.y = 0;
    PS.update(dt);
    drawTitle();
    if (GAME.ready && (IN.press('start') || IN.press('light') || IN.press('jump'))) {
      AUD.unlock(); AUD.uiBig();
      GAME.mode = 'play'; GAME.t = 0;
      resetRun();
    }
  } else if (GAME.mode === 'play') {
    if (IN.press('pause')) { GAME.mode = 'paused'; AUD.ui(); }
    else {
      updatePlay(dt);
      PS.update(dt);
      renderPlay();
    }
  } else if (GAME.mode === 'paused') {
    PS.update(dt * 0.3);
    renderPlay();
    drawPause();
    if (IN.press('pause')) { GAME.mode = 'play'; AUD.ui(); }
    if (IN.press('restart')) { GAME.mode = 'title'; AUD.stopMusic(); AUD.startMusic('field'); }
  } else if (GAME.mode === 'victory' || GAME.mode === 'defeat') {
    const win = GAME.mode === 'victory';
    if (win) GAME.winT += dt; else GAME.deathT += dt;
    if (GAME.hitstop > 0) GAME.hitstop -= dt;
    if (win) { bossUpdate(dt); for (const e of EN) enemyUpdate(e, dt); }
    else plUpdate(dt);
    CAM.follow(win ? BOSS.x : PL.x, (win ? BOSS.y : PL.y) - 18, 1, dt, 0);
    PS.update(dt);
    renderPlay();
    drawEndScreen(win);
    const tt = win ? GAME.winT : GAME.deathT;
    if (tt > 1.6 && (IN.press('start') || IN.press('restart'))) {
      AUD.uiBig();
      if (win) { GAME.mode = 'title'; AUD.stopMusic(); }
      else { GAME.mode = 'play'; GAME.t = 0; resetRun(); }
    }
  }
  if (IN.press('mute')) { AUD.toggle(); tcMuteLabel(); }
  IN.clearEdges();
}

/* ---------------------------------------------------------------------
   26b. DEVICE PROFILE + ON-SCREEN CONTROLS
        The pads are mapped onto the same action names the keyboard uses,
        so the game logic is untouched.
   --------------------------------------------------------------------- */
const TOUCH = (function () {
  if (location.hash === '#touch') return true;
  if (location.hash === '#notouch') return false;
  try {
    /* a phone or tablet: the pointer you actually play with is a finger */
    if (matchMedia('(pointer:coarse)').matches) return true;
    /* a touch panel with no mouse anywhere — but a touchscreen laptop keeps
       its keyboard and mouse, and must not be handed a thumb pad */
    if (!matchMedia('(any-pointer:fine)').matches &&
      (('ontouchstart' in window) || navigator.maxTouchPoints > 0)) return true;
    return false;
  } catch (_) {
    return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  }
})();

/* The visual viewport is the honest one on a handheld: it shrinks and grows
   as the browser chrome slides in and out, while innerHeight keeps reporting
   the space the address bar is still sitting on. */
function viewW() { const v = window.visualViewport; return (v && v.width) ? v.width : innerWidth; }
function viewH() { const v = window.visualViewport; return (v && v.height) ? v.height : innerHeight; }

/* What we are running on, refreshed on every resize. */
const DEV = {
  touch: TOUCH, kind: 'desktop', portrait: false,
  dpr: 1, vw: 0, vh: 0, scale: 1, unit: 62, integer: false
};
function profileDevice() {
  const w = viewW(), h = viewH();
  DEV.vw = w; DEV.vh = h;
  DEV.dpr = window.devicePixelRatio || 1;
  DEV.portrait = h > w;
  /* the short edge is orientation-independent, so a phone stays a phone when
     it is turned: ~480 CSS px splits every current handset from every tablet */
  DEV.kind = !TOUCH ? 'desktop' : (mn(w, h) >= 480 ? 'tablet' : 'phone');
  return DEV;
}
const TCPAD = document.getElementById('tc');
const TC_PTR = {};        /* pointerId -> {act, el} */
const TC_CNT = {};        /* act -> how many fingers hold it */
function tcDown(act, el, id) {
  if (TC_PTR[id]) return;
  TC_PTR[id] = { act: act, el: el };
  TC_CNT[act] = (TC_CNT[act] || 0) + 1;
  if (TC_CNT[act] === 1) IN.down(act);
  el.classList.add('on');
}
function tcUp(id) {
  const rec = TC_PTR[id]; if (!rec) return;
  delete TC_PTR[id];
  TC_CNT[rec.act] = mx(0, (TC_CNT[rec.act] || 1) - 1);
  if (TC_CNT[rec.act] === 0) IN.up(rec.act);
  rec.el.classList.remove('on');
}
function tcMuteLabel() {
  const m = document.getElementById('tb-mute');
  if (m) m.classList.toggle('muted', !!AUD.muted);
}
if (TOUCH && TCPAD) {
  TCPAD.hidden = false;
  const hintEl = document.getElementById('hint');
  if (hintEl) hintEl.style.display = 'none';
  const pads = TCPAD.querySelectorAll('.tb');
  for (let i = 0; i < pads.length; i++) {
    const el = pads[i], act = el.getAttribute('data-act');
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault(); e.stopPropagation();
      AUD.unlock();
      tcDown(act, el, e.pointerId);
      try { el.setPointerCapture(e.pointerId); } catch (_) { }
    }, { passive: false });
    el.addEventListener('pointerup', function (e) { e.preventDefault(); tcUp(e.pointerId); }, { passive: false });
    el.addEventListener('pointercancel', function (e) { tcUp(e.pointerId); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('dragstart', function (e) { e.preventDefault(); });
  }
  addEventListener('pointerup', function (e) { tcUp(e.pointerId); });
  addEventListener('pointercancel', function (e) { tcUp(e.pointerId); });
  addEventListener('blur', function () { for (const id in TC_PTR) tcUp(id); });
  /* a tap on the play area is START / RETRY on the title and end screens */
  cvs.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    AUD.unlock();
    if (GAME.mode === 'title' || GAME.mode === 'victory' || GAME.mode === 'defeat') {
      IN.down('start'); IN.up('start');
    }
  }, { passive: false });
}

/* ---------------------------------------------------------------------
   27.  BOOT — presentation sizing and the orientation gate
   --------------------------------------------------------------------- */

/* How much of the fitted area an integer scale must still cover before a
   handheld accepts the letterboxing it costs. Giving up a fifth of a phone
   screen hurts more than slightly uneven pixel columns do; a desktop has the
   room to spare and always takes the crisp step. */
const INT_SCALE_FILL = 0.86;

function resize() {
  const D = profileDevice();
  /* the keyboard hint line only exists off touch, so only desktop pays for it */
  const pad = TOUCH ? 0 : 26;
  const availW = D.vw, availH = mx(80, D.vh - pad);

  /* Snap in DEVICE pixels, not CSS pixels. One game pixel has to cover a whole
     number of physical pixels or the upscale shows uneven columns that crawl
     as the camera moves — the one artefact this art style cannot hide. */
  const fit = mn(availW / VW, availH / VH);
  let s = fit;
  D.integer = false;
  const devScale = fit * D.dpr;
  if (devScale >= 2) {
    const cand = fl(devScale) / D.dpr;
    if (!TOUCH || cand / fit >= INT_SCALE_FILL) { s = cand; D.integer = true; }
  }
  s = mx(0.2, s);
  D.scale = s;

  cvs.style.width = (VW * s) + 'px';
  cvs.style.height = (VH * s) + 'px';
  /* centre against the visual viewport so the canvas never sits behind the
     browser chrome when it slides back into view */
  document.body.style.height = D.vh + 'px';

  sizeTouchPads();
  updateOrientationGate();
}

/* Pads are sized off the short screen edge: a fixed 62px button is a
   thumb-swallowing slab on a small phone and a postage stamp on a tablet. */
function sizeTouchPads() {
  if (!TOUCH || !TCPAD) return;
  const u = clamp(Math.round(mn(DEV.vw, DEV.vh) * 0.17), 42, 84);
  TCPAD.style.setProperty('--u', u + 'px');
  TCPAD.style.setProperty('--gap', clamp(Math.round(u * 0.18), 6, 16) + 'px');
  DEV.unit = u;
}

/* A handheld held upright gets the rotate prompt instead of a 16:9 sliver. */
const ROTEL = document.getElementById('rot');
function updateOrientationGate() {
  const block = TOUCH && DEV.portrait;
  if (block === GAME.blocked) return;
  GAME.blocked = block;
  if (ROTEL) ROTEL.classList.toggle('show', block);
  if (TCPAD) TCPAD.hidden = block || !TOUCH;
  if (block) {
    /* drop every held finger and pause a run in progress — the knight must not
       take hits behind an overlay nobody can see past */
    for (const id in TC_PTR) tcUp(id);
    IN.held = {}; IN.buf = {};
    if (GAME.mode === 'play') GAME.mode = 'paused';
  }
}

addEventListener('resize', resize);
addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) {
  visualViewport.addEventListener('resize', resize);
  visualViewport.addEventListener('scroll', resize);
}
try { matchMedia('(orientation:portrait)').addEventListener('change', resize); } catch (_) { }
resize();

buildProps();
buildArena();
buildWarmQueue();
seedAmbient();
GAME.mode = 'title';
CAM.x = 190;
requestAnimationFrame(frame);
</script>
</body>
