<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes the env(safe-area-inset-*) rules below real
     on notched handsets; without it they all resolve to zero -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ASHFALL — The Last Warlord</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#050507;overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
    color:#8a95a3;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #wrap{position:relative;line-height:0;filter:saturate(0.96) contrast(1.03);}
  canvas#c{
    display:block;
    cursor:none;
    image-rendering:optimizeSpeed;
    image-rendering:-moz-crisp-edges;
    image-rendering:-webkit-optimize-contrast;
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    background:#05060a;
    box-shadow:0 0 0 1px #14161a, 0 0 24px 6px rgba(0,0,0,0.9), 0 0 90px 30px rgba(0,0,0,0.65);
  }
  #boot{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05060a;color:#646e7d;font-size:13px;letter-spacing:3px;line-height:1.6;
    text-align:center;z-index:5;
  }
  #boot b{color:#b8963f;font-weight:400;}
  /* ---------------- on-screen (touch) controls ---------------- */
  #tc{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    --u:62px;--gap:11px;--icon:32px;
    font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  }
  #tc[hidden]{display:none;}
  /* --u, --gap and --icon are all driven from JS (sizeTouchPads) off the short
     screen edge; the values above are only the fallback until the first
     resize lands. */

  .tb{
    pointer-events:auto;-webkit-tap-highlight-color:transparent;
    -webkit-appearance:none;appearance:none;
    width:var(--u);height:var(--u);border-radius:50%;
    border:1px solid #3a3f49;background-color:rgba(9,11,16,0.55);
    color:#8f9aa8;font-family:inherit;font-size:10px;letter-spacing:1px;
    line-height:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.55), 0 3px 12px rgba(0,0,0,0.6);
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:transform .05s linear, background-color .05s linear, border-color .05s linear;
    backdrop-filter:blur(1px);
    /* the glyph is a baked pixel icon (buildPadIcons), sized to an integer
       multiple of its 16px source so it never lands between pixels */
    background-repeat:no-repeat;background-position:center;
    background-size:var(--icon) var(--icon);
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  .tb.on{background-color:rgba(70,57,26,0.88);border-color:#b8963f;transform:scale(0.93);}

  .tb.roll,.tb.guard{border-color:#40566b;}
  .tb.jump{border-color:#3f5a44;}
  .tb.light{width:calc(var(--u)*1.05);height:calc(var(--u)*1.05);border-color:#5a4c36;}
  .tb.heavy{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-color:#6b4a30;}
  .tb.flask{width:calc(var(--u)*0.88);height:calc(var(--u)*0.88);border-color:#5c3a3a;}
  .tb.sys{width:36px;height:30px;border-radius:7px;background-size:16px 16px;}
  .tb.sys.muted{border-color:#6b4844;}
  /* abandoning a run is destructive, so it keeps a word rather than a glyph
     you could misread, wears the blood colour, and only appears on the pause
     screen — see tcSyncQuit() */
  .tb.sys.quit{width:42px;font-size:10px;color:#a8635c;border-color:#6b3a38;}
  .tb.sys.quit.on{background-color:rgba(70,26,26,0.88);color:#e9b0a8;border-color:#a8635c;}
  /* taking a thing off the stone only exists while something is in reach, so
     like QUIT it wears a word rather than a glyph and is only ever on screen
     when it can actually do something — see tcSyncTake() */
  .tb.sys.take{width:52px;height:32px;font-size:10px;color:#c9b27a;border-color:#6b5a2e;}
  .tb.sys.take.on{background-color:rgba(70,57,26,0.88);color:#e6cd8b;border-color:#b8963f;}
  .tb[hidden]{display:none;}
  /* a class selector beats the UA sheet's [hidden] rule, so a hidden row has
     to be told again or it keeps its slot in the column */
  .tc-row[hidden]{display:none;}

  .tc-row{display:flex;gap:var(--gap);align-items:flex-end;}
  .tc-left,.tc-right{
    position:absolute;display:flex;flex-direction:column;gap:var(--gap);
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
  }
  .tc-left{align-items:flex-start;left:calc(12px + env(safe-area-inset-left,0px));}
  .tc-right{align-items:flex-end;right:calc(12px + env(safe-area-inset-right,0px));}
  .tc-left .tc-row:first-child{padding-left:calc(var(--u)*0.44);}
  /* the two directions want daylight between them — a thumb rolling from one
     to the other should feel the gap, not smear across both at once */
  .tc-left .tc-row:last-child{gap:calc(var(--gap)*2.6);padding-left:calc(var(--u)*0.22);}
  /* keyed to the guard row by name, not by position: the take row appears
     above it and must not inherit its inset */
  .tc-right .tc-row.r-guard{padding-right:calc(var(--u)*0.36);}
  .tc-right .tc-row:last-child{padding-right:calc(var(--u)*0.10);}
  /* The forge is a canvas modal. On touch it keeps only its one explicit
     INTERACT/EXIT action plus the global mute control; movement and combat
     pads cannot leak through the frozen world behind it. */
  #tc.forge-modal .tc-left,
  #tc.forge-modal .r-guard,
  #tc.forge-modal .tc-right>.tc-row:not(#tc-take-row){display:none;}
  #tc.forge-modal .tc-sys .tb:not(#tb-mute){display:none;}
  .tc-sys{
    position:absolute;display:flex;gap:8px;
    right:calc(10px + env(safe-area-inset-right,0px));
    top:calc(4px + env(safe-area-inset-top,0px));
  }
  /* Cinematics still release every gameplay thumb, but mute is a device-level
     action and desktop keeps its M binding in these modes. A single small pad
     occupies the margin left by the 392px caption plate at the narrowest VW;
     no combat control is allowed back over the authored scene. */
  #tc.cine-modal .tc-left,
  #tc.cine-modal .tc-right,
  #tc.cine-modal .tc-sys .tb:not(#tb-mute){display:none;}
  #tc.cine-modal .tc-sys{
    right:auto;left:calc(6px + env(safe-area-inset-left,0px));
    top:calc(6px + env(safe-area-inset-top,0px));
  }
  #tc.cine-modal #tb-mute{width:30px;height:26px;}

  /* ---------------- portrait gate (handhelds only) ---------------- */
  #rot{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;
    padding:24px;background:#05060a;
    font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;
  }
  #rot.show{display:flex;}
  /* the same scanline the game wears, so the prompt belongs to it */
  #rot::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0.17) 0 1px,transparent 1px 2px);
  }
  .rot-in{position:relative;z-index:1;max-width:430px;text-align:center;}
  .rot-ico{width:min(38vw,140px);height:min(38vw,140px);margin:0 auto 26px;}
  .rot-ico svg{display:block;width:100%;height:100%;overflow:visible;}
  .rot-dev{transform-origin:60px 62px;animation:rotdev 3.1s ease-in-out infinite;}
  .rot-arc{animation:rotarc 3.1s ease-in-out infinite;}
  @keyframes rotdev{
    0%,15%{transform:rotate(0deg);}
    45%,76%{transform:rotate(90deg);}
    97%,100%{transform:rotate(0deg);}
  }
  @keyframes rotarc{0%,12%{opacity:.30;}28%{opacity:1;}58%,100%{opacity:.30;}}
  @media (prefers-reduced-motion:reduce){
    .rot-dev{animation:none;transform:rotate(90deg);}
    .rot-arc{animation:none;opacity:.85;}
  }
  .rot-t{font-size:15px;letter-spacing:4px;color:#e6cd8b;line-height:1.7;}
  .rot-s{font-size:10px;letter-spacing:3px;color:#5c6674;line-height:1.9;margin-top:14px;}
  .rot-r{
    width:150px;height:1px;margin:20px auto 0;background:#3a3420;position:relative;
  }
  .rot-r::before{
    content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;
    margin-left:-2px;background:#b8963f;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="boot">FORGING THE RUINS<br><b>. . .</b></div>
</div>
<div id="tc" hidden>
  <div class="tc-sys">
    <button class="tb sys quit" id="tb-quit" data-act="restart" aria-label="abandon the run" hidden>QUIT</button>
    <button class="tb sys" data-act="pause" aria-label="pause"></button>
    <button class="tb sys" id="tb-mute" data-act="mute" aria-label="sound"></button>
  </div>
  <div class="tc-left">
    <div class="tc-row">
      <button class="tb flask" data-act="flask" aria-label="drink flask"></button>
    </div>
    <div class="tc-row">
      <button class="tb move" data-act="left" aria-label="move left"></button>
      <button class="tb move" data-act="right" aria-label="move right"></button>
    </div>
  </div>
  <div class="tc-right">
    <div class="tc-row" id="tc-take-row" hidden>
      <button class="tb sys take" id="tb-take" data-act="take" aria-label="take what is on the ground">TAKE</button>
    </div>
    <div class="tc-row r-guard">
      <button class="tb guard" data-act="guard" aria-label="guard and parry"></button>
    </div>
    <div class="tc-row">
      <button class="tb light" data-act="light" aria-label="light attack"></button>
      <button class="tb heavy" data-act="heavy" aria-label="heavy attack"></button>
    </div>
    <div class="tc-row">
      <button class="tb roll" data-act="roll" aria-label="roll"></button>
      <button class="tb jump" data-act="jump" aria-label="jump"></button>
    </div>
  </div>
</div>
<div id="rot">
  <div class="rot-in">
    <div class="rot-ico">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g class="rot-arc" fill="none" stroke="#b8963f" stroke-width="3" stroke-linecap="round">
          <path d="M18 42 A 46 46 0 0 1 102 42"/>
        </g>
        <path class="rot-arc" fill="#b8963f" d="M102 57 L93 39 L111 39 Z"/>
        <g class="rot-dev">
          <rect x="44" y="36" width="32" height="52" rx="5" fill="#14171d" stroke="#4a5360" stroke-width="2"/>
          <rect x="48" y="43" width="24" height="36" fill="#0a0c11" stroke="#2b323d" stroke-width="1"/>
          <rect x="55" y="38.5" width="10" height="2" rx="1" fill="#39424f"/>
          <circle cx="60" cy="83" r="2.4" fill="#39424f"/>
        </g>
      </svg>
    </div>
    <div class="rot-t">PLEASE ROTATE YOUR DEVICE</div>
    <div class="rot-r"></div>
    <div class="rot-s">ASHFALL IS PLAYED IN LANDSCAPE</div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   ASHFALL — THE LAST WARLORD
   A hand-crafted 32-bit dark-fantasy action game.
   Everything (sprites, terrain, sky, sound) is generated procedurally.
   ===================================================================== */

/* ===== 0.  CANVAS + LOW LEVEL PIXEL PLUMBING =================== */
/* Internal pixel resolution.
   HEIGHT IS FIXED at 270: the level, the ground line at GY and every HUD
   offset were laid out against it and none of them may move. WIDTH is taken
   from the screen's own aspect at boot, because a handset in landscape is far
   wider than 16:9 and a hard 480 pays that difference in black bars. Widening
   is not zooming out — the height sets how big the knight is, so he comes out
   at exactly the size he had before and the spare screen buys more world
   either side. Clamped both ways: under 480 the frame drops below the
   composition the game was designed at, over 640 an ultrawide hands the
   player half the arena at a glance.
   READ ONCE AT LOAD and never again — the sky, vignette, scanline and damage
   overlays are all baked at this width, and turning a handheld over must not
   quietly re-bake them. */
const VH = 270;
const VW = (function () {
  const v = window.visualViewport;
  const w = (v && v.width) ? v.width : innerWidth;
  const h = (v && v.height) ? v.height : innerHeight;
  /* the long edge over the short one, so a phone booted upright still sizes
     for the landscape it is going to be played in */
  const a = (w > 0 && h > 0) ? Math.max(w, h) / Math.min(w, h) : 16 / 9;
  return Math.min(640, Math.max(480, Math.round(VH * a / 2) * 2));
})();
const cvs = document.getElementById('c');
cvs.width = VW; cvs.height = VH;          /* the markup's 480x270 is only the pre-script default */
const ctx = cvs.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const fl = Math.floor, ce = Math.ceil, ab = Math.abs, mn = Math.min, mx = Math.max;
const PI = Math.PI, TAU = PI * 2;
const sin = Math.sin, cos = Math.cos, hyp = Math.hypot, atan2 = Math.atan2;

function mkcv(w, h) {
  const c = document.createElement('canvas');
  c.width = mx(1, w | 0); c.height = mx(1, h | 0);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}
function gc(c) { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return g; }

/* pixel primitives — every coordinate is snapped to the internal grid */
function r(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(fl(x), fl(y), fl(w), fl(h)); }
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(fl(x), fl(y), 1, 1); }
function ra(g, x, y, w, h, c, a) { g.globalAlpha = a; g.fillStyle = c; g.fillRect(fl(x), fl(y), fl(w), fl(h)); g.globalAlpha = 1; }

/* hard-edged pixel ellipse (scanline filled, no anti-aliasing) */
function ell(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t <= 0) continue;
    const w = Math.sqrt(t) * rx;
    g.fillRect(fl(cx - w), fl(cy + y), mx(1, fl(w * 2)), 1);
  }
}
/* Hollow pixel ring by midpoint symmetry: each pixel of the circumference is
   visited exactly once (~5.7 fillRects per unit of radius). Walking it by
   angle instead costs ~37.7 and overdraws most of them — 1131 for radius 30,
   which a parry throws two of, in the one frame that must feel sharpest. */
function ring(g, cx, cy, rad, c) {
  g.fillStyle = c;
  const ox = fl(cx), oy = fl(cy);
  let x = mx(1, rad | 0), y = 0, err = 1 - x;
  while (x >= y) {
    g.fillRect(ox + x, oy + y, 1, 1); g.fillRect(ox - x, oy + y, 1, 1);
    g.fillRect(ox + x, oy - y, 1, 1); g.fillRect(ox - x, oy - y, 1, 1);
    g.fillRect(ox + y, oy + x, 1, 1); g.fillRect(ox - y, oy + x, 1, 1);
    g.fillRect(ox + y, oy - x, 1, 1); g.fillRect(ox - y, oy - x, 1, 1);
    y++;
    if (err < 0) err += 2 * y + 1;
    else { x--; err += 2 * (y - x) + 1; }
  }
}
/* oriented plate — the workhorse for armour, limbs, weapons.
   Rasterised per-pixel so edges stay hard at any angle. Used only while
   baking sprites into the cache, never in the per-frame path.          */
function plate(g, cx, cy, len, wid, ang, c) {
  const ca = cos(ang), sa = sin(ang);
  const hl = len * 0.5, hw = wid * 0.5;
  const rad = ce(hyp(hl, hw)) + 1;
  const x0 = fl(cx - rad), x1 = ce(cx + rad), y0 = fl(cy - rad), y1 = ce(cy + rad);
  const taper = c.taper || 0, round = c.round || 0;
  const cHi = c.hi || c.base, cSh = c.sh || c.base;
  /* horizontal runs of one colour are emitted as a single fillRect —
     setting fillStyle per pixel is what makes procedural baking slow */
  for (let y = y0; y <= y1; y++) {
    let runCol = null, runX = 0, runN = 0;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
      const un = u / hl;
      const halfW = hw * (1 - taper * (un * 0.5 + 0.5));
      let col = null;
      if (!(ab(u) > hl || ab(v) > halfW)) {
        const vn = v / halfW;
        if (!(round && un * un + vn * vn > 1)) {
          col = c.base;
          if (vn < -0.42) col = cHi;
          else if (vn > 0.46) col = cSh;
          if (c.edge && ab(un) > 0.84) col = c.edge;
        }
      }
      if (col === runCol) { runN++; continue; }
      if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, y, runN, 1); }
      runCol = col; runX = x; runN = col === null ? 0 : 1;
    }
    if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, y, runN, 1); }
  }
}
/* dome / ellipse with directional shading (helmet skulls, pommels, shield bosses) */
function dome(g, cx, cy, rx, ry, c, lightX, lightY) {
  lightX = lightX === undefined ? -0.5 : lightX; lightY = lightY === undefined ? -0.75 : lightY;
  const cHi = c.hi || c.base, cSh = c.sh || c.base;
  for (let y = -ry; y <= ry; y++) {
    let runCol = null, runX = 0, runN = 0;
    const yy = fl(cy + y);
    for (let x = -rx; x <= rx; x++) {
      const q = (x / rx) * (x / rx) + (y / ry) * (y / ry);
      let col = null;
      if (q <= 1) {
        const d = (x / rx) * lightX + (y / ry) * lightY;
        col = c.base;
        if (d > 0.55) col = cHi;
        else if (d < -0.35) col = cSh;
        if (q > 0.82 && d < 0) col = cSh;
      }
      if (col === runCol) { runN++; continue; }
      if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, yy, runN, 1); }
      runCol = col; runX = fl(cx + x); runN = col === null ? 0 : 1;
    }
    if (runCol !== null && runN) { g.fillStyle = runCol; g.fillRect(runX, yy, runN, 1); }
  }
}
/* 1px vertical stripes of two colours — the mail showing under a fauld, a
   skirt or a wrapped hand. It carried a `density` argument that every call
   site set to 1, and at 1 the row term is always even, so this is what it
   has always drawn: not a checker, columns. */
function dith(g, x, y, w, h, ca, cb) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    g.fillStyle = (i % 2) ? ca : cb; g.fillRect(fl(x + i), fl(y + j), 1, 1);
  }
}

/* --- colour utils ------------------------------------------------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(a) { return '#' + ((1 << 24) + (a[0] << 16) + (a[1] << 8) + a[2]).toString(16).slice(1); }
function shade(h, f) { const c = hex2rgb(h); return rgb2hex([mn(255, mx(0, c[0] * f | 0)), mn(255, mx(0, c[1] * f | 0)), mn(255, mx(0, c[2] * f | 0))]); }
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex([A[0] + (B[0] - A[0]) * t | 0, A[1] + (B[1] - A[1]) * t | 0, A[2] + (B[2] - A[2]) * t | 0]);
}

/* Deterministic randomness. `hn` is an integer hash, not a stream: the same
   (x, y, seed) always gives the same value, which is why mountains, masonry,
   fog and army silhouettes can be re-rasterised without crawling or shifting. */
function hn(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => fl(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const eOut = t => 1 - (1 - t) * (1 - t);
const eIn = t => t * t;

/* ===== 1.  PALETTE — a tight, cohesive, grim set =============== */
const P = {
  /* worn steel */
  stlHi: '#c2cad4', stlLt: '#94a0ad', stl: '#6d7784', stlM: '#59626f', stlD: '#3f4854',
  stlS: '#2a313c', stlX: '#1a1f27',
  rust: '#6d4a30', rust2: '#4c3220', rust3: '#33220f',
  /* leather */
  leaHi: '#8a6440', lea: '#5f4429', leaD: '#3d2b1a', leaS: '#261a10',
  /* cloth / crimson */
  clHi: '#96322f', cl: '#6f2224', clD: '#4b1519', clS: '#2c0d10',
  clFxEcho: '#b93438', clFxD: '#2a060a', clFx: '#cf413e',
  clFxHi: '#ff796a', clFxCore: '#ffc0ad', clFxWhite: '#fff0e3',
  /* stone masonry */
  stnHi: '#666c75', stnLt: '#4d535c', stn: '#3a4048', stnM: '#2e333a',
  stnD: '#22262c', stnS: '#171a1f', stnX: '#0e1014',
  moss: '#35422a', mossD: '#25301c', mossHi: '#455636',
  /* goblin */
  gobHi: '#93a355', gob: '#6e8039', gobM: '#5a6a2e', gobD: '#414d22', gobS: '#2b3416',
  gobBl: '#42591f', gobBlD: '#2c3c14',
  /* gold / bronze */
  gldHi: '#e6cd8b', gld: '#b8963f', gldD: '#7d6127', gldS: '#4a3916',
  bronze: '#8a6a3a', bronzeD: '#5c4423',
  /* fire */
  fireHi: '#ffd39a', fire: '#e07f2c', fireM: '#b85618', fireD: '#7d3410',
  ember: '#c96a20',
  /* sky & atmosphere */

/* ===== 2.  INPUT ===============================================
   Owns: KEYMAP, IN (held / edge / buffered), releaseAllInput.
   Reduces keyboard, mouse and the on-screen pads to one set of action names,
   so nothing downstream knows where a press came from.
   Invariants:
   - a buffered press survives IN_BUFFER seconds; callers must test their
     preconditions BEFORE IN.consume()
   - every "drop everything" path goes through releaseAllInput(), which also
     clears the pads' pointer counts. Its one argument, `keepHeld`, is the
     single exception and has exactly one caller: the doorway between maps,
     where the page is still focused and the hand is still on the pad
   ===== */
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyW: 'jump', ArrowUp: 'jump', Space: 'jump',
  KeyS: 'roll', ArrowDown: 'roll',
  KeyQ: 'guard',
  KeyE: 'flask',
  /* Taking a thing off the stone, and spending one of the three slots. Bound
     here rather than read off `event.key` so the pads can raise exactly the
     same action names — see tcSyncTake and the canvas tap in section 26b. */
  KeyF: 'take',
  Digit1: 'slot1', Digit2: 'slot2', Digit3: 'slot3',
  Enter: 'start', Escape: 'pause', KeyP: 'pause',
  KeyM: 'mute', KeyR: 'restart'
};
/* How long a press keeps waiting for a state that can honour it. Named here
   rather than buried as a literal in down(): PLC used to carry a `buffer` of
   its own that nothing read and that disagreed with this number. */
const IN_BUFFER = 0.13;
const IN = {
  held: {}, hit: {},
  buf: {},                       // input buffers (seconds remaining)
  down(a) { if (!this.held[a]) { this.hit[a] = true; this.buf[a] = IN_BUFFER; } this.held[a] = true; },
  up(a) { this.held[a] = false; },
  press(a) { return !!this.hit[a]; },
  consume(a) { if (this.buf[a] > 0) { this.buf[a] = 0; return true; } return false; },
  tick(dt) { for (const k in this.buf) if (this.buf[k] > 0) this.buf[k] = mx(0, this.buf[k] - dt); },
  clearEdges() { this.hit = {}; }
};
/* Every "let go of everything" site has to drop the on-screen pads' pointer
   bookkeeping as well as the key state. Clearing IN.held on its own leaves
   TC_CNT holding a count for a thumb the game no longer thinks is down, and a
   pad in that state is dead for the rest of the session: the next press takes
   its count from 1 to 2, which is not 1, so IN.down never fires. tcUp and
   TC_PTR are declared further down but both are reachable by the time any of
   this runs. */
function releaseAllInput(keepHeld) {
  /* `keepHeld` is for the ONE caller whose page is still focused and whose
     fingers are still physically down: the doorway between maps. Crossing it
     runs a full resetRun, and a plain release there lets go of the pad the
     player is at that moment holding — the real pointerup arrives later, finds
     no record and does nothing, so he lands on the far side standing still
     with a dark pad under his thumb. A doorway is not a new run's first press;
     it is the same hand still on the same key. The BUFFER is still dropped,
     because a jump asked for on one map has no business firing on the next. */
  if (!keepHeld) {
    if (typeof TC_PTR !== 'undefined') for (const id in TC_PTR) tcUp(id);
    /* Forge owns a canvas pointer outside TC_PTR. Losing the page while an
       item is being dragged or RESULT is held must restore/cancel it here,
       or FORGE.pointer rejects every later touch as a second owner. The
       declaration is hoisted; FORGE is initialised before events can fire. */
    forgeReleasePointer();
    IN.held = {};
  }
  IN.buf = {}; IN.clearEdges();
}
addEventListener('keydown', e => {
  /* Ctrl+R, Cmd+W, Alt+D and friends share their letter with a binding. Without
     this they both fired the action and had their default swallowed, so the
     browser's own reload was eaten by the game's restart. */
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const a = KEYMAP[e.code];
  if (a) { e.preventDefault(); IN.down(a); }
  AUD.unlock();
}, { passive: false });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); IN.up(a); } }, { passive: false });
/* blur does not fire on every way out of the page — an app switch on a handset
   often only delivers visibilitychange, and pagehide is the one bfcache honours */
addEventListener('blur', () => { releaseAllInput(); });
addEventListener('visibilitychange', () => { if (document.hidden) releaseAllInput(); });
addEventListener('pagehide', () => { releaseAllInput(); });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousedown', e => {
  e.preventDefault(); AUD.unlock();
  if (GAME.mode === 'forge') {
    if (e.button === 2) {
      const p = forgePoint(e);
      if (p) forgeToggleArmorAt(p.x, p.y);
    } else forgeMouseDown(e);
    return;
  }
  if (e.button === 0) IN.down('light'); else if (e.button === 2) IN.down('heavy');
});
addEventListener('mousemove', e => { if (GAME.mode === 'forge') forgeMouseMove(e); });
addEventListener('mouseup', e => {
  if (GAME.mode === 'forge') { forgeMouseUp(e); return; }
  if (e.button === 0) IN.up('light'); else if (e.button === 2) IN.up('heavy');
});

/* ===== 3.  AUDIO — pure Web Audio synthesis ==================== */

  unlock() {
    /* The resume MUST come before the early return. Below it, it ran only on
       the very first call, so a context suspended later — a backgrounded tab,
       a call on a handset — was never woken and the game stayed silent for
       the rest of the session. */
    if (this.ready) {

         OWN fader (see startMusic), so a drone on its way out can fade without
         dragging the one coming in down with it. */

  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.85; },
  /* One percussive envelope: up to `vol` over the shorter of `atk` and a
     quarter-ish of the sound, then all the way back down by the end. Every
     effect in here is that shape; only the source and the filter differ. */
  env(t, dur, vol, atk, frac) {

  nz(dur, f0, f1, vol, q, type) {

  tn(f0, f1, dur, vol, type, delay, q) {

};

/* ===== 4.  SPRITE FINISHING PASS ===============================
   One lighting logic for every baked sprite, so the whole cast agrees on
   where the moon is: pale rim on upward-facing edges, deep shadow on
   downward ones, a softer highlight on left-facing ones, and a near-black
   1px silhouette outline. The strengths are per-caller (see the rim/rimAdd/
   bot objects at each bake site); the direction never is.
   ===== */
function finish(cv, opt, gIn, wIn, hIn) {

/* ===== 6.  THE KNIGHT — layered plate armour, heater shield, arming sword =
   Built from oriented pixel plates driven by a small skeleton with
   two-bone IK, then baked into the sprite cache.
   ===== */
const KW = 88, KH = 80, KOX = 44, KOY = 66;    /* sprite canvas + feet origin */
/* Hip half-width, and the leg reach the hip is allowed to ride at (of 10+10).
   The gap to full extension is what stops the knee locking straight — but it
   is also the whole knee break, because `ik` puts the knee that far off the
   hip-ankle line no matter how the leg is posed. At 19.85 that offset is
   about 1.2px on a 20px leg; at the 19.3 this used to be it was 2.6px, which
   at this sprite size reads as a snapped knee rather than a bent one. */
const KHIP = 2, KLEG = 19.85;

function ik(ax, ay, bx, by, l1, l2, bend) {
  let dx = bx - ax, dy = by - ay;
  let d = hyp(dx, dy) || 0.001;
  const nx = dx / d, ny = dy / d;
  d = mn(d, l1 + l2 - 0.02);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(mx(0, l1 * l1 - a * a));
  return {
    ex: ax + nx * a + (-ny) * h * bend, ey: ay + ny * a + (nx) * h * bend,
    hx: ax + nx * d, hy: ay + ny * d
  };
}
function seg(g, x0, y0, x1, y1, w, c) {
  const ang = atan2(y1 - y0, x1 - x0), len = hyp(x1 - x0, y1 - y0);
  plate(g, (x0 + x1) * 0.5, (y0 + y1) * 0.5, len + w * 0.45, w, ang, c);
}

/* A local frame for a piece of kit that has to follow a joint's angle.
   `at(x, y)` takes a coordinate in the part's own space — x along the piece,
   y across it — and hands back the point rotated onto the sprite. Every
   weapon, helm, shield and crown is drawn through one of these, which is why
   none of them has to know how the limb carrying it is posed. */
function orient(cx, cy, ang) {
  const ca = cos(ang), sa = sin(ang);
  return (x, y) => [cx + x * ca - y * sa, cy + x * sa + y * ca];
}
/* the three ways anything is ever drawn inside such a frame */
function segAt(g, at, x0, y0, x1, y1, w, mat) {
  const a = at(x0, y0), b = at(x1, y1);
  seg(g, a[0], a[1], b[0], b[1], w, mat);
}
function pxAt(g, at, x, y, col) { const q = at(x, y); px(g, q[0], q[1], col); }
function domeAt(g, at, x, y, rx, ry, mat, lx, ly) { const q = at(x, y); dome(g, q[0], q[1], rx, ry, mat, lx, ly); }

/* Two-bone limb: solve the IK, lay the upper and lower plates, and give the
   joint back so the caller can pile armour on top of it. Only for limbs whose
   two plates are drawn back to back — anywhere a knee cop or elbow cop goes
   BETWEEN them, the order matters and the parts stay written out. */
function limb(g, ax, ay, bx, by, l1, l2, bend, w1, w2, mat) {
  const j = ik(ax, ay, bx, by, l1, l2, bend);
  seg(g, ax, ay, j.ex, j.ey, w1, mat);
  seg(g, j.ex, j.ey, j.hx, j.hy, w2, mat);
  return j;
}

/* --- gait ---
   Every walk goes through these rather than a raw sine on the foot: a sine
   eases the sole to a halt at both ends of the stroke while the body keeps
   its pace, which is exactly what reads as skating. Here the planted foot
   travels straight back at a constant rate and only the swing curves. */

/* One foot's path around its own hip pivot. `u` is that leg's phase in
   [0,1): the foot strikes at +A, stays planted and slides back to -A over the
   stance fraction `st`, then swings forward through an arc `H` tall, reaching
   a hair past the strike point and retracting into contact the way a real leg
   does — which is what kills the last of the slide. `a` is ankle pitch (heel
   in, toe driving down through push-off); `toe` is the boot's length ahead of
   the ankle, which lifts the heel instead of sinking the toe into the stone;
   `pk` scales the pitch back for heavy, flat-footed walkers. */
function gaitFoot(u, A, H, st, toe, pk) {
  u -= fl(u);
  const k = pk === undefined ? 1 : pk;
  if (u < st) {
    const q = u / st;
    const a = (q < 0.18 ? -0.28 * (1 - q / 0.18) : (q > 0.62 ? 0.50 * (q - 0.62) / 0.38 : 0)) * k;
    return { x: A * (1 - 2 * q), y: a > 0 ? -toe * sin(a) : 0, a: a };
  }
  const s = (u - st) / (1 - st);
  const e = s * s * s * (s * (s * 6 - 15) + 10) + 0.34 * s * (1 - s);
  const c = s < 0.42 ? s * 0.5 / 0.42 : 0.5 + (s - 0.42) * 0.5 / 0.58;
  return { x: -A + 2 * A * e, y: -H * sin(PI * c), a: (0.50 - 0.78 * s * s * (3 - 2 * s)) * k };
}

/* Both feet and the hip off one stride. Every walk and run in the game is
   this plus an upper body: the two legs run half a cycle apart, each swinging
   around its OWN pivot, and the hip rides wherever both feet can be reached. */
function stride(p, t, hip, leg, A, H, st, toeF, toeB, pk) {
  const F = gaitFoot(t, A, H, st, toeF, pk), B = gaitFoot(t + 0.5, A, H, st, toeB, pk);
  p.fFx = hip + F.x; p.fFy = F.y; p.fFa = F.a;
  p.fBx = -hip + B.x; p.fBy = B.y; p.fBa = B.a;
  p.hipY = hipRide(leg, F.x, F.y, B.x, B.y);
}

/* The hip has to ride low enough for the legs to actually reach the feet, or
   `ik` clamps at full extension near the ends of the stride and the sole
   floats off the stone. The pivots sit either side of centre, so the two legs
   hit that limit at different points and the resulting limp is uneven. Fed
   the live foot targets it also gives the two dips per stride of a real gait
   for free. `R` sits just under full leg length so the knee never locks. */
function hipRide(R, fx, fy, bx, by) {
  return mx(fy - Math.sqrt(mx(1, R * R - fx * fx)), by - Math.sqrt(mx(1, R * R - bx * bx)));
}

/* Where drawKnightBody puts the shoulder for a given hip and lean. An arm
   that swings must hang its hand off an ARC around this point. Sliding the
   hand along world x at a fixed height — how the run used to do it — lets the
   shoulder-to-hand distance collapse to a third of the arm at one end of the
   stroke and stretch straight at the other, so the elbow snaps open and shut
   every step and the shield swings across the chest. */
function shoulderAt(hipY, lean) {
  return { x: sin(lean) * 13, y: hipY - cos(lean) * 13 };
}

/* A boot as a short plate hinged at the ankle. The pitch is a pixel or two,
   but it is what reads as weight on the step. */
function foot(g, ax, ay, back, fwd, w, a, mat) {
  const c = cos(a), s = sin(a);
  seg(g, ax - back * c, ay - back * s, ax + fwd * c, ay + fwd * s, w, mat);
}

/* material sets */
const M_NEAR = { hi: P.stlHi, base: P.stl, sh: P.stlD, edge: P.stlS };
const M_FAR = { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX };
const M_DARK = { hi: P.stlM, base: P.stlD, sh: P.stlX, edge: P.stlX };
const M_LEA = { hi: P.leaHi, base: P.lea, sh: P.leaD, edge: P.leaS };
const M_CLOTH = { hi: P.clHi, base: P.cl, sh: P.clD, edge: P.clS };
const M_GOLD = { hi: P.gldHi, base: P.gld, sh: P.gldD, edge: P.gldS };

function KPOSE() {
  return {
    hipX: 0, hipY: -20, lean: 0.07, headX: 1, headY: 0, headA: 0,
    swX: 7, swY: -26, swA: 0.75,
    shX: -3, shY: -28, shA: -0.25,
    fFx: 5, fFy: 0, fBx: -5, fBy: 0, fFa: 0, fBa: 0,
    capeK: -0.05, swordFront: true, shieldFront: true, wounded: false,
    hideSword: false, hideShield: false, chargeLevel: 0, chargePulse: 0,
    /* `bareHead` is hideSword's contract read the other way round: the head
       stays, the steel over it does not. `heldHelm` puts that steel in the
       sword hand, which is the only place it can be while it is off. */
    bareHead: false, heldHelm: false, finisher: false
  };
}

/* --- the sword ----------------------------------------------------- */
/* Only the honed edge carries charge light. Keeping the fuller and grip dark
   preserves the blade's shape; painting the whole weapon one flat colour
   would turn it into a neon bar and erase the steel underneath. `aura` is
   baked separately for the render-only glow/trail layer. */
function drawChargeBladeGlow(g, hx, hy, ang, level, pulse, aura, finisher) {
  if (!level) return;
  const at = orient(hx, hy, ang);
  /* The finisher is a separate weapon material, not a tint over the whole
     knight: the steel stays readable while the edge burns in the same
     crimson family as the helm's wounded eye and the reserve bar. */
  const cols = finisher ? [null, P.bldD, P.bld, P.bld] : [null, P.stlLt, P.gld, P.cl];
  const his = finisher ? [null, P.bld, P.bldHi || '#d84b43', '#ff8a72'] : [null, P.stlHi, P.gldHi, P.clHi];
  const stride = level === 1 ? 4 : (level === 2 ? 2 : (pulse > 0.62 ? 1 : 2));
  for (let d = 6; d < 25; d += stride) {
    const o = 1.72 - (d - 6) / 19 * 0.92;
    const c = ((d + level) % 4 === 0) ? his[level] : cols[level];
    pxAt(g, at, d, -o, c); pxAt(g, at, d, o, c);
    if (aura && (level === 3 || (level === 2 && d % 4 === 0))) {
      pxAt(g, at, d, -o - 1, c); pxAt(g, at, d, o + 1, c);
    }
  }
  if (level === 3 && pulse > 0.72) {
    for (let d = 9; d < 25; d += 4) {
      const c = finisher ? '#ffb09a' : P.clHi;
      pxAt(g, at, d, -2.5, c); pxAt(g, at, d, 2.5, c);
    }
  }
  pxAt(g, at, 25.5, 0, his[level]);
  if (aura && level === 3) pxAt(g, at, 26.5, 0, finisher ? '#ffb09a' : P.clHi);
}

function drawSword(g, hx, hy, ang, bright, chargeLevel, chargePulse, finisher) {
  const at = orient(hx, hy, ang);
  const chargeHi = finisher ? '#ffb09a' : [null, P.stlHi, P.gldHi, P.clHi][chargeLevel || 0];
  const chargeMid = finisher ? P.bld : [null, P.stlLt, P.gld, P.cl][chargeLevel || 0];
  const bladeM = chargeLevel
    ? { hi: chargeHi, base: mixc(P.stlHi, chargeMid, 0.42), sh: P.stlM, edge: chargeMid }
    : bright
    ? { hi: '#e6ecf4', base: P.stlHi, sh: P.stlLt, edge: P.stlHi }
    : { hi: P.stlHi, base: P.stlLt, sh: P.stlM, edge: P.stlLt };
  /* pommel */
  domeAt(g, at, -4, 0, 2, 2, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.7);
  /* grip (wrapped leather) */
  segAt(g, at, -3.5, 0, 2.5, 0, 3, { hi: P.leaHi, base: P.leaD, sh: P.leaS, edge: P.leaS });
  for (let i = -2; i <= 2; i += 2) { pxAt(g, at, i, 0, P.leaS); }
  /* crossguard */
  segAt(g, at, 3, -5.5, 3, 5.5, 2, { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlD });
  pxAt(g, at, 3, 0, P.gldD);
  /* blade — narrow, and tapered hard enough to actually converge. The old
     profile shed only a third of its width over the whole length, so it
     ended in a flat two-pixel stub: a bar of metal rather than a point. */
  segAt(g, at, 4.5, 0, 24.5, 0, 3.8, { hi: bladeM.hi, base: bladeM.base, sh: bladeM.sh, taper: 0.66 });
  /* fuller — one darker pixel line down the centre, stopped well short of
     the point so it does not eat the last of the taper */
  for (let d = 7; d < 19; d += 1) { pxAt(g, at, d, 0, bright ? P.stlLt : P.stlM); }
  /* the honed edges. At this size sharpness is not geometry, it is the pair
     of bright pixel runs down the flats with the fuller dark between them —
     that contrast is what the eye reads as an edge. */
  for (let d = 6; d < 24; d += 1) {
    const o = 1.5 - (d - 6) / 18 * 0.95;
    pxAt(g, at, d, -o, bladeM.hi); pxAt(g, at, d, o, bladeM.hi);
  }
  /* point — three converging pixels past the plate, so the blade ends on
     one pixel instead of a chopped-off end cap */
  pxAt(g, at, 24.5, 0, bladeM.hi);
  pxAt(g, at, 25.5, 0, bladeM.hi);
  pxAt(g, at, 26.5, 0, bladeM.base);
  /* battle nicks — bitten out of the edge, not floating in the flat */
  pxAt(g, at, 13, -1.6, P.stlS);
  pxAt(g, at, 19, 1.1, P.stlS);
  drawChargeBladeGlow(g, hx, hy, ang, chargeLevel || 0, chargePulse || 0, false, finisher);
}

/* --- the heater shield ---
   Crimson, and a size up. The knight is grey plate from crest to sabaton, so
   a shield in the same worn steel dissolved into the torso and read as one
   more lame of the cuirass. The field takes the crest-and-cape crimson —
   the third of the three red marks the silhouette is built on — and a
   near-black rim keeps its outline off the armour behind it. */
function drawShield(g, cx, cy, ang, back) {
  const ca = cos(ang), sa = sin(ang);
  const W = 13, H = 20, TOP = -3;
  const at = orient(cx, cy, ang);
  const field = back ? P.clS : P.cl, fieldHi = back ? P.clD : P.clHi, fieldSh = back ? P.clS : P.clD;
  const rimC = back ? P.stlX : P.stlS, rimHi = back ? P.stlS : P.stlLt, rimSh = back ? P.stlX : P.stlD;
  for (let y = TOP; y < H + TOP; y++) {
    const t = (y - TOP) / H;
    /* heater profile: straight sides, pointed lower half */
    let hw = W * 0.5;
    if (t > 0.44) hw = W * 0.5 * (1 - Math.pow((t - 0.44) / 0.56, 1.8));
    hw = mx(0.6, hw);
    for (let x = -ce(hw); x <= ce(hw); x++) {
      if (ab(x) > hw) continue;
      const px2 = cx + x * ca - y * sa, py2 = cy + x * sa + y * ca;
      /* two rings: a dark outer rim that cuts the shield away from the
         armour, then a bright bevel that gives the face its depth */
      const rim = (ab(x) > hw - 1.0) || t < 0.05 || hw < 1.5;
      const bevel = !rim && ((ab(x) > hw - 2.0) || t < 0.13);
      let col;
      if (rim) col = rimC;
      else if (bevel) col = (x < 0 || t < 0.13) ? rimHi : rimSh;
      else {
        col = field;
        if (x < -hw * 0.30) col = fieldHi;                        /* lit side */
        else if (x > hw * 0.40) col = fieldSh;                    /* shaded side */
        /* heraldic chevron — one bold band now, not two faded ones */
        const cheq = ab(x) * 0.85 + (y - 2) * 0.80;
        if (ab(cheq - 4.4) < 1.05) col = back ? P.gldS : (x < 0 ? P.gldHi : P.gld);
        else if (ab(cheq - 4.4) < 1.9) col = back ? P.clS : P.gldD;
      }
      px(g, px2, py2, col);
    }
  }
  if (!back) {
    /* rivets through the rim */
    for (const v of [[-4, -2], [4, -2], [-5, 5], [5, 5], [0, 15]]) {
      pxAt(g, at, v[0], v[1], P.stlHi);
    }
    /* central boss — the one piece of bare steel on the face, so the eye
       has something to catch even when the crimson goes dark */
    domeAt(g, at, 0, 3, 3, 3, { hi: P.stlHi, base: P.stl, sh: P.stlS }, -0.6, -0.8);
    pxAt(g, at, -1, 2, '#e2e8f0');
    /* dents, a chipped edge and rust bleeding out of a rivet */
    pxAt(g, at, -3, 9, P.clS);
    pxAt(g, at, 3, -1, P.clD);
    pxAt(g, at, 4, 8, P.rust);
    pxAt(g, at, -5, 1, P.stlD);
  }
}

/* --- helm ---------------------------------------------------------- */
function drawHelm(g, cx, cy, ang, wounded) {
  const at = orient(cx, cy, ang);
  /* neck guard sweeping back */
  segAt(g, at, -4, 2, -7, 5, 6, M_DARK);
  /* skull */
  dome(g, cx, cy - 1, 6, 6, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.55, -0.8);
  /* raised comb along the crown */
  segAt(g, at, -4, -5, 3, -6, 2, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
  /* face plate / visor */
  segAt(g, at, 1, -2, 4, 3, 8, { hi: P.stlLt, base: P.stlM, sh: P.stlD, taper: 0.3 });
  /* brow ridge */
  segAt(g, at, -2, -2, 5, -1, 2, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
  /* eye slit — deep shadow with two cold glints */
  for (let i = -2; i <= 4; i++) { pxAt(g, at, i, 1, P.stlX); }
  for (let i = -2; i <= 4; i++) { pxAt(g, at, i, 2, '#0a0c10'); }
  pxAt(g, at, 3, 1, wounded ? '#9d5a52' : '#7d8898');
  pxAt(g, at, 1, 1, wounded ? '#6d3c38' : '#5c6674');
  /* breath holes */
  pxAt(g, at, 3, 4, P.stlX); pxAt(g, at, 1, 5, P.stlX);
  /* cheek plate */
  segAt(g, at, -2, 3, 1, 6, 4, { hi: P.stlM, base: P.stlD, sh: P.stlS });
  /* tattered crimson crest */
  const crest = [[-2, -7], [-5, -8], [-8, -6], [-10, -3]];
  for (let i = 0; i < crest.length - 1; i++) {
    segAt(g, at, crest[i][0], crest[i][1], crest[i + 1][0], crest[i + 1][1], 3.4 - i * 0.7, i === 0 ? M_CLOTH : { hi: P.cl, base: P.clD, sh: P.clS });
  }
  domeAt(g, at, -1, -6, 2, 2, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  /* scratches */
  pxAt(g, at, -3, -3, P.stlS);
  pxAt(g, at, 2, -4, P.stlD);
  if (wounded) { pxAt(g, at, 0, -3, P.rust2); }
}

/* Forge armor previews deliberately reuse the knight's live material language
   but keep each item independent of a full 88×80 character bake. These helpers
   run once during buildProps(), so the modal only blits the finished props. */
function drawArmorHelmetIcon(g) {
  drawHelm(g, 12, 13, -0.16, false);
}
function drawArmorChestIcon(g) {
  /* cuirass, gorget, pauldrons, fauld and belt */
  plate(g, 12, 10, 15, 12.5, 0.03, { hi: P.stlHi, base: P.stl, sh: P.stlD, edge: P.stlX, taper: 0.26 });
  seg(g, 7, 5, 17, 5, 3.2, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  for (let i = 0; i < 2; i++) {
    plate(g, 5.5 - i * 0.4, 6.2 + i * 1.4, 6 - i, 4 - i * 0.5, -0.22, { hi: P.stlLt, base: P.stlM, sh: P.stlS, round: 1 });
    plate(g, 18.5 + i * 0.4, 6.2 + i * 1.4, 6 - i, 4 - i * 0.5, 0.22, { hi: P.stlHi, base: P.stl, sh: P.stlD, round: 1 });
  }
  seg(g, 6, 15, 18, 15, 3, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  seg(g, 7, 17, 17, 17, 2.2, M_LEA);
  for (const x of [7, 12, 17]) px(g, x, 11, P.stlHi);
  px(g, 16, 13, P.rust); px(g, 9, 8, P.stlS);
}
function drawArmorPantsIcon(g) {
  /* twin cuisses, poleyns and the two short greaves */
  seg(g, 5, 3, 19, 3, 2.6, M_LEA);
  plate(g, 8, 8, 10, 6, PI / 2, { hi: P.stlHi, base: P.stl, sh: P.stlD, edge: P.stlX, taper: 0.16 });
  plate(g, 16, 8, 10, 6, PI / 2, { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX, taper: 0.16 });
  dome(g, 8, 13, 3.2, 2.8, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);
  dome(g, 16, 13, 3.2, 2.8, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.6, -0.7);
  seg(g, 8, 15, 8, 20, 5, { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX });
  seg(g, 16, 15, 16, 20, 5, { hi: P.stlM, base: P.stlD, sh: P.stlX, edge: P.stlX });
  px(g, 7, 8, P.stlHi); px(g, 15, 8, P.stlLt); px(g, 9, 17, P.rust);
}
function drawArmorBootsIcon(g) {
  /* greaves, ankle cops and forward-projecting sabatons */
  plate(g, 8, 8, 11, 5.5, PI / 2, { hi: P.stlHi, base: P.stl, sh: P.stlD, edge: P.stlX, taper: 0.22 });
  plate(g, 16, 8, 11, 5.5, PI / 2, { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX, taper: 0.22 });
  dome(g, 8, 14, 2.8, 2.6, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);
  dome(g, 16, 14, 2.8, 2.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.6, -0.7);
  foot(g, 8, 17, 1.5, 4.3, 4.2, -0.10, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  foot(g, 16, 17, 1.5, 4.3, 4.2, 0.08, { hi: P.stlM, base: P.stlD, sh: P.stlX });
  r(g, 4, 20, 8, 2, P.stlX); r(g, 12, 20, 8, 2, P.ink2);
  px(g, 7, 7, P.stlHi); px(g, 15, 7, P.stlLt); px(g, 17, 13, P.rust);
}
const ARMOR_ICON_FINISH = Object.freeze({ rim: 0.78, rimAdd: -2, bot: 0.58 });

/* --- the head with nothing over it ---
   Everything the helm would cover is one flat ink silhouette. A face drawn in
   shadow at this size reads as a face; what this has to read as is a hole,
   and the only legible thing on it is the question. The rim `finish()` lays
   along the top edge is deliberately left alone — it is what keeps the shape
   a head rather than a gap torn in the sprite. */
function drawBareHead(g, cx, cy, ang) {
  const at = orient(cx, cy, ang);
  const VOID = { hi: P.ink2, base: P.ink, sh: P.ink, edge: P.ink };
  segAt(g, at, -4, 2, -7, 5, 6, VOID);                      /* neck */
  dome(g, cx, cy - 1, 6, 6, { hi: P.ink2, base: P.ink, sh: P.ink }, -0.55, -0.8);
  segAt(g, at, 1, -1, 4, 3, 7, { hi: P.ink2, base: P.ink, sh: P.ink, taper: 0.3 });
  segAt(g, at, -2, 3, 1, 6, 4, VOID);                       /* jaw */
  /* one shade off the void along the crown, so the top of the head has an
     edge of its own and does not dissolve into the sky behind it */
  segAt(g, at, -4, -5, 3, -6, 2, { hi: P.sky2, base: P.ink2, sh: P.ink });
  /* the question, through the same pixel font the rest of the game speaks in */
  const q = at(1, -3.5);
  text(g, '?', q[0] - 2, q[1], P.boneD, 1, 1);
}

/* --- torso, arms and legs ------------------------------------------ */
function drawKnightBody(g, ps) {
  const OX = KOX, OY = KOY;
  const hx = OX + ps.hipX, hy = OY + ps.hipY;
  /* once the body is down the cape stops hanging and pools on the stone */
  if (ps.prone) {
    for (let i = 0; i < 30; i++) {
      const t = i / 29;
      const len = 8 + t * 6 - Math.pow(t, 3) * 3;
      const yy = OY - 1 - fl(t * 5);
      for (let d = 0; d < len; d++) {
        const xx = hx - 6 - d - fl(t * 3);
        if (hn(d * 3, i, 61) > 0.90) continue;
        const fold = sin(d * 0.7 + i * 0.4);
        px(g, xx, yy, d > len - 3 ? P.clS : (fold > 0.4 ? P.cl : (fold < -0.3 ? P.clS : P.clD)));
      }
    }
  }
  const spine = 13;
  const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
  const hdx = sx + sin(ps.lean) * 7 + ps.headX, hdy = sy - cos(ps.lean) * 7 + ps.headY;

  const swx = OX + ps.swX, swy = OY + ps.swY;
  const shx = OX + ps.shX, shy = OY + ps.shY;
  const ffx = OX + ps.fFx, ffy = OY + ps.fFy;
  const fbx = OX + ps.fBx, fby = OY + ps.fBy;

  /* ---- far leg ----
     The knight is drawn facing +x, so the knee has to break toward +x too:
     `ik`'s perpendicular runs the other way, which is why both legs pass -1.
     With +1 the joint folded backwards, and the swing phase of the run came
     out as a bird's leg hooking behind the body. */
  const legB = limb(g, hx - KHIP, hy, fbx, fby, 10, 10, -1, 7, 5.4, M_FAR);   /* cuisse + greave */
  dome(g, legB.ex, legB.ey, 3, 3, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.6, -0.7);  /* poleyn */
  foot(g, legB.hx, legB.hy - 1, 1, 3, 4, ps.fBa, { hi: P.stlM, base: P.stlD, sh: P.stlX });  /* sabaton */

  /* ---- far arm (shield arm when the shield is behind) ---- */
  const armB = ik(sx - 1, sy + 2, shx, shy, 8, 8, 1);
  /* `hideShield` reads exactly like `hideSword`: the arm stays, the thing
     strapped to it does not. It is how the knight keeps a limb after the
     king takes the shield off him. */
  if (!ps.shieldFront && !ps.hideShield) drawShield(g, shx + 1, shy + 2, ps.shA, true);
  seg(g, sx - 1, sy + 2, armB.ex, armB.ey, 6, M_FAR);
  dome(g, armB.ex, armB.ey, 2.6, 2.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.6, -0.7);
  seg(g, armB.ex, armB.ey, armB.hx, armB.hy, 5, M_FAR);
  dome(g, armB.hx, armB.hy, 2.4, 2.4, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.5, -0.7);

  /* ---- sword behind the body ----
     `hideSword` hides the blade, not the arm: it means the gauntlet is
     holding something else this frame (the flask), so the limb still has to
     be drawn or the knight loses an arm for the length of the animation. */
  if (!ps.swordFront) {
    limb(g, sx + 1, sy + 2, swx, swy, 8, 8, -1, 6, 5, M_FAR);
    if (ps.heldHelm) drawHelm(g, swx, swy, ps.swA, false);
    else if (!ps.hideSword) drawSword(g, swx, swy, ps.swA, false, ps.chargeLevel, ps.chargePulse, ps.finisher);
  }

  /* ---- torso ---- */
  const lean = ps.lean;
  /* fauld (skirt of lames over the hips) */
  for (let i = 0; i < 3; i++) {
    const yy = hy + 1 - i * 2.4 + 1;
    const xx = hx + sin(lean) * (i * 1.2);
    seg(g, xx - 6 + i * 0.4, yy, xx + 6.5 - i * 0.4, yy, 3, i % 2 ? M_FAR : { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  }
  /* mail beneath the fauld */
  dith(g, hx - 5, hy + 2, 11, 3, P.stlS, P.stlD);
  /* cuirass */
  plate(g, (hx + sx) / 2 + sin(lean) * 1.0, (hy + sy) / 2, 15, 13.5, lean,
    { hi: P.stlLt, base: P.stl, sh: P.stlD, taper: 0.26 });
  /* breastplate highlight ridge */
  seg(g, sx + 1, sy + 2, hx + 2, hy - 1, 2, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
  /* chest flare / lower edge */
  seg(g, hx - 6, hy - 2, hx + 7, hy - 2.6, 2.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  /* belt */
  seg(g, hx - 6, hy - 0.5, hx + 6.5, hy - 1, 2.4, M_LEA);
  dome(g, hx + 3, hy - 1, 2, 1.6, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  /* gorget */
  seg(g, sx - 4, sy - 1, sx + 4, sy - 1.6, 3.4, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
  /* rivets, scratches, corrosion — deterministic so they never crawl */
  px(g, sx - 3, sy + 3, P.stlHi); px(g, sx + 4, sy + 3, P.stlHi);
  px(g, hx - 4, hy - 6, P.stlS); px(g, hx - 3, hy - 5, P.stlS);
  px(g, hx + 5, hy - 8, P.rust); px(g, hx + 4, hy - 9, P.rust2);
  px(g, sx + 2, sy + 6, P.stlD);
  if (ps.wounded) {
    px(g, hx + 1, hy - 7, P.bldD); px(g, hx + 2, hy - 6, P.bldD); px(g, hx + 1, hy - 5, P.bld);
    px(g, hx - 2, hy - 9, P.bldD);
  }
  /* pauldrons — layered lames, far one first */
  const pbx = sx - 4.5 + sin(lean) * 1, pby = sy - 0.5;
  for (let i = 0; i < 2; i++) plate(g, pbx - i * 0.8, pby + i * 2.2, 8 - i * 1.4, 4.2 - i * 0.5, -0.28, { hi: P.stlLt, base: P.stlM, sh: P.stlS, round: 1 });
  const pfx = sx + 4.5 + sin(lean) * 1, pfy = sy - 0.6;
  for (let i = 0; i < 3; i++) plate(g, pfx + i * 0.6, pfy + i * 2.1, 9 - i * 1.5, 4.4 - i * 0.6, 0.22, { hi: P.stlHi, base: P.stl, sh: P.stlD, round: 1 });
  px(g, pfx + 1, pfy - 1, P.stlHi);

  /* ---- head ---- */
  if (ps.bareHead) drawBareHead(g, hdx, hdy, ps.headA + lean * 0.4);
  else drawHelm(g, hdx, hdy, ps.headA + lean * 0.4, ps.wounded);

  /* ---- near leg ---- */
  const legF = ik(hx + KHIP, hy, ffx, ffy, 10, 10, -1);   /* knee forward — see far leg */
  seg(g, hx + KHIP, hy, legF.ex, legF.ey, 7.4, M_NEAR);
  dome(g, legF.ex, legF.ey, 3.2, 3.2, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);

    seg(g, armF.ex, armF.ey, armF.hx, armF.hy, 5.4, M_NEAR);

    seg(g, sx + 1.5, sy + 2.5, armS.ex, armS.ey, 6.4, M_NEAR);
    dome(g, armS.ex, armS.ey, 2.8, 2.8, { hi: P.stlHi, base: P.stl, sh: P.stlD }, -0.6, -0.7);
    seg(g, armS.ex, armS.ey, armS.hx, armS.hy, 5.4, M_NEAR);

    dome(g, armS.hx, armS.hy, 2.8, 2.8, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.5, -0.7);
    px(g, armS.hx, armS.hy - 2, P.stlHi);

       the flask: one hand, one thing in it */
    if (ps.heldHelm) drawHelm(g, swx, swy, ps.swA, false);

/* --- rolled-up ball ------------------------------------------------ */
function drawKnightRoll(g, t, strip) {
  const cx = KOX, cy = KOY - 11, a = t * TAU * 1.15 - 0.5;
  const at = orient(cx, cy, a);

  segAt(g, at, -7, 2, 3, 7, 8, M_FAR);
  /* tucked legs */
  segAt(g, at, -2, 6, 6, 3, 6.5, M_FAR);
  segAt(g, at, 6, 3, 8, -3, 5.5, M_NEAR);
  /* curled torso */
  segAt(g, at, -5, -1, 4, -3, 11, { hi: P.stlLt, base: P.stl, sh: P.stlD, round: 1 });
  /* cape wrapped round the ball */
  segAt(g, at, -8, -2, -4, 6, 6, M_CLOTH);

/* --- the cape (separate sprite so it can lag behind the body) ------- */
const CAPE_N = 9, CW = 44, CH = 52, COX = 22, COY = 7;
function buildCape(g, k) {
  const H = 30;
  for (let s = 0; s <= 46; s++) {
    const u = s / 46 * 2 - 1;
    const jag = fl(hn(s * 7, 3, 91) * 8);
    const L = H + 5 - jag - (ab(u) > 0.75 ? 4 : 0);
    for (let i = 0; i < L; i++) {
      const t = i / (H - 1);
      const off = -k * Math.pow(t, 1.5) * 15 - Math.pow(t, 2.2) * 2;
      const hw = 5.2 + t * 6.2 - Math.pow(t, 3) * 2.4;
      const x = COX + off + u * hw, y = COY + i;
      let col = P.cl;
      const fold = sin(u * 7.5 + k * 1.5) ;
      if (fold > 0.45) col = P.clHi;
      else if (fold < -0.35) col = P.clD;
      if (u > 0.62) col = P.clS;
      if (u < -0.72) col = mixc(P.clHi, P.cl, 0.35);
      if (i > L - 3) col = P.clS;
      if (t > 0.72 && hn(s * 3, i, 17) > 0.86) col = P.clS;
      px(g, x, y, col);
      if (ab(u) < 0.06 && i % 5 === 2) px(g, x, y, P.clD);
    }
  }
  /* shoulder clasp band */
  for (let x = -7; x <= 7; x++) {
    const yy = COY - 1 + (ab(x) > 5 ? 1 : 0);
    px(g, COX + x, yy, ab(x) < 2 ? P.gldD : P.leaD);
    px(g, COX + x, yy - 1, ab(x) < 2 ? P.gld : P.lea);
  }
}
function capeSprite(i) {
  return SPR.get('cape' + i, CW, CH, (g) => buildCape(g, -1 + i * (2 / (CAPE_N - 1))), { rim: 1.16, rimAdd: 8, bot: 0.72 });
}

/* ===== 7.  KNIGHT ANIMATION TABLE ============================== */
/* The one place a frame index comes off a clock. Looping tables wrap; one-shot
   tables hold their last frame however far past the end the clock has run.
   Every KA/GA/BA reader goes through this, the cutscene included — it drives
   poses straight off its own phase clock rather than through a state machine. */
function animFrame(A, t) {
  const u = t / A.dur;
  return A.loop ? fl((u % 1) * A.n) % A.n : mn(A.n - 1, fl(clamp(u, 0, 1) * A.n));
}

   farther behind the shoulder, while every hand target stays within the
   existing two-bone arm's practical reach. */

  const q = KCHARGE_HOLD[level], s = sin(t * TAU);

     shoulders and sword instead. */

        { hip: -10, lean: 0.5, hd: 2, ff: -1, fb: -7, sw: [12, -7, 2.9], sh: [-4, -11, 1.0] },

      p.shX = q.sh[0]; p.shY = q.sh[1]; p.shA = q.sh[2];
      p.swordFront = k > 2; p.capeK = -0.6 + k * 0.1; p.prone = k >= 2;
