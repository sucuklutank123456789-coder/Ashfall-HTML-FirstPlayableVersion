function knightFrame(state, i, strip, finisher) {
  /* The variant is part of the key, or a kit-less bake would overwrite the
     armed pose in the cache and the knight would lose it for good.
     `strip` is a two-bit mask — bit 1 the shield, bit 2 the sword — so the
     knight the king disarms, the knight who has not picked his kit up yet,
     and the knight carrying both are three separate bakes that cannot
     collide. Bit 1 keeps the original `_x` suffix, so every key that existed
     before the prologue did is byte-for-byte the key it always was. */
  const A = KA[state];
  /* A pose that puts the kit away itself has ONE bake, not three. Without this
     the four scene poses key three byte-identical images under three names,
     the warm queue fills the strip-0 one and drawPlayer — which asks for
     strip 3 all through the opening, because the knight has not picked his
     sword up yet — misses every time and bakes on screen. */
  const st = (A && A.kitless) ? 0 : (strip | 0);
  const fin = finisher && state === 'chargeAtk3' ? '_f' : '';
  const key = 'k_' + state + '_' + i + ((st & 1) ? '_x' : '') + ((st & 2) ? '_s' : '') + fin;
  const c = SPR.cache[key];
  if (c) return c;
  let meta;
  const cv = bakeInto(KW, KH, function (g) {
    if (state === 'roll') meta = drawKnightRoll(g, i / 6, st);
    else {
      const p = KPOSE();
      p.hideShield = !!(st & 1);
      p.hideSword = !!(st & 2);
      p.finisher = !!fin;
      p.capeK = A.cape === undefined ? 0 : A.cape;
      A.f((i + 0.5) / A.n, p);
      /* never let a pose ask for more leg than there is: `mx` only ever
         drops the hip, so poses already inside reach are left alone */
      p.hipY = mx(p.hipY, hipRide(KLEG, p.fFx - KHIP, p.fFy, p.fBx + KHIP, p.fBy));
      meta = drawKnightBody(g, p);
      meta.capeK = p.capeK; meta.prone = p.prone;
    }
  }, { rim: 1.23, rimAdd: 12, bot: 0.58 });
  const e = { n: cv, f: flipOf(cv), fl: null, w: KW, h: KH, ax: meta.ax, ay: meta.ay, prone: !!meta.prone, capeK: meta.capeK === undefined ? 0 : meta.capeK };
  SPR.cache[key] = e;
  return e;
}
/* A second, transparent bake contains only the charged edge. It lets render
   layer two previous sword poses behind the current body for a true weapon
   trail without ghosting the knight, shield or cape. */
function chargeBladeFrame(state, i, finisher) {
  const fin = finisher && state === 'chargeAtk3';
  const key = 'kb_' + state + '_' + i + (fin ? '_f' : '');
  const c = SPR.cache[key];
  if (c) return c;
  const A = KA[state];
  if (!A || !A.charge) return null;
  const p = KPOSE();
  A.f((i + 0.5) / A.n, p);
  const cv = mkcv(KW, KH), g = gc(cv);
  drawChargeBladeGlow(g, KOX + p.swX, KOY + p.swY, p.swA, p.chargeLevel, p.chargePulse, true, fin);
  const e = { n: cv, f: flipOf(cv), w: KW, h: KH, front: !!p.swordFront, pulse: p.chargePulse };
  SPR.cache[key] = e;
  return e;
}
KA.roll = { n: 6, dur: 0.46, cape: 0 };

/* ===== 8.  GOBLINS — three readable variants sharing one skeleton =
       grunt   : hooded scavenger with a rusted cleaver
       thrower : wiry, bandolier of daggers, keeps its distance
       brute   : horned iron helm, heavy axe, scraps of looted plate
   ===== */
const GW = 62, GH = 58, GOX = 31, GOY = 48;
const GHIP = 1.5, GLEG = 12.4;                 /* hip half-width, usable leg reach (of 6.5+6.5) */

const M_SKIN = { hi: P.gobHi, base: P.gob, sh: P.gobD, edge: P.gobS };
const M_SKIN_D = { hi: P.gob, base: P.gobM, sh: P.gobS, edge: P.gobS };
const M_IRON = { hi: P.stlLt, base: P.stlM, sh: P.stlS, edge: P.stlX };

/* Appearance only. Health lives in ETUNE and nowhere else: this table once
   carried an `hp` of its own that had quietly drifted out of step with it. */
const GTYPE = {
  grunt: { s: 1.00, helm: 'hood', weap: 'cleaver', cloth: P.leaD, cloth2: P.leaS },
  thrower: { s: 0.92, helm: 'bare', weap: 'dagger', cloth: '#4a3a2a', cloth2: '#2c231a' },
  brute: { s: 1.30, helm: 'iron', weap: 'axe', cloth: P.stlS, cloth2: P.stlX }
};

function GPOSE() {
  return {
    hipX: 0, hipY: -13, lean: 0.22, headX: 1.5, headY: 0, headA: 0.1,
    wX: 8, wY: -17, wA: 0.6, oX: -5, oY: -17,
    fFx: 4, fFy: 0, fBx: -4, fBy: 0, fFa: 0, fBa: 0, weapFront: true, hideW: false
  };
}

function drawGobWeapon(g, kind, hx, hy, ang) {
  const at = orient(hx, hy, ang);
  if (kind === 'cleaver') {
    segAt(g, at, -3, 0, 3, 0, 2.6, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
    segAt(g, at, 4, 0, 15, -1, 5.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: -0.35 });
    /* rust and a chipped edge */
    pxAt(g, at, 9, -2, P.rust);
    pxAt(g, at, 12, 1, P.rust2);
    pxAt(g, at, 15, -3, P.stlHi);
    pxAt(g, at, 11, -3.4, P.stlHi);
  } else if (kind === 'dagger') {
    segAt(g, at, -2, 0, 2, 0, 2.2, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
    segAt(g, at, 2.5, -2.5, 2.5, 2.5, 1.6, M_IRON);
    segAt(g, at, 3, 0, 11, 0, 2.6, { hi: P.stlHi, base: P.stlLt, sh: P.stlM, taper: 0.7 });
  } else if (kind === 'axe') {
    segAt(g, at, -6, 0, 9, 0, 3.0, { hi: P.leaHi, base: P.lea, sh: P.leaD });
    for (let i = -4; i <= 6; i += 3) { pxAt(g, at, i, 0, P.leaS); }
    /* head of the axe: a broad crescent */
    segAt(g, at, 11, -6, 11, 6, 3.4, M_IRON);
    segAt(g, at, 15, -5, 15, 5, 3.0, { hi: P.stlHi, base: P.stlLt, sh: P.stlM });
    segAt(g, at, 9, -4, 9, 4, 3.0, { hi: P.stlM, base: P.stlD, sh: P.stlX });
    pxAt(g, at, 12, 2, P.rust);
    pxAt(g, at, 13, -3, P.rust2);
    pxAt(g, at, 14, 4, P.bldS);
    /* butt spike */
    segAt(g, at, -6, 0, -9, 0, 2, { hi: P.stlM, base: P.stlD, sh: P.stlX, taper: 0.8 });
  }
}

function drawGobHead(g, cx, cy, ang, cfg) {
  const at = orient(cx, cy, ang);
  const s = cfg.s;
  /* ears — long, pointed, one notched */
  segAt(g, at, -2, -1, -9, -6, 3.4 * s, { hi: P.gobHi, base: P.gobM, sh: P.gobS, taper: 0.85 });
  segAt(g, at, -1, 0, -6, 4, 3.0 * s, { hi: P.gob, base: P.gobD, sh: P.gobS, taper: 0.85 });
  /* skull */
  dome(g, cx, cy, 5 * s, 4.6 * s, { hi: P.gobHi, base: P.gob, sh: P.gobD }, -0.5, -0.8);
  /* brow */
  segAt(g, at, -1, -2, 4, -1.5, 2.2 * s, { hi: P.gobHi, base: P.gobM, sh: P.gobD });
  /* long hooked nose */
  segAt(g, at, 3, 0.5, 7.5, 2, 3 * s, { hi: P.gobHi, base: P.gob, sh: P.gobD, taper: 0.6 });
  /* eyes — sunken sockets with sickly yellow points */
  pxAt(g, at, 2.5, -0.2, P.gobS); pxAt(g, at, 0.2, -0.2, P.gobS);
  pxAt(g, at, 2.6, -0.4, '#c9b24a');
  pxAt(g, at, 0.4, -0.4, '#9a8636');
  /* jaw + teeth */
  segAt(g, at, 0, 3, 4.5, 3.2, 3 * s, { hi: P.gob, base: P.gobD, sh: P.gobS });
  pxAt(g, at, 3.6, 2.2, P.bone);
  pxAt(g, at, 1.6, 2.6, P.boneD);
  /* headgear */
  if (cfg.helm === 'hood') {
    for (let i = 0; i < 3; i++) {
      segAt(g, at, -1 + i * 0.4, -5 - i * 0.2, -7 - i, -3 + i * 2.2, (5 - i) * s, i ? { hi: cfg.cloth, base: cfg.cloth2, sh: P.ink2 } : { hi: P.leaHi, base: cfg.cloth, sh: cfg.cloth2 });
    }
    segAt(g, at, -1, -5, 4, -3.5, 3.2 * s, { hi: P.leaHi, base: cfg.cloth, sh: cfg.cloth2 });
    pxAt(g, at, -9, 4, cfg.cloth2);
  } else if (cfg.helm === 'iron') {
    /* horned iron skullcap */
    dome(g, cx + cos(ang) * 0.5, cy - 4.2 * s, 5.4 * s, 3.2 * s, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.5, -0.9);
    segAt(g, at, -5, -4, 5, -5, 2 * s, { hi: P.stlLt, base: P.stlD, sh: P.stlX });
    segAt(g, at, -2, -6, -7, -12, 3.2 * s, { hi: P.boneD, base: '#6b6555', sh: '#3f3b31', taper: 0.85 });
    segAt(g, at, 3, -6.5, 7, -11, 2.8 * s, { hi: P.bone, base: P.boneD, sh: '#4a463a', taper: 0.85 });
    pxAt(g, at, 3, -4, P.stlHi);
    pxAt(g, at, -3, -3, P.rust);
  } else {
    /* bare skull with lank hair and a bone piercing */
    for (let i = 0; i < 4; i++) {
      segAt(g, at, -1 - i, -4.5 + i * 0.3, -5 - i * 1.4, -1 + i * 1.6, 1.6, { hi: '#4a4436', base: '#332f26', sh: '#211e18' });
    }
    pxAt(g, at, 6, 2.6, P.bone);
    pxAt(g, at, 1, -3, P.gobS);
  }
}

function drawGoblin(g, cfg) {
  return function (ps) {
    const s = cfg.s;
    const hx = GOX + ps.hipX * s, hy = GOY + ps.hipY * s;
    const spine = 9 * s;
    const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
    const hdx = sx + sin(ps.lean) * 5 * s + ps.headX * s, hdy = sy - cos(ps.lean) * 5 * s + ps.headY * s;
    const wx = GOX + ps.wX * s, wy = GOY + ps.wY * s;
    const ox = GOX + ps.oX * s, oy = GOY + ps.oY * s;
    const ffx = GOX + ps.fFx * s, ffy = GOY + ps.fFy * s;
    const fbx = GOX + ps.fBx * s, fby = GOY + ps.fBy * s;
    const L1 = 6.5 * s, L2 = 6.5 * s, A1 = 6 * s, A2 = 6 * s;

    /* far leg */
    const lb = limb(g, hx - GHIP * s, hy, fbx, fby, L1, L2, 1, 4.6 * s, 3.6 * s, M_SKIN_D);
    foot(g, lb.hx, lb.hy - 0.8, 1, 2.6 * s, 2.6 * s, ps.fBa, { hi: P.gobM, base: P.gobD, sh: P.gobS });
    /* far arm */
    const ab2 = limb(g, sx - 1 * s, sy + 1.5 * s, ox, oy, A1, A2, 1, 3.8 * s, 3.2 * s, M_SKIN_D);
    if (cfg.helm === 'iron') { /* the brute wraps its off hand in chain */
      dith(g, ab2.hx - 2, ab2.hy - 2, 4, 4, P.stlD, P.stlS);
    }
    if (!ps.weapFront && !ps.hideW) {
      drawGobWeapon(g, cfg.weap, wx, wy, ps.wA);
      limb(g, sx + s, sy + 1.5 * s, wx, wy, A1, A2, -1, 3.8 * s, 3.2 * s, M_SKIN_D);
    }
    /* torso — hunched, ribbed */
    plate(g, (hx + sx) / 2, (hy + sy) / 2, 11 * s, 9.4 * s, ps.lean + PI / 2, { hi: P.gobHi, base: P.gob, sh: P.gobD, taper: 0.2 });
    /* ribs / collarbone hints */
    px(g, sx - 2 * s, sy + 3 * s, P.gobD); px(g, sx + 2 * s, sy + 3.4 * s, P.gobD);
    px(g, sx - 1, sy + 5 * s, P.gobD);
    /* looted armour scraps */
    if (cfg.helm === 'iron') {
      for (let i = 0; i < 3; i++) plate(g, sx + 3.4 * s + i * 0.5, sy + 0.4 * s + i * 2 * s, (8 - i * 1.4) * s, 3.6 * s, 0.25, { hi: P.stlLt, base: P.stlM, sh: P.stlS, round: 1 });
      dith(g, hx - 4 * s, hy - 5 * s, 8 * s, 5 * s, P.stlS, P.stlD);
      seg(g, hx - 5 * s, hy - 1, hx + 5 * s, hy - 1, 2.6 * s, { hi: P.stlM, base: P.stlD, sh: P.stlX });
    } else {
      /* leather harness crossing the chest */
      seg(g, sx - 4 * s, sy + 6 * s, sx + 4.5 * s, sy + 1 * s, 2.4 * s, { hi: P.leaHi, base: P.lea, sh: P.leaD });
      seg(g, hx - 4.5 * s, hy - 1, hx + 4.5 * s, hy - 1.4, 2.4 * s, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
      px(g, hx + 1.5 * s, hy - 1, P.bronze);
      if (cfg.weap === 'dagger') {
        /* bandolier of throwing knives */
        for (let i = 0; i < 3; i++) {
          const bx = sx - 2 * s + i * 2.2 * s, by = sy + 5 * s - i * 1.6 * s;
          seg(g, bx, by, bx + 0.5, by - 3.4 * s, 1.6, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.5 });
        }
      }
      /* loin cloth */
      for (let i = 0; i < 2; i++) seg(g, hx - 3 * s + i * 3 * s, hy + 1, hx - 3.4 * s + i * 3 * s, hy + 5 * s, 3 * s, { hi: cfg.cloth, base: cfg.cloth2, sh: P.ink2 });
    }
    /* head */
    drawGobHead(g, hdx, hdy, ps.headA + ps.lean * 0.35, cfg);
    /* near leg */
    const lf = limb(g, hx + GHIP * s, hy, ffx, ffy, L1, L2, 1, 5 * s, 3.8 * s, M_SKIN);
    if (cfg.helm === 'iron') { /* iron greave on the leading shin */
      seg(g, lf.ex, lf.ey, lf.hx, lf.hy, 3.0 * s, { hi: P.stlLt, base: P.stlM, sh: P.stlS });
    } else { /* rag wrappings */
      dith(g, lf.ex - 2, lf.ey + 1, 4, 3, cfg.cloth, cfg.cloth2);
    }
    foot(g, lf.hx, lf.hy - 0.8, 1.2, 3 * s, 3 * s, ps.fFa, { hi: P.gobHi, base: P.gob, sh: P.gobD });
    px(g, lf.hx + 3 * s * cos(ps.fFa), lf.hy - 1.6 + 3 * s * sin(ps.fFa), P.boneD);   /* claw */
    /* near arm + weapon */
    if (ps.weapFront) {
      const aw = limb(g, sx + s, sy + 1.5 * s, wx, wy, A1, A2, -1, 4.2 * s, 3.4 * s, M_SKIN);
      px(g, aw.ex, aw.ey - 2, P.gobHi);
      if (!ps.hideW) drawGobWeapon(g, cfg.weap, wx, wy, ps.wA);
    }
  };
}

/* --- goblin animation table ---------------------------------------- */
const GA = {
  idle: {
    n: 4, dur: 1.6, loop: 1, f(t, p) {
      const s = sin(t * TAU);
      p.hipY = -13 + s * 0.5; p.lean = 0.24 + s * 0.03;
      p.wY = -16 + s * 0.6; p.wA = 0.7; p.oY = -16 + s * 0.4;
      p.headX = 1.6 + s * 0.3; p.headA = 0.12 + s * 0.05;
      p.fFx = 4; p.fBx = -4.5;
    }
  },
  walk: {
    n: 8, dur: 0.66, loop: 1, f(t, p) {
      const ph = t * TAU;
      stride(p, t, GHIP, GLEG, 5.2, 3.4, 0.62, 3, 2.6);
      p.lean = 0.20;
      p.headX = 1.6; p.headY = 0.3 * cos(ph);
      p.wX = 7 - 2.6 * sin(ph); p.wY = p.hipY - 3; p.wA = 0.8 - 0.2 * sin(ph);
      p.oX = -5 + 2.6 * sin(ph); p.oY = p.hipY - 3;
    }
  },
  run: {
    n: 8, dur: 0.42, loop: 1, f(t, p) {
      const ph = t * TAU;
      stride(p, t, GHIP, GLEG, 6.3, 4.4, 0.46, 3, 2.6);
      p.lean = 0.32;
      p.headX = 2.2; p.headY = 0.4 * cos(ph); p.headA = -0.1;
      p.wX = 8 - 3.6 * sin(ph); p.wY = p.hipY - 2.5; p.wA = 0.5 - 0.3 * sin(ph);
      p.oX = -6 + 3.6 * sin(ph); p.oY = p.hipY - 3.5;
    }
  },
  wind: {
    n: 3, dur: 0.42, f(t, p) {
      const k = mn(2, fl(t * 3));
      p.lean = -0.10 - k * 0.06; p.hipY = -12.5;
      p.fFx = 3.5; p.fBx = -6 - k * 0.5;
      p.wX = -1 - k * 2.5; p.wY = -22 - k * 2; p.wA = -1.9 - k * 0.35; p.weapFront = false;
      p.oX = -5; p.oY = -15; p.headX = 1 - k * 0.3; p.headA = -0.16;
    }
  },
  atk: {
    n: 4, dur: 0.34, f(t, p) {
      const k = mn(3, fl(t * 4));
      const key = [
        { w: [4, -24, -1.2], lean: 0.15, ff: 5, fb: -5, front: 1 },
        { w: [11, -17, -0.15], lean: 0.48, ff: 7.5, fb: -4.5, front: 1 },
        { w: [12, -12, 0.55], lean: 0.55, ff: 7.5, fb: -4.5, front: 1 },
        { w: [9, -14, 0.7], lean: 0.34, ff: 6, fb: -4.5, front: 1 }
      ][k];
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.lean = key.lean; p.fFx = key.ff; p.fBx = key.fb; p.hipY = -13;
      p.headX = 2.4; p.headA = 0.2; p.oX = -5.5; p.oY = -17;
    }
  },
  throw: {
    n: 4, dur: 0.46, f(t, p) {
      const k = mn(3, fl(t * 4));
      const key = [
        { w: [-2, -22, -2.3], lean: -0.14, front: 0, ff: 4, hd: 1 },
        { w: [-4, -24, -2.6], lean: -0.22, front: 0, ff: 4, hd: 0.6 },
        { w: [8, -21, -0.5], lean: 0.30, front: 1, ff: 6, hd: 2.4 },
        { w: [11, -19, 0.1], lean: 0.36, front: 1, ff: 6.5, hd: 2.6 }
      ][k];
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.lean = key.lean; p.weapFront = !!key.front; p.fFx = key.ff; p.fBx = -5;
      p.headX = key.hd; p.hipY = -13; p.hideW = k >= 3;
      p.oX = -4; p.oY = -18;
    }
  },
  guard: {
    n: 2, dur: 0.5, loop: 1, f(t, p) {
      const s = t < 0.5 ? 0 : 1;
      p.lean = -0.08; p.hipY = -12.5 + s * 0.3; p.fFx = 5; p.fBx = -6;
      p.wX = -4; p.wY = -14; p.wA = 1.6; p.weapFront = false;
      p.oX = 6; p.oY = -19; p.headX = 0.8;
    }
  },
  hurt: {
    n: 2, dur: 0.26, f(t, p) {
      const s = t < 0.5 ? 1 : 0.55;
      p.lean = -0.30 * s; p.hipY = -12.4; p.headX = -1.4 * s; p.headA = -0.4 * s;
      p.fFx = 2.5; p.fBx = -6.5;
      p.wX = 7 + s * 2; p.wY = -13; p.wA = 1.5; p.oX = -6 - s; p.oY = -14;
    }
  },
  die: {
    n: 5, dur: 0.62, f(t, p) {
      const k = mn(4, fl(t * 5));
      const key = [
        { hip: -12, lean: -0.4, hd: -2, w: [8, -12, 2.0], o: [-6, -12, 0], ff: 2, fb: -7 },
        { hip: -9, lean: -0.7, hd: -3, w: [10, -8, 2.6], o: [-7, -9, 0], ff: 0, fb: -8 },
        { hip: -6, lean: -1.0, hd: -4, w: [11, -4, 2.9], o: [-8, -5, 0], ff: -2, fb: -8 },
        { hip: -3.5, lean: -1.3, hd: -5, w: [11, -2, 3.1], o: [-9, -2, 0], ff: -4, fb: -7 },
        { hip: -2.5, lean: -1.45, hd: -5.5, w: [11, -1, 3.14], o: [-9, -1, 0], ff: -5, fb: -6 }
      ][k];
      p.hipY = key.hip; p.lean = key.lean; p.headX = key.hd; p.headA = key.lean * 0.6;
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.oX = key.o[0]; p.oY = key.o[1];
      p.fFx = key.ff; p.fBx = key.fb; p.fFy = 0; p.fBy = 0; p.weapFront = true;
    }
  }
};

const GOB_FIN = { rim: 1.22, rimAdd: 11, bot: 0.58 };
/* The `||` matters: SPR.get's arguments — the builder closure included — are
   only evaluated when the cache misses, and this is called for every goblin
   on screen every frame. */
function gobFrame(type, state, i) {
  const key = 'g_' + type + '_' + state + '_' + i;
  return SPR.cache[key] || SPR.get(key, GW, GH, function (g) {
    const cfg = GTYPE[type], A = GA[state], p = GPOSE();
    A.f((i + 0.5) / A.n, p);
    p.hipY = mx(p.hipY, hipRide(GLEG, p.fFx - GHIP, p.fFy, p.fBx + GHIP, p.fBy));
    drawGoblin(g, cfg)(p);
  }, GOB_FIN);
}

/* --- thrown dagger ------------------------------------------------- */
function daggerSprite(i) {
  return SPR.get('dag' + i, 20, 20, (g) => {
    const a = i / 8 * TAU;
    drawGobWeapon(g, 'dagger', 10 - cos(a) * 3, 10 - sin(a) * 3, a);
  }, { rim: 1.2, bot: 0.7 });
}

/* ===== 9.  GRULLK, THE GOBLIN KING =============================
   Twice the height of his kin, wrapped in looted plate, a bent crown of
   tarnished gold, and a mace that drags his whole body behind it.
   ===== */
const BW = 176, BH = 168, BOX = 84, BOY = 138;
/* Grullk is broad, but his old 12px stride around a 14px-wide pair of hip
   pivots made both legs cross through the centre of the body. Keeping the
   usable reach close to the full 40px straightens the planted leg without
   locking the knee, while the narrower gait below leaves each foot on its
   own side of the pelvis. */
const BHIP = 7, BLEG = 39.2;                   /* hip half-width, usable leg reach (of 20+20) */

const M_KSKIN = { hi: '#5f6d38', base: '#47542a', sh: '#2d3719', edge: '#1c2410' };
const M_KSKIN_D = { hi: '#3f4a24', base: '#303a1b', sh: '#1e2611', edge: '#141a0b' };
const M_KIRON = { hi: P.stlLt, base: P.stlD, sh: P.stlX, edge: P.stlX };
const M_KIRON2 = { hi: P.stlHi, base: P.stlM, sh: P.stlS, edge: P.stlX };
const M_FUR = { hi: '#4a4034', base: '#332c23', sh: '#211c16', edge: '#161310' };
const M_KPLATE = { hi: '#a4adb8', base: '#59616c', sh: '#292f38', edge: '#15191f' };
const M_KPLATE_D = { hi: '#69727d', base: '#3b424c', sh: '#20252d', edge: '#111419' };

function BPOSE() {
  return {
    hipX: 0, hipY: -40, lean: 0.16, headX: 3, headY: 0, headA: 0.08,
    mX: 22, mY: -52, mA: 0.9, oX: -16, oY: -50,
    fFx: 9, fFy: 0, fBx: -10, fBy: 0, fFa: 0, fBa: 0, maceFront: true, capeK: 0, jaw: 0, crownTilt: 0
  };
}

function drawMace(g, hx, hy, ang) {
  const at = orient(hx, hy, ang);
  /* haft — dark timber bound with iron */
  segAt(g, at, -10, 0, 30, 0, 6, { hi: '#5a4a35', base: '#3a2f22', sh: '#241d15', edge: '#1a140f' });
  for (let d = -6; d <= 24; d += 8) {
    segAt(g, at, d, -3.4, d, 3.4, 2.4, M_KIRON2);
  }
  /* butt cap + hanging chain */
  domeAt(g, at, -11, 0, 3.4, 3.4, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.5, -0.8);
  for (let i = 0; i < 4; i++) { pxAt(g, at, -12 - i * 1.2, 3 + i * 2.6, i % 2 ? P.stlM : P.stlS); }
  /* head — a heavy iron block */
  segAt(g, at, 30, 0, 44, 0, 17, { hi: P.stlLt, base: P.stlD, sh: P.stlX });
  segAt(g, at, 32, 0, 42, 0, 13, { hi: P.stlM, base: P.stlS, sh: P.stlX });
  /* royal band of tarnished gold */
  segAt(g, at, 36, -8.5, 36, 8.5, 3, { hi: P.gldHi, base: P.gld, sh: P.gldS });
  /* spikes */
  const sp = [[46, 0, 0], [42, -10, -0.9], [42, 10, 0.9], [33, -11, -2.2], [33, 11, 2.2]];
  for (const s of sp) {
    segAt(g, at, s[0], s[1], s[0] + cos(s[2]) * 8, s[1] + sin(s[2]) * 8, 5.4,
      { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.88 });
  }
  /* rust, gore and battle wear */
  pxAt(g, at, 35, 4, P.rust);
  pxAt(g, at, 39, -5, P.rust2);
  pxAt(g, at, 41, 6, P.bldS);
  pxAt(g, at, 38, 2, P.stlHi);
}

function drawCrown(g, cx, cy, ang) {
  const at = orient(cx, cy, ang);
  /* band */
  segAt(g, at, -9, 0, 9, -1, 5, { hi: P.gldHi, base: P.gld, sh: P.gldD });
  /* points — one snapped off, one bent */
  const pts = [[-8, -1, -6, -9], [-4, -2, -3.5, -11], [0, -2, 0, -13], [4, -2, 5.5, -10], [8, -1, 10, -5]];
  for (let i = 0; i < pts.length; i++) {
    const q = pts[i];
    segAt(g, at, q[0], q[1], q[2], q[3], i === 2 ? 4.4 : 3.6, i === 4
      ? { hi: P.gldD, base: P.gldS, sh: P.gldS, taper: 0.7 }
      : { hi: P.gldHi, base: P.gld, sh: P.gldD, taper: 0.55 });
    if (i !== 4) { pxAt(g, at, q[2], q[3] - 1, P.gldHi); }
  }
  /* set stones: one blood-red, one missing */
  pxAt(g, at, 0, -1, P.bld);
  pxAt(g, at, -4, -1, P.gldS);
  pxAt(g, at, 4, -1, P.clD);
  /* tarnish */
  pxAt(g, at, -7, 1, P.gldS);
  pxAt(g, at, 6, 0, P.bronzeD);
}

function drawKingHead(g, cx, cy, ang, jaw, crownTilt) {
  const at = orient(cx, cy, ang);
  /* ears, torn and pierced */
  segAt(g, at, -4, -2, -16, -10, 6.4, { hi: '#5f6d38', base: '#3a4520', sh: '#1e2611', taper: 0.8 });
  segAt(g, at, -3, 1, -13, 7, 5.6, { hi: '#47542a', base: '#2a3318', sh: '#19200e', taper: 0.8 });
  pxAt(g, at, -11, -7, P.gld);
  pxAt(g, at, -9, 4, P.bronze);
  /* skull */
  dome(g, cx, cy, 10, 9, { hi: '#5f6d38', base: '#47542a', sh: '#2a3318' }, -0.5, -0.8);
  /* heavy brow */
  segAt(g, at, -3, -4, 8, -3, 5, { hi: '#6b7a3e', base: '#47542a', sh: '#2a3318' });
  /* eyes — deep sockets, sickly amber */
  for (const ex of [[6, -0.5], [1.5, -0.6]]) {
    const s = at(ex[0], ex[1]);
    r(g, s[0] - 1, s[1] - 1, 3, 3, '#232a12');
  }
  const y0 = at(6, -1);
  px(g, y0[0], y0[1], '#e0c258'); px(g, y0[0] - 1, y0[1], '#a8902f');
  pxAt(g, at, 1.5, -1, '#c9ab45');
  /* broad hooked nose */
  segAt(g, at, 5, 1, 12, 3.5, 5.4, { hi: '#5f6d38', base: '#414d22', sh: '#2a3318', taper: 0.5 });
  /* jaw, tusks */
  segAt(g, at, -1, 6 + jaw, 8, 6.5 + jaw, 6.4, { hi: '#4f5c2c', base: '#333d1c', sh: '#1e2611' });
  const tk = [[7, 3.6 + jaw], [3, 4.2 + jaw], [5, 4 + jaw]];
  for (let i = 0; i < 3; i++) {
    segAt(g, at, tk[i][0], tk[i][1], tk[i][0] + 0.6, tk[i][1] - 4 - (i === 0 ? 2 : 0), i === 0 ? 3.4 : 2.4, { hi: '#e2dcc4', base: P.bone, sh: P.boneD, taper: 0.7 });
  }
  if (jaw > 0.5) { let m = at(3, 7); r(g, m[0] - 3, m[1] - 1, 7, 3, '#1a1408'); }
  /* scars */
  pxAt(g, at, 2, -5, '#8a5a4a'); pxAt(g, at, 3, -4, '#8a5a4a');
  pxAt(g, at, 4, -3, '#6d4436');
  /* warpaint smear */
  dith(g, cx - 4, cy - 2, 5, 2, '#2a3318', P.bldD);
  /* crown */
  const cr = at(1, -10);
  drawCrown(g, cr[0], cr[1], ang + crownTilt);
}

function drawKing(g, ps) {
  const hx = BOX + ps.hipX, hy = BOY + ps.hipY;
  const spine = 26;
  const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
  const hdx = sx + sin(ps.lean) * 13 + ps.headX, hdy = sy - cos(ps.lean) * 13 + ps.headY;
  const mx2 = BOX + ps.mX, my2 = BOY + ps.mY;
  const ox = BOX + ps.oX, oy = BOY + ps.oY;
  const ffx = BOX + ps.fFx, ffy = BOY + ps.fFy;
  const fbx = BOX + ps.fBx, fby = BOY + ps.fBy;

  /* ---- ruined royal cape: absolute back layer ----
     Drawn before every limb and armour piece, and centred on the spine so
     Grullk's complete silhouette always composites in front of the cloth. */
  const k = ps.capeK;
  for (let s = 0; s <= 40; s++) {
    const u = s / 40 * 2 - 1;
    const jag = fl(hn(s * 5, 11, 47) * 12);
    const L = 58 - jag - (ab(u) > 0.8 ? 10 : 0);
    for (let i = 0; i < L; i++) {
      const t = i / 56;
      const off = -k * Math.pow(t, 1.5) * 10 - Math.pow(t, 2.2) * 2 - 6;
      const hw = 12 + t * 11 - Math.pow(t, 3) * 4;
      const fold = sin(u * 6 + k);
      let col = fold > 0.4 ? P.cl : (fold < -0.3 ? P.clS : P.clD);
      if (u > 0.6) col = P.clS;
      if (i > L - 4) col = P.clS;
      if (hn(s * 3, i, 23) > 0.9) col = P.clS;
      px(g, sx + off + u * hw, sy - 4 + i, col);
    }
  }
  /* ---- far leg: a planted, armoured column rather than a green zig-zag ----
     Grullk faces +x in the source sprite, so -1 bends the knee toward the
     direction he is looking. +1 folded it behind him, the same IK mistake the
     knight once had, and the broad plates amplified it into a broken-looking
     leg. Skin remains at the joints; every load-bearing surface is looted iron. */
  const lb = ik(hx - BHIP, hy, fbx, fby, 20, 20, -1);
  seg(g, hx - BHIP, hy, lb.ex, lb.ey, 14.5, M_KSKIN_D);
  seg(g, hx - BHIP - 0.5, hy - 1, lb.ex, lb.ey - 1, 10.5, M_KPLATE_D);
  dome(g, lb.ex, lb.ey, 6.2, 5.5, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.6, -0.8);
  r(g, lb.ex - 4, lb.ey - 1, 8, 2, P.stlS);
  px(g, lb.ex - 2, lb.ey - 3, P.rust); px(g, lb.ex + 3, lb.ey, P.stlLt);
  seg(g, lb.ex, lb.ey, lb.hx, lb.hy, 10.5, M_KSKIN_D);
  seg(g, lb.ex + 0.5, lb.ey + 2, lb.hx, lb.hy - 2, 8.2, M_KPLATE_D);
  for (let i = 0; i < 3; i++) {
    const t = 0.26 + i * 0.24;
    const qx = lb.ex + (lb.hx - lb.ex) * t, qy = lb.ey + (lb.hy - lb.ey) * t;
    seg(g, qx - 4, qy, qx + 4, qy - 1, 2.2, i === 1 ? M_GOLD : M_LEA);
  }
  foot(g, lb.hx, lb.hy - 2, 3, 8, 5.4, ps.fBa, M_KPLATE_D);
  px(g, lb.hx + 5 * cos(ps.fBa), lb.hy - 3 + 5 * sin(ps.fBa), P.stlM);

  /* ---- severed off arm ----
     The empty arm no longer reaches a hand target. Only a short upper-arm
     stump survives under the pauldron, capped by torn leather, dried blood
     and one pale bone pixel. oX/oY still steer its attitude in every existing
     pose, so attacks keep their old shoulder motion without growing a limb. */
  const osx = sx - 6, osy = sy + 4;
  const oa = atan2(oy - osy, ox - osx);
  const stx = osx + cos(oa) * 15.5, sty = osy + sin(oa) * 15.5;
  seg(g, osx, osy, stx, sty, 11.5, M_KSKIN_D);
  seg(g, osx + cos(oa) * 3, osy + sin(oa) * 3, stx - cos(oa) * 1.5, sty - sin(oa) * 1.5, 8.2, M_FUR);
  dome(g, stx, sty, 4.8, 4.2, { hi: '#4f2b25', base: P.bldD, sh: P.bldS }, -0.6, -0.8);
  seg(g, stx - sin(oa) * 4.2, sty + cos(oa) * 4.2,
    stx + sin(oa) * 4.2, sty - cos(oa) * 4.2, 2.2, { hi: P.lea, base: P.leaD, sh: P.leaS });
  px(g, stx + cos(oa), sty + sin(oa), P.bone);
  /* mace behind the body during the wind-up */
  if (!ps.maceFront) {
    drawMace(g, mx2, my2, ps.mA);
    limb(g, sx + 6, sy + 4, mx2, my2, 14, 13, -1, 11, 9, M_KSKIN_D);
  }
  /* ---- rebuilt torso: mail foundation, asymmetric cuirass, plated belly ---- */
  plate(g, (hx + sx) / 2 + sin(ps.lean) * 2, (hy + sy) / 2 + 2, 31, 31,
    ps.lean + PI / 2, { hi: '#687641', base: '#47542a', sh: '#252e16', taper: -0.22, round: 0 });
  /* chain mail is allowed to show at the armpits and waist so the armour is
     assembled rather than painted as one flat grey shape */
  dith(g, sx - 13, sy + 2, 26, 12, P.stlS, P.stlD);
  dith(g, hx - 14, hy - 10, 29, 14, P.stlD, P.stlS);
  /* a high, asymmetric breastplate: brighter on the mace side, broken away
     toward the missing arm. The centre ridge and separate lower lames make
     the torso readable even against the arena wall. */
  plate(g, sx + 4, sy + 7, 24, 24, ps.lean + PI / 2, M_KPLATE);
  plate(g, sx - 6, sy + 8, 18, 10, ps.lean + PI / 2 + 0.08, M_KPLATE_D);
  seg(g, sx + 2, sy - 2, hx + 3, hy - 12, 3.2, { hi: P.stlHi, base: P.stlLt, sh: P.stlD });
  for (let i = 0; i < 4; i++) {

      i % 2 ? M_KPLATE_D : M_KPLATE);

    px(g, hx + 9 - inset, yy - 2, i === 2 ? P.rust : P.stlM);
  }

     points into the hand that carries the mace */
  seg(g, sx + 10, sy + 1, hx - 7, hy - 1, 4.2, { hi: P.leaHi, base: P.lea, sh: P.leaS });
  for (let i = 0; i < 4; i++) {

    dome(g, sx + 10 + (hx - 7 - sx - 10) * t, sy + 1 + (hy - 1 - sy - 1) * t,
      1.4, 1.4, { hi: P.gldHi, base: P.gldD, sh: P.gldS }, -0.5, -0.8);
  }
  /* chain skirt with overlapping iron tassets */
  dith(g, hx - 14, hy + 1, 28, 11, P.stlS, P.stlD);
  for (let i = 0; i < 5; i++) {
    const tx = hx - 13 + i * 6;
    plate(g, tx, hy + 8, 10, 5.2, PI / 2 + (i - 2) * 0.05, i % 2 ? M_KPLATE_D : M_KIRON);
    px(g, tx, hy + 4, P.gldD);
  }
  /* wide double belt and battered royal buckle */
  seg(g, hx - 14, hy - 1, hx + 14, hy - 2, 6.2, { hi: P.leaHi, base: P.lea, sh: P.leaS });
  seg(g, hx - 13, hy + 2, hx + 13, hy + 1, 2.2, { hi: P.gldD, base: P.bronze, sh: P.gldS });
  dome(g, hx + 3, hy - 1.5, 4.5, 3.5, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  px(g, hx + 2, hy - 2, P.bldD); px(g, hx + 5, hy, P.rust2);
  /* trophy: a knight's helm hanging from the belt */
  dome(g, hx - 11, hy + 3, 4, 4, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.5, -0.7);
  r(g, hx - 13, hy + 3, 5, 1, P.stlX);
  /* fur mantle over the shoulders */
  for (let i = 0; i < 9; i++) {
    const a = -0.5 + i * 0.32, rr = 15 + (i % 2) * 3;
    seg(g, sx - 2 + cos(a + PI) * 4, sy - 2, sx + cos(a + PI) * rr, sy - 2 + sin(a) * 8 + 4, 7, M_FUR);
  }
  plate(g, sx, sy - 2, 30, 12, ps.lean, M_FUR);
  /* bone necklace */
  for (let i = -3; i <= 3; i++) {
    const a = i * 0.34;
    px(g, sx + sin(a) * 10 + 1, sy + 6 + cos(a) * 3, P.boneD);
    if (i % 2 === 0) px(g, sx + sin(a) * 10 + 1, sy + 7 + cos(a) * 3, P.bone);
  }
  /* pauldrons — spiked, looted */
  for (let i = 0; i < 3; i++) plate(g, sx - 13 - i * 0.6, sy - 1 + i * 4, 19 - i * 3, 8 - i * 1.2, -0.25, { hi: P.stlM, base: P.stlD, sh: P.stlX, round: 1 });
  for (let i = 0; i < 3; i++) plate(g, sx + 14 + i * 0.8, sy - 1 + i * 4.2, 21 - i * 3, 9 - i * 1.2, 0.22, { hi: P.stlHi, base: P.stlM, sh: P.stlS, round: 1 });
  seg(g, sx + 14, sy - 5, sx + 20, sy - 12, 5, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.85 });
  seg(g, sx - 13, sy - 4, sx - 18, sy - 10, 4.4, { hi: P.stlM, base: P.stlD, sh: P.stlX, taper: 0.85 });

     physically behind the body, but its silhouette and wound must remain
     readable or it merely looks like a hidden hand. */
  dome(g, stx, sty, 5.2, 4.6, { hi: '#6b352d', base: P.bldD, sh: P.bldS }, -0.6, -0.8);
  seg(g, stx - sin(oa) * 4.5, sty + cos(oa) * 4.5,
    stx + sin(oa) * 4.5, sty - cos(oa) * 4.5, 2.4, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
  px(g, stx + cos(oa), sty + sin(oa), P.bone);

  drawKingHead(g, hdx, hdy, ps.headA + ps.lean * 0.3, ps.jaw, ps.crownTilt);

  const lf = ik(hx + BHIP, hy, ffx, ffy, 20, 20, -1);

  seg(g, hx + BHIP + 0.5, hy - 1, lf.ex, lf.ey - 1, 11.5, M_KPLATE);

  for (let i = 0; i < 2; i++) {

      12.2 - i, i ? M_KPLATE_D : M_KPLATE);
  }
  dome(g, lf.ex, lf.ey, 6.8, 6.2, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.8);
  r(g, lf.ex - 5, lf.ey - 1, 10, 2, P.stlD);
  px(g, lf.ex - 2, lf.ey - 4, P.stlHi); px(g, lf.ex + 4, lf.ey + 1, P.rust);
  seg(g, lf.ex, lf.ey, lf.hx, lf.hy, 12, M_KSKIN);
  seg(g, lf.ex + 1, lf.ey + 2, lf.hx + 1, lf.hy - 3, 9.5, M_KPLATE);
  for (let i = 0; i < 3; i++) {
    const t = 0.30 + i * 0.23;
    const qx = lf.ex + (lf.hx - lf.ex) * t, qy = lf.ey + (lf.hy - lf.ey) * t;
    seg(g, qx - 4.5, qy, qx + 4.5, qy - 1, 2.1, i === 0 ? M_GOLD : M_LEA);
  }
  foot(g, lf.hx, lf.hy - 2, 3, 9, 6.2, ps.fFa, M_KPLATE);
  const fc = cos(ps.fFa), fs = sin(ps.fFa);
  px(g, lf.hx + 9 * fc, lf.hy - 4 + 9 * fs, P.boneD);
  px(g, lf.hx + 8 * fc + fs, lf.hy - 5 + 8 * fs - fc, P.bone);
  /* ---- near arm + mace ---- */
  if (ps.maceFront) {
    const am = ik(sx + 6, sy + 5, mx2, my2, 14, 13, -1);
    /* The whole weapon arm carries the brightest steel in the sprite. A dark
       skin tube used to disappear into the breastplate and leave the mace
       looking self-propelled; separate rerebrace, elbow cop, vambrace and
       gripping fingers now describe one continuous load path to the weapon. */
    seg(g, sx + 6, sy + 5, am.ex, am.ey, 13, M_KSKIN);
    seg(g, sx + 7, sy + 4, am.ex, am.ey - 1, 9.5, M_KPLATE);
    dome(g, am.ex, am.ey, 5.8, 5.4, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.8);
    px(g, am.ex - 2, am.ey - 4, P.gldD);

    seg(g, am.ex + 1.5, am.ey + 1, am.hx, am.hy, 8.6, M_KPLATE);
    for (let i = 0; i < 3; i++) {
      const t = 0.25 + i * 0.25;

      dome(g, qx, qy, 2.2, 2.2, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.8);
    }
    dome(g, am.hx, am.hy, 5, 4.5, { hi: P.stlHi, base: P.stlM, sh: P.stlX }, -0.6, -0.8);
    /* leather fingers close visibly around the haft */
    for (let i = -2; i <= 2; i += 2) px(g, am.hx + i, am.hy + 2, i === -2 ? P.leaHi : P.leaD);
    px(g, am.hx - 2, am.hy - 3, '#dbe1e8');

  }

  const cv = mkcv(w, h), g = gc(cv);

      if (x < 0 || x >= w) continue;

      /* broken, notched flanks rather than clean slopes */
      const notch = hn(x >> 2, i, seed + 9) * 5 * t;

      else if (y === top + 1 && hn(x, 0, seed + 1) > 0.4) col = colTop;
      else if (y < top + 4 && hn(x, y, seed + 2) > 0.72) col = colShade;
      else if (y > top + 6 && hn(x >> 2, y >> 2, seed + 3) > 0.94) col = colShade;

function brickFace(g, x0, y0, w, h, seed, pal) {

  const rowH = 7;

    const yy = y0 + ry * rowH;
    const rowOff = (ry % 2) * 9 + fl(hn(ry, seed, 3) * 5);
    let bx = -rowOff;
    while (bx < w) {
      const bw = 11 + fl(hn(bx, ry + seed, 7) * 9);
      const rr = hn(bx + 3, ry + seed, 11);
      let base = pal.base;
      if (rr > 0.86) base = pal.m; else if (rr < 0.14) base = pal.lt;
      const recessed = rr > 0.93;
      for (let j = 0; j < rowH && yy + j < y0 + h; j++) {
        for (let i = 0; i < bw && bx + i < w; i++) {
          if (bx + i < 0) continue;
          let col = base;
          if (j === 0) col = recessed ? pal.d : pal.lt;                       /* top light */
          else if (j === rowH - 1) col = pal.x;                               /* mortar shadow */
          else if (i === 0 || i === bw - 1) col = pal.d;                      /* vertical seam */
          else if (j === 1) col = recessed ? pal.m : mixc(base, pal.lt, 0.45);
          else if (j > rowH - 3) col = pal.s;

   deliberately quiet copy of the same masonry, placed behind the authored
   faces; the opaque cap and the live face remain the foreground structure. */
const MID_WALL_BACK_ALPHA = 0.39;
function bakeMidFace(w, h, seed, ore, damage) {
  const pal = { hi: P.stnLt, lt: P.stn, base: P.stnM, m: P.stnD, d: P.stnS, s: P.stnX, x: P.ink };
  return bakeInto(w, h, function (g) {
    brickFace(g, 0, 0, w, h, seed, pal);
    /* Cumulative seeds mean stage N contains every fissure from stage N-1. */
    addCracks(g, 1, 2, w - 2, h - 3, seed + 71, 4 + damage * 3);
    r(g, 0, 0, w, 2, P.stnLt); r(g, w - 2, 0, 2, h, P.stnX);
    if (ore && PROPS.redOre) {
      const cv = PROPS.redOre, ox = fl((w - cv.width) / 2), oy = fl((h - cv.height) / 2);
      g.drawImage(cv, ox, oy);
      /* Damage travels out of the same core instead of adding unrelated red
         marks elsewhere on the stone. */
      for (let i = 0; i < damage; i++) {
        const dir = i % 2 ? 1 : -1, x0 = w / 2 + dir * (4 + i);
        seg(g, w / 2, h / 2, x0, h / 2 - 7 - i * 4, 1.2,
          { hi: P.clFxHi, base: P.clFx, sh: P.clD, taper: 0.55 });
      }
    }
  }, { rim: 1.08, rimAdd: 5, bot: 0.72, noOutline: true });
}
function bakeMidLevel(L) {
  const M = L.mid;
  if (!M || M.baked) return;
  M.baked = true;
  const w = M.layerW, h = M.crackH;
  /* The upper masonry is a fixed architectural mass.  The five authored
     faces are only its foot course; keeping these extents here lets the
     renderer advance the foot without translating the wall above it. */
  M.wallCapH = MID_WALL_H - h;
  M.wallSpanX0 = M.wallAX;
  M.wallSpanX1 = M.wallBX + M.layerW * 5;
  M.wallA = []; M.wallB = []; M.ore = [];
  for (let i = 0; i < 5; i++) {
    M.wallA.push(bakeMidFace(w, h, 241 + i * 13, false, 0));
    M.wallB.push(bakeMidFace(w, h, 421 + i * 17, false, 0));
    M.ore.push(bakeMidFace(w, h, 337, true, i));
  }
  M.wallTile = bakeInto(96, MID_WALL_H, function (g) {
    const pal = { hi: P.stnM, lt: P.stnD, base: P.stnS, m: P.stnX, d: P.ink2, s: P.ink, x: P.sky0 };
    brickFace(g, 0, 0, 96, MID_WALL_H, 509, pal);
    addCracks(g, 0, 16, 96, MID_WALL_H - 18, 523, 16);
    /* The buried mass swallows the moon toward its upper reaches. */
    for (let y = 0; y < MID_WALL_H; y++) {
      const a = clamp(1 - y / MID_WALL_H, 0, 1) * 0.66;
      if (a > 0.01) ra(g, 0, y, 96, 1, P.sky0, a);
    }
  }, { rim: 1.02, rimAdd: 2, bot: 0.78, noOutline: true });
  const rw = M.roomX1 - M.roomX0, rh = 154;
  M.roomH = rh;
  M.roomCv = bakeInto(rw, rh, function (g) {
    const pal = { hi: P.stnLt, lt: P.stn, base: P.stnM, m: P.stnD, d: P.stnS, s: P.stnX, x: P.ink };
    brickFace(g, 0, 0, rw, rh, 601, pal);
    /* A low ceiling, iron ribs and an old central maker's mark distinguish
       the room without inventing a second visual language. */
    r(g, 0, 0, rw, 8, P.stnS); r(g, 0, 7, rw, 2, P.stnLt);
    for (let x = 28; x < rw; x += 84) {
      r(g, x, 7, 6, rh - 7, P.stlS); r(g, x, 7, 1, rh - 7, P.stlM);
      for (let y = 18; y < rh; y += 25) px(g, x + 2, y, P.rust);
    }
    const cx = fl(rw / 2);
    r(g, cx - 16, 46, 32, 2, P.stnS);
    for (let i = 0; i < 6; i++) {
      px(g, cx - 5 + i * 2, 36 + ab(2 - i), i < 3 ? P.gldD : P.stlM);
      px(g, cx - 5 + i * 2, 43 - ab(2 - i), P.stnLt);
    }
    addStain(g, 0, rh - 36, rw, 30, 617, P.ink);
  }, { rim: 1.04, rimAdd: 3, bot: 0.82, noOutline: true });
}

/* ====== LAYER 6: battlefield fog strips — four bands, placed by drawBackground
   and drawForeground rather than by their order here ====== */
function mkFog(w, h, seed, col, alpha) {
  const cv = mkcv(w, h), g = gc(cv);
  for (let x = 0; x < w; x++) {
    let v = 0, amp = 1, f = 0.02;
    for (let o = 0; o < 3; o++) { v += (hn(fl(x * f), o, seed) - 0.5) * amp; amp *= 0.5; f *= 2.7; }
    const top = h * 0.5 - (0.35 + v) * h * 0.5;
    const bot = h * 0.5 + (0.35 - v * 0.6) * h * 0.5;
    for (let y = mx(0, fl(top)); y < mn(h, bot); y++) {
      const edge = (y < top + 3 ? (y - top) / 3 : 1) * (y > bot - 3 ? (bot - y) / 3 : 1);
      /* hard dithered edge instead of a soft blur */
      if (edge < 0.99 && hn(x, y, seed + 5) > edge) continue;
      ra(g, x, y, 1, 1, y < h * 0.45 ? mixc(col, '#5c6779', 0.3) : col, alpha);
    }
  }
  return cv;
}
const fogs = [
  { cv: mkFog(240, 34, 61, P.fogA, 0.34), y: 158, plx: 0.20, sp: 5, amp: 3, ph: 0 },
  { cv: mkFog(280, 28, 67, P.fogB, 0.26), y: 178, plx: 0.36, sp: 8, amp: 2, ph: 1.4 },
  { cv: mkFog(200, 22, 71, P.fogC, 0.14), y: 192, plx: 0.55, sp: 13, amp: 2, ph: 2.7 },
  { cv: mkFog(320, 20, 73, P.fogA, 0.22), y: 116, plx: 0.12, sp: 3, amp: 4, ph: 0.7 }

/* ====== vignette + scanlines ====== */
const vigCv = (function () {
  const cv = mkcv(VW, VH), g = gc(cv);
  const cx = VW / 2, cy = VH / 2, mr = hyp(cx, cy);
  for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
    const d = hyp((x - cx) * 0.86, (y - cy)) / mr;
    let a = Math.pow(mx(0, d - 0.26) / 0.74, 1.7) * 0.88;
    if (a > 0.006) { g.fillStyle = 'rgba(3,4,7,' + a.toFixed(3) + ')'; g.fillRect(x, y, 1, 1); }
  }
  return cv;
})();
const scanCv = (function () {
  const cv = mkcv(VW, VH), g = gc(cv);
  for (let y = 0; y < VH; y += 2) ra(g, 0, y, VW, 1, '#000', 0.13);
  for (let y = 0; y < VH; y += 8) ra(g, 0, y, VW, 1, '#0a0f18', 0.05);
  return cv;
})();

  ctx.drawImage(castleCv, fl(300 - cx * 0.26 + 760), fl(46 - cy * 0.12));
  ctx.globalAlpha = 1;
  /* the distant host */
  const ax = fl(-cx * 0.34) % armyCv.width;
  /* same rule as drawTiled above: ax is in (-w, 0] for any non-negative cx,
     so this first tile already reaches x=0 and neither edge needs a spare */
  for (let x = ax; x < VW; x += armyCv.width) ctx.drawImage(armyCv, fl(x), fl(136 - cy * 0.2));
  /* fog above the host */
  drawFogBand(fogs[0], cx);
  /* mid-ground ruins */
  for (const b of LV.bg) {
    const cvp = PROPS[b.k]; if (!cvp) continue;
    /* HORIZONTAL parallax only. These stand on the same stone the knight
       does, and anything with a visible base must ride the camera's vertical
       motion 1:1 or it tears loose: a jump lifted the camera 30px and moved
       them ten, so the columns hung with daylight under them. Depth is read
       off the horizontal drift and the haze, never off the footing. */
    const sx = fl(b.x - cx * b.p), sy = fl(b.y - cy);
    if (sx > VW + 20 || sx + cvp.width < -20) continue;
    ctx.globalAlpha = 0.78;
    ctx.drawImage(cvp, sx, sy);
    ctx.globalAlpha = 1;
  }
  drawFogBand(fogs[1], cx);
}
function drawFogBand(f, cx) {
  const w = f.cv.width;
  let off = -(((cx * f.plx) + WT * f.sp) % w);
  const yy = fl(f.y + sin(WT * 0.31 + f.ph) * f.amp - CAM.cy * f.plx * 0.5);
  for (let x = off; x < VW; x += w) ctx.drawImage(f.cv, fl(x), yy);
}

function drawPits() {

    if (chance(3.6)) PS.spawn({
      x: p.x0 + Math.random() * (p.x1 - p.x0), y: top + 6, vx: rnd(-3, 3), vy: rnd(5, 16),
      life: rnd(1.2, 2.2), size: 1, col: '#2a3038', alpha: 0.4, shape: 0, layer: L_WORLD, wob: 0.3

function drawPlatforms() {

function drawDecor(back) {

function drawMidArchitectureBack() {
  const M = LV.mid;
  if (!M || !M.wallTile) return;
  const tile = M.wallTile;
  const capH = M.wallCapH || (MID_WALL_H - M.crackH);
  const x0 = M.wallSpanX0 === undefined ? M.wallAX : M.wallSpanX0;
  const x1 = M.wallSpanX1 === undefined ? M.wallBX + M.layerW * 5 : M.wallSpanX1;
  const wallAEnd = M.wallAX + M.layerW * 5;
  const sy = fl(GY - MID_WALL_H - CAM.cy);
  const sx = fl(M.roomX0 - CAM.cx), ry = fl(GY - M.roomH - CAM.cy);

  /* A broken face reveals the fixed wall behind it, not the parallax sky.
     Use the same baked masonry so the rear layer belongs to this passage,
     then keep it subdued enough that the authored cap/front course reads as
     the actual obstacle. */
  ctx.globalAlpha = MID_WALL_BACK_ALPHA;
  for (let wx = x0; wx < x1; wx += tile.width) {
    const tw = mn(tile.width, x1 - wx);
    if (tw <= 0) continue;
    const sx2 = fl(wx - CAM.cx);
    if (sx2 + tw < 0 || sx2 > VW) continue;
    ctx.drawImage(tile, 0, 0, tw, MID_WALL_H, sx2, sy, tw, MID_WALL_H);
  }
  ctx.globalAlpha = 1;

  if (midRoomOpen() && M.roomCv && sx < VW && sx + M.roomCv.width > 0) {
    /* The room remains a lower recess; its upper half is covered by the
       opaque cap below, so the forge is a pocket between masonry faces. */
    ctx.globalAlpha = 0.82;
    ctx.drawImage(M.roomCv, sx, ry);
    ctx.globalAlpha = 1;
  }
  /* The upper structure is now fully opaque. It is deliberately separate from
     the breakable foot course: breaking one face cannot erase or translate it. */
  ctx.globalAlpha = 1;
  for (let wx = x0; wx < x1; wx += tile.width) {
    const tw = mn(tile.width, x1 - wx);
    if (tw <= 0) continue;
    const sx2 = fl(wx - CAM.cx);
    if (sx2 + tw < 0 || sx2 > VW) continue;
    ctx.drawImage(tile, 0, 0, tw, capH, sx2, sy, tw, capH);
  }

  /* Until the current right-hand wall is fully gone, the space beyond its
     active face is still sealed.  Starting at that face is important: already
     broken portions on the left must retain their quiet backing wall instead
     of turning into a black hole.  The mask is above the backing/cap and below
     platforms, props and entities, so only the unopened space is hidden. */
  const darkFrom = PROG.midWallA < 5
    ? wallAEnd
    : (PROG.midWallB < 5 ? M.wallBX + PROG.midWallB * M.layerW : null);
  if (darkFrom !== null) {
    const dx = fl(darkFrom - CAM.cx), x = mx(0, dx);
    if (x < VW) r(ctx, x, sy, VW - x, MID_WALL_H, P.ink);
  }
}
function drawMidWallMass(front, face, end) {
  const M = LV.mid, tile = M.wallTile;
  if (!tile) return;
  const capH = M.wallCapH || (MID_WALL_H - M.crackH), stripH = MID_WALL_H - capH;
  const sy = fl(GY - MID_WALL_H - CAM.cy);
  /* Only the low, cracked course advances.  Its end is the authored end of
     this five-face wall, never the edge of the viewport; otherwise a live
     strip impersonates walls that do not exist farther down the passage. */
  const wallEnd = end === undefined
    ? (front < M.wallBX ? M.wallAX + M.layerW * 5 : M.wallBX + M.layerW * 5)
    : end;
  for (let wx = front; wx < wallEnd; wx += tile.width) {
    const tw = mn(tile.width, wallEnd - wx);
    if (tw <= 0) continue;
    const sx = fl(wx - CAM.cx);
    if (sx + tw < 0) continue;
    ctx.drawImage(tile, 0, capH, tw, stripH, sx, sy + capH, tw, stripH);
  }
  if (face) ctx.drawImage(face, fl(front - CAM.cx), fl(GY - M.crackH - CAM.cy));
}
function drawMidArchitecture() {
  const M = LV.mid;
  if (!M) return;
  if (PROG.midWallA < 5) {
    const n = PROG.midWallA, fx = M.wallAX + n * M.layerW;
    const face = n === 4 ? M.ore[clamp(PROG.midOreHits, 0, 4)] : M.wallA[n];
    drawMidWallMass(fx, face, M.wallAX + M.layerW * 5);
    return;                            /* everything to its right is hidden */
  }
  const av = PROPS.anvil;
  if (av) ctx.drawImage(av, fl(M.anvilX - CAM.cx - av.width / 2), fl(GY - CAM.cy - av.height + 1));
  if (PROG.midWallB < 5) {
    const n = PROG.midWallB, fx = M.wallBX + n * M.layerW;
    drawMidWallMass(fx, M.wallB[clamp(n, 0, 4)], M.wallBX + M.layerW * 5);
  }
}

/* Every fire in the game is one recipe over a different hearth: the iron bowl
   on its stand, and the ring of stones the knight was sitting at when this
   started. The only thing that differs is where in its own prop the flame
   lives, so that is all this table carries — the flicker, the pooled light,
   the embers and the smoke are shared. The brazier's row is the numbers that
   were written into drawBraziers before there was a second kind of fire, so
   nothing about an existing brazier moved by a pixel. */
const FIRE = {
  brazier: { prop: 'brazier', h: 26, cx: 9, top: 8, glowY: 10, fw: 8, fh: 9, emberY: 18, smokeY: 22 },
  campfire: { prop: 'campfire', h: 14, cx: 13, top: 5, glowY: 7, fw: 11, fh: 8, emberY: 8, smokeY: 11 },
  walltorch: { prop: 'wallTorch', h: 22, cx: 13, top: 14, glowY: 14, fw: 7, fh: 10, emberY: 7, smokeY: 11 }
};
function fireVisible(b) {
  if (b.show === 'midRoom') return !!LV.mid && PROG.midWallA >= 5;
  if (b.show === 'midExit') return !!LV.mid && PROG.midWallB >= 5;
  return true;
}
function drawBraziers() {
  const cx = CAM.cx, cy = CAM.cy;
  for (let i = 0; i < LV.braziers.length; i++) {
    const b = LV.braziers[i];
    if (!fireVisible(b)) continue;
    const F = FIRE[b.k || 'brazier'];
    const cvp = PROPS[F.prop];
    const sx = fl(b.x - cx), sy = fl(b.y - cy - F.h);
    if (sx > VW + 30 || sx < -30) continue;
    /* warm pool of light — baked stack, flicker carried on the blit alpha */
    const fl2 = 0.82 + sin(WT * 6.1 + i) * 0.09 + sin(WT * 13.7 + i * 2) * 0.05;
    ctx.globalAlpha = clamp(fl2, 0, 1);
    ctx.drawImage(glowCv, sx + F.cx - GLOW_RX - 1, sy + F.glowY - GLOW_RY - 1);
    ctx.globalAlpha = 1;
    ctx.drawImage(cvp, sx, sy);
    /* the flame itself */
    const fh = F.fh + sin(WT * 7.3 + i * 1.7) * 2.2 + sin(WT * 17 + i) * 1.1;
    for (let j = 0; j < fh; j++) {
      const t = j / fh;
      const w = mx(1, fl((1 - t) * F.fw * (0.7 + 0.3 * sin(WT * 9 + j * 0.7 + i))));
      const xo = fl(sin(WT * 5.5 + j * 0.5 + i) * 1.6 * t);
      const col = t < 0.25 ? P.fireHi : (t < 0.55 ? P.fire : (t < 0.8 ? P.fireM : P.fireD));
      ra(ctx, sx + F.cx - (w >> 1) + xo, sy + F.top - j, w, 1, col, t > 0.7 ? 0.55 : 0.92);
    }
    /* embers and thin smoke */
    if (chance(20.4)) FX.ember(b.x + rnd(-3, 3), b.y - F.emberY, Math.random() < 0.16);
    if (chance(7.2)) FX.smoke(b.x + rnd(-2, 2), b.y - F.smokeY);
  }
}

function drawForeground() {
  const cx = CAM.cx, cy = CAM.cy;
  for (const f of LV.fg) {
    const cv = PROPS[f.k]; if (!cv) continue;
    /* same rule as the mid-ground: the posts and rubble are planted, so only
       x parallaxes. 1.1 sank them a few pixels into the stone on every jump */
    const sx = fl(f.x - cx * f.p), sy = fl(f.y - cy - cv.height);
    if (sx > VW + 40 || sx + cv.width < -40) continue;
    ctx.globalAlpha = 0.94;
    ctx.drawImage(cv, sx, sy);
    ctx.globalAlpha = 1;
  }
}

/* ---- the arena: bigger blocks, iron, royal ruin ----
   Returns the surface rather than assigning a module-level one: a hall
   belongs to the map that has a hall, and loadLevel() hangs it there. */
function buildArena() {
  const W = 880, H = 210, cv = mkcv(W, H), g = gc(cv);
  const pal = { hi: '#4b515b', lt: '#383e47', base: '#2a2f36', m: '#21262c', d: '#181c22', s: '#101318', x: '#090b0f' };
  /* rear wall of great blocks */
  for (let ry = 0; ry * 14 < H; ry++) {
    const yy = ry * 14, off = (ry % 2) * 17;
    let bx = -off;
    while (bx < W) {
      const bw = 26 + fl(hn(bx, ry, 91) * 14);
      const rr = hn(bx + 5, ry, 93);
      let base = rr > 0.85 ? pal.m : (rr < 0.15 ? pal.lt : pal.base);
      for (let j = 0; j < 14 && yy + j < H; j++) for (let i = 0; i < bw && bx + i < W; i++) {
        if (bx + i < 0) continue;
        let col = base;
        if (j === 0) col = pal.lt; else if (j === 13) col = pal.x;
        else if (i === 0 || i === bw - 1) col = pal.d;
        else if (j === 1) col = mixc(base, pal.hi, 0.3);
        else if (j > 11) col = pal.s;
        const n = hn(bx + i, yy + j, 95);
        if (n > 0.97) col = pal.hi; else if (n < 0.03) col = pal.x;
        g.fillStyle = col; g.fillRect(bx + i, yy + j, 1, 1);
      }
      bx += bw;
    }
  }
  /* iron reinforcement bands */
  for (const by of [46, 122]) {
    r(g, 0, by, W, 5, P.stlD); r(g, 0, by, W, 1, P.stlM); r(g, 0, by + 4, W, 1, P.stlX);
    for (let x = 8; x < W; x += 26) { px(g, x, by + 1, P.stlLt); px(g, x, by + 3, P.stlS); }
    for (let x = 20; x < W; x += 53) if (hn(x, by, 97) > 0.5) px(g, x, by + 2, P.rust);
  }
  /* damaged carvings — a frieze of crowned skulls */
  for (let i = 0; i < 9; i++) {
    const x = 40 + i * 84, y = 74;
    if (hn(i, 1, 99) > 0.75) continue;
    dome(g, x, y, 8, 8, { hi: pal.lt, base: pal.m, sh: pal.x }, -0.5, -0.8);
    r(g, x - 4, y - 1, 3, 3, pal.x); r(g, x + 2, y - 1, 3, 3, pal.x);
    r(g, x - 3, y + 4, 7, 2, pal.x);
    for (let k = -2; k <= 2; k++) r(g, x + k * 3, y - 10, 2, 4, hn(i, k, 101) > 0.3 ? P.gldS : pal.d);
    r(g, x - 8, y - 7, 17, 2, P.gldS);
    /* gouges hacked into the stone */
    if (hn(i, 2, 103) > 0.5) { for (let k = 0; k < 6; k++) px(g, x - 5 + k, y - 3 + k, pal.x); }
  }
  /* crimson drapes, torn */
  for (const dx of [110, 300, 470, 660, 806]) {
    for (let x = 0; x < 22; x++) {
      const L = 70 + fl(hn(dx + x, 3, 105) * 26) - (x > 16 ? 26 : 0);
      for (let y = 0; y < L; y++) {
        if (hn(dx + x, y, 107) > 0.95) continue;
        const f2 = sin(x * 0.8 + y * 0.03);
        let col = f2 > 0.5 ? P.clD : (f2 < -0.5 ? P.clS : mixc(P.clD, P.clS, 0.5));
        if (y > L - 4) col = P.clS;
        g.fillStyle = col; g.fillRect(dx + x, 12 + y, 1, 1);
      }
    }
    r(g, dx - 2, 8, 26, 4, P.stlD); r(g, dx - 2, 8, 26, 1, P.stlM);
    for (let x = 0; x < 22; x += 6) px(g, dx + x, 10, P.gldD);
  }
  /* scorch marks and old green stains near the floor */
  addStain(g, 0, H - 40, W, 34, 111, '#0a0c10');
  for (const sx of [200, 420, 600, 780]) addStain(g, sx, H - 26, 60, 22, 113, P.gobBlD);
  /* the hall swallows light towards the floor and the corners */
  for (let y = 0; y < H; y++) {
    const a = clamp((y - 90) / 120, 0, 1) * 0.55;
    if (a > 0.01) ra(g, 0, y, W, 1, '#04060a', a);
  }
  for (let x = 0; x < W; x++) {
    const e = mx(0, 1 - x / 90) + mx(0, 1 - (W - x) / 90);
    if (e > 0.02) ra(g, x, 0, 1, H, '#04060a', mn(0.6, e * 0.5));
  }
  return cv;
}

/* ---- baked soft light ------------------------------------------------
   The moon's halo and a brazier's pool of light are both a short stack of
   hard-edged translucent ellipses at fixed radii — about 240 fillRects a
   frame for the halo and 170 per visible brazier, for two shapes that never
   change. Baked once, each is a single drawImage. Compositing the stack into
   a transparent buffer and blitting it is the same operation as laying the
   layers on one at a time, so the halo is pixel-identical; the brazier now
   folds its flicker into one blit alpha rather than each layer's, a
   difference of about four thousandths of a step at these colours. */
const haloCv = (function () {
  const R = 47, cv = mkcv(R * 2 + 2, R * 2 + 2), g = gc(cv);
  for (let i = 3; i >= 1; i--) {
    g.globalAlpha = 0.020 * i;
    ell(g, R + 1, R + 1, 26 + i * 7, 26 + i * 7, '#7d8698');
  }
  g.globalAlpha = 1;
  return cv;
})();
const HALO_R = 47;
const glowCv = (function () {
  const RX = 40, RY = 30, cv = mkcv(RX * 2 + 2, RY * 2 + 2), g = gc(cv);
  for (let k = 4; k >= 1; k--) {
    g.globalAlpha = 0.030 * k;
    ell(g, RX + 1, RY + 1, 8 + k * 8, 6 + k * 6, k > 2 ? P.fireD : P.fireM);
  }
  g.globalAlpha = 1;
  return cv;
})();
const GLOW_RX = 40, GLOW_RY = 30;

/* ---- baked pit interiors ---
   A shaft is entirely deterministic — every depth line, wet ledge and spike
   comes out of hn() — and used to cost ~160 alpha-blended fills per frame
   apiece. Baked once it is one drawImage; only the drifting ash is live. */
const PIT_H = 160;
function bakePits(L) {
  for (const pit of L.pits) {
    const w = pit.x1 - pit.x0, cv = mkcv(w, PIT_H), g = gc(cv);
    r(g, 0, 0, w, PIT_H, '#0a0c10');
    r(g, 2, 4, w - 4, PIT_H, '#07080b');
    r(g, 5, 12, w - 10, PIT_H, '#040507');
    for (let i = 0; i < w; i += 5) {
      const d = 10 + fl(hn(pit.x0 + i, 3, 77) * 26);
      ra(g, i, 2, 1, d, '#151a22', 0.5);
    }
    for (let i = 0; i < 4; i++) {
      const yy = 8 + i * 13, ww = 3 + fl(hn(pit.x0, i, 78) * 4);
      ra(g, 1, yy, ww, 2, '#1b2028', 0.7);
      ra(g, w - 1 - ww, yy + 5, ww, 2, '#161b23', 0.7);
    }
    for (let i = 2; i < w - 2; i += 6) {
      const h = 8 + fl(hn(pit.x0 + i, 5, 79) * 7);
      for (let j = 0; j < h; j++) {
        const ww2 = mx(1, fl((1 - j / h) * 3));
        ra(g, i - (ww2 >> 1) + 1, 54 + h - j, ww2, 1, j > h * 0.7 ? '#2a3039' : '#1a1f26', 0.9);
      }
      ra(g, i, 55, 1, 1, P.stnLt, 0.5);
    }
    ra(g, 0, 0, w, 1, '#2e3540', 0.5);
    ra(g, 0, 1, 2, 3, '#20262e', 0.6);
    ra(g, w - 2, 1, 2, 3, '#20262e', 0.6);
    pit.cv = cv;
  }
}

/* The flask goes up in the sword hand and the sword goes with it — one

   The shield arm braces low: it is strapped to the forearm, and raising it

KA.drink = {
