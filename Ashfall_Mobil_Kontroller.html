        { w: [4, -24, -1.2], lean: 0.15, ff: 5, fb: -5, front: 1 },
        { w: [11, -17, -0.15], lean: 0.48, ff: 7.5, fb: -4.5, front: 1 },
        { w: [12, -12, 0.55], lean: 0.55, ff: 7.5, fb: -4.5, front: 1 },
        { w: [9, -14, 0.7], lean: 0.34, ff: 6, fb: -4.5, front: 1 }
      ][k];
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.lean = key.lean; p.fFx = key.ff; p.fBx = key.fb; p.hipY = -13;
      p.headX = 2.4; p.headA = 0.2; p.oX = -5.5; p.oY = -17;
    }
  },
  throw: {
    n: 4, dur: 0.46, f(t, p) {
      const k = mn(3, fl(t * 4));
      const key = [
        { w: [-2, -22, -2.3], lean: -0.14, front: 0, ff: 4, hd: 1 },
        { w: [-4, -24, -2.6], lean: -0.22, front: 0, ff: 4, hd: 0.6 },
        { w: [8, -21, -0.5], lean: 0.30, front: 1, ff: 6, hd: 2.4 },
        { w: [11, -19, 0.1], lean: 0.36, front: 1, ff: 6.5, hd: 2.6 }
      ][k];
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.lean = key.lean; p.weapFront = !!key.front; p.fFx = key.ff; p.fBx = -5;
      p.headX = key.hd; p.hipY = -13; p.hideW = k >= 3;
      p.oX = -4; p.oY = -18;
    }
  },
  guard: {
    n: 2, dur: 0.5, loop: 1, f(t, p) {
      const s = t < 0.5 ? 0 : 1;
      p.lean = -0.08; p.hipY = -12.5 + s * 0.3; p.fFx = 5; p.fBx = -6;
      p.wX = -4; p.wY = -14; p.wA = 1.6; p.weapFront = false;
      p.oX = 6; p.oY = -19; p.headX = 0.8;
    }
  },
  hurt: {
    n: 2, dur: 0.26, f(t, p) {
      const s = t < 0.5 ? 1 : 0.55;
      p.lean = -0.30 * s; p.hipY = -12.4; p.headX = -1.4 * s; p.headA = -0.4 * s;
      p.fFx = 2.5; p.fBx = -6.5;
      p.wX = 7 + s * 2; p.wY = -13; p.wA = 1.5; p.oX = -6 - s; p.oY = -14;
    }
  },
  die: {
    n: 5, dur: 0.62, f(t, p) {
      const k = mn(4, fl(t * 5));
      const key = [
        { hip: -12, lean: -0.4, hd: -2, w: [8, -12, 2.0], o: [-6, -12, 0], ff: 2, fb: -7 },
        { hip: -9, lean: -0.7, hd: -3, w: [10, -8, 2.6], o: [-7, -9, 0], ff: 0, fb: -8 },
        { hip: -6, lean: -1.0, hd: -4, w: [11, -4, 2.9], o: [-8, -5, 0], ff: -2, fb: -8 },
        { hip: -3.5, lean: -1.3, hd: -5, w: [11, -2, 3.1], o: [-9, -2, 0], ff: -4, fb: -7 },
        { hip: -2.5, lean: -1.45, hd: -5.5, w: [11, -1, 3.14], o: [-9, -1, 0], ff: -5, fb: -6 }
      ][k];
      p.hipY = key.hip; p.lean = key.lean; p.headX = key.hd; p.headA = key.lean * 0.6;
      p.wX = key.w[0]; p.wY = key.w[1]; p.wA = key.w[2];
      p.oX = key.o[0]; p.oY = key.o[1];
      p.fFx = key.ff; p.fBx = key.fb; p.fFy = 0; p.fBy = 0; p.weapFront = true;
    }
  }
};

const GOB_FIN = { rim: 1.22, rimAdd: 11, bot: 0.58 };
/* The `||` matters: SPR.get's arguments — the builder closure included — are
   only evaluated when the cache misses, and this is called for every goblin
   on screen every frame. */
function gobFrame(type, state, i) {
  const key = 'g_' + type + '_' + state + '_' + i;
  return SPR.cache[key] || SPR.get(key, GW, GH, function (g) {
    const cfg = GTYPE[type], A = GA[state], p = GPOSE();
    A.f((i + 0.5) / A.n, p);
    p.hipY = mx(p.hipY, hipRide(GLEG, p.fFx - GHIP, p.fFy, p.fBx + GHIP, p.fBy));
    drawGoblin(g, cfg)(p);
  }, GOB_FIN);
}

/* --- thrown dagger ------------------------------------------------- */
function daggerSprite(i) {
  return SPR.get('dag' + i, 20, 20, (g) => {
    const a = i / 8 * TAU;
    drawGobWeapon(g, 'dagger', 10 - cos(a) * 3, 10 - sin(a) * 3, a);
  }, { rim: 1.2, bot: 0.7 });
}

/* ===== 9.  GRULLK, THE GOBLIN KING =============================
   Twice the height of his kin, wrapped in looted plate, a bent crown of
   tarnished gold, and a mace that drags his whole body behind it.
   ===== */
const BW = 176, BH = 168, BOX = 84, BOY = 138;
/* Grullk is broad, but his old 12px stride around a 14px-wide pair of hip
   pivots made both legs cross through the centre of the body. Keeping the
   usable reach close to the full 40px straightens the planted leg without
   locking the knee, while the narrower gait below leaves each foot on its
   own side of the pelvis. */
const BHIP = 7, BLEG = 39.2;                   /* hip half-width, usable leg reach (of 20+20) */

const M_KSKIN = { hi: '#5f6d38', base: '#47542a', sh: '#2d3719', edge: '#1c2410' };
const M_KSKIN_D = { hi: '#3f4a24', base: '#303a1b', sh: '#1e2611', edge: '#141a0b' };
const M_KIRON = { hi: P.stlLt, base: P.stlD, sh: P.stlX, edge: P.stlX };
const M_KIRON2 = { hi: P.stlHi, base: P.stlM, sh: P.stlS, edge: P.stlX };
const M_FUR = { hi: '#4a4034', base: '#332c23', sh: '#211c16', edge: '#161310' };
const M_KPLATE = { hi: '#a4adb8', base: '#59616c', sh: '#292f38', edge: '#15191f' };
const M_KPLATE_D = { hi: '#69727d', base: '#3b424c', sh: '#20252d', edge: '#111419' };

function BPOSE() {
  return {
    hipX: 0, hipY: -40, lean: 0.16, headX: 3, headY: 0, headA: 0.08,
    mX: 22, mY: -52, mA: 0.9, oX: -16, oY: -50,
    fFx: 9, fFy: 0, fBx: -10, fBy: 0, fFa: 0, fBa: 0, maceFront: true, capeK: 0, jaw: 0, crownTilt: 0
  };
}

function drawMace(g, hx, hy, ang) {
  const at = orient(hx, hy, ang);
  /* haft — dark timber bound with iron */
  segAt(g, at, -10, 0, 30, 0, 6, { hi: '#5a4a35', base: '#3a2f22', sh: '#241d15', edge: '#1a140f' });
  for (let d = -6; d <= 24; d += 8) {
    segAt(g, at, d, -3.4, d, 3.4, 2.4, M_KIRON2);
  }
  /* butt cap + hanging chain */
  domeAt(g, at, -11, 0, 3.4, 3.4, { hi: P.stlLt, base: P.stlM, sh: P.stlS }, -0.5, -0.8);
  for (let i = 0; i < 4; i++) { pxAt(g, at, -12 - i * 1.2, 3 + i * 2.6, i % 2 ? P.stlM : P.stlS); }
  /* head — a heavy iron block */
  segAt(g, at, 30, 0, 44, 0, 17, { hi: P.stlLt, base: P.stlD, sh: P.stlX });
  segAt(g, at, 32, 0, 42, 0, 13, { hi: P.stlM, base: P.stlS, sh: P.stlX });
  /* royal band of tarnished gold */
  segAt(g, at, 36, -8.5, 36, 8.5, 3, { hi: P.gldHi, base: P.gld, sh: P.gldS });
  /* spikes */
  const sp = [[46, 0, 0], [42, -10, -0.9], [42, 10, 0.9], [33, -11, -2.2], [33, 11, 2.2]];
  for (const s of sp) {
    segAt(g, at, s[0], s[1], s[0] + cos(s[2]) * 8, s[1] + sin(s[2]) * 8, 5.4,
      { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.88 });
  }
  /* rust, gore and battle wear */
  pxAt(g, at, 35, 4, P.rust);
  pxAt(g, at, 39, -5, P.rust2);
  pxAt(g, at, 41, 6, P.bldS);
  pxAt(g, at, 38, 2, P.stlHi);
}

function drawCrown(g, cx, cy, ang) {
  const at = orient(cx, cy, ang);
  /* band */
  segAt(g, at, -9, 0, 9, -1, 5, { hi: P.gldHi, base: P.gld, sh: P.gldD });
  /* points — one snapped off, one bent */
  const pts = [[-8, -1, -6, -9], [-4, -2, -3.5, -11], [0, -2, 0, -13], [4, -2, 5.5, -10], [8, -1, 10, -5]];
  for (let i = 0; i < pts.length; i++) {
    const q = pts[i];
    segAt(g, at, q[0], q[1], q[2], q[3], i === 2 ? 4.4 : 3.6, i === 4
      ? { hi: P.gldD, base: P.gldS, sh: P.gldS, taper: 0.7 }
      : { hi: P.gldHi, base: P.gld, sh: P.gldD, taper: 0.55 });
    if (i !== 4) { pxAt(g, at, q[2], q[3] - 1, P.gldHi); }
  }
  /* set stones: one blood-red, one missing */
  pxAt(g, at, 0, -1, P.bld);
  pxAt(g, at, -4, -1, P.gldS);
  pxAt(g, at, 4, -1, P.clD);
  /* tarnish */
  pxAt(g, at, -7, 1, P.gldS);
  pxAt(g, at, 6, 0, P.bronzeD);
}

function drawKingHead(g, cx, cy, ang, jaw, crownTilt) {
  const at = orient(cx, cy, ang);
  /* ears, torn and pierced */
  segAt(g, at, -4, -2, -16, -10, 6.4, { hi: '#5f6d38', base: '#3a4520', sh: '#1e2611', taper: 0.8 });
  segAt(g, at, -3, 1, -13, 7, 5.6, { hi: '#47542a', base: '#2a3318', sh: '#19200e', taper: 0.8 });
  pxAt(g, at, -11, -7, P.gld);
  pxAt(g, at, -9, 4, P.bronze);
  /* skull */
  dome(g, cx, cy, 10, 9, { hi: '#5f6d38', base: '#47542a', sh: '#2a3318' }, -0.5, -0.8);
  /* heavy brow */
  segAt(g, at, -3, -4, 8, -3, 5, { hi: '#6b7a3e', base: '#47542a', sh: '#2a3318' });
  /* eyes — deep sockets, sickly amber */
  for (const ex of [[6, -0.5], [1.5, -0.6]]) {
    const s = at(ex[0], ex[1]);
    r(g, s[0] - 1, s[1] - 1, 3, 3, '#232a12');
  }
  const y0 = at(6, -1);
  px(g, y0[0], y0[1], '#e0c258'); px(g, y0[0] - 1, y0[1], '#a8902f');
  pxAt(g, at, 1.5, -1, '#c9ab45');
  /* broad hooked nose */
  segAt(g, at, 5, 1, 12, 3.5, 5.4, { hi: '#5f6d38', base: '#414d22', sh: '#2a3318', taper: 0.5 });
  /* jaw, tusks */
  segAt(g, at, -1, 6 + jaw, 8, 6.5 + jaw, 6.4, { hi: '#4f5c2c', base: '#333d1c', sh: '#1e2611' });
  const tk = [[7, 3.6 + jaw], [3, 4.2 + jaw], [5, 4 + jaw]];
  for (let i = 0; i < 3; i++) {
    segAt(g, at, tk[i][0], tk[i][1], tk[i][0] + 0.6, tk[i][1] - 4 - (i === 0 ? 2 : 0), i === 0 ? 3.4 : 2.4, { hi: '#e2dcc4', base: P.bone, sh: P.boneD, taper: 0.7 });
  }
  if (jaw > 0.5) { let m = at(3, 7); r(g, m[0] - 3, m[1] - 1, 7, 3, '#1a1408'); }
  /* scars */
  pxAt(g, at, 2, -5, '#8a5a4a'); pxAt(g, at, 3, -4, '#8a5a4a');
  pxAt(g, at, 4, -3, '#6d4436');
  /* warpaint smear */
  dith(g, cx - 4, cy - 2, 5, 2, '#2a3318', P.bldD);
  /* crown */
  const cr = at(1, -10);
  drawCrown(g, cr[0], cr[1], ang + crownTilt);
}

function drawKing(g, ps) {
  const hx = BOX + ps.hipX, hy = BOY + ps.hipY;
  const spine = 26;
  const sx = hx + sin(ps.lean) * spine, sy = hy - cos(ps.lean) * spine;
  const hdx = sx + sin(ps.lean) * 13 + ps.headX, hdy = sy - cos(ps.lean) * 13 + ps.headY;
  const mx2 = BOX + ps.mX, my2 = BOY + ps.mY;
  const ox = BOX + ps.oX, oy = BOY + ps.oY;
  const ffx = BOX + ps.fFx, ffy = BOY + ps.fFy;
  const fbx = BOX + ps.fBx, fby = BOY + ps.fBy;

  /* ---- ruined royal cape: absolute back layer ----
     Drawn before every limb and armour piece, and centred on the spine so
     Grullk's complete silhouette always composites in front of the cloth. */
  const k = ps.capeK;
  for (let s = 0; s <= 40; s++) {
    const u = s / 40 * 2 - 1;
    const jag = fl(hn(s * 5, 11, 47) * 12);
    const L = 58 - jag - (ab(u) > 0.8 ? 10 : 0);
    for (let i = 0; i < L; i++) {
      const t = i / 56;
      const off = -k * Math.pow(t, 1.5) * 10 - Math.pow(t, 2.2) * 2 - 6;
      const hw = 12 + t * 11 - Math.pow(t, 3) * 4;
      const fold = sin(u * 6 + k);
      let col = fold > 0.4 ? P.cl : (fold < -0.3 ? P.clS : P.clD);
      if (u > 0.6) col = P.clS;
      if (i > L - 4) col = P.clS;
      if (hn(s * 3, i, 23) > 0.9) col = P.clS;
      px(g, sx + off + u * hw, sy - 4 + i, col);
    }
  }
  /* ---- far leg: a planted, armoured column rather than a green zig-zag ----
     Grullk faces +x in the source sprite, so -1 bends the knee toward the
     direction he is looking. +1 folded it behind him, the same IK mistake the
     knight once had, and the broad plates amplified it into a broken-looking
     leg. Skin remains at the joints; every load-bearing surface is looted iron. */
  const lb = ik(hx - BHIP, hy, fbx, fby, 20, 20, -1);
  seg(g, hx - BHIP, hy, lb.ex, lb.ey, 14.5, M_KSKIN_D);
  seg(g, hx - BHIP - 0.5, hy - 1, lb.ex, lb.ey - 1, 10.5, M_KPLATE_D);
  dome(g, lb.ex, lb.ey, 6.2, 5.5, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.6, -0.8);
  r(g, lb.ex - 4, lb.ey - 1, 8, 2, P.stlS);
  px(g, lb.ex - 2, lb.ey - 3, P.rust); px(g, lb.ex + 3, lb.ey, P.stlLt);
  seg(g, lb.ex, lb.ey, lb.hx, lb.hy, 10.5, M_KSKIN_D);
  seg(g, lb.ex + 0.5, lb.ey + 2, lb.hx, lb.hy - 2, 8.2, M_KPLATE_D);
  for (let i = 0; i < 3; i++) {
    const t = 0.26 + i * 0.24;
    const qx = lb.ex + (lb.hx - lb.ex) * t, qy = lb.ey + (lb.hy - lb.ey) * t;
    seg(g, qx - 4, qy, qx + 4, qy - 1, 2.2, i === 1 ? M_GOLD : M_LEA);
  }
  foot(g, lb.hx, lb.hy - 2, 3, 8, 5.4, ps.fBa, M_KPLATE_D);
  px(g, lb.hx + 5 * cos(ps.fBa), lb.hy - 3 + 5 * sin(ps.fBa), P.stlM);

  /* ---- severed off arm ----
     The empty arm no longer reaches a hand target. Only a short upper-arm
     stump survives under the pauldron, capped by torn leather, dried blood
     and one pale bone pixel. oX/oY still steer its attitude in every existing
     pose, so attacks keep their old shoulder motion without growing a limb. */
  const osx = sx - 6, osy = sy + 4;
  const oa = atan2(oy - osy, ox - osx);
  const stx = osx + cos(oa) * 15.5, sty = osy + sin(oa) * 15.5;
  seg(g, osx, osy, stx, sty, 11.5, M_KSKIN_D);
  seg(g, osx + cos(oa) * 3, osy + sin(oa) * 3, stx - cos(oa) * 1.5, sty - sin(oa) * 1.5, 8.2, M_FUR);
  dome(g, stx, sty, 4.8, 4.2, { hi: '#4f2b25', base: P.bldD, sh: P.bldS }, -0.6, -0.8);
  seg(g, stx - sin(oa) * 4.2, sty + cos(oa) * 4.2,
    stx + sin(oa) * 4.2, sty - cos(oa) * 4.2, 2.2, { hi: P.lea, base: P.leaD, sh: P.leaS });
  px(g, stx + cos(oa), sty + sin(oa), P.bone);
  /* mace behind the body during the wind-up */
  if (!ps.maceFront) {
    drawMace(g, mx2, my2, ps.mA);
    limb(g, sx + 6, sy + 4, mx2, my2, 14, 13, -1, 11, 9, M_KSKIN_D);
  }
  /* ---- rebuilt torso: mail foundation, asymmetric cuirass, plated belly ---- */
  plate(g, (hx + sx) / 2 + sin(ps.lean) * 2, (hy + sy) / 2 + 2, 31, 31,
    ps.lean + PI / 2, { hi: '#687641', base: '#47542a', sh: '#252e16', taper: -0.22, round: 0 });
  /* chain mail is allowed to show at the armpits and waist so the armour is
     assembled rather than painted as one flat grey shape */
  dith(g, sx - 13, sy + 2, 26, 12, P.stlS, P.stlD);
  dith(g, hx - 14, hy - 10, 29, 14, P.stlD, P.stlS);
  /* a high, asymmetric breastplate: brighter on the mace side, broken away
     toward the missing arm. The centre ridge and separate lower lames make
     the torso readable even against the arena wall. */
  plate(g, sx + 4, sy + 7, 24, 24, ps.lean + PI / 2, M_KPLATE);
  plate(g, sx - 6, sy + 8, 18, 10, ps.lean + PI / 2 + 0.08, M_KPLATE_D);
  seg(g, sx + 2, sy - 2, hx + 3, hy - 12, 3.2, { hi: P.stlHi, base: P.stlLt, sh: P.stlD });
  for (let i = 0; i < 4; i++) {
    const yy = hy - 4 - i * 5.2;
    const inset = i * 0.8;
    seg(g, hx - 11 + inset, yy, hx + 13 - inset, yy - 1.2, 5.4,
      i % 2 ? M_KPLATE_D : M_KPLATE);
    px(g, hx - 7 + inset, yy - 2, P.stlHi);
    px(g, hx + 9 - inset, yy - 2, i === 2 ? P.rust : P.stlM);
  }
  /* leather harness anchors the remaining weapon shoulder and visually
     points into the hand that carries the mace */
  seg(g, sx + 10, sy + 1, hx - 7, hy - 1, 4.2, { hi: P.leaHi, base: P.lea, sh: P.leaS });
  for (let i = 0; i < 4; i++) {
    const t = (i + 0.5) / 4;
    dome(g, sx + 10 + (hx - 7 - sx - 10) * t, sy + 1 + (hy - 1 - sy - 1) * t,
      1.4, 1.4, { hi: P.gldHi, base: P.gldD, sh: P.gldS }, -0.5, -0.8);
  }
  /* chain skirt with overlapping iron tassets */
  dith(g, hx - 14, hy + 1, 28, 11, P.stlS, P.stlD);
  for (let i = 0; i < 5; i++) {
    const tx = hx - 13 + i * 6;
    plate(g, tx, hy + 8, 10, 5.2, PI / 2 + (i - 2) * 0.05, i % 2 ? M_KPLATE_D : M_KIRON);
    px(g, tx, hy + 4, P.gldD);
  }
  /* wide double belt and battered royal buckle */
  seg(g, hx - 14, hy - 1, hx + 14, hy - 2, 6.2, { hi: P.leaHi, base: P.lea, sh: P.leaS });
  seg(g, hx - 13, hy + 2, hx + 13, hy + 1, 2.2, { hi: P.gldD, base: P.bronze, sh: P.gldS });
  dome(g, hx + 3, hy - 1.5, 4.5, 3.5, { hi: P.gldHi, base: P.gld, sh: P.gldS }, -0.5, -0.8);
  px(g, hx + 2, hy - 2, P.bldD); px(g, hx + 5, hy, P.rust2);
  /* trophy: a knight's helm hanging from the belt */
  dome(g, hx - 11, hy + 3, 4, 4, { hi: P.stlM, base: P.stlD, sh: P.stlX }, -0.5, -0.7);
  r(g, hx - 13, hy + 3, 5, 1, P.stlX);
  /* fur mantle over the shoulders */
  for (let i = 0; i < 9; i++) {
    const a = -0.5 + i * 0.32, rr = 15 + (i % 2) * 3;
    seg(g, sx - 2 + cos(a + PI) * 4, sy - 2, sx + cos(a + PI) * rr, sy - 2 + sin(a) * 8 + 4, 7, M_FUR);
  }
  plate(g, sx, sy - 2, 30, 12, ps.lean, M_FUR);
  /* bone necklace */
  for (let i = -3; i <= 3; i++) {
    const a = i * 0.34;
    px(g, sx + sin(a) * 10 + 1, sy + 6 + cos(a) * 3, P.boneD);
    if (i % 2 === 0) px(g, sx + sin(a) * 10 + 1, sy + 7 + cos(a) * 3, P.bone);
  }
  /* pauldrons — spiked, looted */
  for (let i = 0; i < 3; i++) plate(g, sx - 13 - i * 0.6, sy - 1 + i * 4, 19 - i * 3, 8 - i * 1.2, -0.25, { hi: P.stlM, base: P.stlD, sh: P.stlX, round: 1 });
  for (let i = 0; i < 3; i++) plate(g, sx + 14 + i * 0.8, sy - 1 + i * 4.2, 21 - i * 3, 9 - i * 1.2, 0.22, { hi: P.stlHi, base: P.stlM, sh: P.stlS, round: 1 });
  seg(g, sx + 14, sy - 5, sx + 20, sy - 12, 5, { hi: P.stlLt, base: P.stlM, sh: P.stlS, taper: 0.85 });
  seg(g, sx - 13, sy - 4, sx - 18, sy - 10, 4.4, { hi: P.stlM, base: P.stlD, sh: P.stlX, taper: 0.85 });
  px(g, sx + 13, sy + 1, P.rust); px(g, sx - 12, sy + 3, P.rust2);
  /* redraw the severed end above the torso and pauldron overlap. The limb is
     physically behind the body, but its silhouette and wound must remain
     readable or it merely looks like a hidden hand. */
  dome(g, stx, sty, 5.2, 4.6, { hi: '#6b352d', base: P.bldD, sh: P.bldS }, -0.6, -0.8);
  seg(g, stx - sin(oa) * 4.5, sty + cos(oa) * 4.5,
    stx + sin(oa) * 4.5, sty - cos(oa) * 4.5, 2.4, { hi: P.leaHi, base: P.leaD, sh: P.leaS });
  px(g, stx + cos(oa), sty + sin(oa), P.bone);
  /* ---- head ---- */
  drawKingHead(g, hdx, hdy, ps.headA + ps.lean * 0.3, ps.jaw, ps.crownTilt);
  /* ---- near leg: readable thigh / knee / greave / sabaton hierarchy ---- */
  const lf = ik(hx + BHIP, hy, ffx, ffy, 20, 20, -1);
  seg(g, hx + BHIP, hy, lf.ex, lf.ey, 16, M_KSKIN);
  seg(g, hx + BHIP + 0.5, hy - 1, lf.ex, lf.ey - 1, 11.5, M_KPLATE);
  /* two overlapping cuisse lames */
  for (let i = 0; i < 2; i++) {
    const t0 = 0.20 + i * 0.28, t1 = t0 + 0.34;
    seg(g, hx + BHIP + (lf.ex - hx - BHIP) * t0, hy + (lf.ey - hy) * t0,
      hx + BHIP + (lf.ex - hx - BHIP) * t1, hy + (lf.ey - hy) * t1,
      12.2 - i, i ? M_KPLATE_D : M_KPLATE);
  }
  dome(g, lf.ex, lf.ey, 6.8, 6.2, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.8);
  r(g, lf.ex - 5, lf.ey - 1, 10, 2, P.stlD);
  px(g, lf.ex - 2, lf.ey - 4, P.stlHi); px(g, lf.ex + 4, lf.ey + 1, P.rust);
  seg(g, lf.ex, lf.ey, lf.hx, lf.hy, 12, M_KSKIN);
  seg(g, lf.ex + 1, lf.ey + 2, lf.hx + 1, lf.hy - 3, 9.5, M_KPLATE);
  for (let i = 0; i < 3; i++) {
    const t = 0.30 + i * 0.23;
    const qx = lf.ex + (lf.hx - lf.ex) * t, qy = lf.ey + (lf.hy - lf.ey) * t;
    seg(g, qx - 4.5, qy, qx + 4.5, qy - 1, 2.1, i === 0 ? M_GOLD : M_LEA);
  }
  foot(g, lf.hx, lf.hy - 2, 3, 9, 6.2, ps.fFa, M_KPLATE);
  const fc = cos(ps.fFa), fs = sin(ps.fFa);
  px(g, lf.hx + 9 * fc, lf.hy - 4 + 9 * fs, P.boneD);
  px(g, lf.hx + 8 * fc + fs, lf.hy - 5 + 8 * fs - fc, P.bone);
  /* ---- near arm + mace ---- */
  if (ps.maceFront) {
    const am = ik(sx + 6, sy + 5, mx2, my2, 14, 13, -1);
    /* The whole weapon arm carries the brightest steel in the sprite. A dark
       skin tube used to disappear into the breastplate and leave the mace
       looking self-propelled; separate rerebrace, elbow cop, vambrace and
       gripping fingers now describe one continuous load path to the weapon. */
    seg(g, sx + 6, sy + 5, am.ex, am.ey, 13, M_KSKIN);
    seg(g, sx + 7, sy + 4, am.ex, am.ey - 1, 9.5, M_KPLATE);
    dome(g, am.ex, am.ey, 5.8, 5.4, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.8);
    px(g, am.ex - 2, am.ey - 4, P.gldD);
    seg(g, am.ex, am.ey, am.hx, am.hy, 10.5, M_KSKIN);
    seg(g, am.ex + 1.5, am.ey + 1, am.hx, am.hy, 8.6, M_KPLATE);
    for (let i = 0; i < 3; i++) {
      const t = 0.25 + i * 0.25;
      const qx = am.ex + (am.hx - am.ex) * t, qy = am.ey + (am.hy - am.ey) * t;
      dome(g, qx, qy, 2.2, 2.2, { hi: P.stlHi, base: P.stlM, sh: P.stlS }, -0.6, -0.8);
    }
    dome(g, am.hx, am.hy, 5, 4.5, { hi: P.stlHi, base: P.stlM, sh: P.stlX }, -0.6, -0.8);
    /* leather fingers close visibly around the haft */
    for (let i = -2; i <= 2; i += 2) px(g, am.hx + i, am.hy + 2, i === -2 ? P.leaHi : P.leaD);
    px(g, am.hx - 2, am.hy - 3, '#dbe1e8');
    drawMace(g, mx2, my2, ps.mA);

const skyCv = (function () {
  const cv = mkcv(VW, VH), g = gc(cv);
  for (let y = 0; y < VH; y++) {
    const t = y / VH;

    if (t < 0.28) col = mixc(P.sky0, P.sky1, t / 0.28);
    else if (t < 0.55) col = mixc(P.sky1, P.sky3, (t - 0.28) / 0.27);
    else if (t < 0.78) col = mixc(P.sky3, P.horiz, (t - 0.55) / 0.23);

  }
  /* banded dithering so the gradient reads as pixels, not as a smooth ramp */
  for (let y = 0; y < VH; y += 2) {
    for (let x = (y >> 1) % 3; x < VW; x += 3) {
      if (hn(x, y, 5) > 0.72) ra(g, x, y, 1, 1, '#000', 0.16);

/* ====== LAYER 3: mountains — jagged asymmetric silhouettes ====== */
function mkMountains(w, h, seed, colTop, colBody, colShade, peaks, amp) {
  const cv = mkcv(w, h), g = gc(cv);
  const prof = new Float32Array(w);
  for (let x = 0; x < w; x++) prof[x] = h;
  /* stack asymmetric triangular peaks — the classic ridge silhouette */
  for (let i = 0; i < peaks; i++) {
    const px2 = hn(i, 1, seed) * (w + 200) - 100;
    const ph = h * (0.30 + hn(i, 2, seed) * amp);
    const lw = 26 + hn(i, 3, seed) * 90, rw = 26 + hn(i, 4, seed) * 110;
    const top = h - ph;
    for (let x = fl(px2 - lw); x < px2 + rw; x++) {
      if (x < 0 || x >= w) continue;
      const t = x < px2 ? (px2 - x) / lw : (x - px2) / rw;
      /* broken, notched flanks rather than clean slopes */
      const notch = hn(x >> 2, i, seed + 9) * 5 * t;
      const y = top + Math.pow(t, 0.82) * ph + notch;
      if (y < prof[x]) prof[x] = y;
    }
  }
  for (let x = 0; x < w; x++) {
    const top = mx(0, fl(prof[x]));
    for (let y = top; y < h; y++) {
      let col = colBody;
      if (y === top) col = colTop;                                  /* moonlit ridge */
      else if (y === top + 1 && hn(x, 0, seed + 1) > 0.4) col = colTop;
      else if (y < top + 4 && hn(x, y, seed + 2) > 0.72) col = colShade;
      else if (y > top + 6 && hn(x >> 2, y >> 2, seed + 3) > 0.94) col = colShade;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* ====== masonry helpers ====== */
function brickFace(g, x0, y0, w, h, seed, pal) {
  pal = pal || { hi: P.stnHi, lt: P.stnLt, base: P.stn, m: P.stnM, d: P.stnD, s: P.stnS, x: P.stnX };
  const rowH = 7;
  for (let ry = 0; ry * rowH < h; ry++) {
    const yy = y0 + ry * rowH;
    const rowOff = (ry % 2) * 9 + fl(hn(ry, seed, 3) * 5);
    let bx = -rowOff;
    while (bx < w) {
      const bw = 11 + fl(hn(bx, ry + seed, 7) * 9);
      const rr = hn(bx + 3, ry + seed, 11);
      let base = pal.base;
      if (rr > 0.86) base = pal.m; else if (rr < 0.14) base = pal.lt;
      const recessed = rr > 0.93;
      for (let j = 0; j < rowH && yy + j < y0 + h; j++) {
        for (let i = 0; i < bw && bx + i < w; i++) {
          if (bx + i < 0) continue;
          let col = base;
          if (j === 0) col = recessed ? pal.d : pal.lt;                       /* top light */
          else if (j === rowH - 1) col = pal.x;                               /* mortar shadow */
          else if (i === 0 || i === bw - 1) col = pal.d;                      /* vertical seam */
          else if (j === 1) col = recessed ? pal.m : mixc(base, pal.lt, 0.45);
          else if (j > rowH - 3) col = pal.s;
          if (recessed) col = mixc(col, pal.x, 0.5);
          /* speckle */
          const n = hn(x0 + bx + i, yy + j, seed + 17);
          if (n > 0.965) col = pal.hi; else if (n < 0.035) col = pal.x;
          g.fillStyle = col; g.fillRect(x0 + bx + i, yy + j, 1, 1);
        }
      }
      bx += bw;
    }
  }
}
function addCracks(g, x0, y0, w, h, seed, n) {
  for (let c = 0; c < n; c++) {
    let cx = x0 + hn(c, seed, 21) * w, cy = y0 + hn(c, seed, 22) * h * 0.8;
    let a = PI * 0.5 + (hn(c, seed, 23) - 0.5) * 1.6;

      px(g, cx, cy, P.stnX);
      if (hn(fl(cx), fl(cy), 25) > 0.6) px(g, cx + 1, cy, P.stnS);
      a += (hn(fl(cx), fl(cy), 26) - 0.5) * 0.7;
      cx += cos(a); cy += sin(a);

/* ====== LAYER 6: battlefield fog strips — four bands, placed by drawBackground
   and drawForeground rather than by their order here ====== */
function mkFog(w, h, seed, col, alpha) {
  const cv = mkcv(w, h), g = gc(cv);
  for (let x = 0; x < w; x++) {
    let v = 0, amp = 1, f = 0.02;
    for (let o = 0; o < 3; o++) { v += (hn(fl(x * f), o, seed) - 0.5) * amp; amp *= 0.5; f *= 2.7; }
    const top = h * 0.5 - (0.35 + v) * h * 0.5;
    const bot = h * 0.5 + (0.35 - v * 0.6) * h * 0.5;
    for (let y = mx(0, fl(top)); y < mn(h, bot); y++) {
      const edge = (y < top + 3 ? (y - top) / 3 : 1) * (y > bot - 3 ? (bot - y) / 3 : 1);
      /* hard dithered edge instead of a soft blur */
      if (edge < 0.99 && hn(x, y, seed + 5) > edge) continue;
      ra(g, x, y, 1, 1, y < h * 0.45 ? mixc(col, '#5c6779', 0.3) : col, alpha);
    }
  }
  return cv;
}

/* solid lookup */
function groundAt(x, yRef) {
  let best = 1e9, found = null;
  for (const p of LV.plats) {
    if (x < p.x || x > p.x + p.w) continue;
    if (p.y >= yRef - 2 && p.y < best) { best = p.y; found = p; }
  }
  return found ? found.y : null;
}
function isSolidAt(x, y) {
  for (const p of LV.plats) if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return p;
  return null;
}
/* Settle a falling body onto the first platform top it crosses. Goblins, the
   king and every corpse use this; the knight does NOT, because his own loop
   also pushes him out of walls and that difference is deliberate. */
function landOn(e, prevY, halfW) {
  for (const pl of LV.plats) {
    if (e.x + halfW < pl.x || e.x - halfW > pl.x + pl.w) continue;
    if (e.vy >= 0 && prevY <= pl.y + 1 && e.y >= pl.y) { e.y = pl.y; e.vy = 0; e.onGround = true; return true; }
  }
  return false;
}
/* A body with nothing left to decide: gravity, integrate, come to rest on
   whatever is under it. The caller owns the horizontal damping, because the
   knight's is per frame and the goblins' is per second. */
function corpseFall(e, dt, cap) {
  e.vy = mn(cap, e.vy + PLC.gravity * dt);
  e.x += e.vx * dt; e.y += e.vy * dt;
  const g = groundAt(e.x, e.y);
  if (g !== null && e.y > g) { e.y = g; e.vy = 0; }
}
/* Attack boxes are authored facing right, so mirroring one swaps its near and
   far edge. Written into a shared pair rather than a fresh object: this runs
   inside the hit test of every swing in the game, and the result is always
   read out on the very next line. */
const FBOX = { x0: 0, x1: 0 };
function faceBox(x, face, near, far) {
  if (face > 0) { FBOX.x0 = x + near; FBOX.x1 = x + far; }
  else { FBOX.x0 = x - far; FBOX.x1 = x - near; }
  return FBOX;
}
/* Does a hurt box overlap a world-space attack box? One four-way rejection,
   written once, so every hit test in the game agrees on what "touching" means. */
function boxHit(hb, x0, y0, x1, y1) {
  return !(hb.x1 < x0 || hb.x0 > x1 || hb.y1 < y0 || hb.y0 > y1);
}

const CAM = {
  x: 0, y: 0, tx: 0, ty: 0, shake: 0, shakeD: 0, ox: 0, oy: 0, lock: 0, lockX0: 0, lockX1: 0,
  follow(px2, py2, dt, vx) {
    const look = clamp(vx * 0.16, -26, 26);
    this.tx = px2 - VW * 0.42 + look;
    const desiredY = py2 - VH * 0.66;
    this.ty += (desiredY - this.ty) * mn(1, dt * 3.2);
    let lo = 0, hi = LV.w - VW;
    if (this.lock) { lo = this.lockX0; hi = this.lockX1 - VW; }
    this.tx = clamp(this.tx, lo, hi);
    this.x += (this.tx - this.x) * mn(1, dt * 6.5);
    this.x = clamp(this.x, lo, hi);
    this.y = clamp(this.ty, -30, 26);
    if (this.shake > 0) {
      this.shake = mx(0, this.shake - dt * this.shakeD);
      const s = this.shake * this.shake;
      this.ox = (Math.random() * 2 - 1) * s; this.oy = (Math.random() * 2 - 1) * s * 0.7;
    } else { this.ox = 0; this.oy = 0; }
  },
  kick(amount, decay) { this.shake = mn(9, mx(this.shake, amount)); this.shakeD = decay || 5; },
  get cx() { return fl(this.x + this.ox); },
  get cy() { return fl(this.y + this.oy); }
};

let WT = 0;   /* world clock, keeps running during hitstop */
/* The frame's own delta, published for the handful of ambient emitters that
   live in the render path. They used to roll a per-FRAME probability, so a
   144Hz panel got two and a half times the embers a 60Hz one did, and a paused
   game — which still renders — kept spawning at full tilt behind the plate. */
let FRAME_DT = 1 / 60;
function chance(perSec) { return Math.random() < perSec * FRAME_DT; }

function drawBackground() {
  const cx = CAM.cx, cy = CAM.cy;
  /* the canvas is opaque and never cleared, so the sky drifting down by a pixel
     or two leaves the previous frame standing in the gap it opens at the top */
  const skyY = fl(-cy * 0.05);
  if (skyY > 0) r(ctx, 0, 0, VW, skyY, P.sky0);
  ctx.drawImage(skyCv, 0, skyY);
  /* moon — kept upper-left so every rim light in the game agrees with it */
  const mxp = fl(74 - cx * 0.022), myp = fl(20 - cy * 0.02);
  ctx.drawImage(moonCv, mxp, myp);
  /* faint halo — baked, see haloCv */
  ctx.drawImage(haloCv, mxp + 26 - HALO_R - 1, myp + 26 - HALO_R - 1);
  /* clouds crossing the moon */
  for (const c of clouds) {
    let x = -((c.x + WT * c.sp + cx * c.plx) % (c.cv.width + VW));
    for (let k = 0; k < 3; k++) {
      const xx = fl(x + k * (c.cv.width + VW));
      if (xx > VW || xx + c.cv.width < 0) continue;
      ctx.drawImage(c.cv, xx, fl(c.y - cy * 0.03));
    }
  }
  /* mountains */
  const drawTiled = (cv, plx, y, alpha) => {
    const w = cv.width;
    let off = -((cx * plx) % w);
    if (alpha) ctx.globalAlpha = alpha;
    /* off lands in (-w, 0] for any camera at or right of the level's left
       edge, so the tile at `off` already covers x=0 (a shake can push cx a
       pixel or two negative there and open a hairline gap for one frame) */
    for (let x = off; x < VW; x += w) ctx.drawImage(cv, fl(x), fl(y - cy * plx * 0.5));
    ctx.globalAlpha = 1;
  };
  drawTiled(mtFar, 0.10, 66, 0.88);
  drawTiled(mtNear, 0.17, 84, 1);
  /* fog band behind the castle */
  drawFogBand(fogs[3], cx);
  /* the besieged castle — a landmark, not a repeating wall */
  ctx.globalAlpha = 0.94;
  ctx.drawImage(castleCv, fl(300 - cx * 0.26), fl(34 - cy * 0.12));
  ctx.drawImage(castleCv, fl(300 - cx * 0.26 + 760), fl(46 - cy * 0.12));
  ctx.globalAlpha = 1;
  /* the distant host */
  const ax = fl(-cx * 0.34) % armyCv.width;
  /* same rule as drawTiled above: ax is in (-w, 0] for any non-negative cx,
     so this first tile already reaches x=0 and neither edge needs a spare */
  for (let x = ax; x < VW; x += armyCv.width) ctx.drawImage(armyCv, fl(x), fl(136 - cy * 0.2));
  /* fog above the host */
  drawFogBand(fogs[0], cx);
  /* mid-ground ruins */
  for (const b of LV.bg) {
    const cvp = PROPS[b.k]; if (!cvp) continue;
    /* HORIZONTAL parallax only. These stand on the same stone the knight
       does, and anything with a visible base must ride the camera's vertical
       motion 1:1 or it tears loose: a jump lifted the camera 30px and moved
       them ten, so the columns hung with daylight under them. Depth is read
       off the horizontal drift and the haze, never off the footing. */
    const sx = fl(b.x - cx * b.p), sy = fl(b.y - cy);
    if (sx > VW + 20 || sx + cvp.width < -20) continue;
    ctx.globalAlpha = 0.78;
    ctx.drawImage(cvp, sx, sy);
    ctx.globalAlpha = 1;

    /* sparse ash drifting inside */
    if (chance(3.6)) PS.spawn({
      x: p.x0 + Math.random() * (p.x1 - p.x0), y: top + 6, vx: rnd(-3, 3), vy: rnd(5, 16),
      life: rnd(1.2, 2.2), size: 1, col: '#2a3038', alpha: 0.4, shape: 0, layer: L_WORLD, wob: 0.3
    });
  }
}

function drawPlatforms() {
  const cx = CAM.cx, cy = CAM.cy;
  for (const p of LV.plats) {
    const sx = fl(p.x - cx), sy = fl(p.y - cy - 4);
    if (sx > VW || sx + p.w < 0) continue;
    ctx.drawImage(p.cv, sx, sy);
  }
}

function drawDecor(back) {
  const cx = CAM.cx, cy = CAM.cy;
  for (const d of LV.decor) {
    const cv = PROPS[d.k]; if (!cv) continue;
    if (!!d.l !== !!back) continue;
    const sx = fl(d.x - cx), sy = fl(d.y - cy - cv.height + 1);
    if (sx > VW + 8 || sx + cv.width < -8) continue;
    ctx.drawImage(cv, sx, sy);
  }
}

function drawBraziers() {
  const cx = CAM.cx, cy = CAM.cy;
  const cvp = PROPS.brazier;
  for (let i = 0; i < LV.braziers.length; i++) {
    const b = LV.braziers[i];
    const sx = fl(b.x - cx), sy = fl(b.y - cy - 26);
    if (sx > VW + 30 || sx < -30) continue;
    /* warm pool of light — baked stack, flicker carried on the blit alpha */
    const fl2 = 0.82 + sin(WT * 6.1 + i) * 0.09 + sin(WT * 13.7 + i * 2) * 0.05;
    ctx.globalAlpha = clamp(fl2, 0, 1);
    ctx.drawImage(glowCv, sx + 9 - GLOW_RX - 1, sy + 10 - GLOW_RY - 1);
    ctx.globalAlpha = 1;
    ctx.drawImage(cvp, sx, sy);
    /* the flame itself */
    const fh = 9 + sin(WT * 7.3 + i * 1.7) * 2.2 + sin(WT * 17 + i) * 1.1;
    for (let j = 0; j < fh; j++) {
      const t = j / fh;
      const w = mx(1, fl((1 - t) * 8 * (0.7 + 0.3 * sin(WT * 9 + j * 0.7 + i))));
      const xo = fl(sin(WT * 5.5 + j * 0.5 + i) * 1.6 * t);
      const col = t < 0.25 ? P.fireHi : (t < 0.55 ? P.fire : (t < 0.8 ? P.fireM : P.fireD));
      ra(ctx, sx + 9 - (w >> 1) + xo, sy + 8 - j, w, 1, col, t > 0.7 ? 0.55 : 0.92);
    }
    /* embers and thin smoke */
    if (chance(20.4)) FX.ember(b.x + rnd(-3, 3), b.y - 18, Math.random() < 0.16);
    if (chance(7.2)) FX.smoke(b.x + rnd(-2, 2), b.y - 22);
  }
}

function drawForeground() {
  const cx = CAM.cx, cy = CAM.cy;
  for (const f of LV.fg) {
    const cv = PROPS[f.k]; if (!cv) continue;
    /* same rule as the mid-ground: the posts and rubble are planted, so only
       x parallaxes. 1.1 sank them a few pixels into the stone on every jump */
    const sx = fl(f.x - cx * f.p), sy = fl(f.y - cy - cv.height);
    if (sx > VW + 40 || sx + cv.width < -40) continue;
    ctx.globalAlpha = 0.94;
    ctx.drawImage(cv, sx, sy);
    ctx.globalAlpha = 1;
  }
}

/* ---- the arena: bigger blocks, iron, royal ruin ---- */
let arenaCv = null;
function buildArena() {
  const W = 880, H = 210, cv = mkcv(W, H), g = gc(cv);
  const pal = { hi: '#4b515b', lt: '#383e47', base: '#2a2f36', m: '#21262c', d: '#181c22', s: '#101318', x: '#090b0f' };
  /* rear wall of great blocks */
  for (let ry = 0; ry * 14 < H; ry++) {
    const yy = ry * 14, off = (ry % 2) * 17;
    let bx = -off;
    while (bx < W) {
      const bw = 26 + fl(hn(bx, ry, 91) * 14);
      const rr = hn(bx + 5, ry, 93);
      let base = rr > 0.85 ? pal.m : (rr < 0.15 ? pal.lt : pal.base);
      for (let j = 0; j < 14 && yy + j < H; j++) for (let i = 0; i < bw && bx + i < W; i++) {
        if (bx + i < 0) continue;
        let col = base;
        if (j === 0) col = pal.lt; else if (j === 13) col = pal.x;
        else if (i === 0 || i === bw - 1) col = pal.d;
        else if (j === 1) col = mixc(base, pal.hi, 0.3);
        else if (j > 11) col = pal.s;
        const n = hn(bx + i, yy + j, 95);
        if (n > 0.97) col = pal.hi; else if (n < 0.03) col = pal.x;
        g.fillStyle = col; g.fillRect(bx + i, yy + j, 1, 1);
      }
      bx += bw;
    }
  }
  /* iron reinforcement bands */
  for (const by of [46, 122]) {
    r(g, 0, by, W, 5, P.stlD); r(g, 0, by, W, 1, P.stlM); r(g, 0, by + 4, W, 1, P.stlX);
    for (let x = 8; x < W; x += 26) { px(g, x, by + 1, P.stlLt); px(g, x, by + 3, P.stlS); }
    for (let x = 20; x < W; x += 53) if (hn(x, by, 97) > 0.5) px(g, x, by + 2, P.rust);
  }
  /* damaged carvings — a frieze of crowned skulls */
  for (let i = 0; i < 9; i++) {
    const x = 40 + i * 84, y = 74;
    if (hn(i, 1, 99) > 0.75) continue;
    dome(g, x, y, 8, 8, { hi: pal.lt, base: pal.m, sh: pal.x }, -0.5, -0.8);
    r(g, x - 4, y - 1, 3, 3, pal.x); r(g, x + 2, y - 1, 3, 3, pal.x);
    r(g, x - 3, y + 4, 7, 2, pal.x);
    for (let k = -2; k <= 2; k++) r(g, x + k * 3, y - 10, 2, 4, hn(i, k, 101) > 0.3 ? P.gldS : pal.d);
    r(g, x - 8, y - 7, 17, 2, P.gldS);
    /* gouges hacked into the stone */
    if (hn(i, 2, 103) > 0.5) { for (let k = 0; k < 6; k++) px(g, x - 5 + k, y - 3 + k, pal.x); }
  }
  /* crimson drapes, torn */
  for (const dx of [110, 300, 470, 660, 806]) {
    for (let x = 0; x < 22; x++) {
      const L = 70 + fl(hn(dx + x, 3, 105) * 26) - (x > 16 ? 26 : 0);
      for (let y = 0; y < L; y++) {
        if (hn(dx + x, y, 107) > 0.95) continue;
        const f2 = sin(x * 0.8 + y * 0.03);
        let col = f2 > 0.5 ? P.clD : (f2 < -0.5 ? P.clS : mixc(P.clD, P.clS, 0.5));
        if (y > L - 4) col = P.clS;
        g.fillStyle = col; g.fillRect(dx + x, 12 + y, 1, 1);
      }
    }
    r(g, dx - 2, 8, 26, 4, P.stlD); r(g, dx - 2, 8, 26, 1, P.stlM);
    for (let x = 0; x < 22; x += 6) px(g, dx + x, 10, P.gldD);
  }
  /* scorch marks and old green stains near the floor */
  addStain(g, 0, H - 40, W, 34, 111, '#0a0c10');
  for (const sx of [200, 420, 600, 780]) addStain(g, sx, H - 26, 60, 22, 113, P.gobBlD);
  /* the hall swallows light towards the floor and the corners */
  for (let y = 0; y < H; y++) {
    const a = clamp((y - 90) / 120, 0, 1) * 0.55;
    if (a > 0.01) ra(g, 0, y, W, 1, '#04060a', a);
  }
  for (let x = 0; x < W; x++) {
    const e = mx(0, 1 - x / 90) + mx(0, 1 - (W - x) / 90);
    if (e > 0.02) ra(g, x, 0, 1, H, '#04060a', mn(0.6, e * 0.5));
  }
  arenaCv = cv;
}

/* ---- baked soft light ------------------------------------------------
   The moon's halo and a brazier's pool of light are both a short stack of
   hard-edged translucent ellipses at fixed radii — about 240 fillRects a
   frame for the halo and 170 per visible brazier, for two shapes that never
   change. Baked once, each is a single drawImage. Compositing the stack into
   a transparent buffer and blitting it is the same operation as laying the
   layers on one at a time, so the halo is pixel-identical; the brazier now
   folds its flicker into one blit alpha rather than each layer's, a
   difference of about four thousandths of a step at these colours. */
const haloCv = (function () {
  const R = 47, cv = mkcv(R * 2 + 2, R * 2 + 2), g = gc(cv);
  for (let i = 3; i >= 1; i--) {
    g.globalAlpha = 0.020 * i;
    ell(g, R + 1, R + 1, 26 + i * 7, 26 + i * 7, '#7d8698');
  }
  g.globalAlpha = 1;
  return cv;
})();
const HALO_R = 47;
const glowCv = (function () {
  const RX = 40, RY = 30, cv = mkcv(RX * 2 + 2, RY * 2 + 2), g = gc(cv);
  for (let k = 4; k >= 1; k--) {
    g.globalAlpha = 0.030 * k;
    ell(g, RX + 1, RY + 1, 8 + k * 8, 6 + k * 6, k > 2 ? P.fireD : P.fireM);
  }
  g.globalAlpha = 1;
  return cv;
})();
const GLOW_RX = 40, GLOW_RY = 30;

/* ---- baked pit interiors ---
   A shaft is entirely deterministic — every depth line, wet ledge and spike
   comes out of hn() — and used to cost ~160 alpha-blended fills per frame
   apiece. Baked once it is one drawImage; only the drifting ash is live. */
const PIT_H = 160;
function bakePits() {
  for (const pit of LV.pits) {
    const w = pit.x1 - pit.x0, cv = mkcv(w, PIT_H), g = gc(cv);
    r(g, 0, 0, w, PIT_H, '#0a0c10');
    r(g, 2, 4, w - 4, PIT_H, '#07080b');
    r(g, 5, 12, w - 10, PIT_H, '#040507');
    for (let i = 0; i < w; i += 5) {
      const d = 10 + fl(hn(pit.x0 + i, 3, 77) * 26);
      ra(g, i, 2, 1, d, '#151a22', 0.5);
    }
    for (let i = 0; i < 4; i++) {
      const yy = 8 + i * 13, ww = 3 + fl(hn(pit.x0, i, 78) * 4);
      ra(g, 1, yy, ww, 2, '#1b2028', 0.7);
      ra(g, w - 1 - ww, yy + 5, ww, 2, '#161b23', 0.7);
    }
    for (let i = 2; i < w - 2; i += 6) {
      const h = 8 + fl(hn(pit.x0 + i, 5, 79) * 7);
      for (let j = 0; j < h; j++) {
        const ww2 = mx(1, fl((1 - j / h) * 3));
        ra(g, i - (ww2 >> 1) + 1, 54 + h - j, ww2, 1, j > h * 0.7 ? '#2a3039' : '#1a1f26', 0.9);
      }
      ra(g, i, 55, 1, 1, P.stnLt, 0.5);
    }
    ra(g, 0, 0, w, 1, '#2e3540', 0.5);
    ra(g, 0, 1, 2, 3, '#20262e', 0.6);
    ra(g, w - 2, 1, 2, 3, '#20262e', 0.6);
    pit.cv = cv;
  }
}

/* ===== 15.  THE PLAYER =========================================
   Owns: PLC (tuning), PL (state), the state machine, stamina, guard/parry,
         plStrike and damagePlayer.
   Depends on: IN, AUD, FX, CAM, GAME, KA, groundAt, gateBarred.
   Invariants:
   - the parry window is armed by a fresh guard PRESS only (PL.guardArm)
   - input buffers are consumed only after their preconditions hold
   - roll i-frames keep their exact window and are refused against any
     telegraph whose answer is not ROLL
   - every field a run writes lives in PL_INIT, so reset() cannot miss it
   ===== */
const PLC = {
  runSpeed: 136, blockSpeed: 42, accel: 940, friction: 1400, airAccel: 560,
  gravity: 980, jumpV: -348, maxFall: 460,
  /* a standing jump peaks at 348^2 / (2*980) = 62px, so anything at or under
     this is the knight's own hop and lands without a sound or a camera kick */
  quietDrop: 72,
  h: 44,
  maxHp: 120, maxStam: 100, stamRegen: 30, stamDelay: 0.42,
  rollSpeed: 210, rollIFrames: [0.06, 0.34], rollDur: 0.46, rollCost: 22,
  lightCost: 11, heavyCost: 25, blockCost: 13,
  /* The parry window, opened by a FRESH press of guard and nothing else —
     holding the shield never re-arms it. Thirty frames, not the eleven this
     used to be: wide enough that reading the PARRY tell is a decision rather
     than a coin toss, and longer than several telegraphs' whole wind-up, so
     on those a tap at the start of the swing still covers the blow. */
  parryWindow: 0.5, coyote: 0.10,
  flasks: 4, flaskHeal: 45,
  /* how long the knight is down after Grullk's stomp throws him. Long enough
     to be the worst thing in the fight, short enough that Grullk's own
     post-stomp cooldown (1.9-2.5s) still gets him back on his feet first. */
  stompStun: 2.0
};
/* Run-start state, written once and used twice: to build PL and to wipe it
   between runs. Keeping the two in one table is the whole point — every field
   a run writes is a field reset() puts back, and there is no second list to
   forget. BOSS.staggerMax was exactly that kind of omission until it was
   caught carrying a phase-2 number into a fresh run's phase one. */
const PL_INIT = {
  x: 60, y: GY, vx: 0, vy: 0, face: 1, onGround: true, coyote: 0,
  hp: PLC.maxHp, stam: PLC.maxStam, stamCd: 0, flasks: PLC.flasks,
  state: 'idle', st: 0, anim: 'idle', at: 0, frame: 0,
  iTime: 0, dead: false, deadT: 0, parryT: 0,
  hitDone: false, combo: 0, comboT: 0, capeK: 0, capeV: 0, lastGround: 60, rollIF: false,
  landForce: 0, apexY: GY, flashT: 0, stepPhase: 0, shieldGone: false,
  healT: 0, stompFly: false,
  /* the parry window belongs to the PRESS, not to the pose: true only while
     the guard has been let go of since the last window was handed out */
  guardArm: true,
  denyT: 0, denyWhat: ''
};
const PL = Object.assign({
  reset() { Object.assign(this, PL_INIT); },
  hurtBox() { return { x0: this.x - 7, y0: this.y - 42, x1: this.x + 7, y1: this.y - 1 }; }
}, PL_INIT);

function plSet(state, anim) {
  PL.state = state; PL.st = 0;
  PL.anim = anim; PL.at = 0; PL.frame = 0;
}
function plCanAct() {
  /* `stompFly` covers the arc as well as the landing: being thrown across the
     arena is not a jump, and letting him swing on the way through would make
     the punish read as free air time */
  return !PL.dead && !PL.stompFly && PL.state !== 'roll' && PL.state !== 'atk1' && PL.state !== 'atk1b' &&
    PL.state !== 'atk2' && PL.state !== 'hurt' && PL.state !== 'parry' && PL.state !== 'drink' &&
    PL.state !== 'airblockland' && PL.state !== 'guardbreak' && PL.state !== 'stunned';
}
function plSpend(n) { PL.stam = mx(0, PL.stam - n); PL.stamCd = PLC.stamDelay; }
/* The one door into `block` — grep says so — so the parry window is handed
   out by the same rule wherever the guard comes up: the guard block in
   plUpdate, a parry recovering into a held shield, and a guarded landing
   finishing its compression. Spending the arm here is what stops one press
   being paid for twice. */
function plEnterBlock() {
  plSet('block', 'block');
  if (PL.guardArm) { PL.parryT = PLC.parryWindow; PL.guardArm = false; }
}
/* Falling guard is protection, not a free mid-air parry. Spending guardArm
   here also prevents holding Q through the landing from minting a fresh
   parry window without a new press. */
function plEnterAirBlock() {
  plSet('airblock', 'airblock');
  PL.parryT = 0;
  PL.guardArm = false;
}
function plEnterRoll(dir) {
  plSet('roll', 'roll'); AUD.roll(); plSpend(PLC.rollCost);
  PL.face = dir !== 0 ? dir : PL.face;
  PL.vx = PL.face * PLC.rollSpeed;
  PL.iTime = 0;
}

/* One frame of the knight, in this order and only this order: corpse ->
   timers -> refusal feedback -> buffered actions -> guard -> per-state
   behaviour -> horizontal motion -> gravity and integration -> world clamps
   -> platform collision -> landing -> airborne/ground state -> pit ->
   animation clock -> cape lag. Several of the later steps read values the
   earlier ones computed (`dir`, `guardWanted`, `prevY`, `landed`, `drop`),
   which is why it is one function rather than four. */
function plUpdate(dt) {
  const p = PL;
  if (p.dead) {
    p.deadT += dt;
    p.at += dt;
    p.frame = animFrame(KA.death, p.at);
    p.vx *= 0.86;
    corpseFall(p, dt, PLC.maxFall);
    return;
  }
  p.st += dt; p.at += dt;
  if (p.iTime > 0) p.iTime -= dt;
  if (p.flashT > 0) p.flashT -= dt;
  if (p.parryT > 0) p.parryT -= dt;
  if (p.denyT > 0) p.denyT -= dt;
  if (p.comboT > 0) p.comboT -= dt; else p.combo = 0;
  if (p.stamCd > 0) p.stamCd -= dt;
  else {
    const guarding = p.state === 'block' || p.state === 'airblock' || p.state === 'airblockland';
    p.stam = mn(PLC.maxStam, p.stam + PLC.stamRegen * (guarding ? 0.35 : 1) * dt);
  }

  const wantLeft = IN.held.left, wantRight = IN.held.right;
  let dir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);

  /* An action the bar cannot pay for used to do nothing at all — no sound, no
     mark, no animation — so a dropped input and an empty bar looked identical,
     and IN_BUFFER only lengthens the silence. Read off the press edge before
     the chain below, so it fires once per press and never for one that is
     about to be honoured. */
  if (plCanAct()) {
    const need = IN.press('heavy') ? PLC.heavyCost : (IN.press('light') ? PLC.lightCost
      : (IN.press('roll') && p.onGround ? PLC.rollCost : 0));
    /* Only cry off if the bar still cannot pay by the time the buffer lapses:
       it refills during those IN_BUFFER seconds once stamCd is out, so a
       shortfall of a point or two is about to be honoured and calling it
       refused would be a lie. */
    const canGain = mx(0, IN_BUFFER - p.stamCd) * PLC.stamRegen;
    if (need && p.stam + canGain < need) { p.denyT = 0.30; p.denyWhat = 'stam'; AUD.denied(); }
    else if (IN.press('flask') && p.flasks <= 0) { p.denyT = 0.30; p.denyWhat = 'flask'; AUD.denied(); }
  }

  /* ---- action inputs ----
     INVARIANT: every branch tests its own preconditions BEFORE IN.consume().
     Consuming empties the buffer as a side effect of asking, so putting it
     first threw away a press that could not be honoured this frame — the one
     thing a buffer exists to prevent. A jump tapped an IN_BUFFER before the
     feet land now fires on the landing, and a roll asked for four stamina
     short waits out those four points.
     Roll is also the escape hatch out of either sword attack, which is why it
     is read BEFORE plCanAct() — attacks intentionally fail that predicate.
     The ground and stamina cost still apply, and consuming the press here is
     what stops the cancelled swing resuming after the roll. */
  const attacking = p.state === 'atk1' || p.state === 'atk1b' || p.state === 'atk2';
  if (attacking && p.onGround && p.stam >= PLC.rollCost && IN.consume('roll')) {
    p.hitDone = true;
    p.combo = 0; p.comboT = 0;
    plEnterRoll(dir);
  } else if (plCanAct()) {
    if (p.onGround && p.stam >= PLC.rollCost && IN.consume('roll')) {
      plEnterRoll(dir);
    } else if (p.onGround && p.flasks > 0 && p.hp < PLC.maxHp && IN.consume('flask')) {
      plSet('drink', 'drink'); p.flasks--; p.healT = 0; AUD.flask();
    } else if (p.stam >= PLC.heavyCost && IN.consume('heavy')) {
      plSet('atk2', 'atk2'); AUD.swingHeavy(); plSpend(PLC.heavyCost);
      p.hitDone = false; if (dir !== 0) p.face = dir;
      p.vx += p.face * 26;
    } else if (p.stam >= PLC.lightCost && IN.consume('light')) {
      const b = p.combo === 1;
      plSet(b ? 'atk1b' : 'atk1', b ? 'atk1b' : 'atk1');
      AUD.swing(); plSpend(PLC.lightCost);
      p.hitDone = false; p.combo = b ? 0 : 1; p.comboT = 0.55;
      if (dir !== 0) p.face = dir;
      p.vx += p.face * 34;
    } else if ((p.onGround || p.coyote > 0) && IN.consume('jump')) {
      p.vy = PLC.jumpV; p.onGround = false; p.coyote = 0;
      /* Keep a held shield through the whole jump. The ascent gets its own
         weighted lower-body animation; it must not reuse the flat block pose. */
      if (IN.held.guard && p.stam > 4) plSet('airblock', 'guardjump');
      else plSet('jump', 'jump');
      AUD.jump();
      FX.jumpDust(p.x, p.y);
    }
  }
  /* INVARIANT: guard is a hold, the parry window belongs to a fresh PRESS,
     and `guardArm` is what makes that true — spent when a window opens, given
     back only by letting the guard go. Testing the state instead ("am I not
     already in block?") minted a whole new window every time anything else
     let go of the knight: a stagger ending, a guard-break wearing off, a
     landing, stepping off a ledge. Holding Q and tapping jump was a
     permanent parry. */
  if (!IN.held.guard) p.guardArm = true;
  const guardWanted = IN.held.guard && p.onGround && plCanAct() && p.stam > 4;
  const airGuardState = p.state === 'jump' || p.state === 'fall' || p.state === 'airblock';
  const airGuardWanted = IN.held.guard && !p.onGround && airGuardState &&
    (p.vy > 0 || p.state === 'airblock') && p.stam > 4;
  if (guardWanted && p.state !== 'block' && p.state !== 'parry') {
    plEnterBlock();
  } else if (airGuardWanted && p.state !== 'airblock') {
    plEnterAirBlock();
  } else if (!guardWanted && (p.state === 'block')) {
    plSet('idle', 'idle');
  } else if (!airGuardWanted && p.state === 'airblock') {
    plSet('fall', 'fall');
  }

  /* ---- state behaviour ---- */
  const A = KA[p.anim];
  let allowMove = true, spd = PLC.runSpeed;
  p.rollIF = false;                       /* set again below only while rolling */
  switch (p.state) {
    case 'roll': {
      allowMove = false;
      const t = p.st / PLC.rollDur;
      p.rollIF = (t > PLC.rollIFrames[0] / PLC.rollDur && t < PLC.rollIFrames[1] / PLC.rollDur);
      /* stamped only while the window is open, and cleared on the way out:
         leaving the last 0.02s standing let a blow that the roll was the wrong
         answer to slip through the frame after `rollIF` had already gone false */
      if (p.rollIF) p.iTime = mx(p.iTime, 0.02);
      else if (p.iTime > 0 && p.iTime <= 0.02) p.iTime = 0;
      p.vx = p.face * PLC.rollSpeed * (1 - eIn(clamp(t, 0, 1)) * 0.55);
      if (p.onGround && (p.st % 0.07) < dt) FX.rollDust(p.x, p.y, p.face);
      /* a held shield is picked up by the guard block on the NEXT frame, not
         here: guardWanted is false throughout a roll because plCanAct() says so */
      if (p.st >= PLC.rollDur) plSet('idle', 'idle');
      break;
    }
    case 'atk1': case 'atk1b': case 'atk2': {
      allowMove = false;
      const dur = A.dur;
      const t = p.st / dur;
      p.vx *= Math.pow(0.02, dt);
      /* the heavy swing drags the body forward through the impact */
      if (p.state === 'atk2' && t > 0.52 && t < 0.66 && p.onGround) p.vx += p.face * 300 * dt;
      const fi = fl(t * A.n);
      const hitF = A.hit;
      if (hitF && hitF.indexOf(fi) >= 0 && !p.hitDone) plStrike(p.state === 'atk2');
      /* the whoosh, on the first frame of the swing's active window only */
      if (hitF && fi === hitF[0] && p.st - dt < hitF[0] / A.n * dur) {
        const ang = p.state === 'atk2' ? -0.5 : (p.state === 'atk1b' ? -1.1 : 0.2);
        if (p.state === 'atk2') FX.swingHeavy(p.x + p.face * 14, p.y - 28, p.face, ang);
        else FX.swingLight(p.x + p.face * 12, p.y - 26, p.face, ang);
      }
      if (p.st >= dur) plSet('idle', 'idle');
      break;
    }
    case 'block': {
      allowMove = true; spd = PLC.blockSpeed;
      break;
    }
    /* full run-speed air control, i.e. the defaults: the shield changes the
       posture, not the trajectory the jump already committed to */
    case 'airblock': break;
    case 'airblockland': {
      allowMove = false; p.vx *= Math.pow(0.08, dt);
      if (p.st >= KA.airblockland.dur) {
        if (IN.held.guard && p.stam > 4) plEnterBlock();
        else plSet('idle', 'idle');
      }
      break;
    }
    case 'parry': {
      allowMove = false; p.vx *= Math.pow(0.01, dt);
      if (p.st >= KA.parry.dur) { if (IN.held.guard) plEnterBlock(); else plSet('idle', 'idle'); }
      break;
    }
    case 'hurt': {
      allowMove = false; p.vx *= Math.pow(0.06, dt);
      if (p.st >= KA.hurt.dur) plSet('idle', 'idle');
      break;
    }
    case 'guardbreak': {
      allowMove = false; p.vx *= Math.pow(0.05, dt);
      if (p.st >= 0.62) plSet('idle', 'idle');
      break;
    }
    case 'stunned': {
      allowMove = false; p.vx *= Math.pow(0.04, dt);
      /* `hurt` held on its last frame, the same trick a parried goblin gets:
         the pose already reads as off balance. Two seconds of a still sprite
         would read as a lock-up, so motes turn slowly over the helm. */
      if ((p.st % 0.14) < dt) {
        const a2 = p.st * 6.5;
        PS.spawn({
          x: p.x + cos(a2) * 9, y: p.y - 46 + sin(a2) * 2.5, vx: 0, vy: -7,
          life: 0.46, size: 1, col: a2 % TAU < PI ? P.gldHi : P.gld, alpha: 0.8,
          shape: 0, layer: L_COMBAT, add: true
        });
      }
      if (p.st >= PLC.stompStun) plSet('idle', 'idle');
      break;
    }
    case 'drink': {
      allowMove = false; p.vx *= Math.pow(0.02, dt);
      p.healT += dt;
      if (p.healT > 0.22 && p.healT - dt <= 0.22) {
        p.hp = mn(PLC.maxHp, p.hp + PLC.flaskHeal);
        for (let i = 0; i < 10; i++) PS.spawn({
          x: p.x + rnd(-6, 6), y: p.y - rnd(8, 34), vx: rnd(-12, 12), vy: rnd(-26, -6),
          life: rnd(0.4, 0.8), size: 1, col: i % 2 ? P.gldHi : P.gld, alpha: 0.7,
          drag: 0.05, shape: 0, layer: L_COMBAT, add: true
        });
      }
      if (p.st >= KA.drink.dur) plSet('idle', 'idle');
      break;
    }
  }

  /* ---- horizontal motion ---- */
  if (allowMove && dir !== 0) {
    if (p.state !== 'block') p.face = dir;
    const a = (p.onGround ? PLC.accel : PLC.airAccel) * dt;
    p.vx += dir * a;
    p.vx = clamp(p.vx, -spd, spd);
  } else if (allowMove) {
    const f = (p.onGround ? PLC.friction : 240) * dt;
    if (p.vx > 0) p.vx = mx(0, p.vx - f); else p.vx = mn(0, p.vx + f);
  }
  /* ---- gravity + integration ---- */
  p.vy = mn(PLC.maxFall, p.vy + PLC.gravity * dt);
  const prevY = p.y;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  /* arena confinement */
  if (GAME.arenaLocked) p.x = clamp(p.x, LV.arenaX0 + 34, LV.arenaX1 - 10);
  /* the barred portcullis holds the road until the last goblin is down */
  if (gateBarred() && p.x > LV.gateX - 9) {
    p.x = LV.gateX - 9;
    if (p.vx > 0) p.vx = 0;
  }
  p.x = clamp(p.x, 6, LV.w - 8);

  /* ---- collisions ---- */
  let landed = false;
  p.onGround = false;
  for (const pl of LV.plats) {
    if (p.x + 6 < pl.x || p.x - 6 > pl.x + pl.w) continue;
    /* landing on top */
    if (p.vy >= 0 && prevY <= pl.y + 1 && p.y >= pl.y) {
      p.y = pl.y; p.vy = 0; p.onGround = true; landed = true; break;
    }
    /* standing inside (walked into a step) */
    if (p.y > pl.y && p.y - PLC.h < pl.y + pl.h && prevY > pl.y) {
      /* push out sideways from a wall */
      const cxp = p.x, left = pl.x, right = pl.x + pl.w;
      if (p.y - PLC.h * 0.4 > pl.y) {
        if (cxp < left + pl.w * 0.5) { p.x = mn(p.x, left - 7); } else { p.x = mx(p.x, right + 7); }
        p.vx = 0;
      }
    }
  }
  /* how far the body actually fell, measured from the highest point it
     reached since the feet last left stone — read before the apex is reset */
  const drop = p.y - p.apexY;
  if (p.onGround) {
    p.coyote = PLC.coyote;
    p.lastGround = p.x;
  } else {
    p.coyote = mx(0, p.coyote - dt);
    p.apexY = mn(p.apexY, p.y);
  }
  /* Landing feedback is keyed to DROP, not to impact speed: a standing jump
     comes back down at nearly the speed of a real fall, so a speed test kicked
     the camera every time the knight hopped on the spot. quietDrop sits just
     over a standing jump's apex (jumpV^2 / 2g), so his own hop is silent and
     stepping off anything above ankle height is not. */
  if (landed && !p.stompFly && (p.state === 'fall' || p.state === 'jump' || p.state === 'airblock')) {
    const shieldLanding = p.state === 'airblock' && IN.held.guard && p.stam > 4;
    const force = clamp(p.landForce / 420, 0, 1);
    FX.landDust(p.x, p.y, force);
    if (drop > PLC.quietDrop) {
      const heft = clamp((drop - PLC.quietDrop) / 90, 0, 1);
      AUD.land(force);
      if (force > 0.55) CAM.kick(1.2 + heft * 2.2, 8);
    }
    plSet(shieldLanding ? 'airblockland' : 'land', shieldLanding ? 'airblockland' : 'land');
  }
  /* Thrown clear by the stomp. The blow was only the fare — this is the part
     that costs, and it deliberately does not go through the landing above:
     there is no crouch-and-recover here, he arrives and stays down. */
  if (p.stompFly && landed) {
    p.stompFly = false;
    plSet('stunned', 'hurt');
    p.vx *= 0.18;
    FX.landDust(p.x, p.y, 1);
    FX.dustRing(p.x, p.y, 8, 80);
    FX.blood(p.x, p.y - 14, -p.face, 5, P.bld);
    AUD.land(1); AUD.hurt();
    CAM.kick(2.8, 7);
  }
  if (p.onGround) p.apexY = p.y;
  p.landForce = p.vy;
  /* airborne state */
  if (!p.onGround && (p.state === 'idle' || p.state === 'run' || p.state === 'land' || p.state === 'block')) {
    plSet('fall', 'fall');
  }
  if (p.state === 'jump' && p.vy > 20) plSet('fall', 'fall');
  if (p.state === 'airblock' && p.vy > 20 && p.anim === 'guardjump') p.anim = 'airblock';
  if (p.state === 'land' && p.st >= KA.land.dur) plSet('idle', 'idle');
  /* ground locomotion state */
  if (p.onGround && (p.state === 'idle' || p.state === 'run')) {
    const moving = ab(p.vx) > 12 && dir !== 0;
    if (moving && p.state !== 'run') plSet('run', 'run');
    else if (!moving && p.state !== 'idle') plSet('idle', p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle');
    if (!moving && p.anim === 'idle' && p.hp < PLC.maxHp * 0.3) { p.anim = 'idleW'; }
    if (!moving && p.anim === 'idleW' && p.hp >= PLC.maxHp * 0.3) { p.anim = 'idle'; }
  }
  /* A different animation, not the same one sliding: `block` plants both
     feet, so holding a direction dragged the knight along the stone. The
     clock is NOT restarted on the swap — the stride carries across, so
     starting and stopping does not snap the legs to a contact pose. */
  if (p.onGround && p.state === 'block') {
    const want = (ab(p.vx) > 8 && dir !== 0) ? 'blockwalk' : 'block';
    if (p.anim !== want) p.anim = want;
  }
  /* pit */
  if (p.y > VH + 90) {
    p.hp -= 34; p.flashT = 0.32; AUD.hurt(); CAM.kick(3, 6);
    if (p.hp <= 0) { plDie(); return; }
    const gx = p.lastGround;
    p.x = gx; p.y = (groundAt(gx, 0) || GY) - 2; p.vy = 0; p.vx = 0;
    /* the respawn is a teleport, not a fall — do not let the pit's depth be
       carried into the next landing's impact */
    p.apexY = p.y; p.landForce = 0;
    p.iTime = 1.1; plSet('land', 'land');
  }

  /* ---- animation clock ---- */
  const AA = KA[p.anim];
  if (AA) {
    if (p.anim === 'run') p.at += ab(p.vx) / PLC.runSpeed * dt * 0.55;
    /* the guard walk is paced off the guard speed, not the run speed, or a
       knight moving at a third of his pace would still be striding flat out */
    else if (p.anim === 'blockwalk') p.at += ab(p.vx) / PLC.blockSpeed * dt * 0.30;
    p.frame = animFrame(AA, p.at);
    if (p.anim === 'roll') p.frame = mn(5, fl(p.st / PLC.rollDur * 6));
    /* footfall dust on the two contact frames of whichever gait is running */
    const walking = p.anim === 'run' ? [0, 5] : (p.anim === 'blockwalk' ? [0, 4] : null);
    if (walking && p.onGround) {
      const f2 = p.frame;
      if ((f2 === walking[0] || f2 === walking[1]) && p.stepPhase !== f2) {
        FX.footDust(p.x - p.face * 3, p.y, p.face, ab(p.vx));
        AUD.step();
      }
      if (p.stepPhase !== f2) p.stepPhase = f2;
    }
  }
  /* ---- cape lag ---- */
  const targetK = (KA[p.anim] && KA[p.anim].cape !== undefined ? KA[p.anim].cape : 0)
    - clamp(p.vx * p.face / PLC.runSpeed, -1, 1) * 0.55
    + clamp(-p.vy / 300, -0.6, 0.9);
  p.capeV += (targetK - p.capeK) * 26 * dt;
  p.capeV *= Math.pow(0.0006, dt);
  p.capeK = clamp(p.capeK + p.capeV * dt, -1, 1);
}

function plDie() {
  if (PL.dead) return;
  PL.dead = true; PL.deadT = 0; PL.at = 0; PL.anim = 'death'; PL.state = 'death';
  PL.vx = -PL.face * 40; PL.vy = -80;
  AUD.die(); AUD.stopMusic();
  FX.blood(PL.x, PL.y - 26, -PL.face, 14, P.bld);
  CAM.kick(4, 4);
  GAME.deathT = 0;
}

/* the player's own strike */
function plStrike(heavy) {
  const p = PL;
  p.hitDone = true;
  const box = heavy
    ? { x0: 2, y0: -46, x1: 40, y1: -4 }
    : (p.state === 'atk1b' ? { x0: 2, y0: -42, x1: 32, y1: -8 } : { x0: 2, y0: -38, x1: 32, y1: -10 });
  const fb = faceBox(p.x, p.face, box.x0, box.x1);
  const wx0 = fb.x0, wx1 = fb.x1, wy0 = p.y + box.y0, wy1 = p.y + box.y1;
  let hitAny = false;
  const dmg = heavy ? 30 : (p.state === 'atk1b' ? 15 : 10);
  for (const e of EN) {
    if (e.dead) continue;
    const hb = e.hurtBox();
    if (!boxHit(hb, wx0, wy0, wx1, wy1)) continue;
    const hx = clamp((wx0 + wx1) * 0.5, hb.x0, hb.x1), hy = clamp((wy0 + wy1) * 0.5, hb.y0, hb.y1);
    enemyHurt(e, dmg, p.face, heavy, hx, hy);
    hitAny = true;
  }
  if (BOSS.active && !BOSS.dead) {
    const hb = bossHurtBox();
    if (boxHit(hb, wx0, wy0, wx1, wy1)) {
      const hx = clamp((wx0 + wx1) * 0.5, hb.x0, hb.x1), hy = clamp((wy0 + wy1) * 0.5, hb.y0, hb.y1);
      bossHurt(dmg, p.face, heavy, hx, hy);
      hitAny = true;
    }
  }
  if (hitAny) {
    GAME.hitstop = mx(GAME.hitstop, heavy ? 0.11 : 0.055);
    CAM.kick(heavy ? 3.0 : 1.5, heavy ? 7 : 9);
    p.stam = mn(PLC.maxStam, p.stam + (heavy ? 6 : 3));
  } else {
    /* whiff — a few motes of disturbed dust only */
    if (heavy) FX.dust(p.x + p.face * 22, p.y - 30, 2, 8, 6, P.stnLt);
  }
}

/* damage taken by the player, routed through guard / parry / i-frames */
/* `answer` is the word the telegraph put over the boss's head, and it names
   the ONE limb that beats the blow. The guard is not a universal out during
   a telegraph:
     PARRY  — the shield is right. A tap on the window turns the blow and
              staggers Grullk; merely holding still stops it, for chip and a
              heavy bite of stamina.
     ROLL   — only the roll's own i-frames. The shield eats it at full price,
              which is what stops the fight collapsing back into holding Q.
     JUMP   — geometry, not this function: the box is cleared or it is not.
     BACK   — not in this vocabulary at all, so nothing here catches the
              stomp. Leaving is the only answer.
   Blows with no telegraph (goblins, thrown daggers) pass no answer and the
   shield is a full reply to all of them. Only Grullk names his terms. */
function damagePlayer(amount, srcX, kind, contactY, answer) {
  const p = PL;
  if (p.dead) return 'dodge';
  /* only the roll's OWN i-frames are refused — invulnerability earned any
     other way (a hit, a parry, a pit respawn) always holds */
  const wrongRoll = p.rollIF && answer && answer !== 'ROLL';
  if (p.iTime > 0 && !wrongRoll) {
    if (p.state === 'roll') FX.afterimage(p.x, p.y);
    return 'dodge';
  }
  const fromFront = (srcX - p.x) * p.face > -4;
  const cy2 = contactY === undefined ? p.y - 26 : contactY;
  const cxp = p.x + p.face * 11;
  if ((p.state === 'block' || p.state === 'airblock' || p.state === 'airblockland' || p.state === 'parry') && fromFront) {
    /* only a blow that asked to be parried can be turned by the shield */
    if (p.parryT > 0 && (!answer || answer === 'PARRY')) {
      /* ---- PARRY ---- */
      plSet('parry', 'parry');
      p.parryT = 0; p.iTime = 0.30;
      FX.parryBurst(cxp, cy2, p.face);
      AUD.parry();
      GAME.hitstop = mx(GAME.hitstop, 0.16);
      GAME.parryFlash = 0.24;
      CAM.kick(4.2, 7);
      p.stam = mn(PLC.maxStam, p.stam + 26);
      return 'parry';
    }
    /* ---- BLOCK ----
       Open when the blow named no answer, and when it named PARRY: missing
       the window on a chop you were told to meet with the shield still
       leaves a shield in front of it. It costs chip plus `blockCost + 55% of
       the blow` — 32 of 100 for the diag — so turtling empties the bar in a
       handful of swings and guard-breaks. ROLL, JUMP and the stomp's BACK
       skip this entirely and fall through to the clean hit; no stamina is
       spent, because nothing was stopped. */
    if (!answer || answer === 'PARRY') {
      const cost = PLC.blockCost + amount * 0.55;
      plSpend(cost);
      FX.blockSparks(cxp, cy2, p.face);
      AUD.block();
      CAM.kick(1.5, 9);
      GAME.hitstop = mx(GAME.hitstop, 0.045);
      p.vx += (p.x - srcX > 0 ? 1 : -1) * 46;
      if (p.stam <= 0) {
        plSet('guardbreak', 'hurt');
        p.hp -= amount * 0.30; p.flashT = 0.32; p.iTime = 0.2;
        AUD.hurt(); CAM.kick(3, 6);
        if (p.hp <= 0) plDie();
        return 'break';
      }
      /* chip still draws blood, so it still has to look like it. Without this
         a guard held to the last point of health killed the knight with no red
         on the screen at all. */
      p.hp -= amount * 0.12;
      p.flashT = 0.32; GAME.damageFlash = mx(GAME.damageFlash, 0.16);
      if (p.hp <= 0) plDie();
      return 'block';
    }
  }
  /* ---- clean hit ---- */
  p.hp -= amount;
  p.flashT = 0.32; p.iTime = 0.62;
  plSet('hurt', 'hurt');
  p.vx = (p.x - srcX > 0 ? 1 : -1) * 120;
  p.vy = mn(p.vy, -70);
  FX.blood(p.x, p.y - 26, p.x - srcX > 0 ? 1 : -1, 8, P.bld);
  AUD.hurt();
  CAM.kick(3.4, 6);
  GAME.hitstop = mx(GAME.hitstop, 0.07);
  GAME.damageFlash = 0.32;
  if (p.hp <= 0) plDie();
  return 'hit';
}

/* ===== 16.  GOBLINS ============================================ */
const EN = [];
/* `parryStun` is how long a turned blow leaves a goblin open, and it scales
   with how little the thing weighs — a caught blow puts the wiry thrower on
   its back, the brute has the mass to ride one out. All three are far longer
   than the 0.26s flinch an ordinary hit buys, which is the whole point: the
   window is the reward. Grullk is deliberately off this table; his answer is
   a 3.0s bossStun() at 1.75x damage, which is its own economy. */
const ETUNE = {
  grunt: { hp: 45, spd: 58, chase: 200, atkRange: 27, wind: 0.42, dmg: 12, poise: 0, cd: [0.55, 1.1], w: 11, h: 30, parryStun: 1.50 },
  thrower: { hp: 31, spd: 48, chase: 300, atkRange: 150, wind: 0.30, dmg: 10, poise: 0, cd: [1.1, 1.8], w: 10, h: 28, parryStun: 2.00 },

function spawnEnemy(t, x, y) {

function enemyUpdate(e, dt) {
  const T = ETUNE[e.t];
  e.st += dt; e.at += dt;

    e.deadT += dt;

    return;
  }

  /* One ledge height. The level's real gaps are 42-46, and at a strict `< 46`
     the two throwers sitting at exactly 46 watched the knight walk past
     underneath without ever reaching for a dagger. */
  const sameLevel = ab(dy) < 48;
  if (!e.alerted && adx < T.chase && sameLevel && !PL.dead) {
    e.alerted = true; AUD.gobAlert();
    eSet(e, 'idle', 'idle');
  }
  if (e.cd > 0) e.cd -= dt;

  let move = 0;
  switch (e.state) {
    case 'idle': {
      if (e.alerted && !PL.dead) {
        if (e.t === 'thrower') {
          if (adx < 82 && sameLevel) { move = -Math.sign(dx); e.face = Math.sign(dx) || e.face; }
          else if (adx > 175 || !sameLevel) { move = Math.sign(dx); e.face = move; }
          else { e.face = Math.sign(dx) || e.face; if (e.cd <= 0) { eSet(e, 'throwWind', 'throw'); e.hitDone = false; } }
        } else {
          e.face = Math.sign(dx) || e.face;
          if (adx > T.atkRange) move = Math.sign(dx);
          else if (e.cd <= 0) {
            if (e.t === 'brute' && Math.random() < 0.24) { eSet(e, 'guard', 'guard'); e.guardT = rnd(0.5, 1.0); }
            else eSet(e, 'wind', 'wind');
          }
        }
      } else {
        /* idle patrol along the ledge */
        e.patrolT -= dt;
        if (e.patrolT <= 0) { e.patrolT = rnd(1.4, 3.2); e.patrolDir = Math.random() < 0.5 ? -1 : (Math.random() < 0.5 ? 0 : 1); }
        move = e.patrolDir * 0.42;
        if (move !== 0) e.face = Math.sign(move);
      }
      break;
    }
    case 'wind': {
      /* Per-type wind-up. The table has always carried one and nothing read
         it, so the brute's longer telegraph did not exist. The animation still
         plays over GA.wind.dur; only the moment the blow commits moves. Two of
         the three rows reach here — a thrower never enters `wind` at all, so
         its 0.30 stays unreachable data, kept for the table's symmetry. */
      if (e.st >= (T.wind || GA.wind.dur)) { eSet(e, 'atk', 'atk'); e.hitDone = false; }
      break;
    }
    case 'atk': {
      const fi = fl(e.st / GA.atk.dur * GA.atk.n);
      if ((fi === 1 || fi === 2) && !e.hitDone) {
        e.hitDone = true;
        const box = e.t === 'brute' ? [4, -34, 36, 2] : [4, -24, 28, -1];
        const fb = faceBox(e.x, e.face, box[0], box[2]);
        const hb = PL.hurtBox();

      if (e.st >= GA.atk.dur) { eSet(e, 'idle', 'idle'); e.cd = rnd(T.cd[0], T.cd[1]); }

      const fi = fl(e.st / GA.throw.dur * GA.throw.n);

           through its own ribs. Re-aim at the moment of release. */

      break;
    }
    case 'guard': {
      e.guardT -= dt;
      e.face = Math.sign(dx) || e.face;
      if (e.guardT <= 0) { eSet(e, 'idle', 'idle'); e.cd = 0.15; }
      break;
    }
    case 'hurt': {
      /* a parried goblin holds the last recoil frame for the rest of its
         stun — the pose already reads as "off balance", so freezing it there
         costs nothing and the extra window is the whole reward for parrying */
      if (e.st >= (e.stunT || GA.hurt.dur)) { e.stunT = 0; eSet(e, 'idle', 'idle'); e.cd = mx(e.cd, 0.24); }
      break;

  /* ---- motion ---- */
  /* `move` is only ever non-zero in the idle case, so the speed is simply the
     type's speed — the 0.2 arm this used to carry was unreachable */
  const spd = T.spd;
  if (move !== 0 && e.state === 'idle') {
    e.vx += move * 800 * dt;
    e.vx = clamp(e.vx, -spd, spd);
    /* do not walk off a ledge or into a pit */
    const ahead = e.x + Math.sign(move) * 12;
    const gA = groundAt(ahead, e.y - 4);
    if (gA === null || ab(gA - e.y) > 20) { e.vx = 0; if (!e.alerted) e.patrolDir *= -1; }

  e.x += e.vx * dt; e.y += e.vy * dt;

     world-space clamp every goblin type could walk through the closed
     portcullis into the boss arena before the field was cleared. */

     skipped the death sound and — the part that mattered — the kill counter
     the gate reads its own line off, so the tally under THE GATE IS BARRED
     disagreed with the number of goblins actually left standing. */
  if (e.y > VH + 140 && !e.dead) {

  if (e.state === 'idle') want = ab(e.vx) > 12 ? (e.alerted ? 'run' : 'walk') : 'idle';
  else if (e.state === 'wind') want = 'wind';
  else if (e.state === 'atk') want = 'atk';
  else if (e.state === 'throwWind') want = 'throw';
  else if (e.state === 'guard') want = 'guard';

    if (Math.random() < 0.35) FX.footDust(e.x, e.y, e.face, ab(e.vx) * 0.7);

function enemyHurt(e, dmg, dir, heavy, hx, hy) {
  if (e.dead) return;

  if (e.state === 'guard' && (e.face * dir < 0) && !heavy) {
    FX.blockSparks(e.x + e.face * 10, e.y - 20, e.face);
    AUD.block(); e.vx = dir * 40;
    return;
  }
  e.hp -= dmg; e.flashT = 0.09;

  /* Kept beside the FX call so the two halves of one impact stay together.
     The visual had a light/heavy split all along; the audio did not, because
     AUD.hit was written and never called from anywhere. */
  if (heavy) { FX.hitHeavy(hx, hy, dir, P.gobBl); AUD.hitHeavy(); }
  else { FX.hitLight(hx, hy, dir, P.gobBl); AUD.hit(); }
  if (e.hp <= 0) {
    e.dead = true; e.deadT = 0; e.anim = 'die'; e.frame = 0;
    e.vx = dir * (heavy ? 150 : 80); e.vy = -110;
    FX.gobDeath(e.x, e.y - T.h * 0.5, dir);
    AUD.gobDie();
    GAME.kills++;
    return;
  }
  AUD.gobHurt();
  const flinch = heavy || T.poise === 0;
  if (flinch) {
    /* An ordinary hit never GRANTS a parry window — and must not cancel one
       either. This used to slam `stunT` to zero, so the free hits a parry
       bought cut the stun back to the animation's 0.26s and the reward
       evaporated the moment it was spent. `eSet` restarts the clock, so the
       remainder is carried across by hand: PRESERVED, never extended, or a
       fast enough sword would lock a goblin down forever. */
    const left = e.stunT > 0 ? mx(0, e.stunT - e.st) : 0;
    eSet(e, 'hurt', 'hurt');
    e.stunT = left > GA.hurt.dur ? left : 0;
    e.vx = dir * (heavy ? 130 : 70);
    if (heavy) e.vy = -60;
  } else {
    e.vx = dir * 30;
  }

}

/* ===== 17.  THROWN DAGGERS (parry them back at their owner) ==== */
const DAG = [];

    d.rot += (d.vx > 0 ? 1 : -1) * dt * 16;

      if (d.x > hb.x0 - 3 && d.x < hb.x1 + 3 && d.y > hb.y0 && d.y < hb.y1) {

             only way it can be parried at all — without this its parryStun

          /* passes through the roll */
        } else gone = true;

/* ===== 18.  GRULLK — boss logic ================================

         machine, stagger/stun, the punish repeat and the camp timer.
   TIMING-SENSITIVE. Every attack's active frames, box and duration are tied
   to the answer its telegraph names (BTELL, section 22) and to what the
   knight can physically do in that time. Changing any one of `frames`, `dur`
   or `box` means re-deriving the others.

     person can actually time. Touch this and re-derive both numbers. */

  diag: { frames: [5, 6], box: [8, -60, 54, 6], dmg: 35, kb: 210, dur: 1.25 },

function bossHurt(dmg, dir, heavy, hx, hy) {

  const mult = b.state === 'stun' ? 1.75 : 1;
  b.hp -= dmg * mult;

  else { FX.hitLight(hx, hy, dir, P.gobBl); AUD.hit(); }
