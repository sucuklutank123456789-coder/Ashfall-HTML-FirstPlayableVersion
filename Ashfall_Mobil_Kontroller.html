  }
  p.st += dt; p.at += dt;
  if (p.iTime > 0) p.iTime -= dt;
  if (p.flashT > 0) p.flashT -= dt;
  if (p.parryT > 0) p.parryT -= dt;
  if (p.denyT > 0) p.denyT -= dt;
  if (p.chargePulseT > 0) p.chargePulseT -= dt;
  if (p.comboT > 0) p.comboT -= dt; else p.combo = 0;
  if (p.stamCd > 0) p.stamCd -= dt;
  else {
    const guarding = p.state === 'block' || p.state === 'airblock' || p.state === 'airblockland';
    p.stam = mn(PLC.maxStam, p.stam + PLC.stamRegen * (guarding ? 0.35 : 1) * dt);
  }

  const wantLeft = IN.held.left, wantRight = IN.held.right;
  let dir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);
  const attacking = p.state === 'atk1' || p.state === 'atk1b' || p.state === 'atk2' ||
    p.state === 'charge' || p.state === 'chargeAtk';
  const canAct = plCanAct();

  /* An action the bar cannot pay for used to do nothing at all — no sound, no
     mark, no animation — so a dropped input and an empty bar looked identical,
     and IN_BUFFER only lengthens the silence. Read off the press edge before
     the chain below, so it fires once per press and never for one that is
     about to be honoured. */
  if (canAct || attacking) {
    /* A swing he cannot make AT ALL is not a stamina problem: with his kit
       still on the stone there is nothing for the bar to refuse and flashing
       it would be a lie about which of the two is in the way. During a sword
       attack only roll is actionable, so only that escape can be refused. */
    const canLight = canAct && p.armed, canHeavy = canAct && p.armed;
    const need = (attacking && p.onGround && IN.press('roll')) ? PLC.rollCost
      : ((canHeavy && IN.press('heavy')) ? PLC.heavyCost
        : ((canLight && IN.press('light')) ? PLC.lightCost
          : (canAct && IN.press('roll') && p.onGround ? PLC.rollCost : 0)));
    /* Only cry off if the bar still cannot pay by the time the buffer lapses:
       it refills during those IN_BUFFER seconds once stamCd is out, so a
       shortfall of a point or two is about to be honoured and calling it
       refused would be a lie. */
    const canGain = mx(0, IN_BUFFER - p.stamCd) * PLC.stamRegen;
    if (need && p.stam + canGain < need) { p.denyT = 0.30; p.denyWhat = 'stam'; AUD.denied(); }
    else if (canAct && IN.press('flask') && p.flasks <= 0) { p.denyT = 0.30; p.denyWhat = 'flask'; AUD.denied(); }
  }

  /* ---- action inputs ----
     INVARIANT: every branch tests its own preconditions BEFORE IN.consume().
     Consuming empties the buffer as a side effect of asking, so putting it
     first threw away a press that could not be honoured this frame — the one
     thing a buffer exists to prevent. A jump tapped an IN_BUFFER before the
     feet land now fires on the landing, and a roll asked for four stamina
     short waits out those four points.
     Roll is also the escape hatch out of either sword attack, which is why it
     is read BEFORE plCanAct() — attacks intentionally fail that predicate.
     The ground and stamina cost still apply, and consuming the press here is
     what stops the cancelled swing resuming after the roll. */
  /* asked once: the chain below reads it and so does nothing else this frame */
  const takeI = takeTarget();
  if (attacking && p.onGround && p.stam >= PLC.rollCost && IN.consume('roll')) {
    p.hitDone = true;
    p.combo = 0; p.comboT = 0;
    plEnterRoll(dir);
  } else if (canAct) {
    if (p.onGround && p.stam >= PLC.rollCost && IN.consume('roll')) {
      plEnterRoll(dir);
    } else if (p.onGround && p.flasks > 0 && p.hp < PLC.maxHp && IN.consume('flask')) {
      plSet('drink', 'drink'); p.flasks--; p.healT = 0; AUD.flask();
    } else if (p.onGround && midAnvilReachable() && IN.consume('take')) {
      forgeOpen();
      return;
    } else if (p.onGround && takeI >= 0 && IN.consume('take')) {
      /* the bend costs nothing but the time it takes — the thing it is
         reaching for is remembered here and lifted on PICK_FRAME */
      plSet('pickup', 'pickup'); p.takeI = takeI; AUD.ui();
    } else if (p.armed && p.stam >= PLC.heavyCost && IN.consume('heavy')) {
      plSpend(PLC.heavyCost);
      p.hitDone = false; if (dir !== 0) p.face = dir;
      if (LV.noCharge) {
        /* The prologue teaches the old heavy only: a held RMB must not turn
           into the later field's charge just because the player waits. */
        plSet('atk2', 'atk2');
        p.chargeT = 0; p.chargeLevel = 0; p.chargePulseT = 0;
        AUD.swingHeavy();
        p.vx += p.face * 26;
      } else {
        plSet('charge', 'chargeStart');
        p.chargeT = 0; p.chargeLevel = 0; p.chargePulseT = 0;
        p.vx += p.face * 12;
      }
    } else if (p.armed && p.stam >= PLC.lightCost && IN.consume('light')) {
      const b = p.combo === 1;
      plSet(b ? 'atk1b' : 'atk1', b ? 'atk1b' : 'atk1');
      AUD.swing(); plSpend(PLC.lightCost);
      p.hitDone = false; p.combo = b ? 0 : 1; p.comboT = 0.55;
      if (dir !== 0) p.face = dir;
      p.vx += p.face * 34;
    } else if ((p.onGround || p.coyote > 0) && IN.consume('jump')) {
      p.vy = PLC.jumpV; p.onGround = false; p.coyote = 0;
      /* Keep a held shield through the whole jump. The ascent gets its own
         weighted lower-body animation; it must not reuse the flat block pose.
         `armed` is the same gate the guard block below uses: without it an
         unarmed knight entered `airblock` here and was demoted to `fall` by
         that block in the same frame, so the whole rise played in the falling
         pose and the takeoff pose never appeared at all. */
      if (p.armed && IN.held.guard && p.stam > 4) plSet('airblock', 'guardjump');
      else plSet('jump', 'jump');
      AUD.jump();
      FX.jumpDust(p.x, p.y);
    }
  }
  /* INVARIANT: guard is a hold, the parry window belongs to a fresh PRESS,
     and `guardArm` is what makes that true — spent when a window opens, given
     back only by letting the guard go. Testing the state instead ("am I not
     already in block?") minted a whole new window every time anything else
     let go of the knight: a stagger ending, a guard-break wearing off, a
     landing, stepping off a ledge. Holding Q and tapping jump was a
     permanent parry. */
  if (!IN.held.guard) p.guardArm = true;
  /* and there has to be a shield on the arm. Gating it here rather than
     inside damagePlayer keeps the whole guard economy — the window, the arm,
     the chip, the break — reading exactly as it always has; the knight
     simply never enters any of the guarding states without his kit. */
  const guardWanted = IN.held.guard && p.armed && p.onGround && plCanAct() && p.stam > 4;
  const airGuardState = p.state === 'jump' || p.state === 'fall' || p.state === 'airblock';
  const airGuardWanted = IN.held.guard && p.armed && !p.onGround && airGuardState &&
    (p.vy > 0 || p.state === 'airblock') && p.stam > 4;
  if (guardWanted && p.state !== 'block' && p.state !== 'parry') {
    plEnterBlock();
  } else if (airGuardWanted && p.state !== 'airblock') {
    plEnterAirBlock();
  } else if (!guardWanted && (p.state === 'block')) {
    plSet('idle', 'idle');
  } else if (!airGuardWanted && p.state === 'airblock') {
    plSet('fall', 'fall');
  }

  /* ---- state behaviour ---- */
  const A = KA[p.anim];
  let allowMove = true, spd = PLC.runSpeed;
  p.rollIF = false;                       /* set again below only while rolling */
  switch (p.state) {
    case 'roll': {
      allowMove = false;
      const t = p.st / PLC.rollDur;
      p.rollIF = (t > PLC.rollIFrames[0] / PLC.rollDur && t < PLC.rollIFrames[1] / PLC.rollDur);
      /* stamped only while the window is open, and cleared on the way out:
         leaving the last 0.02s standing let a blow that the roll was the wrong
         answer to slip through the frame after `rollIF` had already gone false */
      if (p.rollIF) p.iTime = mx(p.iTime, 0.02);
      else if (p.iTime > 0 && p.iTime <= 0.02) p.iTime = 0;
      p.vx = p.face * PLC.rollSpeed * (1 - eIn(clamp(t, 0, 1)) * 0.55);
      if (p.onGround && (p.st % 0.07) < dt) FX.rollDust(p.x, p.y, p.face);
      /* a held shield is picked up by the guard block on the NEXT frame, not
         here: guardWanted is false throughout a roll because plCanAct() says so */
      if (p.st >= PLC.rollDur) plSet('idle', 'idle');
      break;
    }
    case 'charge': {
      allowMove = false;
      p.vx *= Math.pow(0.018, dt);
      p.chargeT = mx(0, p.st - PLC.chargeGate);
      const T = plChargeTimes();
      const raw = p.chargeT >= T[2] ? 3 : (p.chargeT >= T[1] ? 2 : (p.chargeT >= T[0] ? 1 : 0));
      const level = mn(plChargeCap(), raw);
      if (level > p.chargeLevel) {
        p.chargeLevel = level;
        p.chargePulseT = level === 3 ? 0.22 : 0.16;
        p.anim = 'charge' + level; p.at = 0; p.frame = 0;
        AUD.chargeStep(level);
      }
      /* Release owns the attack. A short click reaches here with level zero
         and continues through the original atk2, preserving its old damage. */
      if (!IN.held.heavy) plReleaseCharge();
      break;
    }
    case 'atk1': case 'atk1b': case 'atk2': case 'chargeAtk': {
      allowMove = false;
      const dur = A.dur;
      const t = p.st / dur;
      const charged = p.state === 'chargeAtk';
      const heavy = p.state === 'atk2' || charged;
      p.vx *= Math.pow(0.02, dt);
      /* the heavy swing drags the body forward through the impact */
      if (heavy && t > (charged ? 0.30 : 0.52) && t < (charged ? 0.58 : 0.66) && p.onGround)
        p.vx += p.face * (charged ? A.drive : 300) * dt;
      const fi = fl(t * A.n);
      const hitF = A.hit;
      if (hitF && hitF.indexOf(fi) >= 0 && !p.hitDone) {
        plStrike(heavy, charged ? p.chargeLevel : 0);
        /* A wall lesson can open its SAY interruption from the active strike.
           Do not let the remainder of this gameplay tick re-integrate the
           pose that the scene entrance just normalized. */
        if (GAME.exitNotice) return;
      }
      /* the whoosh, on the first frame of the swing's active window only */
      if (hitF && fi === hitF[0] && p.st - dt < hitF[0] / A.n * dur) {
        const ang = heavy ? -0.5 : (p.state === 'atk1b' ? -1.1 : 0.2);
        if (charged) FX.swingCharged(p.x + p.face * 14, p.y - 28, p.face, ang, p.chargeLevel);
        else if (heavy) FX.swingHeavy(p.x + p.face * 14, p.y - 28, p.face, ang);
        else FX.swingLight(p.x + p.face * 12, p.y - 26, p.face, ang);
      }
      if (p.st >= dur) {
        p.chargeT = 0; p.chargeLevel = 0; p.chargePulseT = 0;
        plSet('idle', 'idle');
      }
      break;
    }
    case 'block': {
      allowMove = true; spd = PLC.blockSpeed;
      break;
    }
    /* full run-speed air control, i.e. the defaults: the shield changes the
       posture, not the trajectory the jump already committed to */
    case 'airblock': break;
    case 'airblockland': {
      allowMove = false; p.vx *= Math.pow(0.08, dt);
      if (p.st >= KA.airblockland.dur) {
        if (IN.held.guard && p.stam > 4) plEnterBlock();
        else plSet('idle', 'idle');
      }
      break;
    }
    case 'parry': {
      allowMove = false; p.vx *= Math.pow(0.01, dt);
      if (p.st >= KA.parry.dur) { if (IN.held.guard) plEnterBlock(); else plSet('idle', 'idle'); }
      break;
    }
    case 'hurt': {
      allowMove = false; p.vx *= Math.pow(0.06, dt);
      if (p.st >= KA.hurt.dur) plSet('idle', 'idle');
      break;
    }
    case 'guardbreak': {
      allowMove = false; p.vx *= Math.pow(0.05, dt);
      if (p.st >= 0.62) plSet('idle', 'idle');
      break;
    }
    case 'stunned': {
      allowMove = false; p.vx *= Math.pow(0.04, dt);
      /* `hurt` held on its last frame, the same trick a parried goblin gets:
         the pose already reads as off balance. Two seconds of a still sprite
         would read as a lock-up, so motes turn slowly over the helm. */
      if ((p.st % 0.14) < dt) {
        const a2 = p.st * 6.5;
        PS.spawn({
          x: p.x + cos(a2) * 9, y: p.y - 46 + sin(a2) * 2.5, vx: 0, vy: -7,
          life: 0.46, size: 1, col: a2 % TAU < PI ? P.gldHi : P.gld, alpha: 0.8,
          shape: 0, layer: L_COMBAT, add: true
        });
      }
      if (p.st >= PLC.stompStun) plSet('idle', 'idle');
      break;
    }
    case 'pickup': {
      allowMove = false; p.vx *= Math.pow(0.02, dt);
      /* the take lands on the frame his hand is actually on the stone, not at
         the end of the bend: the thing has to leave the ground while he is
         still over it. `takeI` is spent on the way through, so a bend can
         only ever lift one thing however long the animation runs. */
      if (p.takeI >= 0 && p.st >= KA.pickup.dur * (PICK_FRAME / KA.pickup.n)) {
        const i = p.takeI; p.takeI = -1; pickupTake(i);
      }
      if (p.st >= KA.pickup.dur) plSet('idle', 'idle');
      break;
    }
    case 'drink': {
      allowMove = false; p.vx *= Math.pow(0.02, dt);
      p.healT += dt;
      if (p.healT > 0.22 && p.healT - dt <= 0.22) {
        p.hp = mn(PLC.maxHp, p.hp + PLC.flaskHeal);
        for (let i = 0; i < 10; i++) PS.spawn({
          x: p.x + rnd(-6, 6), y: p.y - rnd(8, 34), vx: rnd(-12, 12), vy: rnd(-26, -6),
          life: rnd(0.4, 0.8), size: 1, col: i % 2 ? P.gldHi : P.gld, alpha: 0.7,
          drag: 0.05, shape: 0, layer: L_COMBAT, add: true
        });
      }
      if (p.st >= KA.drink.dur) plSet('idle', 'idle');
      break;
    }
  }

  /* ---- horizontal motion ---- */
  if (allowMove && dir !== 0) {
    if (p.state !== 'block') p.face = dir;
    const a = (p.onGround ? PLC.accel : PLC.airAccel) * dt;
    p.vx += dir * a;
    p.vx = clamp(p.vx, -spd, spd);
  } else if (allowMove) {
    const f = (p.onGround ? PLC.friction : 240) * dt;
    if (p.vx > 0) p.vx = mx(0, p.vx - f); else p.vx = mn(0, p.vx + f);
  }
  /* ---- gravity + integration ---- */
  p.vy = mn(PLC.maxFall, p.vy + PLC.gravity * dt);
  const prevX = p.x, prevY = p.y;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  /* arena confinement belongs to the live boss encounter. After the authored
     defeat handoff the arena remains marked completed (so the trigger cannot
     respawn Grullk), but the inactive boss must not pull the knight back over
     the threshold where the scene deliberately left him. */
  if (GAME.arenaLocked && BOSS.active) p.x = clamp(p.x, LV.arenaX0 + 34, LV.arenaX1 - 10);
  /* During a post-story wake the player is deliberately outside the combat
     room. The rear limit is invisible: it prevents walking back into the
     cleared goblin road while leaving the right-hand entrance open. */
  if (bossWakeStaged()) {
    const wallX = bossWakeBackX() + PLC.footW;
    if (p.x < wallX) { p.x = wallX; if (p.vx < 0) p.vx = 0; }
  }
  /* the barred portcullis holds the road until the last goblin is down */
  if (gateBarred() && p.x > LV.gateX - 9) {
    p.x = LV.gateX - 9;
    if (p.vx > 0) p.vx = 0;
  }
  /* The prologue exit is a real horizontal boundary while either lesson is
     unfinished. Keep positive speed so holding right keeps the walk cycle
     pressed against the invisible wall instead of inventing a hit animation. */
  if (prologueExitBarred() && p.x > LV.exitX) {
    p.x = LV.exitX;
    if (prologueExitContact()) return;
  }
  /* midAutoBegin changes mode and fully settles the knight. Nothing below
     may advance the interrupted physics/state again on that same frame. */
  if (midClampPlayer(p)) return;
  midWallCapCollide(p, prevX, prevY);
  p.x = clamp(p.x, 6, LV.w - 8);

  /* ---- collisions ---- */
  /* Do not stop at the first support: at a step seam the lower road supports
     the feet in the same frame that the raised platform must classify a true
     horizontal edge crossing. `p.onGround` still admits only one support. */
  let landed = false, support = null;
  p.onGround = false;
  for (const pl of LV.plats) {
    if (p.x + PLC.footW < pl.x || p.x - PLC.footW > pl.x + pl.w) continue;
    /* Tops are one-way: only a downward crossing from above may support. */
    if (!p.onGround && p.vy >= 0 && prevY <= pl.y + 1 && p.y >= pl.y) {
      p.y = pl.y; p.vy = 0; p.onGround = true; landed = true; support = pl;
    }
    /* Thin ledges above the feet are not walls. A real step owns the feet's
       vertical slab, and only a swept foot edge — never vertical overlap by
       itself — may choose a horizontal push direction. Rising bodies pass. */
    const platformBottom = pl.y + pl.h;
    if (p.vy >= 0 && p.y > pl.y && p.y <= platformBottom &&
        p.y - PLC.h < platformBottom && prevY > pl.y && prevY <= platformBottom) {
      const left = pl.x, right = pl.x + pl.w;
      const crossedLeftEdge = prevX + PLC.footW <= left && p.x + PLC.footW > left;
      const crossedRightEdge = prevX - PLC.footW >= right && p.x - PLC.footW < right;
      if (p.y - PLC.h * 0.4 > pl.y) {
        if (crossedLeftEdge) { p.x = mn(p.x, left - PLC.footW - 1); p.vx = 0; }
        else if (crossedRightEdge) { p.x = mx(p.x, right + PLC.footW + 1); p.vx = 0; }
      }
    }
  }
  /* how far the body actually fell, measured from the highest point it
     reached since the feet last left stone — read before the apex is reset */
  const drop = p.y - p.apexY;
  if (p.onGround) {
    p.coyote = PLC.coyote;
    /* Store the observed support, not a later groundAt guess: stacked ledges
       can share x while having different tops. The extra pixel keeps the
       whole footprint strictly inside the respawn platform. */
    const safeInset = PLC.footW + 1;
    p.lastGroundX = clamp(p.x, support.x + safeInset, support.x + support.w - safeInset);
    p.lastGroundY = support.y;
  } else {
    p.coyote = mx(0, p.coyote - dt);
    p.apexY = mn(p.apexY, p.y);
  }
  /* Landing feedback is keyed to DROP, not to impact speed: a standing jump
     comes back down at nearly the speed of a real fall, so a speed test kicked
     the camera every time the knight hopped on the spot. quietDrop sits just
     over a standing jump's apex (jumpV^2 / 2g), so his own hop is silent and
     stepping off anything above ankle height is not. */
  if (landed && !p.stompFly && (p.state === 'fall' || p.state === 'jump' || p.state === 'airblock')) {
    const shieldLanding = p.state === 'airblock' && IN.held.guard && p.stam > 4;
    const force = clamp(p.landForce / 420, 0, 1);
    FX.landDust(p.x, p.y, force);
    if (drop > PLC.quietDrop) {
      const heft = clamp((drop - PLC.quietDrop) / 90, 0, 1);
      AUD.land(force);
      if (force > 0.55) CAM.kick(1.2 + heft * 2.2, 8);
    }
    plSet(shieldLanding ? 'airblockland' : 'land', shieldLanding ? 'airblockland' : 'land');
  }
  /* Thrown clear by the stomp. The blow was only the fare — this is the part
     that costs, and it deliberately does not go through the landing above:
     there is no crouch-and-recover here, he arrives and stays down. */
  if (p.stompFly && landed) {
    p.stompFly = false;
    plSet('stunned', 'hurt');
    p.vx *= 0.18;
    FX.landDust(p.x, p.y, 1);
    FX.dustRing(p.x, p.y, 8, 80);
    FX.blood(p.x, p.y - 14, -p.face, 5, P.bld);
    AUD.land(1); AUD.hurt();
    CAM.kick(2.8, 7);
  }
  if (p.onGround) p.apexY = p.y;
  p.landForce = p.vy;
  /* airborne state */
  if (!p.onGround && (p.state === 'idle' || p.state === 'run' || p.state === 'land' || p.state === 'block')) {
    plSet('fall', 'fall');
  }
  if (p.state === 'jump' && p.vy > 20) plSet('fall', 'fall');
  if (p.state === 'airblock' && p.vy > 20 && p.anim === 'guardjump') p.anim = 'airblock';
  if (p.state === 'land' && p.st >= KA.land.dur) plSet('idle', 'idle');
  /* ground locomotion state */
  if (p.onGround && (p.state === 'idle' || p.state === 'run')) {
    const moving = ab(p.vx) > 12 && dir !== 0;
    if (moving && p.state !== 'run') plSet('run', 'run');
    else if (!moving && p.state !== 'idle') plSet('idle', p.hp < PLC.maxHp * 0.3 ? 'idleW' : 'idle');
    if (!moving && p.anim === 'idle' && p.hp < PLC.maxHp * 0.3) { p.anim = 'idleW'; }
    if (!moving && p.anim === 'idleW' && p.hp >= PLC.maxHp * 0.3) { p.anim = 'idle'; }
  }
  /* A different animation, not the same one sliding: `block` plants both
     feet, so holding a direction dragged the knight along the stone. The
     clock is NOT restarted on the swap — the stride carries across, so
     starting and stopping does not snap the legs to a contact pose. */
  if (p.onGround && p.state === 'block') {
    const want = (ab(p.vx) > 8 && dir !== 0) ? 'blockwalk' : 'block';
    if (p.anim !== want) p.anim = want;
  }
  /* pit */
  if (p.y > VH + 90) {
    p.hp -= 34; p.flashT = 0.32; AUD.hurt(); CAM.kick(3, 6);
    if (p.hp <= 0) { plDie(); return; }
    p.chargeT = 0; p.chargeLevel = 0; p.chargePulseT = 0;
    /* This pair was validated against one concrete support platform. Asking
       groundAt here could select a different ledge stacked above it. */
    p.x = p.lastGroundX; p.y = p.lastGroundY; p.vy = 0; p.vx = 0;
    /* the respawn is a teleport, not a fall — do not let the pit's depth be
       carried into the next landing's impact */
    p.apexY = p.y; p.landForce = 0;
    p.iTime = 1.1; plSet('land', 'land');
  }

  /* ---- animation clock ---- */
  const AA = KA[p.anim];
  if (AA) {
    if (p.anim === 'run') p.at += ab(p.vx) / PLC.runSpeed * dt * 0.55;
    /* the guard walk is paced off the guard speed, not the run speed, or a
       knight moving at a third of his pace would still be striding flat out */
    else if (p.anim === 'blockwalk') p.at += ab(p.vx) / PLC.blockSpeed * dt * 0.30;
    p.frame = animFrame(AA, p.at);
    if (p.anim === 'roll') p.frame = mn(5, fl(p.st / PLC.rollDur * 6));
    /* footfall dust on the two contact frames of whichever gait is running */
    const walking = p.anim === 'run' ? [0, 5] : (p.anim === 'blockwalk' ? [0, 4] : null);
    if (walking && p.onGround) {
      const f2 = p.frame;
      if ((f2 === walking[0] || f2 === walking[1]) && p.stepPhase !== f2) {
        FX.footDust(p.x - p.face * 3, p.y, p.face, ab(p.vx));
        AUD.step();
      }
      if (p.stepPhase !== f2) p.stepPhase = f2;
    }
  }
  /* ---- cape lag ---- */
  const targetK = (KA[p.anim] && KA[p.anim].cape !== undefined ? KA[p.anim].cape : 0)
    - clamp(p.vx * p.face / PLC.runSpeed, -1, 1) * 0.55
    + clamp(-p.vy / 300, -0.6, 0.9);
  p.capeV += (targetK - p.capeK) * 26 * dt;
  p.capeV *= Math.pow(0.0006, dt);
  p.capeK = clamp(p.capeK + p.capeV * dt, -1, 1);
}

function plDie() {
  if (PL.dead) return;
  PL.dead = true; PL.deadT = 0; PL.at = 0; PL.anim = 'death'; PL.state = 'death';
  PL.chargeT = 0; PL.chargeLevel = 0; PL.chargePulseT = 0;
  PL.vx = -PL.face * 40; PL.vy = -80;
  AUD.die(); AUD.stopMusic();
  FX.blood(PL.x, PL.y - 26, -PL.face, 14, P.bld);
  CAM.kick(4, 4);
  GAME.deathT = 0;
}

/* One pure damage gate owns the anvil reward. The caller supplies the attack
   identity and progression bit; this helper no longer reaches into live PL or
   PROG state, so every tier can be tested without manufacturing a whole run. */
function plAttackDamage(state, charge, forged) {
  const key = charge ? 'chargeAtk' + charge : state;
  const tuned = PLC.swordDamage[key];
  /* chargeAtk3 is already impossible before the forge, but keeping its full
     value here prevents isolated probes inventing a pre-forge red tier. */
  return tuned - (!forged && charge !== 3 ? PLC.forgeDamageBonus : 0);
}

/* the player's own strike */
function plStrike(heavy, chargeLevel) {
  const p = PL;
  const charge = chargeLevel || 0;
  p.hitDone = true;
  const box = heavy
    ? { x0: 2, y0: -46, x1: 40, y1: -4 }
    : (p.state === 'atk1b' ? { x0: 2, y0: -42, x1: 32, y1: -8 } : { x0: 2, y0: -38, x1: 32, y1: -10 });
  const fb = faceBox(p.x, p.face, box.x0, box.x1);
  const wx0 = fb.x0, wx1 = fb.x1, wy0 = p.y + box.y0, wy1 = p.y + box.y1;
  let hitAny = false;
  const dmg = plAttackDamage(p.state, charge, PROG.redCharge);
  /* Belt and braces: the item gate is the normal owner of this privilege,
     but a stale/debug-written flag still cannot skip the mandatory first
     Grullk death. */
  const finisher = charge === 3 && PROG.finisherArmed && GAME.bossRematch;
  for (const e of EN) {
    if (e.dead) continue;
    const hb = e.hurtBox();
    if (!boxHit(hb, wx0, wy0, wx1, wy1)) continue;
    const hx = clamp((wx0 + wx1) * 0.5, hb.x0, hb.x1), hy = clamp((wy0 + wy1) * 0.5, hb.y0, hb.y1);
    enemyHurt(e, dmg, p.face, heavy, hx, hy, charge);
    hitAny = true;
  }
  if (BOSS.active && !BOSS.dead) {
    const hb = bossHurtBox();
    if (boxHit(hb, wx0, wy0, wx1, wy1)) {
      const hx = clamp((wx0 + wx1) * 0.5, hb.x0, hb.x1), hy = clamp((wy0 + wy1) * 0.5, hb.y0, hb.y1);
      /* The red finisher is a boss-only override. Goblins still receive the
         ordinary chargeAtk3 tuning, while a confirmed Grullk contact records
         the exact 155 damage and hands the scene over to the finale. */
      bossHurt(dmg, p.face, heavy, hx, hy, charge, finisher);
      hitAny = true;
    }
  }
  const worldHit = midStrike(wx0, wy0, wx1, wy1, charge);
  if (hitAny) {
    const stop = charge ? [0, 0.115, 0.135, 0.16][charge] : (heavy ? 0.11 : 0.055);
    /* All three charged hits use exactly half their former displacement.
       Red gets its extra authority from local contact layers, not nausea. */
    const kick = charge ? [0, 1.75, 2.4, 3.7][charge] : (heavy ? 3.0 : 1.5);
    GAME.hitstop = mx(GAME.hitstop, stop);
    CAM.kick(kick, charge === 3 ? 5.2 : (heavy ? 7 : 9));
    p.stam = mn(PLC.maxStam, p.stam + (heavy ? 6 : 3));
  } else if (!worldHit) {
    /* whiff — a few motes of disturbed dust only */
    if (heavy) FX.dust(p.x + p.face * 22, p.y - 30, 2, 8, 6, P.stnLt);
  }
}

/* damage taken by the player, routed through guard / parry / i-frames */
/* `answer` is the word the telegraph put over the boss's head, and it names
   the ONE limb that beats the blow. The guard is not a universal out during
   a telegraph:
     PARRY  — the shield is right. A tap on the window turns the blow and
              staggers Grullk; merely holding still stops it, for chip and a
              heavy bite of stamina.
     ROLL   — only the roll's own i-frames. The shield eats it at full price,
              which is what stops the fight collapsing back into holding Q.
     JUMP   — geometry, not this function: the box is cleared or it is not.
     BACK   — not in this vocabulary at all, so nothing here catches the
              stomp. Leaving is the only answer.
   Blows with no telegraph (goblins, thrown daggers) pass no answer and the
   shield is a full reply to all of them. Only Grullk names his terms. */
function damagePlayer(amount, srcX, kind, contactY, answer) {
  const p = PL;
  if (p.dead) return 'dodge';
  /* only the roll's OWN i-frames are refused — invulnerability earned any
     other way (a hit, a parry, a pit respawn) always holds */
  const wrongRoll = p.rollIF && answer && answer !== 'ROLL';
  if (p.iTime > 0 && !wrongRoll) {
    if (p.state === 'roll') FX.afterimage(p.x, p.y);
    return 'dodge';
  }
  const fromFront = (srcX - p.x) * p.face > -4;
  const cy2 = contactY === undefined ? p.y - 26 : contactY;
  const cxp = p.x + p.face * 11;
  if ((p.state === 'block' || p.state === 'airblock' || p.state === 'airblockland' || p.state === 'parry') && fromFront) {
    /* only a blow that asked to be parried can be turned by the shield */
    if (p.parryT > 0 && (!answer || answer === 'PARRY')) {
      /* ---- PARRY ---- */
      plSet('parry', 'parry');
      p.parryT = 0; p.iTime = 0.30;
      FX.parryBurst(cxp, cy2, p.face);
      AUD.parry();
      GAME.hitstop = mx(GAME.hitstop, 0.16);
      GAME.parryFlash = 0.24;
      CAM.kick(4.2, 7);
      p.stam = mn(PLC.maxStam, p.stam + 26);
      return 'parry';
    }
    /* ---- BLOCK ----
       Open when the blow named no answer, and when it named PARRY: missing
       the window on a chop you were told to meet with the shield still
       leaves a shield in front of it. It costs chip plus `blockCost + 55% of
       the blow` — 32 of 100 for the diag — so turtling empties the bar in a
       handful of swings and guard-breaks. ROLL, JUMP and the stomp's BACK
       skip this entirely and fall through to the clean hit; no stamina is
       spent, because nothing was stopped. */
    if (!answer || answer === 'PARRY') {
      const cost = PLC.blockCost + amount * 0.55;
      plSpend(cost);
      FX.blockSparks(cxp, cy2, p.face);
      AUD.block();
      CAM.kick(1.5, 9);
      GAME.hitstop = mx(GAME.hitstop, 0.045);
      p.vx += (p.x - srcX > 0 ? 1 : -1) * 46;
      if (p.stam <= 0) {
        plSet('guardbreak', 'hurt');
        p.hp -= amount * 0.30; p.flashT = 0.32; p.iTime = 0.2;
        AUD.hurt(); CAM.kick(3, 6);
        if (p.hp <= 0) plDie();
        return 'break';
      }
      /* chip still draws blood, so it still has to look like it. Without this
         a guard held to the last point of health killed the knight with no red
         on the screen at all. */
      p.hp -= amount * 0.12;
      p.flashT = 0.32; GAME.damageFlash = mx(GAME.damageFlash, 0.16);
      if (p.hp <= 0) plDie();
      return 'block';
    }
  }
  /* ---- clean hit ---- */
  p.hp -= amount;
  p.flashT = 0.32; p.iTime = 0.62;
  p.chargeT = 0; p.chargeLevel = 0; p.chargePulseT = 0;
  plSet('hurt', 'hurt');
  p.vx = (p.x - srcX > 0 ? 1 : -1) * 120;
  p.vy = mn(p.vy, -70);
  FX.blood(p.x, p.y - 26, p.x - srcX > 0 ? 1 : -1, 8, P.bld);
  AUD.hurt();
  CAM.kick(3.4, 6);
  GAME.hitstop = mx(GAME.hitstop, 0.07);
  GAME.damageFlash = 0.32;
  if (p.hp <= 0) plDie();
  return 'hit';
}

/* ===== 16.  GOBLINS ============================================ */
const EN = [];
/* Damage numbers are transient world feedback, not enemy simulation state.
   One frozen tuning owner keeps lifetime, motion, capacity and bar geometry
   together; none of these presentation values belongs in ETUNE combat data. */
const ENEMY_FEEDBACK = Object.freeze({
  damageT: 0.55, fadeT: 0.28, rise: 10, maxDamageNumbers: 32,
  numberOffsetY: 18, barOffsetY: 8, barMinW: 22, barWidthScale: 2
});
/* `parryStun` is how long a turned blow leaves a goblin open, and it scales
   with how little the thing weighs — a caught blow puts the wiry thrower on
   its back, the brute has the mass to ride one out. All three are far longer
   than the 0.26s flinch an ordinary hit buys, which is the whole point: the
   window is the reward. Grullk is deliberately off this table; his answer is
   a 3.0s bossStun() at 1.75x damage, which is its own economy. */
const ETUNE = {
  grunt: { hp: 45, spd: 58, chase: 200, atkRange: 27, wind: 0.42, dmg: 12, poise: 0, cd: [0.55, 1.1], w: 11, h: 30, parryStun: 1.50 },
  thrower: { hp: 31, spd: 48, chase: 300, atkRange: 150, wind: 0.30, dmg: 10, poise: 0, cd: [1.1, 1.8], w: 10, h: 28, parryStun: 2.00 },
  brute: { hp: 90, spd: 46, chase: 230, atkRange: 34, wind: 0.52, dmg: 20, poise: 1, cd: [0.9, 1.6], w: 15, h: 39, parryStun: 0.75 }
};
function spawnEnemy(t, x, y) {
  const T = ETUNE[t];
  const e = {
    t: t, x: x, y: y === undefined ? GY : y, vx: 0, vy: 0, face: -1,
    hp: T.hp, maxHp: T.hp, state: 'idle', st: 0, anim: 'idle', at: 0, frame: 0,
    dead: false, deadT: 0, alerted: false, cd: rnd(0.3, 1), hitDone: false,
    flashT: 0, onGround: true, patrolDir: -1, patrolT: rnd(0, 2),
    guardT: 0, fade: 1, stunT: 0,
    hurtBox() { return { x0: this.x - T.w * 0.5, y0: this.y - T.h, x1: this.x + T.w * 0.5, y1: this.y - 1 }; }
  };
  EN.push(e);
  return e;
}
function enemyBarW(T) {
  return mx(ENEMY_FEEDBACK.barMinW, fl(T.w * ENEMY_FEEDBACK.barWidthScale));
}
function eSet(e, s, a) { e.state = s; e.st = 0; if (a !== undefined) { e.anim = a; e.at = 0; e.frame = 0; } }

function enemyUpdate(e, dt) {
  const T = ETUNE[e.t];
  e.st += dt; e.at += dt;
  if (e.flashT > 0) e.flashT -= dt;
  if (e.dead) {
    e.deadT += dt;
    e.frame = animFrame(GA.die, e.deadT);
    e.vx *= Math.pow(0.02, dt);
    corpseFall(e, dt, 400);
    if (e.deadT > 1.5) e.fade = mx(0, 1 - (e.deadT - 1.5) / 0.8);
    return;
  }
  const dx = PL.x - e.x, dy = PL.y - e.y, adx = ab(dx);
  /* One ledge height. The level's real gaps are 42-46, and at a strict `< 46`
     the two throwers sitting at exactly 46 watched the knight walk past
     underneath without ever reaching for a dagger. */
  const sameLevel = ab(dy) < 48;
  if (!e.alerted && adx < T.chase && sameLevel && !PL.dead) {
    e.alerted = true; AUD.gobAlert();
    eSet(e, 'idle', 'idle');
  }
  if (e.cd > 0) e.cd -= dt;

  let move = 0;
  switch (e.state) {
    case 'idle': {
      if (e.alerted && !PL.dead) {
        if (e.t === 'thrower') {
          if (adx < 82 && sameLevel) { move = -Math.sign(dx); e.face = Math.sign(dx) || e.face; }
          else if (adx > 175 || !sameLevel) { move = Math.sign(dx); e.face = move; }
          else { e.face = Math.sign(dx) || e.face; if (e.cd <= 0) { eSet(e, 'throwWind', 'throw'); e.hitDone = false; } }
        } else {
          e.face = Math.sign(dx) || e.face;
          if (adx > T.atkRange) move = Math.sign(dx);
          else if (e.cd <= 0) {
            if (e.t === 'brute' && Math.random() < 0.24) { eSet(e, 'guard', 'guard'); e.guardT = rnd(0.5, 1.0); }
            else eSet(e, 'wind', 'wind');
          }
        }
      } else {
        /* idle patrol along the ledge */
        e.patrolT -= dt;
        if (e.patrolT <= 0) { e.patrolT = rnd(1.4, 3.2); e.patrolDir = Math.random() < 0.5 ? -1 : (Math.random() < 0.5 ? 0 : 1); }
        move = e.patrolDir * 0.42;
        if (move !== 0) e.face = Math.sign(move);
      }
      break;
    }
    case 'wind': {
      /* Per-type wind-up. The table has always carried one and nothing read
         it, so the brute's longer telegraph did not exist. The animation still
         plays over GA.wind.dur; only the moment the blow commits moves. Two of
         the three rows reach here — a thrower never enters `wind` at all, so
         its 0.30 stays unreachable data, kept for the table's symmetry. */
      if (e.st >= (T.wind || GA.wind.dur)) { eSet(e, 'atk', 'atk'); e.hitDone = false; }
      break;
    }
    case 'atk': {
      const fi = fl(e.st / GA.atk.dur * GA.atk.n);
      if ((fi === 1 || fi === 2) && !e.hitDone) {
        e.hitDone = true;
        const box = e.t === 'brute' ? [4, -34, 36, 2] : [4, -24, 28, -1];
        const fb = faceBox(e.x, e.face, box[0], box[2]);
        const hb = PL.hurtBox();
        if (boxHit(hb, fb.x0, e.y + box[1], fb.x1, e.y + box[3])) {
          const res = damagePlayer(T.dmg, e.x, 'melee', e.y - 22);
          if (res === 'parry') {
            /* hurt it first — enemyHurt may kill it, and it clears stunT on
               the way through, so the parry window has to be stamped after */
            enemyHurt(e, 6, PL.face, false, e.x, e.y - 16);
            if (!e.dead) {
              eSet(e, 'hurt', 'hurt');
              e.stunT = T.parryStun; e.vx = -e.face * 100;
            }
          }
        }
        AUD.swing();
        FX.dust(e.x + e.face * 18, e.y - 12, 2, 10, 8, P.stnLt);
      }
      if (e.st >= GA.atk.dur) { eSet(e, 'idle', 'idle'); e.cd = rnd(T.cd[0], T.cd[1]); }
      break;
    }
    case 'throwWind': {
      const fi = fl(e.st / GA.throw.dur * GA.throw.n);
      if (fi >= 3 && !e.hitDone) {
        e.hitDone = true;
        /* the wind-up freezes `face`, so a knight who crosses over during it
           used to get a dagger spawned 8px behind the goblin and flying back
           through its own ribs. Re-aim at the moment of release. */
        e.face = Math.sign(PL.x - e.x) || e.face;
        const tx = PL.x - e.x, ty = (PL.y - 24) - (e.y - 20);
        const d = mx(30, hyp(tx, ty));
        spawnDagger(e.x + e.face * 8, e.y - 20, (tx / d) * 190, (ty / d) * 190 - 22, e);
        AUD.dagger();
      }
      if (e.st >= GA.throw.dur) { eSet(e, 'idle', 'idle'); e.cd = rnd(T.cd[0], T.cd[1]); e.hitDone = false; }
      break;
    }
    case 'guard': {
      e.guardT -= dt;
      e.face = Math.sign(dx) || e.face;
      if (e.guardT <= 0) { eSet(e, 'idle', 'idle'); e.cd = 0.15; }
      break;
    }
    case 'hurt': {
      /* a parried goblin holds the last recoil frame for the rest of its
         stun — the pose already reads as "off balance", so freezing it there
         costs nothing and the extra window is the whole reward for parrying */
      if (e.st >= (e.stunT || GA.hurt.dur)) { e.stunT = 0; eSet(e, 'idle', 'idle'); e.cd = mx(e.cd, 0.24); }
      break;
    }
  }
  /* ---- motion ---- */
  /* `move` is only ever non-zero in the idle case, so the speed is simply the
     type's speed — the 0.2 arm this used to carry was unreachable */
  const spd = T.spd;
  if (move !== 0 && e.state === 'idle') {
    e.vx += move * 800 * dt;
    e.vx = clamp(e.vx, -spd, spd);
    /* do not walk off a ledge or into a pit */
    const ahead = e.x + Math.sign(move) * 12;
    const gA = groundAt(ahead, e.y - 4);
    if (gA === null || ab(gA - e.y) > 20) { e.vx = 0; if (!e.alerted) e.patrolDir *= -1; }
  } else {
    e.vx *= Math.pow(0.0008, dt);
  }
  e.vy = mn(460, e.vy + PLC.gravity * dt);
  const prevY = e.y;
  e.x += e.vx * dt; e.y += e.vy * dt;
  /* Use the same barred-gate boundary as the knight.  Without this shared
     world-space clamp every goblin type could walk through the closed
     portcullis into the boss arena before the field was cleared. */
  if (gateBarred() && e.x > LV.gateX - 9) {
    e.x = LV.gateX - 9;
    if (e.vx > 0) e.vx = 0;
  }
  e.onGround = false;
  landOn(e, prevY, 5);
  /* The pit kills like anything else does. Marking it dead and walking away
     skipped the death sound and — the part that mattered — the kill counter
     the gate reads its own line off, so the tally under THE GATE IS BARRED
     disagreed with the number of goblins actually left standing. */
  if (e.y > VH + 140 && !e.dead) {
    e.dead = true; e.deadT = 2.2; e.hp = 0;
    e.anim = 'die'; e.frame = GA.die.n - 1;
    GAME.kills++;
    if (LV.mid && e.t === 'brute') PROG.midBruteDead = true;
    AUD.gobDie();
    return;                       /* it is a corpse now; skip the living-anim pass */
  }
  /* ---- anim ---- */
  let want = e.anim;
  if (e.state === 'idle') want = ab(e.vx) > 12 ? (e.alerted ? 'run' : 'walk') : 'idle';
  else if (e.state === 'wind') want = 'wind';
  else if (e.state === 'atk') want = 'atk';
  else if (e.state === 'throwWind') want = 'throw';
  else if (e.state === 'guard') want = 'guard';
  else if (e.state === 'hurt') want = 'hurt';
  if (want !== e.anim) { e.anim = want; e.at = 0; }
  e.frame = animFrame(GA[e.anim], e.state === 'idle' ? e.at : e.st);
  /* footfalls kick a little grit */
  if ((e.anim === 'run') && e.onGround && (e.frame === 1 || e.frame === 4)) {
    if (Math.random() < 0.35) FX.footDust(e.x, e.y, e.face, ab(e.vx) * 0.7);
  }
}

function enemyHurt(e, dmg, dir, heavy, hx, hy, chargeLevel) {
  if (e.dead) return;
  const charge = chargeLevel || 0, T = ETUNE[e.t];
  /* the brute's guard turns aside light blows */
  if (e.state === 'guard' && (e.face * dir < 0) && !heavy) {
    FX.blockSparks(e.x + e.face * 10, e.y - 20, e.face);
    AUD.block(); e.vx = dir * 40;
    return;
  }
  e.hp -= dmg;
  spawnDamageNumber(e, dmg, T);
  e.flashT = charge === 3 ? 0.14 : 0.09;
  /* Kept beside the FX call so the two halves of one impact stay together.
     The visual had a light/heavy split all along; the audio did not, because
     AUD.hit was written and never called from anywhere. */
  if (charge) { FX.chargeHit(hx, hy, dir, charge); AUD.hitCharged(charge); }
  else if (heavy) { FX.hitHeavy(hx, hy, dir, P.gobBl); AUD.hitHeavy(); }
  else { FX.hitLight(hx, hy, dir, P.gobBl); AUD.hit(); }
  if (e.hp <= 0) {
    e.dead = true; e.deadT = 0; e.anim = 'die'; e.frame = 0;
    e.vx = dir * (heavy ? 150 : 80); e.vy = -110;
    if (charge) FX.chargeKill(e.x, e.y - T.h * 0.5, dir, charge);
    else FX.gobDeath(e.x, e.y - T.h * 0.5, dir);
    AUD.gobDie();
    GAME.kills++;
    if (LV.mid && e.t === 'brute') PROG.midBruteDead = true;
    return;
  }
  AUD.gobHurt();
  const flinch = heavy || T.poise === 0;
  if (flinch) {
    /* An ordinary hit never GRANTS a parry window — and must not cancel one
       either. This used to slam `stunT` to zero, so the free hits a parry
       bought cut the stun back to the animation's 0.26s and the reward
       evaporated the moment it was spent. `eSet` restarts the clock, so the
       remainder is carried across by hand: PRESERVED, never extended, or a
       fast enough sword would lock a goblin down forever. */
    const left = e.stunT > 0 ? mx(0, e.stunT - e.st) : 0;
    eSet(e, 'hurt', 'hurt');
    e.stunT = left > GA.hurt.dur ? left : 0;
    e.vx = dir * (heavy ? 130 : 70);
    if (heavy) e.vy = -60;
  } else {
    e.vx = dir * 30;
  }
  e.alerted = true;
}

/* The number is stamped only after enemyHurt accepts the blow, so a brute's
   successful light guard never lies with damage that was not dealt. It owns
   a world-space point rather than the enemy reference: knockback can move the
   body without dragging an already-landed impact label across the screen. */
function spawnDamageNumber(e, amount, T) {
  const q = GAME.damageNums;
  if (q.length >= ENEMY_FEEDBACK.maxDamageNumbers) q.shift();
  q.push({
    x: e.x, y: e.y - T.h - ENEMY_FEEDBACK.numberOffsetY,
    n: Math.round(amount), t: ENEMY_FEEDBACK.damageT
  });
}
function updateDamageNumbers(dt) {
  for (let i = GAME.damageNums.length - 1; i >= 0; i--) {
    GAME.damageNums[i].t -= dt;
    if (GAME.damageNums[i].t <= 0) GAME.damageNums.splice(i, 1);
  }
}

/* ===== 17.  THROWN DAGGERS (parry them back at their owner) ==== */
const DAG = [];
function spawnDagger(x, y, vx, vy, owner) {
  DAG.push({ x: x, y: y, vx: vx, vy: vy, rot: 0, life: 4, owner: owner, friendly: false, trailT: 0 });
}
function daggerUpdate(dt) {
  for (let i = DAG.length - 1; i >= 0; i--) {
    const d = DAG[i];
    d.life -= dt;
    d.vy += 190 * dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.rot += (d.vx > 0 ? 1 : -1) * dt * 16;
    let gone = d.life <= 0;
    /* stone */
    if (isSolidAt(d.x, d.y)) {
      gone = true;
      FX.stoneBurst(d.x, d.y, 3, 60, 2);
      AUD.daggerHit();
    }
    if (!gone && !d.friendly && !PL.dead) {
      const hb = PL.hurtBox();
      if (d.x > hb.x0 - 3 && d.x < hb.x1 + 3 && d.y > hb.y0 && d.y < hb.y1) {
        const res = damagePlayer(10, d.x, 'proj', d.y);
        if (res === 'parry') {
          d.friendly = true; d.vx = -d.vx * 1.5; d.vy = -ab(d.vy) * 0.3 - 20; d.life = 3;
          /* the thrower never comes into reach, so a turned dagger is the
             only way it can be parried at all — without this its parryStun
             would be a number nothing could ever trigger */
          const ow = d.owner;
          if (ow && !ow.dead && ow.state !== 'hurt') {
            eSet(ow, 'hurt', 'hurt');
            ow.stunT = ETUNE[ow.t].parryStun; ow.alerted = true;
            ow.vx = (ow.x - PL.x > 0 ? 1 : -1) * 60;
          }
        } else if (res === 'block') {
          gone = true;
        } else if (res === 'dodge') {
          /* passes through the roll */
        } else gone = true;
      }
    } else if (!gone && d.friendly) {
      for (const e of EN) {
        if (e.dead) continue;
        const hb = e.hurtBox();
        if (d.x > hb.x0 && d.x < hb.x1 && d.y > hb.y0 && d.y < hb.y1) {
          enemyHurt(e, 36, Math.sign(d.vx) || 1, true, d.x, d.y);
          gone = true; GAME.reflectKills++;
          break;
        }
      }
      if (!gone && BOSS.active && !BOSS.dead) {
        const hb = bossHurtBox();
        if (d.x > hb.x0 && d.x < hb.x1 && d.y > hb.y0 && d.y < hb.y1) { bossHurt(30, Math.sign(d.vx) || 1, true, d.x, d.y); gone = true; }
      }
    }
    if (gone) { DAG.splice(i, 1); continue; }
    /* faint trail */
    d.trailT -= dt;
    if (d.trailT <= 0) {
      d.trailT = 0.05;
      PS.spawn({
        x: d.x, y: d.y, vx: 0, vy: 0, life: 0.16, size: 1,
        col: d.friendly ? P.gldHi : '#5c6674', alpha: d.friendly ? 0.6 : 0.3,
        shape: 0, layer: L_COMBAT, add: d.friendly
      });
    }
  }
}

/* ===== 18.  GRULLK — boss logic ================================
   Owns: BATK (hitboxes/damage/active frames), BOSS, the two-phase state
         machine, stagger/stun, the punish repeat and the camp timer.
   TIMING-SENSITIVE. Every attack's active frames, box and duration are tied
   to the answer its telegraph names (BTELL, section 22) and to what the
   knight can physically do in that time. Changing any one of `frames`, `dur`
   or `box` means re-deriving the others.
   Invariants:
   - a stagger window is never cut short (phase 2's roar defers, insideT freezes)
   - `hitDone` means "the box reached him", whatever he did about it
   - the punish never begets another punish
   ===== */
const BATK = {
  smash: { frames: [5, 6], box: [12, -50, 52, 6], dmg: 30, kb: 190, dur: 1.55 },
  /* Two active frames, not three. Eight frames over 1.30s is 0.1625s each, so
     [4,5,6] pinned the head to the stone for 0.49s — and a jump only clears
     the 28px box for 0.53s of its 0.71s flight (348^2/2g = 62px apex, 27px
     needed). Forty milliseconds of margin is not a window, it is a coin
     toss: the knight answered correctly and still came down onto the mace.
     At two frames the safe overlap is a fifth of a second, which is a jump a
     person can actually time. Touch this and re-derive both numbers. */
  sweep: { frames: [4, 5], box: [2, -28, 62, 6], dmg: 30, kb: 240, dur: 1.30 },
  diag: { frames: [5, 6], box: [8, -60, 54, 6], dmg: 35, kb: 210, dur: 1.25 },
  /* The stomp reaches the same distance on both sides, because it exists for
     the one place the other three cannot touch, and it hits for half again
     what an ordinary swing does — it is the price of a stalemate, not part
     of the rotation. */
  stomp: { frames: [3], box: [-58, -30, 58, 6], dmg: 40, kb: 0, dur: 0.86 }
};
/* Standing inside the king. Every one of his boxes starts in front of him —
   smash at +12, diag at +8 — so a knight parked under the belly is inside
   the only gap the whole moveset has, and stepping round the back is the
   other. Just under two seconds is longer than an honest trade in his
   footprint and short enough that living there stops being a plan. The clock
   bleeds back at twice the rate when the knight leaves, so darting out for a
   frame does not clear it but genuinely disengaging does in about a second. */
const BOSS_INSIDE_X = 24, BOSS_INSIDE_T = 1.95;
/* How much faster the punish swing runs than the swing it repeats. At 2.2 a
   sweep's wind-up is 0.30s instead of 0.65 — the tell still names its answer
   and there is still just time to give it, but not time to walk anywhere. */
const BOSS_PUNISH_RATE = 2.2;
/* Same one-table rule as PL_INIT. Two fields here have bitten before and are
   why the rule exists: `active` used to come back true on every reset, so the
   king was ticked, drawn and hittable from the first frame of a run with the
   knight still on the wrong side of a barred gate; and `staggerMax`, which
   phase 2 raises to 185, was left off the old reset list, so a second run's
   phase ONE quietly asked for the phase-two stagger bar. */
const BOSS_INIT = {
  active: false, x: 3150, y: GY, vx: 0, vy: 0, face: -1,
  hp: 750, maxHp: 750, hpShown: 750,
  state: 'sleep', st: 0, anim: 'idle', at: 0, frame: 0,
  dead: false, deadT: 0, phase: 1, stagger: 0, staggerMax: 145,
  cd: 0.9, hitDone: false, flashT: 0, stunT: 0, chain: 0,
  stepPhase: -1, introT: 0, onGround: true, lastFrame: -1,
  insideT: 0, punishing: false, atkRate: 1, phase2Roar: false,
  finisherDeath: false, lastDamage: 0
};
const BOSS = Object.assign({ reset() { Object.assign(this, BOSS_INIT); } }, BOSS_INIT);
function bossHurtBox() {
  return { x0: BOSS.x - 22, y0: BOSS.y - 88, x1: BOSS.x + 22, y1: BOSS.y - 2 };
}
function bSet(s, a) { BOSS.state = s; BOSS.st = 0; if (a !== undefined) { BOSS.anim = a; BOSS.at = 0; BOSS.frame = 0; BOSS.lastFrame = -1; } }

const BOSS_FINISHER_DAMAGE = 155;
/* The finisher's presentation lives beside the boss damage gate. Keeping it
   out of `enemyHurt()` is important: goblin hits must never read boss-only
   state or own the red screen/particle burst. */
function bossFinisherImpact(hx, hy, dir) {
  GAME.finisherFlash = 0.72;
  GAME.hitstop = mx(GAME.hitstop, 0.22);
  for (let i = 0; i < 18; i++) PS.spawn({
    x: hx + rnd(-3, 3), y: hy + rnd(-4, 4), vx: dir * rnd(70, 160) + rnd(-30, 30),
    vy: rnd(-120, 20), life: rnd(0.22, 0.50), size: i % 3 === 0 ? 2 : 1,
    endSize: 1, col: i % 3 ? P.bld : '#ff8a72', col2: P.bldD,
    grav: 180, drag: 0.03, shape: i % 4 === 0 ? 2 : 3, len: 5,
    layer: L_COMBAT, add: true
  });
  FX.dustRing(hx, hy, 14, 170);
  CAM.kick(7.5, 5);
}

function bossHurt(dmg, dir, heavy, hx, hy, chargeLevel, finisher) {
  const b = BOSS;
  if (b.dead || !b.active) return;
  const charge = chargeLevel || 0;
  const mult = b.state === 'stun' ? 1.75 : 1;
  const dealt = finisher ? BOSS_FINISHER_DAMAGE : dmg * mult;
  b.lastDamage = dealt;
  b.hp -= dealt;
  b.flashT = charge === 3 ? 0.14 : 0.09;
  if (charge) { FX.chargeHit(hx, hy, dir, charge); AUD.hitCharged(charge); }
  else if (heavy) { FX.hitHeavy(hx, hy, dir, P.gobBl); AUD.hitHeavy(); }
  else { FX.hitLight(hx, hy, dir, P.gobBl); AUD.hit(); }
  if (finisher) bossFinisherImpact(hx, hy, dir);
  for (let i = 0; i < (heavy ? 3 : 1); i++) PS.spawn({
    x: hx, y: hy, vx: dir * rnd(40, 110), vy: rnd(-70, -10), life: rnd(0.2, 0.4),
    size: 1, col: P.stlHi, alpha: 0.8, grav: 200, shape: 2, len: 4, layer: L_COMBAT, add: true
  });
  AUD.bossHurt();
  if (b.hp <= 0) {
    if (finisher) {
      PROG.finisherArmed = false;
      b.finisherDeath = true;
    }
    bossDie(dir); return;
  }
  if (b.state !== 'stun') {
    b.stagger += dealt * (heavy ? 1.5 : 1);
    if (b.stagger >= b.staggerMax) bossStun();
    else if (b.state === 'idle' || b.state === 'walk') {
      if (heavy && Math.random() < 0.4) bSet('hurt', 'hurt');
      b.vx = dir * 24;
    }
  }
  /* The crown burns the moment he drops under half — but never on top of a
     stagger. That window is the one clean reward in the fight, and cutting it
     short to play the phase-change animation takes the prize back with the
     other hand (the same reasoning that freezes `insideT`). So the phase, the
     bar and the callout land now and the roar waits for him to come round. */
  if (b.phase === 1 && b.hp <= b.maxHp * 0.5) {
    b.phase = 2; b.staggerMax = 185;
    if (b.state === 'stun') { b.phase2Roar = true; b.stagger = 0; }
    else { b.stagger = 0; bSet('roar', 'roar'); AUD.bossRoar(); }
    CAM.kick(4.5, 4);
    GAME.phaseText = 2.4;
    for (let i = 0; i < 16; i++) FX.dust(b.x + rnd(-24, 24), b.y, 1, 40, 30, P.stnLt);
    FX.dustRing(b.x, b.y, 12, 130);
  }
}
/* The camping answer, entered from two places: from neutral, and out of the
   middle of an ordinary swing. It is not part of the rotation, so it ignores
   b.cd entirely; and because it replaces whatever was running, it puts the
   chain counter and the punish clock back to neutral on the way in. */
function bossStomp() {
  const b = BOSS;
  b.insideT = 0; b.chain = 0; b.atkRate = 1;
  bSet('stomp', 'stomp'); b.hitDone = false;
  AUD.bossSnarl();
}
function bossStun() {
  const b = BOSS;
  bSet('stun', 'stun');
  b.stunT = 3.0; b.stagger = 0; b.vx = 0; b.chain = 0;
  AUD.bossHurt(); AUD.tn(90, 40, 0.5, 0.18, 'sine');
  CAM.kick(3, 6);
  FX.dustRing(b.x, b.y, 10, 90);
  for (let i = 0; i < 8; i++) PS.spawn({
    x: b.x + rnd(-14, 14), y: b.y - rnd(40, 80), vx: rnd(-30, 30), vy: rnd(-40, -10),
    life: rnd(0.4, 0.8), size: 1, col: P.gldHi, alpha: 0.7, grav: 90, shape: 0, layer: L_COMBAT, add: true
  });
}
function bossDie(dir) {
  const b = BOSS;
  b.dead = true; b.deadT = 0; bSet('die', 'die'); b.vx = dir * 30;
  AUD.bossDie(); AUD.stopMusic();
  CAM.kick(5, 3.5);
  GAME.hitstop = mx(GAME.hitstop, 0.35);
  /* 25-40 particles across several kinds, not one uniform puff */
  FX.blood(b.x, b.y - 50, dir, 14, P.gobBl);
  for (let i = 0; i < 9; i++) PS.spawn({
    x: b.x + rnd(-14, 14), y: b.y - rnd(20, 70), vx: rnd(-120, 120), vy: rnd(-160, -40),
    life: rnd(0.6, 1.2), size: 2, endSize: 1, col: i % 3 === 0 ? P.stlM : P.stlD, col2: P.stlS,
    grav: 340, drag: 0.02, shape: 3, spin: rnd(-9, 9), layer: L_COMBAT, ground: b.y
  });
  for (let i = 0; i < 5; i++) PS.spawn({
    x: b.x + rnd(-8, 8), y: b.y - rnd(60, 84), vx: rnd(-70, 70), vy: rnd(-140, -60),
    life: rnd(0.7, 1.3), size: 1, col: P.gld, col2: P.gldD,
    grav: 320, drag: 0.02, shape: 3, layer: L_COMBAT, ground: b.y
  });
  FX.dustColumn(b.x, b.y, 90);
  FX.dustRing(b.x, b.y, 12, 120);
}

function bossUpdate(dt) {
  const b = BOSS;
  if (!b.active) return;
  b.st += dt; b.at += dt;
  if (b.flashT > 0) b.flashT -= dt;
  b.hpShown += (b.hp - b.hpShown) * mn(1, dt * 3.4);

  if (b.dead) {
    b.deadT += dt;
    b.frame = animFrame(BA.die, b.deadT);
    b.vx *= Math.pow(0.05, dt);
    b.x += b.vx * dt;
    /* dust and debris as the body settles */
    if (b.deadT < 2.0 && Math.random() < 0.28) FX.dust(b.x + rnd(-22, 22), b.y, 1, 14, 10, P.stnLt);
    if ((b.deadT > 0.6 && b.deadT - dt <= 0.6) || (b.deadT > 1.5 && b.deadT - dt <= 1.5)) {
      CAM.kick(2.2, 6); FX.stoneBurst(b.x + rnd(-16, 16), b.y, 5, 90, 6); AUD.land(0.9);
    }
    return;
  }

  const dx = PL.x - b.x, adx = ab(dx);
  if (b.cd > 0) b.cd -= dt;

  /* How long the knight has been standing in the king's own footprint. It is
     deliberately frozen while Grullk is staggered: that window is the whole
     reward for filling the stagger bar, and a stomp that fired in the middle
     of it would be taking back the prize with the other hand. */
  const stompTimerState = b.state === 'idle' || b.state === 'walk' || b.state === 'smash' ||
    b.state === 'sweep' || b.state === 'diag';
  if (PL.dead || !stompTimerState) {
    b.insideT = 0;
  } else if (adx < BOSS_INSIDE_X) b.insideT += dt;
  else b.insideT = mx(0, b.insideT - dt * 2);

  switch (b.state) {
    case 'intro': {
      b.introT += dt;
      b.frame = animFrame(BA.roar, b.introT);
      if (b.introT > 0.15 && b.introT - dt <= 0.15) { AUD.bossRoar(); CAM.kick(3.6, 4); }
      if (b.introT > 0.3 && Math.random() < 0.3) FX.dust(b.x + rnd(-30, 30), b.y, 1, 24, 18, P.stnLt);
      if (b.introT >= BA.roar.dur) { bSet('idle', 'idle'); b.cd = 0.5; }
      break;
    }
    case 'roar': {
      /* both of these are planted animations, so the drive left over from an
         interrupted swing has to be bled off or he slides through them */
      b.vx *= Math.pow(0.01, dt);
      b.frame = animFrame(BA.roar, b.st);
      if (b.st >= BA.roar.dur) { bSet('idle', 'idle'); b.cd = 0.35; }
      break;
    }
    case 'stun': {
      b.stunT -= dt;
      if (Math.random() < 0.10) FX.dust(b.x + rnd(-18, 18), b.y, 1, 8, 6, P.stnLt);
      if (b.stunT <= 0) {
        /* the phase change he was owed while he was down */
        if (b.phase2Roar) { b.phase2Roar = false; bSet('roar', 'roar'); AUD.bossRoar(); CAM.kick(3.6, 4); }
        else { bSet('idle', 'idle'); b.cd = 0.35; }
      }
      break;
    }
    case 'hurt': {
      b.vx *= Math.pow(0.05, dt);
      if (b.st >= BA.hurt.dur) { bSet('idle', 'idle'); b.cd = mx(b.cd, 0.25); }
      break;
    }
    case 'idle': case 'walk': {
      /* re-setting the anim every frame pins b.at at zero and the idle never
         breathes — the same trap the walk pick below is written to dodge */
      if (PL.dead) { bSet('idle', b.anim === 'idle' ? undefined : 'idle'); break; }
      b.face = dx > 0 ? 1 : -1;
      /* every road back to neutral runs through here, so this is the one
         place a punish swing's compressed clock has to be put back */
      if (b.punishing) { b.punishing = false; b.atkRate = 1; }
      if (b.insideT >= BOSS_INSIDE_T) { bossStomp(); break; }
      if (b.cd <= 0) {
        let pick;
        if (adx < 50) pick = Math.random() < 0.55 ? 'sweep' : 'smash';
        else if (adx < 96) pick = Math.random() < 0.45 ? 'smash' : (Math.random() < 0.6 ? 'diag' : 'sweep');
        else if (adx < 190) pick = Math.random() < 0.62 ? 'diag' : 'walk';
        else pick = 'walk';
        /* re-picking `walk` every 0.28 s must not restart the cycle, or the
           stride never gets past its first frame and Grullk slides along on
           a frozen leg */
        if (pick === 'walk') { bSet('walk', b.anim === 'walk' ? undefined : 'walk'); b.cd = 0.28; }
        else { bSet(pick, pick); b.hitDone = false; }
      } else {
        if (adx > 62) bSet('walk', b.anim === 'walk' ? undefined : 'walk');
        else if (b.anim !== 'idle') bSet('idle', 'idle');
      }
      if (b.state === 'walk') {
        const spd = b.phase === 2 ? 46 : 34;
        b.vx += b.face * 340 * dt;
        b.vx = clamp(b.vx, -spd, spd);
        if (adx < 56) b.vx *= 0.6;
      } else b.vx *= Math.pow(0.004, dt);
      break;
    }
    case 'smash': case 'sweep': case 'diag': case 'stomp': {
      /* The camp timer runs during the three ordinary attacks too, so a swing
         that is already playing can be cut short by it. */
      if (b.state !== 'stomp' && b.insideT >= BOSS_INSIDE_T) { bossStomp(); break; }
      const kind = b.state;
      const A = BA[kind], K = BATK[kind];
      /* a punish swing runs the same keys on a compressed clock — every read
         of the duration in here, and in drawBossTell, goes through this */
      const dur = A.dur / b.atkRate;
      const t = b.st / dur;
      const fi = mn(A.n - 1, fl(t * A.n));
      b.frame = fi;
      /* Forward drive during the committed part of the swing, scaled with the
         clock: the same push per second over less than half the time would
         cover less than half the ground, and a punish that fell short of the
         man it was aimed at would be no punish at all. */
      const drv = b.atkRate;
      if (kind === 'diag' && fi >= 3 && fi <= 5) b.vx += b.face * 420 * drv * dt;
      else if (kind === 'sweep' && fi >= 4 && fi <= 5) b.vx += b.face * 200 * drv * dt;
      else if (kind === 'smash' && fi === 5) b.vx += b.face * 120 * drv * dt;
      else b.vx *= Math.pow(0.01, dt);
      b.vx = clamp(b.vx, -150 * drv, 150 * drv);
      /* impact frame */
      if (fi !== b.lastFrame) {
        b.lastFrame = fi;
        if (fi === K.frames[0]) bossImpact(kind);
        if (kind === 'smash' && fi === 3) { AUD.tn(70, 46, 0.4, 0.10, 'sine'); }
        /* the knee at the top of its lift, held for one frame before it drops */
        if (kind === 'stomp' && fi === 2) { AUD.tn(58, 44, 0.30, 0.09, 'sine'); }
      }
      /* hit test on the active frames */
      if (K.frames.indexOf(fi) >= 0 && !b.hitDone && !PL.dead) {
        const fb = faceBox(b.x, b.face, K.box[0], K.box[2]);
        const bx0 = fb.x0, bx1 = fb.x1, by0 = b.y + K.box[1], by1 = b.y + K.box[3];
        const hb = PL.hurtBox();
        if (boxHit(hb, bx0, by0, bx1, by1)) {
          b.hitDone = true;
          const tell = BTELL[b.state];
          const res = damagePlayer(K.dmg, b.x, 'boss', clamp(PL.y - 22, by0, by1), tell ? tell.act : null);
          if (res === 'parry') { bossStun(); }
          else if (res === 'hit') {
            if (kind === 'stomp' && !PL.dead) {
              /* thrown clear along the way he is facing. The blow itself is
                 only the fare — it is the landing that puts the knight down,
                 which plUpdate picks up off this flag. */
              PL.vx = b.face * 300; PL.vy = -330; PL.stompFly = true;
            } else { PL.vx = (PL.x - b.x > 0 ? 1 : -1) * K.kb; PL.vy = -110; }
          }
        }
      }
      if (b.st >= dur) {
        /* A swing beaten by walking round the outside of it — not by
           answering it, by not being there — earns a repeat. `hitDone` is the
           honest test: it is set the moment the box overlaps the man whatever
           he then does about it, so a clean roll-through or a parry counts as
           reaching him and is left alone. `!b.punishing` keeps one whiff to
           one answer, so the fight still breathes. */
        const whiffedBehind = !b.hitDone && !b.punishing && kind !== 'stomp' &&
          !PL.dead && (PL.x - b.x) * b.face < 0 && adx < 170;
        b.hitDone = false;
        if (whiffedBehind) {
          b.face = dx > 0 ? 1 : -1;
          bSet(kind, kind); b.chain = 0;
          b.punishing = true; b.atkRate = BOSS_PUNISH_RATE;
          AUD.bossSnarl();
          FX.dustRing(b.x, b.y, 8, 80);
        } else if (b.punishing || kind === 'stomp') {
          b.punishing = false; b.atkRate = 1; b.chain = 0;
          bSet('idle', 'idle');
          /* he watches the knight get up: the stun is 2s and this cooldown is
             what stops the very next swing landing on a man still on his knees */
          b.cd = kind === 'stomp' ? rnd(1.9, 2.5) : (b.phase === 2 ? rnd(0.6, 1.1) : rnd(0.9, 1.45));
        } else if (b.phase === 2 && b.chain < 1 && Math.random() < 0.34 && adx < 120) {
          b.chain++; const nk = Math.random() < 0.5 ? 'smash' : 'sweep';
          bSet(nk, nk);
        } else {
          b.chain = 0;
          bSet('idle', 'idle');
          b.cd = b.phase === 2 ? rnd(0.42, 0.9) : rnd(0.8, 1.35);
        }
      }
      break;
    }
  }

  /* physics */
  b.vy = mn(460, b.vy + PLC.gravity * dt);
  const prevY = b.y;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.x = clamp(b.x, LV.arenaX0 + 26, LV.arenaX1 - 26);
  b.onGround = false;
  landOn(b, prevY, 16);
  /* animation clock for the looping states */
  if (b.state === 'sleep' || b.state === 'idle' || b.state === 'walk' || b.state === 'stun') {
    b.frame = animFrame(BA[b.anim], b.at);
    /* heavy footfalls */
    if (b.state === 'walk' && b.onGround && (b.frame === 0 || b.frame === 5) && b.stepPhase !== b.frame) {
      b.stepPhase = b.frame;
      FX.dust(b.x - b.face * 6, b.y, 4, 24, 14, P.stnLt);
      FX.stoneBurst(b.x - b.face * 4, b.y, 2, 40, 4);
      AUD.bossStep();
      CAM.kick(0.9, 12);
    }
  } else if (b.state === 'hurt') {
    b.frame = animFrame(BA.hurt, b.st);
  }
}

function bossImpact(kind) {
  const b = BOSS;
  const fx = b.x + b.face * 40;
  if (kind === 'smash') {
    AUD.hitHeavy(); AUD.bossStep();
    CAM.kick(5.2, 6);
    GAME.hitstop = mx(GAME.hitstop, 0.06);

/* ===== 19.  THE GATE =========================================== */
/* The portcullis has two jobs. It bars the road to the arena until the last
   goblin is down, then hauls itself up; and once the knight is through, it
   drops behind him and there is no way back out.
     shut -> raising -> open -> falling -> closed                          */
const GATE = {

const GATE_H = 92;
function hostStanding() {

}
/* The prologue has one ordered exit contract: clear the road first, then take

   wall, the warning text and the doorway cannot drift into different orders. */
function prologueExitReason() {

     on the road at the warning boundary instead of preserving that pose. */
  plPrepareCinematic(LV.exitX);

function gateBarred() {
  if (LV.gateX === undefined) return false;

function gateUpdate(dt) {

    G.t += dt;

    G.y = G.shutY + (G.upY - G.shutY) * eOut(t);
    /* grit shaken loose from the housing as the chains take the weight */
    if (Math.random() < 0.4) PS.spawn({

function textW(s, sc, sp) { sc = sc || 1; sp = sp === undefined ? 1 : sp; return s.length * (5 * sc + sp * sc) - sp * sc; }

/* ===== 21.  GAME STATE =========================================
   Owns: PROG (the playthrough), GAME (mode machine + run-scoped counters),
         the sprite warm queue, and the two doors back — resetRun() for a run,
         beginLevel() for a run on a named map.
   Modes: boot -> title -> intro -> play <-> paused, play -> defeat -> play,
          play -> midscene -> play, play -> forge -> play,
          play -> play (another map), play -> cutscene -> play.
          `victory` is deliberately unreachable and deliberately kept; see
          updatePlay().
   ===== */
/* What a PLAYTHROUGH knows, as against what a RUN knows. Dying and rising
   again is a fresh run of the same map with the same kit and the same thing
   in your pocket; only the title screen starts a playthrough over. Keeping
   the two apart is what lets resetRun() stay the single door back to a clean
   run without also throwing away which map you were on.
   A factory rather than a table, because `inv` is an array: a shared literal
   would hand every reset the same array and the "init table" would quietly
   become the live one. */
function progInit() {
  return {
    level: 0, introSeen: false, inv: ['', '', ''],
    /* The passage is a lesson, not a corpse-run tax. Broken masonry, the
       recovered ore and the forged tier survive death but not a new game. */

    midWallA: 0, midOreHits: 0, gemTaken: false,
    redCharge: false, midWallB: 0,
    /* armed only by the first inventory slot while Grullk's reserve segment
       is live; a successful chargeAtk3 consumes this privilege */

const PROG = progInit();

  /* False is the mandatory story encounter. The first closing scene flips

     with the gate raised and Grullk dormant until he walks right into the
     arena trigger. */
  bossWake: false,
  arenaLocked: false, kills: 0, reflectKills: 0,
  deathT: 0, winT: 0, bossNameT: 0, phaseText: 0, gateOpenT: 0,
  invFlash: 0, invFlashI: -1, wallRejectT: 0, midRevealT: 0,
  /* A prologue exit warning is a gameplay modal, not a cutscene. While the
     caption is typing/holding, the world is paused; after it closes, the
     unmet requirement remains an invisible wall until it is satisfied. */

};
/* and the fields that deliberately outlive a run: the mode machine, the warm
   queue, and the two gates that are about the device rather than the fight */
const GAME = Object.assign({
  mode: 'boot', starFx: [], chargeFx: [], damageNums: [],
  warm: [], warmI: 0, ready: false,
  blocked: false            /* handheld held upright — the world is frozen */
}, GAME_RUN);

const MIDSCENE_INIT = { on: false, phase: '', t: 0, takeI: -1, stepF: -1 };
const MIDSCENE = Object.assign({}, MIDSCENE_INIT);
function forgeInit() {
  return {
    on: false, bag: new Array(36).fill(''),

    armorExpanded: false,
    fsword: '', fore: '', result: '', drag: null,
    px: -100, py: -100, pointer: null, pointerKind: '', hold: 0, beam: 0,
    notice: '', noticeT: 0, crafted: false, flash: 0

const FORGE = forgeInit();

/* Every animation the knight can be in while his sword and shield are still
   lying on the road. They bake to their own cache keys (strip 3 — no shield,
   no sword), so each one has to be warmed as well or the prologue stops to
   bake mid-stride. `roll` and `death` are in here because falling into the
   prologue's pit is a thing a player does before picking anything up. */
const KIT_OFF_STATES = ['idle', 'idleW', 'run', 'jump', 'fall', 'land', 'roll',
  'hurt', 'death', 'drink', 'pickup'];
function buildWarmQueue() {
  const q = [];

  /* Charged edge masks have distinct cache keys because only the weapon may
     trail. Warm them beside their owner sprites so the first red release
     cannot stall combat to bake two historical blade poses. */
  for (const k in KA) if (KA[k].charge) for (let i = 0; i < KA[k].n; i++) q.push(['kb', k, i]);
  /* The red finisher has its own cached weapon/body material. Warm its full
     release arc up front so activating the reserve window never pauses the
     first empowered swing to bake sprites on the critical frame. */
  for (let i = 0; i < KA.chargeAtk3.n; i++) q.push(['kf', 'chargeAtk3', i, 0]);
  for (let i = 0; i < KA.chargeAtk3.n; i++) q.push(['kbf', 'chargeAtk3', i]);
  /* The partial-kit poses the knight wears after the king takes his shield,
     while he retrieves it, and after the finisher makes him drop the sword
     first. They bake to their own cache keys, so both asymmetric pickup strips
     have to be warm before either cutscene reaches them. */
  for (const k of ['hurt', 'death', 'pickup']) for (let i = 0; i < KA[k].n; i++) q.push(['k', k, i, 1]);
  for (let i = 0; i < KA.pickup.n; i++) q.push(['k', 'pickup', i, 2]);
  for (const k of KIT_OFF_STATES) for (let i = 0; i < KA[k].n; i++) q.push(['k', k, i, 3]);
  for (const t in GTYPE) for (const s in GA) { for (let i = 0; i < GA[s].n; i++) q.push(['g', t, s, i]); }
  for (const s in BA) for (let i = 0; i < BA[s].n; i++) q.push(['b', s, i]);
  for (let i = 0; i < CAPE_N; i++) q.push(['c', i]);

function warmTick(budget) {
  const q = GAME.warm;

    const it = q[GAME.warmI];
    if (it[0] === 'k') knightFrame(it[1], it[2], it[3]);
    else if (it[0] === 'kb') chargeBladeFrame(it[1], it[2]);
    else if (it[0] === 'kf') knightFrame(it[1], it[2], it[3], true);
    else if (it[0] === 'kbf') chargeBladeFrame(it[1], it[2], true);
    else if (it[0] === 'g') gobFrame(it[1], it[2], it[3]);
    else if (it[0] === 'b') bossFrame(it[1], it[2]);

  loadLevel(PROG.level);

  Object.assign(SAY, SAY_INIT);

/* A run on whichever map the playthrough is on. Every entry into play goes

   retry drops you straight into the field it was setting up. */

function newGame() {
  /* A doorway the player walked into and then abandoned. WARP deliberately sits

     but it must not survive a whole PLAYTHROUGH: pausing on the fade, quitting
     to the title and starting again used to arrive at the far side of a door
     the new knight never opened, with the leftover black still over the scene. */
  WARP.t = 0; WARP.to = -1; WARP.half = false;
  Object.assign(PROG, progInit());

}
/* A doorway with nothing drawn in it. The screen goes down to black, the next
   map is loaded behind it through the same door a retry uses, and it comes
   back up. WARP deliberately sits outside GAME_RUN: the swap it is running
   IS a resetRun, and a timer that reset itself halfway would never finish.
   Health, stamina and flasks come back full on the far side — the field was
   balanced against a knight who walks in whole, and the prologue must not
   quietly change that. */

     hand that walked him through the door is meant to still be walking on the

  AUD.uiBig();
}
/* Advance the transition clock only; updatePlay owns the unconditional early

function warpTick(dt) {
  WARP.t += dt;

    WARP.half = true;
    PROG.level = WARP.to;
    beginLevel(true);                 /* he is still holding the pad — see releaseAllInput */
    return;                           /* GAME was just rebuilt — do not touch it twice */

function warpAlpha() {

  return WARP.t < WARP_OUT ? WARP.t / WARP_OUT : clamp(1 - (WARP.t - WARP_OUT) / WARP_IN, 0, 1);
}

/* ===== 22.  ENTITY RENDERING =================================== */
function drawChargeBladeMask(e, x, y, face, alpha) {
  if (!e || alpha <= 0) return;
  const src = face < 0 ? e.f : e.n;
  const dx = fl(x - (face < 0 ? (e.w - KOX) : KOX)), dy = fl(y - KOY);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.drawImage(src, dx, dy);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function drawChargeBar(p, x, y) {
  const T = plChargeTimes(), t = p.chargeT;
  /* The charge gate is preparation, not earned charge: when the gate opens,
     show an empty bar and let it fill from zero. */
  if (p.state !== 'charge' || p.st < PLC.chargeGate) return;
  const cap = plChargeCap();
  const level = p.chargeLevel;
  const w = 33, h = 3, bx = fl(x - w / 2), by = fl(y - 57);
  r(ctx, bx - 1, by - 1, w + 2, h + 2, P.stlX);
  r(ctx, bx, by, w, h, P.ink2);
  let fw = 0, col = P.stlM, hi = P.stlLt;
  if (cap === 2) {
    /* Two equal authored halves, each with its own material. The first does
       not turn gold merely because the second has begun filling. */
    const a = fl(16 * clamp(t / T[0], 0, 1));
    const b = fl(17 * clamp((t - T[0]) / (T[1] - T[0]), 0, 1));
    if (a > 0) { r(ctx, bx, by, a, h, P.stlM); r(ctx, bx, by, a, 1, P.stlLt); }
    if (b > 0) { r(ctx, bx + 16, by, b, h, P.gld); r(ctx, bx + 16, by, b, 1, P.gldHi); }
    fw = a + b; col = level >= 2 ? P.gld : P.stlM; hi = level >= 2 ? P.gldHi : P.stlLt;
    ra(ctx, bx + 16, by, 1, h, P.stlX, 0.68);
  } else {
    let frac;
    if (t < T[0]) frac = clamp(t / T[0], 0, 1) / 3;
    else if (t < T[1]) frac = 1 / 3 + (t - T[0]) / (T[1] - T[0]) / 3;
    else frac = 2 / 3 + clamp((t - T[1]) / (T[2] - T[1]), 0, 1) / 3;
    col = level >= 3 ? P.cl : (level >= 2 ? P.gld : P.stlM);
    hi = level >= 3 ? P.clHi : (level >= 2 ? P.gldHi : P.stlLt);
    fw = fl(w * clamp(frac, 0, 1));
    if (fw > 0) { r(ctx, bx, by, fw, h, col); r(ctx, bx, by, fw, 1, hi); }
    ra(ctx, bx + 11, by, 1, h, P.stlX, 0.58);
    ra(ctx, bx + 22, by, 1, h, P.stlX, 0.58);

    const a = clamp(p.chargePulseT / (level === 3 ? 0.22 : 0.16), 0, 1);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * (level === 3 ? 0.70 : 0.38);

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}
function drawPlayer() {

  const rk = clamp(GAME.chargeRecoilT / CHARGE_RECOIL_T, 0, 1);
  const x = fl(p.x - cx - p.face * 2 * eOut(rk)), y = fl(p.y - cy);
  const flash = p.flashT > 0.18;

  if (gY !== null && !p.dead) {
    const h = clamp(1 - (gY - p.y) / 90, 0.25, 1);
    ctx.globalAlpha = 0.42 * h;

    ctx.globalAlpha = 1;

     only the shield; the road takes both until he picks them back up. */
  const strip = p.cutKitStrip >= 0 ? p.cutKitStrip : (p.armed ? (p.shieldGone ? 1 : 0) : 3);

  const blade = chargeA ? chargeBladeFrame(p.anim, p.frame, finisher) : null;

    const ci = clamp(fl((p.capeK + 1) * 0.5 * (CAPE_N - 1) + 0.5), 0, CAPE_N - 1);
    const ce2 = capeSprite(ci);
    blit(ce2, x + p.face * (fr.ax || 0), y + (fr.ay || -33), p.face, COX, COY);
  }

     behind the body, so the trail follows the sword rather than ghosting the
     whole knight and never lies about his collision silhouette. */
  if (p.state === 'chargeAtk' && p.chargeLevel === 3) {
    if (p.frame > 1) drawChargeBladeMask(chargeBladeFrame(p.anim, p.frame - 2, finisher), x, y, p.face, finisher ? 0.34 : 0.12);
    if (p.frame > 0) drawChargeBladeMask(chargeBladeFrame(p.anim, p.frame - 1, finisher), x, y, p.face, finisher ? 0.58 : 0.24);
  }

     mark: held guard and just-pressed guard look identical, so whether a
     parry was even possible could only be learned from the outcome. A gold
     edge that burns down as the window closes says "this one is live"
     without adding anything to the silhouette. */
  if (!p.dead && p.parryT > 0 && (p.state === 'block' || p.state === 'parry') && !p.shieldGone) {
    const k = clamp(p.parryT / PLC.parryWindow, 0, 1);

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30 + 0.55 * k;
    r(ctx, ex, ey, 1, fl(4 + 12 * k), P.gldHi);
    ctx.globalAlpha = 0.18 + 0.30 * k;
    r(ctx, ex + p.face, ey + 1, 1, fl(3 + 9 * k), P.gld);
    ctx.globalAlpha = 1;

    PS.spawn({
      x: p.x + rnd(-5, 5), y: p.y - rnd(18, 32), vx: rnd(-6, 6), vy: rnd(6, 20),
      life: rnd(0.25, 0.5), size: 1, col: P.bldD, alpha: 0.7, grav: 120, shape: 4, layer: L_COMBAT

    PS.spawn({
      x: p.x - p.face * rnd(2, 8), y: p.y - rnd(6, 16), vx: 0, vy: 0, life: 0.12,
      size: rint(2, 4), col: '#68809c', alpha: 0.3, shape: 7, layer: L_WORLD

}

/* ===== attack telegraph — it names the answer to the swing that is coming =
   smash : a vertical slam with a wide ground splash  -> roll through it
   sweep : a low horizontal swing at ankle height     -> jump over it
   diag  : a committed diagonal chop                  -> parry it
   stomp : no front at all, and no answer in the guard -> get out from under
   ===== */
const BTELL = {
  smash: { act: 'ROLL', col: '#8fb9dc', dim: '#3a5d78' },
  sweep: { act: 'JUMP', col: '#8fc47f', dim: '#3d6435' },
  diag: { act: 'PARRY', col: '#dcb85f', dim: '#6e5520' },
  /* BACK is not in damagePlayer's vocabulary, and that is the point: it is
     not ROLL, so the roll's i-frames are refused; it is not PARRY, so the
     window does not catch it; and being an answer at all, it skips the guard
     branch outright. The word names footwork because footwork is the only
     thing that beats it — there is 0.43s and no side of him to stand on. */
  stomp: { act: 'BACK', col: '#c98a5f', dim: '#6b4527' }
};
function drawBossTell() {
  const b = BOSS;
  if (!b.active) return;
  const sx = fl(b.x - CAM.cx), sy = fl(b.y - CAM.cy);
  if (b.dead || PL.dead || !GAME.arenaLocked) return;
  /* The stomp answers a clock the player cannot see, and its own tell fires
     only 0.43s before the blow — which narrates the loss rather than teaching
     the player to move. This bar fills under the king's feet from a bit over
     halfway, in the stomp's colour, so leaving is a decision made before the
     swing instead of a reaction to it. */
  if (b.insideT > BOSS_INSIDE_T * 0.55 && b.state !== 'stomp') {
    const k = clamp((b.insideT - BOSS_INSIDE_T * 0.55) / (BOSS_INSIDE_T * 0.45), 0, 1);
    const bw = 30, bx = sx - bw / 2, by = sy + 3;
    ctx.globalAlpha = 0.34 + 0.30 * k;
    r(ctx, bx, by, bw, 1, '#3a2418');
    r(ctx, bx, by, fl(bw * k), 1, BTELL.stomp.col);
    if (k > 0.75 && (sin(WT * 26) > 0)) { ctx.globalAlpha = 0.85; r(ctx, bx, by - 2, bw, 1, BTELL.stomp.col); }
    ctx.globalAlpha = 1;
  }
  const T = BTELL[b.state]; if (!T) return;
  const A = BA[b.state], K = BATK[b.state];
  /* the same compressed duration bossUpdate is running the swing on, or the
     bar would fill at half speed while the mace came down at full */
  const dur = A.dur / (b.atkRate || 1);
  const impact = K.frames[0] / A.n * dur;        /* the frame the blow lands on */
  const t = b.st, endT = impact + 0.16;
  if (t > endT) return;
  const a = clamp(t / 0.07, 0, 1) * clamp((endT - t) / 0.18, 0, 1);
  if (a <= 0.01) return;

  const w = textW(T.act, 1, 2), pw = w + 11, ph = 15;
  const cx2 = clamp(fl(sx), fl(pw / 2) + 3, VW - fl(pw / 2) - 3);
  const py = clamp(fl(sy) - 108, 6, VH - 46);
  /* blink hard over the last third of the wind-up */
  const near = t > impact - 0.30;
  const blink = near ? (0.62 + 0.38 * (sin(t * 34) > 0 ? 1 : 0)) : 1;

  /* a repeat swing keeps its word — the answer has not changed — but wears a
     blood-coloured frame, so the rule being taught is legible the first time
     it costs the player something */
  const dimC = b.punishing ? '#8c2f26' : T.dim;
  ctx.globalAlpha = a * 0.78;
  r(ctx, cx2 - pw / 2, py, pw, ph, '#05070a');
  ctx.globalAlpha = a * (b.punishing ? 0.85 : 0.5);
  r(ctx, cx2 - pw / 2, py, pw, 1, dimC);
  r(ctx, cx2 - pw / 2, py + ph - 1, pw, 1, dimC);
  if (b.punishing) { r(ctx, cx2 - pw / 2, py, 1, ph, dimC); r(ctx, cx2 + fl(pw / 2) - 1, py, 1, ph, dimC); }
  ctx.globalAlpha = a * blink;
  textC(ctx, T.act, cx2, py + 3, T.col, 1, 2, true);
  /* timing bar: fills as the mace comes down */
  const bw = pw - 6, fwd = fl(bw * clamp(t / impact, 0, 1));
  ctx.globalAlpha = a * 0.55;
  r(ctx, cx2 - bw / 2, py + ph + 1, bw, 1, '#0a0d12');
  if (fwd > 0) { ctx.globalAlpha = a * blink; r(ctx, cx2 - bw / 2, py + ph + 1, fwd, 1, T.col); }
  /* little arrow pointing down at the head */
  ctx.globalAlpha = a * 0.7;
  r(ctx, cx2 - 1, py + ph + 4, 3, 1, dimC);
  r(ctx, cx2, py + ph + 5, 1, 1, dimC);
  ctx.globalAlpha = 1;
}
